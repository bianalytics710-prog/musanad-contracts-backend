  # ============================================================
  # M11 — Document Ingestion Pipeline (CR-D0)
  # ============================================================

  /contracts/{contractId}/versions/{versionId}/ingest:
    post:
      summary: Manually trigger document ingestion (re-extraction)
      description: >
        Flips the contract_version ingestion_status from `pending`, `failed`,
        or `partial` to `extracting` and enqueues re-extraction via the
        ingestion worker (node-cron + p-limit concurrency 2). Returns
        `alreadyInProgress: true` when the version is already `extracting` or
        `complete` — idempotent. Permission: `document.ingest` (Super Admin
        break-glass only per OPEN-DECISION-L Path A; normal upload flow
        triggers extraction automatically via the upload controller callback).
        Implements ep_ingest_manual_trigger.
      operationId: documentIngestionManualTrigger
      tags: ["M11 — Document Ingestion Pipeline"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["Super Admin"]
      x-required-permission: document.ingest
      parameters:
        - in: path
          name: contractId
          required: true
          schema: { type: integer }
          description: Contract ID.
        - in: path
          name: versionId
          required: true
          schema: { type: integer }
          description: Contract version ID to re-extract.
      responses:
        "201":
          description: Ingestion queued (status advanced to `extracting`).
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      contractVersionId: { type: integer }
                      ingestionStatus: { type: string, enum: [extracting] }
                      queuedAt: { type: string, format: date-time }
                      alreadyInProgress: { type: boolean }
        "400":
          description: Invalid path parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks `document.ingest`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Contract version not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  /contracts/{contractId}/versions/{versionId}/extracted-text:
    get:
      summary: Get a signed URL for the extracted text artifact
      description: >
        Returns a short-lived Supabase Storage signed URL (60 s TTL) for
        downloading the extracted plain-text artifact (`<uuid>.txt`). The
        `extracted_text_uri` column is never returned directly — only the
        signed URL is exposed so the raw Storage path is not logged or cached
        by clients. FE caches the signed-URL response with
        `staleTime: 50_000` (10 s margin before TTL expiry). Returns 409
        when the version is not yet `complete`. Implements
        ep_extracted_text_signed_url.
      operationId: documentIngestionExtractedTextSignedUrl
      tags: ["M11 — Document Ingestion Pipeline"]
      security:
        - BearerAuth: []
      x-authorised-roles: [drafter, approver, legal_counsel, recipient, executive, platform_admin, "Super Admin"]
      x-required-permission: contract.read.* (any)
      parameters:
        - in: path
          name: contractId
          required: true
          schema: { type: integer }
        - in: path
          name: versionId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Signed URL returned. TTL 60 s.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      signedUrl: { type: string, format: uri, description: Supabase Storage signed URL. TTL 60 s. }
                      expiresAt: { type: string, format: date-time }
                      extractionEngine: { type: string, enum: [digital_pdf, tesseract, gpt4o_vision, mammoth_docx, mixed] }
                      pageCount: { type: integer }
                      ocrConfidenceAvg: { type: number, format: float, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks any contract.read.* permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Contract version not found or RLS-invisible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Version not yet `complete` — ingestion still in progress or failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  /contracts/{contractId}/versions/{versionId}/ingestion-status:
    get:
      summary: Poll ingestion status for a contract version
      description: >
        Returns the current ingestion lifecycle status for a contract_version
        row. FE Document tab polls this endpoint every 3 s while
        `ingestionStatus` is `pending` or `extracting` and stops on
        `complete`, `failed`, or `partial`. Also returns `lowConfidencePageCount`
        — the number of `ingestion_review_queue` rows still awaiting human
        review — so the Document tab can surface a "N pages need review" badge.
        Returns 404 when the version is not visible to the caller (RLS). The
        `extractedTextUri` field is present in the DB response but stripped
        by the controller before sending — use the `/extracted-text` endpoint
        for signed-URL delivery. Implements ep_ingestion_status_poll.
      operationId: documentIngestionStatusPoll
      tags: ["M11 — Document Ingestion Pipeline"]
      security:
        - BearerAuth: []
      x-authorised-roles: [drafter, approver, legal_counsel, recipient, executive, platform_admin, "Super Admin"]
      x-required-permission: contract.read.* (any)
      parameters:
        - in: path
          name: contractId
          required: true
          schema: { type: integer }
        - in: path
          name: versionId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ingestion status returned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      contractVersionId: { type: integer }
                      ingestionStatus:
                        type: string
                        enum: [pending, extracting, complete, failed, partial]
                      pageCount: { type: integer, nullable: true }
                      ocrUsed: { type: boolean }
                      ocrConfidenceAvg: { type: number, nullable: true }
                      extractionEngine:
                        type: string
                        nullable: true
                        enum: [digital_pdf, tesseract, gpt4o_vision, mammoth_docx, mixed]
                      extractedAt: { type: string, format: date-time, nullable: true }
                      lowConfidencePageCount: { type: integer, description: Pages still pending human review in ingestion_review_queue. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks any contract.read.* permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Contract version not found or RLS-invisible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/ingestion-queue:
    get:
      summary: List the admin ingestion review queue
      description: >
        Returns a paginated list of `ingestion_review_queue` rows for the
        caller's tenant — all pages where Tesseract confidence was below
        the threshold OR where the daily Vision cap routed the page to human
        review. Response does NOT include `tesseract_text` or `gpt4o_text`
        (sensitive fields excluded from the list endpoint; use the resolve
        endpoint for full context). Filter by `reviewStatus`, `contractVersionId`,
        or `gpt4oUsed`. Default sort: `pending_auto > pending_human > resolved >
        rejected`, then `created_at DESC`. Implements ep_admin_ingestion_queue_list.
      operationId: adminIngestionQueueList
      tags: ["M11 — Document Ingestion Pipeline"]
      security:
        - BearerAuth: []
      x-authorised-roles: [legal_counsel, platform_admin, "Super Admin"]
      x-required-permission: document.review OR ingestion_queue.read
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: reviewStatus
          schema:
            type: string
            enum: [pending_auto, pending_human, resolved, rejected]
          required: false
        - in: query
          name: contractVersionId
          schema: { type: integer }
          required: false
        - in: query
          name: gpt4oUsed
          schema: { type: boolean }
          required: false
      responses:
        "200":
          description: Paginated queue list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        contractVersionId: { type: integer }
                        contractTitleEn: { type: string }
                        contractTitleAr: { type: string }
                        pageNo: { type: integer }
                        tesseractConfidence: { type: number, nullable: true }
                        gpt4oUsed: { type: boolean }
                        reviewStatus:
                          type: string
                          enum: [pending_auto, pending_human, resolved, rejected]
                        reviewedByName: { type: string, nullable: true }
                        reviewedAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        dataClassification: { type: string }
                        tenantId: { type: string, format: uuid }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks `document.review` or `ingestion_queue.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/ingestion-queue/{id}/resolve:
    post:
      summary: Resolve a low-confidence ingestion page
      description: >
        Allows a reviewer (legal_counsel or platform_admin) to confirm, correct,
        or reject a low-confidence OCR page in the ingestion_review_queue.
        **confirm** — accepts the best available text (gpt4o_text if present,
        otherwise tesseract_text) as `final_text` and marks the row `resolved`.
        **correct** — accepts caller-provided `correctedText` as `final_text`
        and marks `resolved`. **reject** — marks `rejected` with `final_text = NULL`.
        Already-resolved/rejected rows return 409. RLS ensures reviewers can only
        see rows belonging to their tenant. Implements ep_admin_ingestion_queue_resolve.
      operationId: adminIngestionQueueResolve
      tags: ["M11 — Document Ingestion Pipeline"]
      security:
        - BearerAuth: []
      x-authorised-roles: [legal_counsel, platform_admin, "Super Admin"]
      x-required-permission: document.review
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: ingestion_review_queue row ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [confirm, correct, reject]
                correctedText:
                  type: string
                  description: Required when action = correct.
      responses:
        "200":
          description: Page resolved.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      queueId: { type: integer }
                      reviewStatus: { type: string, enum: [resolved, rejected] }
                      finalText: { type: string, nullable: true }
                      reviewedAt: { type: string, format: date-time }
        "400":
          description: Invalid action or missing correctedText for `correct` action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks `document.review`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Queue item not found or RLS-invisible (tenant isolation).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Queue item already resolved or rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────────────────────────────────────────────────────
  # M12 — Clause Taxonomy + Two-Stage Extractor + pgvector + Auto-Obligations
  # Migrations 141–149, 157 (cross-cutting), 159 (backfill)
  # Permissions: clause.extract, clause.review, clause.taxonomy.read, clause.search
  # ─────────────────────────────────────────────────────────────────────────────

  /contracts/{id}/extract-clauses:
    post:
      summary: Trigger clause extraction on the latest version of a contract
      description: |
        Queues clause extraction on the most recent contract_version. Idempotent
        on (contract_version_id) — returns queued=false if extraction is already
        in progress. Use forceReprocess=true to override. Automatically triggered
        by the system on contract.ingested PG NOTIFY (M11); this endpoint supports
        manual admin triggers.
      operationId: extractClausesLatest
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["Super Admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Contract ID (BIGINT)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forceReprocess:
                  type: boolean
                  description: If true, re-run extraction even if clauses already exist for this version
      responses:
        "202":
          description: Extraction job accepted and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      queued: { type: boolean }
                      extractionRunId: { type: integer, nullable: true }
                      reason: { type: string, nullable: true }
        "400": { description: Invalid request body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.extract permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Contract not found or not in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Extraction already running (use forceReprocess=true to override), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /contracts/{id}/versions/{vId}/extract-clauses:
    post:
      summary: Trigger clause extraction on a specific contract version
      description: Queues clause extraction for the specified contract_version. Idempotent per (contract_version_id).
      operationId: extractClausesForVersion
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["Super Admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Contract ID (BIGINT)
        - name: vId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Contract version ID (BIGINT)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forceReprocess: { type: boolean }
      responses:
        "202":
          description: Extraction job accepted and queued for specific version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      queued: { type: boolean }
                      extractionRunId: { type: integer, nullable: true }
                      reason: { type: string, nullable: true }
        "400": { description: Invalid request body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.extract permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Contract or version not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Extraction already running for this version, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /clauses/review-queue:
    get:
      summary: Paginated list of extracted clause records pending legal review
      description: |
        Returns contract_clause_extracted rows with review_status='pending_review'
        (confidence below 0.70 per HITL Q1). Filters: contractId, clauseType, reviewStatus,
        confidenceBelow. RLS-scoped to current tenant.
      operationId: listClauseReviewQueue
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["legal_counsel", "platform_admin"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: contractId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: clauseType
          in: query
          schema: { type: string }
          description: Filter by ClauseTypeV2 enum value (e.g. force_majeure)
        - name: reviewStatus
          in: query
          schema:
            type: string
            enum: [auto, pending_review, reviewed, rejected, pending_extraction]
        - name: confidenceBelow
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Paginated clause review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            contractId: { type: integer }
                            contractTitleEn: { type: string }
                            contractTitleAr: { type: string }
                            clauseTypeV2: { type: string }
                            family: { type: string }
                            displayNameEn: { type: string }
                            displayNameAr: { type: string }
                            parametersPreview: { type: object }
                            confidence: { type: number, nullable: true }
                            pageNo: { type: integer, nullable: true }
                            reviewStatus: { type: string }
                            createdAt: { type: string, format: date-time }
                      pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { description: Invalid query parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.review permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /clauses/{id}/review:
    post:
      summary: Confirm, correct, or reject an extracted clause record
      description: |
        Resolves a pending_review contract_clause_extracted row. action must be
        confirm / correct / reject. correct requires parametersCorrection and
        textExcerptsCorrection with matching keys (Annex A.1.2 discipline).
        On confirm/correct for obligation-deriving clause types, fn_obligations_derive_from_clause
        re-runs idempotently. Double-resolve returns 409.
      operationId: reviewClause
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["legal_counsel", "platform_admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: contract_clause_extracted ID (BIGINT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [confirm, correct, reject]
                parametersCorrection:
                  type: object
                  description: Required when action=correct. snake_case keys per Annex A parameter spec.
                textExcerptsCorrection:
                  type: object
                  description: Required when action=correct. Every key in parametersCorrection must have a match here.
      responses:
        "200":
          description: Clause resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      clauseId: { type: integer }
                      newReviewStatus: { type: string, enum: [reviewed, rejected] }
                      obligationsRecomputed: { type: boolean }
        "400": { description: Invalid action or missing parametersCorrection when action=correct, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.review permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Clause record not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Clause already resolved (already_resolved), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/clause-taxonomy:
    get:
      summary: Retrieve the full clause taxonomy catalogue
      description: |
        Returns all 50 non-deprecated clause_taxonomy rows for the current tenant
        with parameter schemas, identification cues, and EN+AR display labels.
        Response includes both a flat items array and a groupedByFamily map.
        Used by the admin viewer and Stage 2 LLM prompt builder.
      operationId: listClauseTaxonomy
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["Super Admin", "platform_admin", "legal_counsel", "contract_drafter", "contract_approver", "contract_approver_2", "contract_recipient", "executive"]
      parameters:
        - name: family
          in: query
          schema:
            type: string
            enum: [force_majeure, termination, pricing, performance, indemnity, compliance, governance, operational]
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: isActive
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Clause taxonomy catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            clauseTypeId: { type: string }
                            family: { type: string }
                            displayNameEn: { type: string }
                            displayNameAr: { type: string }
                            definitionEn: { type: string }
                            definitionAr: { type: string }
                            identificationCuesEn: { type: string }
                            identificationCuesAr: { type: string }
                            parameterSchema: { type: object }
                            version: { type: integer }
                            isDeprecated: { type: boolean }
                            dataClassification: { type: string }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                            createdBy: { type: integer, nullable: true }
                            updatedBy: { type: integer, nullable: true }
                            isActive: { type: boolean }
                      groupedByFamily:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: object }
        "400": { description: Invalid query parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.taxonomy.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /clauses/search:
    post:
      summary: Semantic search across extracted clause records using pgvector embeddings
      description: |
        Server embeds queryText via text-embedding-3-small (logged to ai_request_log),
        then queries the ivfflat index on contract_clause_extracted.embedding using
        cosine similarity. Returns top-N results ordered by similarity descending.
        queryText is sensitive — not logged (pinoRedactPaths). Optionally restricted
        to one contract via contractId.
      operationId: searchClauses
      tags: ["M12 — Clause Taxonomy + Extraction"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["Super Admin", "platform_admin", "legal_counsel", "contract_drafter", "contract_approver", "contract_approver_2", "contract_recipient", "executive"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryText]
              properties:
                queryText: { type: string, minLength: 3, maxLength: 1000 }
                contractId: { type: integer, minimum: 1, nullable: true }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
                similarityMin: { type: number, minimum: 0, maximum: 1, default: 0.0 }
      responses:
        "200":
          description: Semantic search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            clauseId: { type: integer }
                            contractId: { type: integer }
                            clauseTypeV2: { type: string }
                            family: { type: string }
                            similarity: { type: number }
                            summaryEn: { type: string, nullable: true }
                            summaryAr: { type: string, nullable: true }
                            pageNo: { type: integer, nullable: true }
                      count: { type: integer }
                      queryEmbeddingLogId: { type: integer }
        "400": { description: queryText missing or too short/long, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks clause.search permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: OpenAI embedding call failed; caller should retry, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────────────────────────────────────────────────────
  # M13 — Correlation Rule Engine + DSL
  # Migrations 150–158
  # Permissions: rule.read, rule.manage, correlation.read, correlation.dismiss
  # ─────────────────────────────────────────────────────────────────────────────

  /admin/rules:
    get:
      summary: List all correlation rules for the tenant
