              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/sources/{id}/test-pull:
    post:
      tags: [M7 — OSINT Sources]
      operationId: osintSourceTestPull
      summary: Queue a manual test-pull for a source
      description: |
        Queue a manual test-pull for a source. The fn emits
        `pg_notify('osint_test_pull')` and returns 202 Accepted; the BE
        worker (LISTENing on the channel) dispatches the actual fetch
        within ~10s (AC-S7-06). 409 if `enabled=false` (Smoke DEF-2 fix
        — translatePgError 22023 → 409 routing for "is disabled" prefix).
        FE polls source_health every 2s for up to 30s after this
        response (AC-S10-04) to surface delta `signals_24h` count.
        **Production caveat (F-3):** Neon `-pooler` PgBouncer transaction
        pooling drops session-level LISTEN; production worker connection
        MUST use Neon **direct** endpoint. See ops-runbook M7 section.
        DB function: `fn_osint_source_test_pull`.
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [source.manage]
      x-authMode: jwt
      x-storyId: S7
      x-rateLimit: authedWriteRateLimiter
      x-pgNotifyChannel:
        channel: osint_test_pull
        payload: OsintTestPullNotification
        consumer: BE fetch worker (S7) — registered LISTEN at startup
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "202":
          description: Test pull queued. Worker dispatches manual fetch within ~10s.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/TestPullResponse" }
                  requestId: { type: string, format: uuid }
