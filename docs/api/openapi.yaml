  /regulatory-impacts/bulk-detect:
    post:
      tags: [M5 — Regulatory Impacts]
      operationId: regulatoryImpactBulkDetect
      summary: Bulk-create regulatory impacts across contracts (S11)
      description: |
        Bulk-create regulatory_impact rows across a candidate set of contracts.
        Idempotent re-runs via ON CONFLICT DO NOTHING on the COALESCE-sentinel
        UNIQUE partial index (AC-S11-02 — `skippedDuplicateCount` returned).
        S2-17 atomic gate+commit: SELECT FOR UPDATE on regulatory_update row
        before per-contract INSERT loop (Codex M1c TOCTOU lesson). DEFINER
        carve-out — legal_counsel writes impacts on contracts they don't
        directly own; defence-in-depth permission gate at fn body line 1.
        `impactPayload` is SENSITIVE — pino-redacted at controller (covered
        by `ai_prompt_payload` class per M4 precedent). Q9 EMIT — emits one
        `regulatory_impact_detected` activity per successfully-inserted impact.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: regulations.manage
      x-authMode: jwt
      x-storyId: S11
      x-securityDefiner: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDetectRegulatoryImpactDto" }
      responses:
        "201":
          description: Bulk-detect result.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/BulkDetectRegulatoryImpactResult" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — empty contractIds (AC-S11-03), regulatoryUpdateId
            not found (AC-S11-04), regulationId not found (AC-S11-05),
            impactPayload missing entry for contractId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /regulatory-impacts/{id}/resolve:
    patch:
      tags: [M5 — Regulatory Impacts]
      operationId: regulatoryImpactResolve
      summary: Resolve (or un-resolve) a regulatory impact (S13)
      description: |
        Polymorphic permission — `regulations.manage` OR caller is
        `contract.drafted_by` for the underlying contract (AC-S13-05). The
        route gate is intentionally permissive (`authoriseAnyOf(['regulations.read',
        'regulations.manage'])`); the fn body re-gates strictly via the
        polymorphic OR-branch (a contract_recipient — no `regulations.read`
        in the M5 grant matrix — is correctly rejected at the route gate).
        `resolutionAction='pending'` un-resolves (resolved=FALSE). Q9 EMIT —
        emits a `regulatory_impact_resolved` activity only when v_resolved=TRUE.
        `resolutionNote` is admin-bounded free text and stored verbatim
        (Q8 — NOT redacted).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter (own contract only)]
      x-requiredPermissions: regulations.manage OR (contract drafter for the underlying contract)
      x-authMode: jwt
      x-storyId: S13
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRegulatoryImpactDto" }
      responses:
        "200":
          description: Resolve result.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RegulatoryImpactResolveResult" }
                  requestId: { type: string, format: uuid }
        "400":
          description: Invalid resolutionAction (23514 → AC-S13-03).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks regulations.manage AND is not contract.drafted_by (AC-S13-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Regulatory impact not found (P0002 → AC-S13-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /impact-categories:
    get:
      tags: [M5 — Impact Categories]
      operationId: impactCategoryList
      summary: List impact categories (S14)
      description: |
        Sort: `display_order ASC, id ASC`. No pagination (small reference
        table, ~8-12 rows seeded in migration 052). Default returns only
        `active=TRUE` rows. AC-S14-05 — accessible to ALL authenticated roles
        including `contract_recipient` (only M5 endpoint without a permission
        gate beyond JWT; taxonomy used by FE form pickers).
