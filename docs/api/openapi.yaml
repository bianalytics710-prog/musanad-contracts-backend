  /sign/{invitationToken}:
    get:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureGetByInvitationToken
      summary: Public signer landing page — masked-email signer-safe contract excerpt
      description: |
        PUBLIC unauthenticated read. The plaintext invitationToken from the
        URL path is hashed (SHA-256) and matched against
        signature_invitation.invitation_token_hash inside a SECURITY DEFINER
        fn_ (GRANT EXECUTE TO PUBLIC). Updates view_count + last_viewed_at;
        emits a 'viewed' signature_event ONCE per invitation (gated on
        first_viewed_at IS NULL, AC-S3-03).

        Sensitive-field policy is the strictest in the project:
        - signer.email ALWAYS masked (`j***@example.com`)
        - signer.phone NEVER returned
        - contract.body* TRUNCATED to LEFT(body_*, 4000) chars
        - signature_data + signature_image_url NEVER returned (AC-S3-05)

        Errors return SINGLE GENERIC `invitation_invalid_or_expired` (HTTP 410)
        that does NOT distinguish unknown / expired / cancelled (AC-S3-04).

        DB function: `fn_signature_get_by_invitation_token` (DEFINER VOLATILE
        — touches view_count + first_viewed_at).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path; SHA-256 hash-and-match server-side)
      x-acsCovered: [AC-S3-01, AC-S3-02, AC-S3-03, AC-S3-04, AC-S3-05, AC-S3-06, AC-S3-07]
      parameters:
        - name: invitationToken
          in: path
          required: true
          description: |
            SENSITIVE — plaintext base64 token. The fn_ hashes inside (AC-S3-06).
            Pino-redacted at the request URL path; never logged in plaintext.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK — signer-safe contract excerpt.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignaturePublicViewResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/sign:
    post:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureSign
      summary: PUBLIC — record a signature with one of 4 methods (typed/drawn/uae_pass/ds_otp)
      description: |
        PUBLIC unauthenticated write. Records a signature; the step-completion
        check (S2-18 NULL-safe via IS NOT DISTINCT FROM on step_order) advances
        contract.status awaiting_signature_employer →
        awaiting_signature_counterparty → fully_signed (AN-13: M3 stops at
        fully_signed; the fully_signed → active transition is a contract-lifecycle
        concern handled by future modules).

        Method gating (validated by fn_, mirrored in Zod):
        - typed     → signatureData required (>= 2 chars trimmed)
        - drawn     → signatureData AND signatureImageUrl required
        - uae_pass  → uaePassVerificationLevel required
        - ds_otp    → metadata.otpReceipt required (non-empty)

        AC-S4-09 — second sign on same invitation returns 409 already_signed
        (idempotency-style — fn_ raises P0001 with the existing status).
        AC-S4-10 — signatureData and signatureImageUrl NEVER returned in the
        response. Audit trail JSONB redacts both via M3 034.

        DB function: `fn_signature_sign` (DEFINER, GRANT EXECUTE TO PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S4-01, AC-S4-02, AC-S4-03, AC-S4-04, AC-S4-05, AC-S4-06, AC-S4-07, AC-S4-08, AC-S4-09, AC-S4-10, AC-S4-11, AC-S4-12]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignContractDto" }
            examples:
              typed:
                summary: Typed signature
                value:
                  signatureMethod: typed
                  signatureData: "Faisal Al Mazrouei"
              uaePass:
                summary: UAE Pass signature
                value:
                  signatureMethod: uae_pass
                  uaePassVerificationLevel: verified
                  metadata:
                    uaePassAttestationId: "uap-mock-2026-05-04"
              dsOtp:
                summary: Digital Signature OTP
                value:
                  signatureMethod: ds_otp
                  metadata:
                    otpReceipt: "otp-receipt-c891"
      responses:
        "200":
          description: OK — signed event recorded; contractNewStatus reflects step transition (or NULL if step incomplete).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignContractResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: |
            CONFLICT — `already_signed` (AC-S4-09; invitation.status='signed' on entry).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/decline:
    post:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureDecline
      summary: PUBLIC — record a decline with required reason (5..2000 chars)
      description: |
        PUBLIC unauthenticated write. Records a decline; required-signer
        decline halts the contract (awaiting_signature_* → 'rejected',
        AC-S5-01); witness (non-required) decline records the event without
        a status transition (AC-S5-05).

        DB function: `fn_signature_decline` (DEFINER, GRANT EXECUTE TO PUBLIC;
        FOR UPDATE on contract + invitation + signature_party).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S5-01, AC-S5-02, AC-S5-03, AC-S5-04, AC-S5-05, AC-S5-06, AC-S5-07, AC-S5-08]
      parameters:
        - name: invitationToken
          in: path
