            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AiCostSummary" }
                  requestId: { type: string, format: uuid }
        "400":
          description: VALIDATION_ERROR — windowDays out of [1,90] (22023 → AC-S11-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks `ai.observability.read` (42501 → AC-S11-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/health:
    get:
      tags: [M6 — Admin Health]
      operationId: adminHealth
      summary: Admin observability health probe (S12)
      description: |
        Admin observability probe — `db` (status from CURRENT_TIMESTAMP +
        pg_is_in_recovery() / latestMigration / currentTimestamp), `ai`
        (lastSuccessfulRequestAt / lastFailureAt / estimatedHealthy),
        `overall` (`'ok'` | `'degraded'` | `'unhealthy'`).

        **DISTINCT from M0 public liveness `/api/health`** (no version
        prefix, no auth). This admin endpoint is JWT + platform_admin /
        Super Admin role required.

        `db.latestMigration` reads `MAX(schema_migrations.version)` and
        REQUIRES the new RLS SELECT policy `schema_migrations_select_admin`
        (migration 054, ARCH-NEW-3 option (c)). Without it, the deny-all
        RLS would return NULL on a non-superuser pool connection.

        Audit block (errorCountLastHour + lastErrorAt) DROPPED in design
        Patch Round 1 per S2-22-WARN-2-FIX — `audit_log.action` CHECK
        enum is `'INSERT','UPDATE','DELETE'` only; literal `'ERROR'`
        could never match. Error signal sourced exclusively from
        `ai_request_log.outcome IN ('error','timeout','rate_limited','cancelled')`.

        `fn_health_check` stays SECURITY INVOKER per ARCH-NEW-3 option
        (c) — the new permissive SELECT policy is what enables the
        latestMigration read.
        DB function: `fn_health_check`.
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: (none beyond JWT — fn body role check)
      x-authMode: jwt
      x-storyId: S12
      responses:
        "200":
          description: Admin health snapshot.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/HealthCheckSnapshot" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller is not platform_admin / Super Admin (42501 → AC-S12-07).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ============================================================
  # M7 — OSINT Source Framework + Adapter Protocol (CR-A)
  # 9 endpoints across 3 namespaces:
  #   /admin/sources/* (7) — full source CRUD + credential + test-pull
  #   /signals (1)         — paginated normalised signal list
  #   /admin/source-health (1) — per-source health monitor (bare array)
  # ============================================================

  /admin/sources:
    get:
      tags: [M7 — OSINT Sources]
      operationId: osintSourceList
      summary: Paginated list of OSINT sources for the current tenant
      description: |
        Paginated source list with embedded health badge per row.
        Filterable by `kind`, health `state`, `search` (matches sourceId
        or displayName ILIKE). credentialRef NEVER projected.
        Sort: displayName ASC. RLS auto-scopes by tenant via
        `app.current_tenant_id` GUC.
        DB function: `fn_osint_source_list`.
      x-authorisedRoles: [Super Admin, platform_admin, executive]
      x-requiredPermissions: [source.read]
      x-authMode: jwt
      x-storyId: S9
      x-rateLimit: authedReadRateLimiter
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/SourceKind" } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/HealthState" } }
        - { name: search, in: query, description: "Debounced 300ms on FE (AC-S9-02). ILIKE on sourceId OR displayName.", schema: { type: string } }
      responses:
        "200":
          description: Paginated list with embedded health badge per row.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/OsintSourceListResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [M7 — OSINT Sources]
      operationId: osintSourceCreate
      summary: Create a new OSINT source for the current tenant
      description: |
        Creates a new source row. Validates kind / format /
        refreshSeconds (≥60) / sourceReliability ([0,1]) before INSERT.
        tenant_id is derived from `app.current_tenant_id` GUC — never
        accepted from request body.
        Returns the full detail via chained `fn_osint_source_get_by_id`.
        DB function: `fn_osint_source_create`.
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [source.manage]
      x-authMode: jwt
      x-storyId: S3
      x-rateLimit: authedWriteRateLimiter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOsintSourceDto" }
      responses:
        "201":
          description: Source created. Full detail returned.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/OsintSourceDetail" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Duplicate (tenant_id, sourceId) — 'Source ID already exists for this tenant' (23505 → AC-S3-02)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/sources/{id}:
    get:
      tags: [M7 — OSINT Sources]
      operationId: osintSourceGetById
      summary: Single OSINT source detail
      description: |
        Single OSINT source detail with embedded health badge +
