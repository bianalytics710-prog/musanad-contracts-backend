  /contracts/{id}/status:
    patch:
      tags: [M2 — Approvals, M1a — Contracts]
      operationId: contractUpdateStatus
      summary: |
        Update contract status (M1a endpoint, narrowed-transitions extension by M2 / AE-2).
      description: |
        M2 (AE-2) OWN-AND-SPLIT extension of the M1a endpoint. Wire DTO field
        shape preserved (newStatus + optional reason); the body schema is
        UpdateContractStatusUserDto, with newStatus restricted to the
        per-transition matrix enforced by fn_contract_status_update_user.

        Per-transition permission gates (fn_-side authoritative):
          - draft → in_review        : approval.submit_for_review
          - in_review → in_approval  : approval.submit_for_review (atomic — internally calls fn_approval_route_init)
          - in_review → draft        : approval.submit_for_review (own) OR contract.delete
          - approved → active        : contract.edit
          - any non-terminal → cancelled : contract.delete OR (contract.draft AND ownership)

        Direct in_approval terminal targets (approved / rejected /
        resubmission_requested) are REJECTED with 409 — callers must use
        POST /approvals/{stepId}/decide. (AC-S12-02 / AC-S12-09 / M2-NEW-1.)

        FE migration note: previously-permissive M1a transitions
        (e.g. draft → approved direct) now return 409. Existing M1a tests
        that exercised valid transitions continue to pass; tests that
        exercised permissive transitions MUST be updated to use the
        chain-driven path.

        DB function: `fn_contract_status_update_user` (M2 INVOKER, FOR UPDATE
        on contract — UPGRADE over M1a placeholder which had no lock). Replaces
        the M1a fn_contract_status_update placeholder. The system-only
        fn_contract_status_update_internal (DEFINER) is invoked ONLY by
        fn_approval_decide and is not exposed via HTTP.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-permission: anyOf(contract.status.update, approval.submit_for_review, contract.edit, contract.delete, contract.draft)
      x-acsCovered: [AC-S12-01, AC-S12-02, AC-S12-03, AC-S12-04, AC-S12-05, AC-S12-06, AC-S12-07, AC-S12-08, AC-S12-09, AC-S12-10]
      x-extensionType: M2 / AE-2 OWN-AND-SPLIT (wire-compatible)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractStatusUserDto" }
            examples:
              submitForReview:
                summary: draft → in_review
                value: { newStatus: in_review }
              submitForApproval:
                summary: in_review → in_approval (atomic — chain created)
                value: { newStatus: in_approval, reason: "Ready for legal sign-off" }
              activate:
                summary: approved → active
                value: { newStatus: active }
              cancel:
                summary: any non-terminal → cancelled
                value: { newStatus: cancelled, reason: "Counterparty withdrew." }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateContractStatusUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT — invalid transition. Common causes: (a) target is
            in_approval terminal direct override (use fn_approval_decide /
            POST /approvals/{stepId}/decide); (b) transition pair not in the
            whitelist (AC-S12-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # =====================================================================
  # M3 — Signatures + Signer Q&A AI
  # =====================================================================
  #
  # 10 new endpoints across 4 routers (5 JWT + 5 verify_jwt=false). The
  # public /sign/* router declares routes most-specific-first (W1 carry-over):
  #   POST /qa/message  →  POST /qa/session  →  POST /sign  →  POST /decline
  #   →  GET / (bare token last). Express otherwise resolves the GET first
  #   and refuses to fall through.

  /contracts/{id}/signature-parties:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signaturePartyCreateBulk
      summary: Bulk-create the initial signer roster for an approved contract
      description: |
        Bulk-create the signature_party roster (1..20 signers per call).
        Idempotent — `ON CONFLICT (contract_id, step_order, lower(signer_email))
        WHERE is_active=TRUE DO NOTHING`. Skipped count is returned alongside
        created count (AC-S1-08). Validates contract.status='approved' AND at
        least one approval_chain row exists with status='approved'.

        AC-S1-04: at least one signer MUST have signerSide='employer' AND
        isRequired=TRUE. Validated by the fn_; Zod confirms structure only.
        AC-S1-08: signer_email never echoed in error messages (sensitive).

        DB function: `fn_signature_party_create_bulk` (INVOKER; SELECT FOR
        UPDATE on contract head + per-party row in loop).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S1-01, AC-S1-02, AC-S1-03, AC-S1-04, AC-S1-05, AC-S1-06, AC-S1-07, AC-S1-08, AC-S1-09]
      parameters:
        - name: id
          in: path
          required: true
          description: BIGINT FK → contract(id)
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignaturePartyCreateBulkDto" }
            example:
              signers:
                - signerSide: employer
                  signerNameEn: "Faisal Al Mazrouei"
                  signerEmail: "faisal@employer.example"
                  stepOrder: 1
                  isRequired: true
                - signerSide: counterparty
                  signerNameEn: "Lina Khoury"
                  signerEmail: "lina@counterparty.example"
                  stepOrder: 2
                  isRequired: true
      responses:
        "201":
          description: CREATED — roster persisted (or partially-skipped via idempotency).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignaturePartyCreateBulkResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — contract not found or is_active=FALSE (AC-S1-06).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — precondition failed. Either
            `precondition_failed:contract_status_not_approved` (AC-S1-02) or
            `precondition_failed:no_approved_chain` (AC-S1-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/send-for-signature:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureSendForSignature
      summary: Issue invitation tokens to lowest-step_order signers
      description: |
        Issues invitation_tokens for the lowest-step_order required signers
        and transitions contract.status approved → awaiting_signature_employer.
        Returns plaintext invitationToken ONCE per signer (persisted as
        SHA-256 invitation_token_hash; pino-redacted on egress).

        DB function: `fn_signature_send_for_signature` (INVOKER; SELECT FOR
        UPDATE on contract + per-party in loop). Internally calls
        fn_contract_status_update_internal (M2 026 canonical, byte-for-byte
        preserved at M3 033 except allowed-transitions IF condition) and
        fn_contract_activity_create with new activity_type='sent_for_signature'.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S2-01, AC-S2-02, AC-S2-03, AC-S2-04, AC-S2-05, AC-S2-06, AC-S2-07, AC-S2-08, AC-S2-09]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendForSignatureDto" }
      responses:
        "200":
          description: OK — invitations issued. invitationTokenPlaintext returned ONCE.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendForSignatureResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — contract not found (AC-S2-04).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — either `invalid_status_for_send` (current != approved,
            AC-S2-04) or `no_signature_parties` (roster not yet created,
            AC-S2-05 — call POST /contracts/:id/signature-parties first).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/signatures:
    get:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureListForContract
      summary: Per-contract signature progress with per-signer status + step aggregates
      description: |
        Read API for the ContractDetail Signatures tab. Returns per-signer
        status + invitation/event timestamps + step aggregates. Role-aware
        email masking (AC-S6-04): full plaintext for legal_counsel /
        platform_admin / Super Admin; masked (`j***@example.com`) otherwise.

        AC-S6-05: signature_data and signature_image_url are NEVER returned
        regardless of role.
        AC-S6-07: signers ordered by stepOrder ASC, then created_at ASC.

        DB function: `fn_signature_list_for_contract` (INVOKER STABLE).
        currentInvitationId added by migration 038 (consumed by the cancel
        dialog on the same tab); migration 039 fixed a step-4 nested-aggregate
        latent bug surfaced by the 038 functional probe.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_recipient, executive]
      x-requiredPermissions: [contract.read.* OR signature.read.all]
      x-acsCovered: [AC-S6-01, AC-S6-02, AC-S6-03, AC-S6-04, AC-S6-05, AC-S6-06, AC-S6-07]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureListResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: NOT_FOUND — contract not found OR actor cannot read it (AC-S6-06).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /signature-parties/{id}/resend:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureInvitationResend
      summary: Soft-deactivate prior invitation and issue a fresh one with extended expiry
      description: |
        Deactivates the existing active invitation for a signature_party and
        creates a NEW invitation with fresh token + extended expiry
        (NOW() + 14 days). Emits a 'resent' signature_event on the OLD
        invitation with metadata.newInvitationId. AC-S7-03 — current status
        must NOT be IN ('signed','declined','cancelled').

        DB function: `fn_signature_invitation_resend` (INVOKER; FOR UPDATE
        on signature_party + signature_invitation).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S7-01, AC-S7-02, AC-S7-03, AC-S7-04, AC-S7-05]
      parameters:
        - name: id
          in: path
          required: true
          description: BIGINT FK → signature_party(id)
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendInvitationDto" }
            example:
              reason: "Original email bounced — corrected address."
      responses:
        "200":
          description: OK — new invitationTokenPlaintext returned ONCE.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendInvitationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — signature_party not found / inactive (AC-S7-05).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — `invalid_invitation_status_for_resend` (AC-S7-03;
            invitation status IN ('signed','declined','cancelled')).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /signature-invitations/{id}/cancel:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureInvitationCancel
      summary: Cancel an active invitation; conditionally roll the contract back to 'approved'
      description: |
        Sets invitation.status='cancelled'. When this was the LAST active
        invitation at the current step, calls fn_contract_status_update_internal
        to roll the contract back to 'approved' (contractRolledBack=true,
        AC-S8-02). Required permission `signature.cancel` is **NOT** granted
        to drafter — drafter cannot self-cancel (AC-S8-03).

