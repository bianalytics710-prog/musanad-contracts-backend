        shape preserved (newStatus + optional reason); the body schema is
        UpdateContractStatusUserDto, with newStatus restricted to the
        per-transition matrix enforced by fn_contract_status_update_user.

        Per-transition permission gates (fn_-side authoritative):
          - draft → in_review        : approval.submit_for_review
          - in_review → in_approval  : approval.submit_for_review (atomic — internally calls fn_approval_route_init)
          - in_review → draft        : approval.submit_for_review (own) OR contract.delete
          - approved → active        : contract.edit
          - any non-terminal → cancelled : contract.delete OR (contract.draft AND ownership)

        Direct in_approval terminal targets (approved / rejected /
        resubmission_requested) are REJECTED with 409 — callers must use
        POST /approvals/{stepId}/decide. (AC-S12-02 / AC-S12-09 / M2-NEW-1.)

        FE migration note: previously-permissive M1a transitions
        (e.g. draft → approved direct) now return 409. Existing M1a tests
        that exercised valid transitions continue to pass; tests that
        exercised permissive transitions MUST be updated to use the
        chain-driven path.

        DB function: `fn_contract_status_update_user` (M2 INVOKER, FOR UPDATE
        on contract — UPGRADE over M1a placeholder which had no lock). Replaces
        the M1a fn_contract_status_update placeholder. The system-only
        fn_contract_status_update_internal (DEFINER) is invoked ONLY by
        fn_approval_decide and is not exposed via HTTP.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-permission: anyOf(contract.status.update, approval.submit_for_review, contract.edit, contract.delete, contract.draft)
      x-acsCovered: [AC-S12-01, AC-S12-02, AC-S12-03, AC-S12-04, AC-S12-05, AC-S12-06, AC-S12-07, AC-S12-08, AC-S12-09, AC-S12-10]
      x-extensionType: M2 / AE-2 OWN-AND-SPLIT (wire-compatible)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractStatusUserDto" }
            examples:
              submitForReview:
                summary: draft → in_review
                value: { newStatus: in_review }
              submitForApproval:
                summary: in_review → in_approval (atomic — chain created)
                value: { newStatus: in_approval, reason: "Ready for legal sign-off" }
              activate:
                summary: approved → active
                value: { newStatus: active }
              cancel:
                summary: any non-terminal → cancelled
                value: { newStatus: cancelled, reason: "Counterparty withdrew." }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateContractStatusUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT — invalid transition. Common causes: (a) target is
            in_approval terminal direct override (use fn_approval_decide /
            POST /approvals/{stepId}/decide); (b) transition pair not in the
            whitelist (AC-S12-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # =====================================================================
  # M3 — Signatures + Signer Q&A AI
  # =====================================================================
  #
  # 10 new endpoints across 4 routers (5 JWT + 5 verify_jwt=false). The
  # public /sign/* router declares routes most-specific-first (W1 carry-over):
  #   POST /qa/message  →  POST /qa/session  →  POST /sign  →  POST /decline
  #   →  GET / (bare token last). Express otherwise resolves the GET first
  #   and refuses to fall through.

  /contracts/{id}/signature-parties:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signaturePartyCreateBulk
      summary: Bulk-create the initial signer roster for an approved contract
      description: |
        Bulk-create the signature_party roster (1..20 signers per call).
        Idempotent — `ON CONFLICT (contract_id, step_order, lower(signer_email))
        WHERE is_active=TRUE DO NOTHING`. Skipped count is returned alongside
        created count (AC-S1-08). Validates contract.status='approved' AND at
        least one approval_chain row exists with status='approved'.

        AC-S1-04: at least one signer MUST have signerSide='employer' AND
        isRequired=TRUE. Validated by the fn_; Zod confirms structure only.
        AC-S1-08: signer_email never echoed in error messages (sensitive).

        DB function: `fn_signature_party_create_bulk` (INVOKER; SELECT FOR
        UPDATE on contract head + per-party row in loop).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S1-01, AC-S1-02, AC-S1-03, AC-S1-04, AC-S1-05, AC-S1-06, AC-S1-07, AC-S1-08, AC-S1-09]
      parameters:
        - name: id
          in: path
          required: true
          description: BIGINT FK → contract(id)
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignaturePartyCreateBulkDto" }
            example:
              signers:
                - signerSide: employer
                  signerNameEn: "Faisal Al Mazrouei"
                  signerEmail: "faisal@employer.example"
                  stepOrder: 1
                  isRequired: true
                - signerSide: counterparty
                  signerNameEn: "Lina Khoury"
                  signerEmail: "lina@counterparty.example"
                  stepOrder: 2
                  isRequired: true
      responses:
        "201":
          description: CREATED — roster persisted (or partially-skipped via idempotency).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignaturePartyCreateBulkResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — contract not found or is_active=FALSE (AC-S1-06).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — precondition failed. Either
            `precondition_failed:contract_status_not_approved` (AC-S1-02) or
            `precondition_failed:no_approved_chain` (AC-S1-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/send-for-signature:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureSendForSignature
      summary: Issue invitation tokens to lowest-step_order signers
      description: |
        Issues invitation_tokens for the lowest-step_order required signers
        and transitions contract.status approved → awaiting_signature_employer.
        Returns plaintext invitationToken ONCE per signer (persisted as
        SHA-256 invitation_token_hash; pino-redacted on egress).

        DB function: `fn_signature_send_for_signature` (INVOKER; SELECT FOR
        UPDATE on contract + per-party in loop). Internally calls
        fn_contract_status_update_internal (M2 026 canonical, byte-for-byte
        preserved at M3 033 except allowed-transitions IF condition) and
        fn_contract_activity_create with new activity_type='sent_for_signature'.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S2-01, AC-S2-02, AC-S2-03, AC-S2-04, AC-S2-05, AC-S2-06, AC-S2-07, AC-S2-08, AC-S2-09]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendForSignatureDto" }
      responses:
        "200":
          description: OK — invitations issued. invitationTokenPlaintext returned ONCE.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendForSignatureResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — contract not found (AC-S2-04).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — either `invalid_status_for_send` (current != approved,
            AC-S2-04) or `no_signature_parties` (roster not yet created,
            AC-S2-05 — call POST /contracts/:id/signature-parties first).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/signatures:
    get:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureListForContract
      summary: Per-contract signature progress with per-signer status + step aggregates
      description: |
        Read API for the ContractDetail Signatures tab. Returns per-signer
        status + invitation/event timestamps + step aggregates. Role-aware
        email masking (AC-S6-04): full plaintext for legal_counsel /
        platform_admin / Super Admin; masked (`j***@example.com`) otherwise.

        AC-S6-05: signature_data and signature_image_url are NEVER returned
        regardless of role.
        AC-S6-07: signers ordered by stepOrder ASC, then created_at ASC.

        DB function: `fn_signature_list_for_contract` (INVOKER STABLE).
        currentInvitationId added by migration 038 (consumed by the cancel
        dialog on the same tab); migration 039 fixed a step-4 nested-aggregate
        latent bug surfaced by the 038 functional probe.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_recipient, executive]
      x-requiredPermissions: [contract.read.* OR signature.read.all]
      x-acsCovered: [AC-S6-01, AC-S6-02, AC-S6-03, AC-S6-04, AC-S6-05, AC-S6-06, AC-S6-07]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureListResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: NOT_FOUND — contract not found OR actor cannot read it (AC-S6-06).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /signature-parties/{id}/resend:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureInvitationResend
      summary: Soft-deactivate prior invitation and issue a fresh one with extended expiry
      description: |
        Deactivates the existing active invitation for a signature_party and
        creates a NEW invitation with fresh token + extended expiry
        (NOW() + 14 days). Emits a 'resent' signature_event on the OLD
        invitation with metadata.newInvitationId. AC-S7-03 — current status
        must NOT be IN ('signed','declined','cancelled').

        DB function: `fn_signature_invitation_resend` (INVOKER; FOR UPDATE
        on signature_party + signature_invitation).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-requiredPermissions: [signature.send]
      x-acsCovered: [AC-S7-01, AC-S7-02, AC-S7-03, AC-S7-04, AC-S7-05]
      parameters:
        - name: id
          in: path
          required: true
          description: BIGINT FK → signature_party(id)
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendInvitationDto" }
            example:
              reason: "Original email bounced — corrected address."
      responses:
        "200":
          description: OK — new invitationTokenPlaintext returned ONCE.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendInvitationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — signature_party not found / inactive (AC-S7-05).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — `invalid_invitation_status_for_resend` (AC-S7-03;
            invitation status IN ('signed','declined','cancelled')).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /signature-invitations/{id}/cancel:
    post:
      tags: [M3 — Signatures (Admin)]
      operationId: signatureInvitationCancel
      summary: Cancel an active invitation; conditionally roll the contract back to 'approved'
      description: |
        Sets invitation.status='cancelled'. When this was the LAST active
        invitation at the current step, calls fn_contract_status_update_internal
        to roll the contract back to 'approved' (contractRolledBack=true,
        AC-S8-02). Required permission `signature.cancel` is **NOT** granted
        to drafter — drafter cannot self-cancel (AC-S8-03).

        DB function: `fn_signature_invitation_cancel` (INVOKER; FOR UPDATE
        on contract + invitation + signature_party).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [signature.cancel]
      x-acsCovered: [AC-S8-01, AC-S8-02, AC-S8-03, AC-S8-04, AC-S8-05, AC-S8-06]
      parameters:
        - name: id
          in: path
          required: true
          description: BIGINT FK → signature_invitation(id)
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelInvitationDto" }
            example:
              reason: "Drafter requested re-issuance after counterparty rename."
      responses:
        "200":
          description: OK — invitation cancelled; contractRolledBack reflects whether status reverted.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelInvitationResponse" }
        "400":
          description: VALIDATION_ERROR — missing reason (AC-S8-06).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND — invitation_id unknown.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — `invalid_invitation_status_for_cancel` (AC-S8-05;
            invitation status NOT IN ('pending','viewed')).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}:
    get:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureGetByInvitationToken
      summary: Public signer landing page — masked-email signer-safe contract excerpt
      description: |
        PUBLIC unauthenticated read. The plaintext invitationToken from the
        URL path is hashed (SHA-256) and matched against
        signature_invitation.invitation_token_hash inside a SECURITY DEFINER
        fn_ (GRANT EXECUTE TO PUBLIC). Updates view_count + last_viewed_at;
        emits a 'viewed' signature_event ONCE per invitation (gated on
        first_viewed_at IS NULL, AC-S3-03).

        Sensitive-field policy is the strictest in the project:
        - signer.email ALWAYS masked (`j***@example.com`)
        - signer.phone NEVER returned
        - contract.body* TRUNCATED to LEFT(body_*, 4000) chars
        - signature_data + signature_image_url NEVER returned (AC-S3-05)

        Errors return SINGLE GENERIC `invitation_invalid_or_expired` (HTTP 410)
        that does NOT distinguish unknown / expired / cancelled (AC-S3-04).

        DB function: `fn_signature_get_by_invitation_token` (DEFINER VOLATILE
        — touches view_count + first_viewed_at).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path; SHA-256 hash-and-match server-side)
      x-acsCovered: [AC-S3-01, AC-S3-02, AC-S3-03, AC-S3-04, AC-S3-05, AC-S3-06, AC-S3-07]
      parameters:
        - name: invitationToken
          in: path
          required: true
          description: |
            SENSITIVE — plaintext base64 token. The fn_ hashes inside (AC-S3-06).
            Pino-redacted at the request URL path; never logged in plaintext.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK — signer-safe contract excerpt.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignaturePublicViewResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/sign:
    post:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureSign
      summary: PUBLIC — record a signature with one of 4 methods (typed/drawn/uae_pass/ds_otp)
      description: |
        PUBLIC unauthenticated write. Records a signature; the step-completion
        check (S2-18 NULL-safe via IS NOT DISTINCT FROM on step_order) advances
        contract.status awaiting_signature_employer →
        awaiting_signature_counterparty → fully_signed (AN-13: M3 stops at
        fully_signed; the fully_signed → active transition is a contract-lifecycle
        concern handled by future modules).

        Method gating (validated by fn_, mirrored in Zod):
        - typed     → signatureData required (>= 2 chars trimmed)
        - drawn     → signatureData AND signatureImageUrl required
        - uae_pass  → uaePassVerificationLevel required
        - ds_otp    → metadata.otpReceipt required (non-empty)

        AC-S4-09 — second sign on same invitation returns 409 already_signed
        (idempotency-style — fn_ raises P0001 with the existing status).
        AC-S4-10 — signatureData and signatureImageUrl NEVER returned in the
        response. Audit trail JSONB redacts both via M3 034.

        DB function: `fn_signature_sign` (DEFINER, GRANT EXECUTE TO PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S4-01, AC-S4-02, AC-S4-03, AC-S4-04, AC-S4-05, AC-S4-06, AC-S4-07, AC-S4-08, AC-S4-09, AC-S4-10, AC-S4-11, AC-S4-12]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignContractDto" }
            examples:
              typed:
                summary: Typed signature
                value:
                  signatureMethod: typed
                  signatureData: "Faisal Al Mazrouei"
              uaePass:
                summary: UAE Pass signature
                value:
                  signatureMethod: uae_pass
                  uaePassVerificationLevel: verified
                  metadata:
                    uaePassAttestationId: "uap-mock-2026-05-04"
              dsOtp:
                summary: Digital Signature OTP
                value:
                  signatureMethod: ds_otp
                  metadata:
                    otpReceipt: "otp-receipt-c891"
      responses:
        "200":
          description: OK — signed event recorded; contractNewStatus reflects step transition (or NULL if step incomplete).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignContractResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: |
            CONFLICT — `already_signed` (AC-S4-09; invitation.status='signed' on entry).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/decline:
    post:
      tags: [M3 — Signer Public (verify_jwt=false)]
      operationId: signatureDecline
      summary: PUBLIC — record a decline with required reason (5..2000 chars)
      description: |
        PUBLIC unauthenticated write. Records a decline; required-signer
        decline halts the contract (awaiting_signature_* → 'rejected',
        AC-S5-01); witness (non-required) decline records the event without
        a status transition (AC-S5-05).

        DB function: `fn_signature_decline` (DEFINER, GRANT EXECUTE TO PUBLIC;
        FOR UPDATE on contract + invitation + signature_party).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S5-01, AC-S5-02, AC-S5-03, AC-S5-04, AC-S5-05, AC-S5-06, AC-S5-07, AC-S5-08]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineContractDto" }
            example:
              declineReason: "The indemnity clause requires legal review at our end."
      responses:
        "200":
          description: OK — decline recorded; contractNewStatus is 'rejected' for required signers, NULL for witness.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclineContractResponse" }
        "400":
          description: |
            VALIDATION_ERROR — `reason_too_short` (< 5 chars, AC-S5-02) or
            `reason_too_long` (> 2000 chars, AC-S5-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — `already_decided` (AC-S5-07; invitation.status IN
            ('signed','declined','cancelled')).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/qa/session:
    post:
      tags: [M3 — Signer Q&A AI (verify_jwt=false)]
      operationId: signerQaSessionStart
      summary: PUBLIC — open a Q&A chat session for the signer
      description: |
        PUBLIC unauthenticated. Opens a signer_qa_session row and returns
        sessionTokenPlaintext ONCE — required as `X-Session-Token` header on
        subsequent /qa/message calls. Sliding-window enforcement when 5+
        active sessions per invitation (AN-12 Option A — soft-deactivate
        oldest by created_at ASC; never returns 429 on this path).

        Language is locked at session start (AC-S11-05 / AN-2 languageLock);
        defaults to invitation.language when omitted.

        DB function: `fn_signer_qa_session_start` (DEFINER, GRANT EXECUTE TO
        PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S11-01, AC-S11-02, AC-S11-03, AC-S11-04, AC-S11-05, AC-S11-06]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignerQaSessionStartDto" }
            example:
              language: en
      responses:
        "201":
          description: |
            CREATED — sessionTokenPlaintext returned ONCE; rateLimit metadata
            seeded with maxMessagesPerHour=20.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignerQaSessionStartResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/qa/message:
    post:
      tags: [M3 — Signer Q&A AI (verify_jwt=false)]
      operationId: signerQaSessionRecordMessage
      summary: PUBLIC — submit Q&A message; AI response streams back via SSE
      description: |
        PUBLIC unauthenticated. **Server-Sent Events response** —
        `Content-Type: text/event-stream`. The only streaming endpoint in
        the project.

        Two-call rate-limit pattern (DN-10 / AN-2):
        - Pre-AI: controller invokes the fn_ in `mode='GATE'` to RESERVE a
          slot; raises 429 with retryAfterSeconds when the per-session
          (20/h rolling) or per-invitation (50/h rolling) cap is hit.
        - During AI: controller streams OpenAI gpt-4o tokens as
          `{ type: 'token', delta: '...' }` SSE chunks.
        - Post-AI: controller invokes the fn_ in `mode='COMMIT'` with actual
          tokensConsumed; emits terminal `{ type: 'done', tokensConsumed }`
          chunk.
        - On error past header-flip: emits terminal
          `{ type: 'error', code, message?, retryAfterSeconds? }` chunk.

        AI provider: OpenAI gpt-4o; system prompt loaded VERBATIM from
        `prompts/ai-signer-qa.txt` at request time (Mustache-style
        {{placeholder}} substitution; no auto-escaping). NO transcript is
        persisted (AN-2 transcriptStorage; DN-11) — only the per-session
        message_count + tokens_consumed counters.

        Header `X-Session-Token` carries the plaintext session_token returned
        ONCE by POST /qa/session; the fn_ hashes inside (SHA-256 hash-and-match).

        SENSITIVE — `userMessage` is pino-redacted because `ai_prompt_payload`
        is in project.config sensitiveFields (AC-S12-09).

        DB function: `fn_signer_qa_session_record_message` (DEFINER, GRANT
        EXECUTE TO PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP) + per-session 20/h + per-invitation 50/h (fn_-enforced)
      x-authentication: token-bearer (invitation_token in URL path) + session-token-bearer (X-Session-Token header)
      x-acsCovered: [AC-S12-01, AC-S12-02, AC-S12-03, AC-S12-04, AC-S12-05, AC-S12-06, AC-S12-07, AC-S12-08, AC-S12-09, AC-S12-10]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Session-Token
          in: header
          required: true
          description: |
            SENSITIVE — plaintext session_token returned ONCE by
            POST /qa/session. Pino-redacted on egress logs.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignerQaRecordMessageDto" }
            examples:
              gate:
                summary: GATE — pre-AI slot reservation
                value:
                  mode: GATE
                  tokensConsumed: 0
                  userMessage: "What is the cancellation clause in section 7?"
              commit:
                summary: COMMIT — post-AI usage record
                value:
                  mode: COMMIT
                  tokensConsumed: 142
      responses:
        "200":
          description: |
            OK — Server-Sent Events stream. Each chunk is `data: <JSON>\n\n`.
            Three chunk variants — see SignerQaMessageStreamChunk schema.
            Headers include:
            - `Content-Type: text/event-stream; charset=utf-8`
            - `Cache-Control: no-cache, no-transform`
            - `Connection: keep-alive`
            - `X-Accel-Buffering: no` (Nginx flush)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Content-Type:
              schema: { type: string, enum: ["text/event-stream; charset=utf-8"] }
            Cache-Control:
              schema: { type: string, enum: ["no-cache, no-transform"] }
            Connection:
              schema: { type: string, enum: [keep-alive] }
            X-Accel-Buffering:
              schema: { type: string, enum: [no] }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each SSE event is `data: <JSON>\n\n` where JSON conforms to
                  SignerQaMessageStreamChunk. Multiple `token` chunks may
                  precede the terminal `done` (or `error`) chunk.
              example: |
                data: {"type":"token","delta":"The "}

                data: {"type":"token","delta":"cancellation "}

                data: {"type":"token","delta":"clause "}

                data: {"type":"done","tokensConsumed":142}

        "400":
          description: |
            VALIDATION_ERROR — Zod failure (mode/tokensConsumed/userMessage
            discriminator violation).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: |
            GONE — `session_invalid_or_expired` (AC-S12-10; session_token
            unknown or signer_qa_session.is_active=FALSE) OR
            `invitation_invalid_or_expired` (when GATE finds invitation
            already expired/cancelled).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: |
            RATE_LIMITED — per-session (20/h) OR per-invitation (50/h) cap
            hit (AC-S12-04 / AC-S12-05). Response includes
            `retryAfterSeconds` field. Note: when 429 happens AFTER the SSE
            header flip, it surfaces as a terminal SSE error chunk
            (`{ type: 'error', code: 'rate_limit_exceeded', retryAfterSeconds }`)
            instead of an HTTP 429 status.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }


  # ===== M4 — AI Features (introduced 2026-05-04) =====

  /ai/contract-insights:
    post:
      tags: [M4 — AI (Contract + Drafting + Executive)]
      operationId: aiContractInsights
      summary: Request AI insights on a contract (S1)
      description: |
        Modes: `summary | key_terms | risks | obligations | regulatory | rewrite`.
        - `summary` and `rewrite` stream Server-Sent Events
          (`Content-Type: text/event-stream`) — chunks conform to
          `AiInsightsStreamChunk`. The `done` chunk on mode='summary' carries
          `persisted: ContractAiSummaryPersistData` when fn_contract_ai_summary_persist
          succeeded.
        - The other 4 modes return synchronous JSON (`AiContractInsightsResponseBody`)
          via OpenAI tool-call.
        - Cache via `fn_ai_insight_get_cached` / `fn_ai_insight_upsert`
          (24 h TTL; entity_type='contract').
        - Rate limit pre-flight via `fn_ai_request_log_check_rate_limit`
          (60/h, 240/d defaults from ai_prompt seed).
        - Telemetry: one `ai_request_log` row per invocation in a
          `finally{}` block, regardless of cache_hit / success / error.
      x-rateLimit: fn_ai_request_log_check_rate_limit (per ai_prompt seed; 60/h, 240/d)
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter
      x-requiredPermissions: ai.invoke.contract + contract.read.<scope>
      x-authMode: jwt
      x-storyId: S1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiContractInsightsRequest" }
      responses:
        "200":
          description: |
            OK — synchronous tool-call JSON for non-streaming modes
            (`key_terms | risks | obligations | regulatory`) OR Server-Sent
            Events stream for `summary | rewrite`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-AI-Cache:
              description: HIT|MISS (cache layer indicator).
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AiContractInsightsResponseBody" }
                  requestId: { type: string, format: uuid }
            text/event-stream:
              schema:
                type: string
                description: |
                  Each SSE event is `data: <JSON of AiInsightsStreamChunk>\n\n`.
                  Multiple `token` chunks may precede the terminal `done` /
                  `error` chunk.
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Provider error (sanitised; logged via fn_ai_request_log_create with `outcome='error'`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: Provider timeout (logged with `outcome='timeout'`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

