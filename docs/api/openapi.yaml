        (heuristic — free-form ≥20-char `[A-Za-z0-9_]+` without
        `env:`/`vault:` prefix raises 22023 → AC-S3-06). credentialRef
        body is REDACTED in audit_log (`fn_audit_trigger.v_redact_fields`
        — migration 102 extends to 30 names) + Pino logs
        (project.config.json sensitiveFields).
        **credentialRef is NEVER returned in the response** (only
        credentialKind + lastRotatedAt — AC-S3-04 / AC-S3-05).
        DB function: `fn_source_credential_set` (DEFINER carve-out;
        defence-in-depth permission gate at fn body line 1).
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [source.manage]
      x-authMode: jwt
      x-storyId: S3
      x-rateLimit: authedWriteRateLimiter
      parameters:
        - { name: id, in: path, required: true, description: "The osint_source.id this credential is for; FK pre-validated (23503 → 409 if missing).", schema: { type: integer, minimum: 1 } }
      requestBody:
