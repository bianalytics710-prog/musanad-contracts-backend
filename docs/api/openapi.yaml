  /admin/audit/verify:
    post:
      summary: Walk and verify hash-chained audit_log integrity
      description: >
        Walks audit_log rows in id ASC order and verifies the SHA-256 hash chain
        (fn_audit_chain_verify). Returns the first tamper-mismatch or
        success=true. NFR < 30 s @ 100k rows. Rate-limited: 5/min/user.
      operationId: adminAuditChainVerify
      tags: ["M10 — Audit Hardening + Multi-Tenancy + Admin Cockpit"]
      security:
        - BearerAuth: []
      x-authorised-roles: [platform_admin, "Super Admin"]
      x-required-permission: audit.verify
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startSeq:
                  type: integer
                  nullable: true
                  description: Inclusive lower bound on audit_log.id (optional).
                endSeq:
                  type: integer
                  nullable: true
                  description: Inclusive upper bound on audit_log.id. Must be >= startSeq.
      responses:
        "200":
          description: Chain verified (or mismatch found).
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      verified: { type: boolean }
                      totalRows: { type: integer }
                      brokenAtSeq: { type: integer, nullable: true }
                      expectedHash: { type: string, nullable: true }
                      actualHash: { type: string, nullable: true }
                      checkedAt: { type: string, format: date-time }
        "400":
          description: startSeq > endSeq — `{ field: 'startSeq', message: 'invalid_range' }`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
