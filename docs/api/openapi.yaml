        - { $ref: "#/components/parameters/PageQuery" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: jurisdiction
          in: query
          schema: { $ref: "#/components/schemas/RegulationJurisdiction" }
        - name: regulationType
          in: query
          schema: { $ref: "#/components/schemas/RegulationType" }
        - name: issuerId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RegulationStatus" }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of regulations.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RegulationListResponse" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [M5 — Regulations]
      operationId: regulationCreate
      summary: Create a regulation (S3)
      description: |
        legal_counsel + platform_admin only via `regulations.manage`.
        `referenceCode` is UNIQUE; duplicates return 409.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: regulations.manage
      x-authMode: jwt
      x-storyId: S3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRegulationDto" }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RegulationCreateResult" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — `titleEn` missing (23502 → AC-S3-03), invalid
            regulationType/jurisdiction/status (23514 → AC-S3-04), `issuerId`
            not found (23503).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate `referenceCode` (23505 → AC-S3-02).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /regulations/{id}:
    get:
      tags: [M5 — Regulations]
      operationId: regulationGetById
      summary: Get a regulation with supersession chain (S2)
      description: |
        Returns full detail including the recursive supersession chain (max 5
        hops; AC-S2-02). Empty array when terminal.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_approver, contract_approver_2, executive]
      x-requiredPermissions: regulations.read
      x-authMode: jwt
      x-storyId: S2
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Regulation detail.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/Regulation" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Regulation not found or is_active=FALSE (AC-S2-03).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [M5 — Regulations]
      operationId: regulationUpdate
      summary: Patch update on a regulation (S4)
      description: |
        `referenceCode` is immutable post-create — fn raises 23501 if patched
        (AC-S4-05). Setting `supersededById` auto-flips status to `superseded`
        (AC-S4-02). Self-supersede rejected (AC-S4-03). M5-PROD-DEFECT-1
        (migration 053) added a structured FK pre-check on `supersededById` —
        if the target regulation does not exist or is_active=FALSE, the API
        returns 400 with `{ supersededById: 'Referenced regulation not found' }`
        (instead of 422 raw FK fallthrough).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: regulations.manage
      x-authMode: jwt
      x-storyId: S4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRegulationDto" }
      responses:
        "200":
          description: Updated.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RegulationUpdateResult" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — `referenceCode` patch attempt (23501 → AC-S4-05),
            self-supersede (23514 → AC-S4-03), `supersededById` not found
            (23503 → AC-S4-04 — structured raise post-053 patch), invalid enum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Regulation not found (P0002 → AC-S4-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [M5 — Regulations]
      operationId: regulationDelete
      summary: Soft-delete a regulation (S5)
      description: |
        platform_admin only at the function body (AC-S5-04 — legal_counsel
        cannot delete; route gate accepts `regulations.manage` and the fn body
        re-gates). Active-impact guard: 409 if any regulatory_impact rows
        reference this regulation (AC-S5-02 — cleaner UX than raw 23503 FK
        violation). Sets is_active=FALSE and status='repealed'.
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: regulations.manage
      x-authMode: jwt
      x-storyId: S5
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Soft-deleted.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RegulationDeleteResult" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller is not platform_admin (AC-S5-04 — legal_counsel cannot delete).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Regulation not found (AC-S5-03).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Active impact rows reference this regulation (AC-S5-02).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

