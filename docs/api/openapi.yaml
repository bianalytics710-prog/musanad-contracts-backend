        reject with 422 (fn_role_permission_revoke).
      operationId: adminRolePermissionRevoke
      tags: ["M10 — Audit Hardening + Multi-Tenancy + Admin Cockpit"]
      security:
        - BearerAuth: []
      x-authorised-roles: [platform_admin, "Super Admin"]
      x-required-permission: role.manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: permId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Permission revoked (or was not granted).
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    properties:
                      revoked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks role.manage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: "`{ message: 'role_not_found' }` OR `{ message: 'permission_not_found' }`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: "`{ message: 'cannot_revoke_system_grant' }` — Super Admin essential grant."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

