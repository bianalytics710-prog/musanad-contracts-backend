        Migration 008 adds SELECT FOR UPDATE on the contract row before
        reading existing values, serialising concurrent updates against
        each other and against soft-delete (Codex BE-002).

        DB function: `fn_contract_update`.
      x-rateLimit: authedWriteRateLimiter
