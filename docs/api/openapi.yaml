  # --------------------------------------------------------------------------
  # M1b paths
  #
  # W1 ROUTE-ORDERING NOTE (binds Express runtime, not the OpenAPI generator):
  #   `GET /contracts/export.xlsx` is a LITERAL path. In Express, route matching
  #   is order-sensitive — this literal route MUST be declared BEFORE any
  #   `/contracts/{id}` route or any `/contracts/{id}/...` matcher (otherwise
  #   the path binds `:id='export.xlsx'` and fails PositiveBigIntSchema with
  #   400 instead of reaching the export controller). Verified in
  #   `src/routes/v1/contracts.routes.ts` L73-80 (literal) declared before
  #   L109+ (any `:id` matchers). Smoke test: unauthenticated GET
  #   /api/v1/contracts/export.xlsx → 401 (auth fires first), NOT 400.
  # --------------------------------------------------------------------------

  /contracts/export.xlsx:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: contractExportXlsx
      summary: Export filtered contract list to XLSX
      description: |
        List-level XLSX export. Accepts the same filter set as
        `GET /contracts` (M1a `fn_contract_list`) plus an optional `maxRows`
        clamp (default 10000, hard-clamped 1..50000). Backend exceljs
        WorkbookWriter streams the workbook so memory stays bounded. Per G6:
        heavy bundles (xlsx 0.18.5) moved off the FE.

        - body_en / body_ar are EXCLUDED from the worksheet (AC-S5-02).
        - Role-aware visibility mirrors `fn_contract_list` (AC-S5-04).
        - When the result set exceeds `maxRows`, the workbook gets a
          translated "Result truncated…" footer row AND the response carries
          `X-Export-Truncated: true` (AC-S5-05).
        - Empty result → header row only, NOT an error (AC-S5-07).
        - Emits ONE `audit_log` row via SECURITY DEFINER `fn_audit_log_record`
          AFTER the workbook stream completes (AC-S5-08); discriminated by
          `new_values.event = 'EXPORT'`. NO `contract_activity` rows (per Q4).
        - Rate-limited via `exportRateLimiter` (30 req/min/user — AC-S5-10).

        DB function: `fn_contract_export_xlsx`. Audit helper:
        `fn_audit_log_record` (SECURITY DEFINER, EXECUTE GRANT to
        `neondb_owner` only).
      x-rateLimit: exportRateLimiter (30 / min / authenticated user)
      x-routeOrdering: |
        LITERAL path — declared BEFORE /contracts/{id} matchers in
        src/routes/v1/contracts.routes.ts (W1 enforcement).
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own only — via CMW-2 grant migration 010)
        - executive (read-all scope)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own AND contract.export
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contractType
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: draftedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approvedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: tags
          in: query
          description: AND-semantics tag filter. Repeated query param or comma-list.
          schema:
            type: array
            items: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: maxRows
          in: query
          description: Hard-clamped 1..50000. Default 10000. AC-S5-05/06.
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
      responses:
        "200":
          description: Workbook binary (XLSX).
          headers:
            Content-Disposition:
              description: Attachment filename `contracts-YYYYMMDD-HHmm.xlsx`.
              schema: { type: string }
            X-Export-Truncated:
              description: Present and `true` only when truncated=true (AC-S5-05).
              schema: { type: string, enum: ["true"] }
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          description: VALIDATION_ERROR — `maxRows` out of range (AC-S5-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/payment-schedules:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: paymentScheduleList
      summary: List the active payment milestone schedule for a contract
      description: |
        Returns the active milestones for a contract, ordered by `due_date ASC
        NULLS LAST` then `id ASC`. NOT paginated (typical 1–30 rows per
        contract). Empty `data` array — not 404 — when the contract exists but
        has no milestones (AC-S2-04). 404 (NOT 403) when the actor cannot see
        the parent contract per RLS (AC-S2-03 layered defense).

        DB function: `fn_payment_schedule_list` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - executive
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentScheduleStatus" }
      responses:
        "200":
          description: Active payment schedule rows.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PaymentScheduleListResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: paymentScheduleReplace
      summary: Atomic bulk-replace of a contract's milestone schedule
      description: |
        Soft-deletes existing active rows for the contract then inserts the new
        set in a single transaction. Used by both the standalone Payment
        Schedule Editor modal AND the Compose Wizard submit flow (Q2 — FE-only
        orchestration: POST /contracts → PUT /:id/payment-schedules; NO new BE
        wrapper endpoint).

        - Controller hardcodes `p_replace_existing=true` (AC-S3-01) regardless
          of any client-supplied `replaceExisting`.
        - Concurrency: `fn_payment_schedule_create_bulk` takes
          `SELECT FOR UPDATE` on the parent contract row before any read/write
          of `payment_schedule` (Codex BE-001 pattern, AC-S3-11). Concurrent
          calls against the same contract id are serialised.
        - Emits ONE `contract_activity` row of type
          `payment_schedule_replaced` (AC-S3-10) with metadata
          `{insertedCount, softDeletedCount}`.
        - Permission: `contract.edit` OR (`contract.draft` AND own draft
          contract with status IN draft|resubmission_requested).

        DB function: `fn_payment_schedule_create_bulk`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own draft only)
      x-permissionRequired: contract.edit OR (contract.draft AND own draft)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentScheduleBulkReplaceDto" }
      responses:
        "200":
          description: Replace succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PaymentScheduleBulkReplaceResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/export.pdf:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: contractExportPdf
      summary: Export a single contract to PDF (en / ar / bilingual)
      description: |
        Single-contract PDF export. Backend Puppeteer (headless Chromium)
        renders an HTML template (i18n + Tailwind-derived CSS, `dir='rtl'` for
        Arabic) and pipes back `application/pdf` binary. Per G6: heavy bundles
        (jspdf) moved off the FE.

        - Languages: `en | ar | bilingual` (default `bilingual`) — AC-S4-05.
        - PDF includes contract head + parties placeholder + body in requested
          language(s) + tags + payment-schedule table (AC-S4-02).
        - body_en / body_ar are pino-redacted in BE logs (paths
          `*.bodyEn`, `*.body_en`, `*.bodyAr`, `*.body_ar`) — AC-S4-08.
        - Emits ONE `contract_activity` row of type `exported` (AC-S4-06) with
          metadata `{format:'pdf', language, includeAttachments}`. POST migration
          015, this row is emitted by the controller (AFTER render, BEFORE
          response) — NOT by the fn_ — so render-throw paths never write the
          row (Codex BE-M1b-004).
        - Rate-limited via `exportRateLimiter` (30 req/min/user — AC-S4-09).
        - `includeAttachments` is accepted but no-op (AC-S4-10) until the
          Attachments module ships.

        Renderer pipeline:
          1. fn_contract_export_pdf returns ContractExportPdfResponse JSONB
             (data prep — STABLE post-015, no side effects).
          2. BE controller renders HTML template; Puppeteer launches/uses the
             singleton Chromium (Codex BE-M1b-003 pool — `withPage()` /
             `p-limit(PUPPETEER_MAX_CONCURRENT)` semaphore).
          3. Buffer is streamed back; controller emits `contract_activity`
             AFTER successful render, BEFORE `res.send`.

        DB function: `fn_contract_export_pdf` (SECURITY INVOKER STABLE
        post-015).
      x-rateLimit: exportRateLimiter (30 / min / authenticated user)
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own only — via CMW-2 grant)
        - executive (read-all scope)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own AND contract.export
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: language
          in: query
          schema:
            type: string
            enum: [en, ar, bilingual]
            default: bilingual
        - name: includeAttachments
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: PDF binary.
          headers:
            Content-Disposition:
              description: Attachment filename `<contractNumber>-<language>.pdf`.
              schema: { type: string }
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: VALIDATION_ERROR — invalid `language` (AC-S4-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ============================================================
  # M1c — Bulk & Manual Import (4 import-batch endpoints + 1 AI stub)
  #
  # Route ordering in src/routes/v1/import-batches.routes.ts:
  #   1. POST   /import-batches             (S1)
  #   2. GET    /import-batches             (S3 — list, no :id)
  #   3. GET    /import-batches/:id         (S4)
  #   4. PATCH  /import-batches/:id         (S2)
  # No literal-before-:id collision (no /import-batches/<keyword>) so the
  # M1b W1 ordering rule is informational here.
  #
  # AI namespace (NEW in M1c): src/routes/v1/ai.routes.ts
  #   1. POST   /ai/extract-contract-bulk   (S8 — controller-only stub)
  # Inherits these conventions for M4: JWT required; permission-gated at the
  # controller; authedWriteRateLimiter; pino-redact ai_prompt_payload; FROZEN
  # request + response DTOs (HQ2).
  # ============================================================

  /import-batches:
    post:
      tags: [M1c — Imports]
      operationId: importBatchCreate
      summary: Create a new bulk-import batch (S1)
      description: |
        Initiate a new bulk-import batch. Sets totalFiles up-front; counters
        start at 0; status='in_progress'; initiated_by = current user. Returns
        the full ImportBatch shape via fn_import_batch_get_by_id (initiatedBy
        hydrated as UserRef).

        - AC-S1-04: caller MUST hold `import.run` (BE authorise() gate +
          fn_ defense-in-depth + RLS WITH CHECK on import_batch_insert_runner).
        - AC-S1-05: initiated_by = current_setting('app.current_user_id'),
          NOT a body field — RLS WITH CHECK forbids impersonation.
        - AC-S1-02: totalFiles >= 1 — Zod first, fn_ second.
        - AC-S1-03: config.statusMode in {active|draft|auto} when present.

        DB function: `fn_import_batch_create` (SECURITY INVOKER,
        SET search_path = public, pg_temp).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, contract_drafter]
      x-requiredPermissions: [import.run]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportBatchDto" }
            example:
              totalFiles: 50
              config:
                contractType: service
                statusMode: active
                defaultCounterpartyId: 12
      responses:
        "201":
          description: Batch created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400":
          description: |
            VALIDATION_ERROR — totalFiles < 1 (field='totalFiles'),
            invalid statusMode (field='config.statusMode'), or invalid
            contractType (field='config.contractType').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks `import.run` permission (AC-S1-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [M1c — Imports]
      operationId: importBatchList
      summary: List import batches (paginated, role-aware) (S3)
      description: |
        Paginated, role-aware list of import batches. Ordered by
        `started_at DESC, id DESC` tiebreaker (AC-S3-01). totalPages = 0 when
        total = 0 (M1a 007 patch precedent — AC-S3-02). Soft-deleted
        (is_active=false) batches universally excluded (AC-S3-08).

        Role narrowing (AC-S3-07):
          - platform_admin / legal_counsel / Super Admin / executive
              → see ALL active batches (v_role_can_see_all gate inside
                fn_import_batch_list + import_batch_select_role_aware RLS policy).
          - contract_drafter → sees ONLY own batches (initiated_by = current_user).

        Permission gate is upstream (controller checks anyOf(import.review,
        import.run)); fn_ enforces row visibility. Defense in depth — Codex
        G2 lesson + M1a precedent.

        DB function: `fn_import_batch_list` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own batches only)
      x-requiredPermissions: anyOf(import.review, import.run)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: AC-S3-05 — clamped 1..100.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ImportBatchStatus" }
          description: AC-S3-03 optional status filter.
        - name: initiatedBy
          in: query
          schema: { type: integer, minimum: 1 }
          description: AC-S3-03 optional initiator filter (raw bigint user id).
      responses:
        "200":
          description: Paginated batch list.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks both `import.review` AND `import.run` (AC-S3-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /import-batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        description: import_batch.id (positive bigint).
    get:
      tags: [M1c — Imports]
      operationId: importBatchGetById
      summary: Get a single import batch with hydrated initiator (S4)
      description: |
        Returns the full ImportBatch shape with initiatedBy hydrated as
        UserRef via M0 fn_user_get_by_id (AC-S4-04). Per-batch contract
        drill-down is served by `GET /api/v1/contracts?importBatchId={id}`
        (AC-S4-05) — see the M1a contracts list endpoint with M1c-extended
        params.

        Returns 404 (NOT 403) when the batch does not exist OR is_active=false
        OR not visible to the caller via RLS (Design Note D7 — matches
        M1a fn_contract_get_by_id pattern; avoids leaking existence to
        unauthorised callers).

        DB function: `fn_import_batch_get_by_id` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own batch only)
      x-requiredPermissions: anyOf(import.review, import.run)
      responses:
        "200":
          description: Batch found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            Batch not found, soft-deleted, or not visible to caller (AC-S4-02 +
            AC-S4-03). 404 is intentional — RLS-narrowed not-authorised surfaces
            as 404 (Design Note D7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    patch:
      tags: [M1c — Imports]
      operationId: importBatchUpdate
      summary: Update batch counters and/or transition lifecycle status (S2)
      description: |
        Apply counter deltas (signed integers) and/or transition lifecycle
        status. SELECT FOR UPDATE on the batch row inside fn_import_batch_update
        serialises concurrent counter writes (Codex BE-001 — Design Note D8).
        Returns the full updated ImportBatch shape via fn_import_batch_get_by_id.

        - AC-S2-01: counters incremented atomically.
        - AC-S2-02: allowed transitions:
            in_progress → paused | completed | cancelled
            paused      → in_progress | completed | cancelled
            completed   → (terminal)
            cancelled   → (terminal)
          Other transitions raise 'status:Invalid status transition' → 409.
        - AC-S2-03: when transitioning to completed/cancelled, completed_at =
          CURRENT_TIMESTAMP set in same transaction (also enforced by
          chk_import_batch_completed_at_status — Design Note D2).
        - AC-S2-04: per-counter underflow guard → 400 with the failing field name.
        - AC-S2-05: 5-counter sum overflow vs totalFiles → 400 (also enforced
          declaratively by chk_import_batch_counter_sum — Design Note D3).
        - AC-S2-07: caller must be initiator OR have import.run; defense in depth.
        - AC-S2-08: 'reopen' from terminal states is rejected → 409.

        Direct flips of `is_active` or `initiated_by` are blocked by the
        BEFORE UPDATE trigger `trg_import_batch_immutable_fields` (Codex C1
        fix, migration 021) — SQLSTATE 42501 → BE 403.

        DB function: `fn_import_batch_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - contract_drafter (initiator-self only)
        - legal_counsel (only when also initiator)
      x-requiredPermissions: anyOf(import.run, import.review) + initiator-self enforcement in fn_
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImportBatchDto" }
            example:
              autoSavedDelta: 1
              reviewQueueDelta: 0
      responses:
        "200":
          description: Updated batch shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400":
          description: |
            VALIDATION_ERROR — counter underflow (field one of autoSaved,
            reviewQueue, manualEntry, duplicatesSkipped, errored) or counter
            overflow (field='counters').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            FORBIDDEN — caller is neither admin nor initiator AND lacks
            import.run (AC-S2-07). Also: any direct UPDATE that flips
            is_active or initiated_by raises SQLSTATE 42501 (trigger).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Batch not found or is_active=false (AC-S2-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — invalid status transition (AC-S2-02 / AC-S2-08).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ai/extract-contract-bulk:
    post:
      tags: [M1c — AI]
      operationId: aiExtractContractBulk
      summary: AI extraction stub for bulk-import flow (S8 — controller-only)
      description: |
        Controller-only AI extraction STUB. NO fn_, NO DB persistence. Returns
        a deterministic mock derived from extractedText.length so routing-by-
        confidence tests are repeatable.

        Architecture (HQ1 + HQ2 ratified):
          - File extraction (mammoth/pdfjs) runs IN THE BROWSER per AC-S5-02.
            The backend receives only the extracted text + filename + size.
          - The Supabase 'contracts' bucket upload is FE-direct (best-effort,
            non-blocking) — no BE storage abstraction. Filename is captured on
            contract.import_filename for forensics.

        DTO contract is FROZEN (AC-S8-07): M4 will replace this controller body
        with a real AI provider call WITHOUT changing route, auth, request DTO,
        or response DTO.

        - AC-S8-02: caller MUST hold `import.run`.
        - AC-S8-03: extractedText min 50 chars.
        - AC-S8-04: confidence formula —
          `round(min(95, max(20, extractedText.length / 100)))`
          implemented in src/services/ai/extract-contract-bulk.service.ts.
        - AC-S8-05: rate-limited via authedWriteRateLimiter (429 on excess).
        - AC-S8-06: extractedText is `ai_prompt_payload` per
          project.config.json sensitiveFields. Pino-redacted across 7 paths
          (Codex M1 fix). Controller additionally avoids logging req.body —
          only filename / fileSize / batchId / textLength as derived metadata.

        DB function: NONE — this endpoint never touches the database.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, contract_drafter]
      x-requiredPermissions: [import.run]
      x-frozenDto: true
      x-replaceableBy: M4 (real AI provider call — controller body only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractContractBulkRequest" }
            example:
              filename: "service-agreement-acme-2026.pdf"
              fileSize: 184320
              extractedText: "<extracted text — pino-redacted on log; min 50 chars>"
              batchId: 42
      responses:
        "200":
          description: Deterministic mock extraction response.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractContractBulkResponse" }
        "400":
          description: |
            VALIDATION_ERROR — filename empty, fileSize < 0, extractedText
            < 50 chars (AC-S8-03), or batchId not a positive integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks `import.run` (AC-S8-02).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: RATE_LIMITED — authedWriteRateLimiter exceeded (AC-S8-05).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

# Note: /api/health lives at the root, NOT under /api/v1. Documented as an
# absolute path here so generators emit it correctly.
x-paths-root:
  /api/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness / readiness probe
      description: |
        Returns 200 with `{status, db, uptime, version, timestamp, requestId}` when the
        database is reachable. Suitable for k8s liveness AND readiness probes.
        Returns 503 if the DB is unreachable.

        NB: this endpoint lives at `/api/health` (no `/v1` prefix) per M0 spec.
      x-rateLimit: unlimited (no auth)
      security: []
      responses:
        "200":
          description: Service healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example:
                status: ok
                db: reachable
                uptime: 1234.56
                version: 0.1.0
                timestamp: 2026-05-02T12:34:56.000Z
                requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
        "503":
          description: UNHEALTHY - database or critical dependency unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # =====================================================================
  # M2 — Approval Workflows
  # =====================================================================

  /approvals/my-pending:
    get:
      tags: [M2 — Approvals]
      operationId: approvalListMyPending
      summary: List pending approval steps assigned to the calling user
      description: |
        Paginated list of pending approval steps assigned to the calling user
        via 4 OR-arms: (a) `approver_user_id = current_user`, (b)
        `approver_role IN current_user_roles AND approver_user_id IS NULL`,
        (c) `delegated_to = current_user`, (d) `reassigned_to = current_user`.
        RLS narrows naturally via approval_step → approval_chain → contract.
        DB function: `fn_approval_my_pending`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_approver, contract_approver_2, contract_drafter, executive]
      x-acsCovered: [AC-S1-01, AC-S1-02, AC-S1-03, AC-S1-04, AC-S1-05, AC-S1-06]
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalPendingSort" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPendingApprovalListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /approvals/{stepId}/decide:
    post:
      tags: [M2 — Approvals]
      operationId: approvalDecide
      summary: Approver acts on a pending step (approve / reject / request_resubmission)
      description: |
        Atomically inserts an approval_decision row, updates step + chain +
        contract status as needed. Parallel-group aware (all-of vs any-of
        derived from peer is_required pattern, M2-NEW-4). On terminal chain
        transitions, calls fn_contract_status_update_internal (DEFINER) which
        emits the lifecycle status_changed activity row; this fn separately
        emits the rich `approval_decided` row (BE-M1b-004 audit-after-render).
        DB function: `fn_approval_decide` (locks step + chain + contract FOR
        UPDATE; NULL-safe actor check via IS NOT DISTINCT FROM, migration 031).

        delegate / reassign / escalate are SEPARATE endpoints — fn_approval_decide rejects them at step 1 with 400.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_approver, contract_approver_2]
      x-requiredPermissions: [approval.act]
      x-acsCovered: [AC-S2-01, AC-S2-02, AC-S2-03, AC-S2-04, AC-S2-05, AC-S2-06, AC-S2-07, AC-S2-08, AC-S2-09]
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideApprovalDto" }
            examples:
              approve:
                summary: Approve
                value: { decision: approve }
              rejectWithNote:
                summary: Reject with required note
                value: { decision: reject, decisionNote: "Counterparty entity name does not match the ICA filing." }
              requestResubmission:
                summary: Request resubmission
                value: { decision: request_resubmission, decisionNote: "Add the indemnification clause from template T-2024-12." }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecideApprovalResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT — step already decided.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /approvals/{stepId}/delegate:
    post:
      tags: [M2 — Approvals]
      operationId: approvalDelegate
      summary: Approver voluntarily delegates a pending step to another user
      description: |
        Voluntary delegation by the assigned approver to another user with a
        compatible role. Updates step.delegated_to (status remains 'pending';
        AC-S3-01). Inserts approval_decision row with decision='delegate'.
        Self-delegation is rejected (AC-S3-04).
        DB function: `fn_approval_delegate` (locks step FOR UPDATE).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_approver, contract_approver_2]
      x-requiredPermissions: [approval.act, approval.delegate]
      x-acsCovered: [AC-S3-01, AC-S3-02, AC-S3-03, AC-S3-04, AC-S3-05, AC-S3-06]
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegateApprovalDto" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegateApprovalResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT — step is not pending.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/approval-matrix:
    get:
      tags: [M2 — Admin Approvals]
      operationId: approvalMatrixList
      summary: List active approval matrix rules
      description: |
        Paginated, ordered list of active approval matrix rules. Permission
        gate `approval.matrix.read` (AC-S4-05). Ordered by contract_type ASC,
        step_order ASC, parallel_group NULLS FIRST, approver_role ASC.
        DB function: `fn_approval_matrix_list`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [approval.matrix.read]
      x-acsCovered: [AC-S4-01, AC-S4-02, AC-S4-03, AC-S4-04, AC-S4-05]
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: contractType
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalMatrixListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [M2 — Admin Approvals]
      operationId: approvalMatrixSet
      summary: Atomic upsert/replace of approval matrix rules for a (contractType, value range)
      description: |
        Atomic upsert/replace of approval matrix rules for a (contract_type,
        value range). fn_approval_matrix_set soft-deletes existing active rows
        for the (contract_type, min, max) tuple and INSERTs the new ordered
        rule set. PUT semantics chosen because the operation is replace-shaped
        (idempotent body); POST creation is not modeled separately.
        pg_advisory_xact_lock prevents concurrent admin races on the same range.
        DB function: `fn_approval_matrix_set`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [approval.matrix.write]
      x-acsCovered: [AC-S5-01, AC-S5-02, AC-S5-03, AC-S5-04, AC-S5-05, AC-S5-06, AC-S5-07, AC-S5-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApprovalMatrixDto" }
            example:
              contractType: service_agreement
              valueMin: 0
              valueMax: 50000
              rules:
                - { stepOrder: 1, approverRole: contract_approver, isRequired: true, escalationRole: legal_counsel, escalationAfterHours: 48 }
                - { stepOrder: 2, approverRole: legal_counsel, isRequired: true }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalMatrixSetResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/approval-chain/preview:
    post:
      tags: [M2 — Approvals]
      operationId: approvalChainPreview
      summary: Read-only preview of which matrix rules would route a (contractType, valueAed) pair
      description: |
        Read-only preview of which matrix rules would apply to a given
        (contractType, valueAed) pair. Does NOT persist a chain
        (fn_approval_route_init_preview is STABLE — no INSERT/UPDATE/DELETE).
        FE uses this to show 'will route to N approvers' before the drafter
        clicks Submit (S7). POST + body chosen over GET + query string to
        keep commercial value (valueAed) out of access logs.
