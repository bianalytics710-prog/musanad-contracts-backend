  # 8 net-new endpoints: cascade (5) + party workforce (3)
  # ============================================================

  /regulatory/cascade/run:
    post:
      tags: ["CR-M — Labor-Law Cascade"]
      summary: Run labor-law cascade
      description: |
        Fan the Federal Decree-Law No.9/2024 signal across ADNOC's contractor population.
        Produces one regulatory_cascade_item per non-compliant or clause-matched contractor.
        Synchronous (<5s for ~40 contractors). Returns full run detail immediately.
        SECURITY DEFINER function — BE sets app.current_tenant_id + app.current_user_id GUCs.
      operationId: runRegulatoryCascade
      security: [{ BearerAuth: [] }]
      x-authorised-roles: ["compliance_esg", "platform_admin", "Super Admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signalId:
                  type: integer
                  description: osint_signal.id of the Federal Decree-Law No.9/2024 signal
                impactSignalId:
                  type: integer
                  description: Alias for signalId (legacy naming — controller normalises)
                params:
                  type: object
                  properties:
                    employmentClauseTypes:
                      type: array
                      items: { type: string }
                      description: Override employment clause-type filter (defaults to server config)
              description: At least one of signalId or impactSignalId required
      responses:
        "200":
          description: Cascade complete — full run detail with per-contractor items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegulatoryCascadeRun" }
        "400": { description: signalId missing or invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks regulatory.cascade.run permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Signal not found or not kind=regulatory, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

