      description: |
        Paginated list of pending approval steps assigned to the calling user
        via 4 OR-arms: (a) `approver_user_id = current_user`, (b)
        `approver_role IN current_user_roles AND approver_user_id IS NULL`,
        (c) `delegated_to = current_user`, (d) `reassigned_to = current_user`.
        RLS narrows naturally via approval_step → approval_chain → contract.
        DB function: `fn_approval_my_pending`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_approver, contract_approver_2, contract_drafter, executive]
      x-acsCovered: [AC-S1-01, AC-S1-02, AC-S1-03, AC-S1-04, AC-S1-05, AC-S1-06]
      parameters:
        - $ref: "#/components/parameters/PageQuery"
