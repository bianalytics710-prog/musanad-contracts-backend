            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [M7 — OSINT Sources]
      operationId: osintSourceDelete
      summary: Soft-delete an OSINT source
      description: |
        Soft-delete sets `is_active=false AND enabled=false` in a single
        UPDATE; existing osint_signal rows referencing the source remain
        queryable (Annex B.7.3 source decommissioning rule + AC-S3-07).
        DB function: `fn_osint_source_delete`.
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [source.manage]
      x-authMode: jwt
      x-storyId: S3
