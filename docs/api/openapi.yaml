        — NOT in the PUBLIC EXECUTE allowlist (Q3 Option A). The 5 PUBLIC
        EXECUTE grants stay exactly the M3 set.

        **Service unavailable:** if `SIGNED_PDF_TOKEN_SECRET` is unset at
        boot, S5 returns 503 (intentional; documented in M4-SMOKE-BE-INFO-2;
