openapi: 3.0.3
info:
  title: Musanad Contracts Hub - M0 Foundation API
  description: |
    M0 Foundation API for the Musanad Contracts Hub platform. Covers authentication
    (login, refresh, logout, UAE Pass federated entry), user CRUD, role catalog,
    permission catalog, and the operational health probe.

    All routes are prefixed with `/api/v1` except `/api/health` (infrastructural).

    Architecture: thin HTTP controllers call PostgreSQL `fn_*` functions
    (Database Objects First). RLS is enforced server-side via the
    `app.current_user_id` session GUC, set by middleware before every fn_ call.

    Every response carries an `X-Request-ID` correlation header.
  version: 0.1.0
  contact:
    name: Musanad Technologies FZ-LLC
servers:
  - url: http://localhost:4000/api/v1
    description: Local development backend
  - url: http://localhost:4000
    description: Local development backend (root - for /api/health only)

tags:
  - name: Auth
    description: Authentication endpoints (login, logout, refresh)
  - name: UAE Pass
    description: UAE Pass federated identity (mocked in M0; real provider stubbed)
  - name: Users
    description: User CRUD (admin)
  - name: Roles
    description: Role catalog (read-only in M0)
  - name: Permissions
    description: Permission catalog (read-only in M0)
  - name: Health
    description: Liveness / readiness probes
  - name: M1a — Contracts
    description: |
      Contracts core CRUD & lifecycle (M1a). 11 endpoints covering list/get/create/
      update/soft-delete, status transitions, parent/child tree, tag management,
      version history, and the contract activity timeline. body_en/body_ar are
      sensitive (pino-redacted on logs and audit_log JSONB-redacted by
      fn_audit_trigger).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token (15-minute TTL). Validated claims: `aud`, `iss`, `exp`.
        Issued by `POST /api/v1/auth/login`.
        Refreshed via `POST /api/v1/auth/refresh` (rotation: both access AND
        refresh tokens are rotated; old refresh is blacklisted server-side).
        Logout blacklists the supplied refresh token via `fn_auth_blacklist_token`.

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  headers:
    X-Request-ID:
      description: Correlation UUID. Propagated through controller, fn_ calls, and Pino logs.
      schema:
        type: string
        format: uuid

  schemas:
    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 3 }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. VALIDATION_ERROR, UNAUTHORIZED).
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable, sanitized message. Raw PG errors are NEVER passed through.
              example: Email is required
            requestId:
              type: string
              format: uuid
              description: Correlation id, also returned in the X-Request-ID header.
            fields:
              type: object
              description: Optional per-field validation errors (Zod issues mapped here).
              additionalProperties:
                type: array
                items: { type: string }
      example:
        success: false
        error:
          code: VALIDATION_ERROR
          message: Invalid request body
          requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
          fields:
            email: ["Required"]

    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Super Admin }

    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description:
          type: string
          nullable: true
        permissionCount: { type: integer, example: 4 }

    Permission:
      type: object
      required: [id, code, module, action]
      properties:
        id: { type: integer }
        code:
          type: string
          example: user.read.all
          description: Canonical permission identifier (dot-notation). NOT a name.
        module: { type: string, example: user }
        action: { type: string, example: read.all }
        description:
          type: string
          nullable: true

    User:
      type: object
      required: [id, email, firstName, lastName, isActive, createdAt, updatedAt, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }
          description: Array of permission CODES held by this user (via role).
          example: ["audit.read", "role.manage", "user.manage", "user.read.all"]

    AuthUser:
      type: object
      description: User shape stored in frontend auth state. Strict subset of User; never contains passwordHash.
      required: [id, email, firstName, lastName, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }

    UserListItem:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"

    RefreshTokenDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    LogoutDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }

    CreateUserDto:
      type: object
      required: [email, password, firstName, lastName, roleId]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Plaintext on the wire only. BE bcrypt-hashes (12 rounds) before fn_user_create. Pino-redacted.
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        roleId: { type: integer, minimum: 1 }

    UpdateUserDto:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roleId: { type: integer, minimum: 1 }

    DeleteUserResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string, example: User deactivated }

    HealthResponse:
      type: object
      required: [status, db, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [reachable, unreachable]
        uptime:
          type: number
          description: Process uptime in seconds.
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    UaePassInitiateRequest:
      type: object
      additionalProperties: false
      properties:
        redirectAfter:
          type: string
          format: uri
          description: Optional client redirect target after callback completes.

    UaePassInitiateResponse:
      type: object
      required: [authorizeUrl, state]
      properties:
        authorizeUrl: { type: string, format: uri }
        state:
          type: string
          minLength: 32
          description: Random hex (>= 32 chars). Single-use, 5-minute TTL. Echo unchanged into /callback.

    UaePassCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code from the UAE Pass IdP.
        state:
          type: string
          minLength: 1
          description: Echo of the state issued by /initiate. Single-use, 5-min TTL. (CRX-3)

    UaePassCallbackResponse:
      type: object
      required: [success, provider, identity]
      properties:
        success: { type: boolean, enum: [true] }
        provider:
          type: string
          enum: [mock, live]
        identity:
          type: object
          required: [sub, trustLevel]
          properties:
            sub: { type: string }
            fullNameEn: { type: string, nullable: true }
            fullNameAr: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            trustLevel: { type: string, example: SOP2 }

    # ------------------------------------------------------------
    # M1a — Contracts: Core CRUD & Lifecycle
    # ------------------------------------------------------------
    ContractStatus:
      type: string
      description: |
        14-state contract lifecycle. M1a only validates enum membership;
        state-machine transitions (which terminal -> next is legal) land in M2.
      enum:
        - draft
        - in_review
        - approved
        - awaiting_signature_employer
        - awaiting_signature_counterparty
        - fully_signed
        - active
        - expiring_soon
        - expired
        - amended
        - renewed
        - terminated
        - rejected
        - resubmission_requested

    ContractLanguage:
      type: string
      enum: [en, ar, bilingual]

    ContractGoverningLaw:
      type: string
      enum: [uae_federal, dubai, abu_dhabi, sharjah, difc, adgm, english, other]
      nullable: true

    ContractRelationshipType:
      type: string
      description: Relationship to the parent contract when parentContractId is set.
      enum: [amendment, renewal, extension, superseded, sow_under_msa]
      nullable: true

    ContractActivityType:
      type: string
      description: Activity event type (M1a set; M2/M3 may extend via ALTER CHECK).
      enum:
        - created
        - updated
        - status_changed
        - version_created
        - tagged
        - soft_deleted
        - restored

    ContractActorRef:
      type: object
      nullable: true
      required: [id, firstName, lastName]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }

    ContractListItem:
      type: object
      description: |
        Slim list payload. body_en/body_ar are NEVER returned here (AC-S1-08).
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - currency
        - currentVersion
        - tags
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        contractNumber: { type: string, example: CT-2026-000123 }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        status: { $ref: "#/components/schemas/ContractStatus" }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string, example: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        ourPartyId: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string }
        currentVersion: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Contract:
      type: object
      description: |
        Full contract payload. bodyEn/bodyAr appear in the response but are
        pino-redacted on logging.
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - language
        - currency
        - currentVersion
        - tags
        - attachmentCount
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        templateId: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        expiryNoticeDays: { type: integer, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        currentVersion: { type: integer }
        draftedBy: { $ref: "#/components/schemas/ContractActorRef" }
        reviewedBy: { $ref: "#/components/schemas/ContractActorRef" }
        approvedBy: { $ref: "#/components/schemas/ContractActorRef" }
        aiRiskScore: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        aiSummaryEn: { type: string, nullable: true }
        aiSummaryAr: { type: string, nullable: true }
        importBatchId: { type: integer, nullable: true }
        importConfidence: { type: integer, nullable: true }
        importFilename: { type: string, nullable: true }
        importWarnings:
          type: object
          nullable: true
          additionalProperties: true
        tags:
          type: array
          items: { type: string }
        attachmentCount: { type: integer, example: 0 }
        commentCount: { type: integer, example: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContractDto:
      type: object
      required: [titleEn, contractType]
      additionalProperties: false
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, minLength: 1, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string, default: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }

    UpdateContractDto:
      type: object
      additionalProperties: false
      description: |
        Partial COALESCE update. Status MUST NOT be supplied here - use
        PATCH /contracts/{id}/status instead (AC-S4-04, .strict() rejects).
        Tags are not part of this DTO - use PUT /contracts/{id}/tags.
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }

    UpdateContractStatusDto:
      type: object
      required: [newStatus]
      additionalProperties: false
      properties:
        newStatus: { $ref: "#/components/schemas/ContractStatus" }
        reason: { type: string, maxLength: 500, nullable: true }

    SetContractTagsDto:
      type: object
      required: [tags]
      additionalProperties: false
      properties:
        tags:
          type: array
          description: Replacement tag set. Empty array clears all tags.
          items: { type: string, minLength: 1, maxLength: 64 }

    CreateContractVersionDto:
      type: object
      required: [changeNote]
      additionalProperties: false
      description: |
        At least one of bodyEn or bodyAr must be provided (AC-S10-04).
      properties:
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }
        changeNote: { type: string, minLength: 1, maxLength: 500 }
        diffSummary: { type: string, nullable: true }

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        bodyEn: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        bodyAr: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        diffSummary: { type: string, nullable: true }
        changeNote: { type: string, nullable: true }
        changedBy: { $ref: "#/components/schemas/ContractActorRef" }
        createdAt: { type: string, format: date-time }

    ContractTreeNode:
      type: object
      required: [id, contractNumber, titleEn, status, depth]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        parentContractId: { type: integer, nullable: true }
        depth:
          type: integer
          description: Distance (in node hops) from the root. 0 = root.
        currentVersion: { type: integer }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }

    ContractActivity:
      type: object
      required: [id, contractId, activityType, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        activityType: { $ref: "#/components/schemas/ContractActivityType" }
        actor: { $ref: "#/components/schemas/ContractActorRef" }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Free-form JSON. Examples:
            - status_changed: { fromStatus, toStatus, reason? }
            - version_created: { versionNumber }
            - tagged: { added: string[], removed: string[] }
        createdAt: { type: string, format: date-time }

    ContractListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractVersionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractVersion" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractActivityListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractActivity" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractTreeResponse:
      type: object
      required: [rootId, tree, currentNode, truncated]
      properties:
        rootId: { type: integer }
        tree:
          type: array
          items: { $ref: "#/components/schemas/ContractTreeNode" }
        currentNode: { $ref: "#/components/schemas/ContractTreeNode" }
        truncated:
          type: boolean
          description: True when traversal hit the depth-20 cap (AC-S7-05).

    UpdateContractStatusResponse:
      type: object
      required: [id, fromStatus, toStatus, changedAt]
      properties:
        id: { type: integer }
        fromStatus: { $ref: "#/components/schemas/ContractStatus" }
        toStatus: { $ref: "#/components/schemas/ContractStatus" }
        changedAt: { type: string, format: date-time }

    SetContractTagsResponse:
      type: object
      required: [id, tags]
      properties:
        id: { type: integer }
        tags:
          type: array
          items: { type: string }

    CreateContractVersionResponse:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        createdAt: { type: string, format: date-time }

    DeleteContractResponse:
      type: object
      required: [success, id, message]
      properties:
        success: { type: boolean, enum: [true] }
        id: { type: integer }
        message: { type: string, example: Contract soft-deleted }

  responses:
    Unauthenticated:
      description: UNAUTHORIZED - missing or invalid access token.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: FORBIDDEN - caller lacks required permission.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: VALIDATION_ERROR - request body / query params failed Zod validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: RATE_LIMITED - too many requests.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Authenticate with email + password
      description: |
        Authenticate the caller and issue a JWT access token (15m) + refresh
        token (7d) plus the AuthUser profile.

        - Lockout: 5 failed attempts within 15 minutes locks the account.
        - Email enumeration prevention (CRX-2): unknown emails still run a dummy
          bcrypt to equalize timing; response is always a generic 401.
        - Rate limit: 5 requests per 15 minutes per IP.

        DB functions used: `fn_auth_get_user_for_login`, `fn_auth_record_login_failure`, `fn_auth_record_login_success`.
      x-rateLimit: 5 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginDto" }
            example:
              email: admin@musanad.local
              password: ChangeMe@123
      responses:
        "200":
          description: Login successful. Tokens + user returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                user:
                  id: 1
                  email: admin@musanad.local
                  firstName: System
                  lastName: Admin
                  role: { id: 1, name: Super Admin }
                  permissions: [audit.read, role.manage, user.manage, user.read.all]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_CREDENTIALS - generic to prevent enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: ACCOUNT_LOCKED - too many failed attempts; account locked until lockedUntil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Blacklist the supplied refresh token
      description: |
        Blacklist the supplied refresh token so future refresh attempts return 401.
        The access token is verified for authentication only.
        Rate limit: 10 requests per 5 minutes per IP.
        DB function used: `fn_auth_blacklist_token`.
      x-rateLimit: 10 requests per 5 minutes per IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutDto" }
      responses:
        "200":
          description: Logged out successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
              example:
                success: true
                message: Logged out
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate access + refresh tokens
      description: |
        Exchange a non-blacklisted refresh token for a NEW access token (15m)
        AND a NEW refresh token (7d). The old refresh token is blacklisted
        atomically inside this call (`fn_auth_blacklist_if_absent`, CRX-1 fix).

        Clients MUST replace BOTH stored tokens. Reusing the old refresh after
        a successful rotation returns 401 (refresh-token-rotation pattern;
        OWASP / RFC 6749).

        Rate limit: 10 requests per 15 minutes per IP.
        DB functions used: `fn_auth_check_token_blacklist`, `fn_user_get_by_id`, `fn_auth_blacklist_if_absent`.
      x-rateLimit: 10 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenDto" }
      responses:
        "200":
          description: Refresh successful.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_REFRESH_TOKEN - expired, blacklisted, or user inactive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/uae-pass/initiate:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassInitiate
      summary: Begin UAE Pass federated login flow
      description: |
        Generates a server-side CSRF state value (32 random hex bytes), stores
        it in the state-store with a 5-minute TTL, and returns the authorize
        URL. The client must redirect the user agent there and echo the state
        unchanged in `/callback` (CRX-3 fix).

        State store: in-memory Map for dev (mock provider). MUST swap to Redis
        or a `uae_pass_state` DB table before multi-replica production deploy.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassInitiateRequest" }
      responses:
        "200":
          description: Authorize URL + state nonce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassInitiateResponse" }

  /auth/uae-pass/callback:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassCallback
      summary: Complete UAE Pass federated login (exchange code + state)
      description: |
        Validates `state` against the server-side store (single-use, 5-min TTL),
        then exchanges `code` with the UAE Pass provider for an identity payload.

        - Mock provider returns a synthetic identity (deterministic; dev only).
        - Live provider stub throws NotImplementedError until real UAE Pass
          credentials and SAML/PKCE wiring are completed (see
          `docs/uae-pass-integration.md`).

        CRX-3: missing, expired, or already-consumed state returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassCallbackRequest" }
      responses:
        "200":
          description: Identity payload (mock provider).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassCallbackResponse" }
        "401":
          description: Invalid or expired state parameter (CRX-3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: NOT_IMPLEMENTED - live provider not yet wired in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users:
    get:
      tags: [Users]
      operationId: userList
      summary: List users (paginated)
      description: |
        Paginated user list, optionally filtered by `search` (email / firstName / lastName)
        and `roleId`. Requires `user.read.all`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.read.all]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated user list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserListItem" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: userCreate
      summary: Create a new user
      description: |
        Admin-only. BE bcrypts the password (12 rounds) before passing to
        `fn_user_create`. The plaintext password never reaches the DB or the logs.
        Requires `user.manage`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserDto" }
            example:
              email: new.user@musanad.local
              password: Initial@Pass1
              firstName: New
              lastName: User
              roleId: 3
      responses:
        "201":
          description: User created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: EMAIL_IN_USE - an active user already exists with this email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Users]
      operationId: userGetById
      summary: Get a user profile
      description: Caller must be the user themselves OR have `user.read.all`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self, Super Admin, Admin]
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: userUpdate
      summary: Update user fields (partial)
      description: |
        Partial update of email / firstName / lastName / roleId.
        Self-updates restricted to firstName / lastName at controller level;
        admin updates may change all four. Password updates are NOT handled here
        (reserved for M1+ password reset flow).
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self (limited fields), Super Admin, Admin]
      x-requiredPermissions: [user.manage (or self for firstName/lastName only)]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserDto" }
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EMAIL_IN_USE - new email already in use by another active user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Users]
      operationId: userDelete
      summary: Soft-delete a user
      description: |
        Sets `is_active = false`. Self-protection: caller cannot deactivate their
        own account. Requires `user.manage`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      responses:
        "200":
          description: User deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN - caller lacks user.manage or attempted self-deactivation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles:
    get:
      tags: [Roles]
      operationId: roleList
      summary: List active roles (paginated)
      description: |
        Paginated list of active roles with `permissionCount`. Used to populate
        role-select dropdowns. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated role list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /permissions:
    get:
      tags: [Permissions]
      operationId: permissionList
      summary: List permissions (paginated; optional roleId filter)
      description: |
        Paginated permission catalog. If `roleId` is provided, returns only
        permissions held by that role. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated permission list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ============================================================
  # M1a — Contracts (11 endpoints, S1..S11; S12 is trigger-only)
  # ============================================================

  /contracts:
    get:
      tags: [M1a — Contracts]
      operationId: contractList
      summary: List contracts (paginated, role-aware, filter+search+tags)
      description: |
        Paginated contract list with role-aware filtering, status / type /
        counterparty / date filters, debounced search, and AND-semantic tag
        filter. body_en / body_ar are NEVER returned by this endpoint
        (AC-S1-08). DB function: `fn_contract_list`.
      x-rateLimit: authedReadRateLimiter (60 / min / authenticated user)
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contractType
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: draftedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approvedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: tags
          in: query
          description: AND-semantics; every supplied tag must match.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: search
          in: query
          description: ILIKE across contract_number / title_en / title_ar.
          schema: { type: string }
      responses:
        "200":
          description: Paginated contract list.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [M1a — Contracts]
      operationId: contractCreate
      summary: Create a new contract (draft status, auto-numbered)
      description: |
        Creates a new contract row with `status='draft'`, auto-generated
        `contract_number` (format CT-YYYY-NNNNNN), `current_version=1`. A
        `created` activity row is auto-emitted by trigger. body_en/body_ar
        in the request body are pino-redacted on inbound logging.

        DB function: `fn_contract_create`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin, legal_counsel, contract_drafter]
      x-permissionRequired: contract.draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContractDto" }
      responses:
        "201":
          description: Contract created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            CONFLICT - contract number collision after 3 controller retries
            (AC-S3-09 defensive only; auto-generation should not race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}:
    get:
      tags: [M1a — Contracts]
      operationId: contractGetById
      summary: Get a single contract (with attachment + comment counts)
      description: |
        Returns the full contract payload including bodyEn/bodyAr (which are
        pino-redacted on logging). attachmentCount and commentCount are
        inline numeric fields; the underlying tables are forward references.

        AC-S2-03 layering: when the row exists in `contract` but is hidden by
        RLS for the caller, the controller returns 403 (not 404). The
        existence pre-check uses an allowlisted SECURITY DEFINER helper
        (`db.checkActiveRowExists`).

        DB function: `fn_contract_get_by_id`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [M1a — Contracts]
      operationId: contractUpdate
      summary: Update a contract (partial COALESCE; body changes create a version)
      description: |
        Partial COALESCE update. **`status` MUST NOT be in the payload** -
        Zod `.strict()` rejects it (AC-S4-04). Use PATCH /contracts/{id}/status
        for status transitions. Tags are not part of this DTO either - use
        PUT /contracts/{id}/tags. A body change auto-creates a new
        `contract_version` row in the same transaction (S4 + S10 wired
        together; AC-S4-02).

        Migration 008 adds SELECT FOR UPDATE on the contract row before
        reading existing values, serialising concurrent updates against
        each other and against soft-delete (Codex BE-002).

        DB function: `fn_contract_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own AND status IN draft|resubmission_requested)
      x-permissionRequired: contract.edit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractDto" }
      responses:
        "200":
          description: Contract updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [M1a — Contracts]
      operationId: contractDelete
      summary: Soft-delete a contract (cascades to tags; rejects if children active)
      description: |
        Soft-deletes the contract (sets `is_active=FALSE`). Cascades a
        soft-delete to `contract_tag` rows. `contract_version` rows are
        preserved verbatim (append-only; AC-S5-02).

        Cannot soft-delete a contract with active children (AC-S5-04 ->
        409 CONFLICT details.children).

        Defence-in-depth: `fn_contract_delete` is SECURITY DEFINER and sets
        the `app.fn_contract_delete='true'` GUC, takes
        SELECT...FOR UPDATE on the row, performs the child-active check
        inside the lock, then flips `is_active`. The companion RESTRICTIVE
        RLS policy `contract_deny_direct_is_active_update` prevents bypass
        via direct UPDATE. Codex G2 TOCTOU defense.

        DB function: `fn_contract_delete`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin]
      x-permissionRequired: contract.delete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract soft-deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteContractResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT - contract has active children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}/status:
    patch:
      tags: [M1a — Contracts]
      operationId: contractUpdateStatus
      summary: Update contract status (placeholder transitions; M2 adds state-machine)
      description: |
        Updates `contract.status` with **placeholder** transition rules:
        M1a validates enum membership only. The full state-machine
        (which transitions are legal from which terminal) lands in M2.

        Auto-emits a `status_changed` activity row with
        `metadata.{ fromStatus, toStatus, reason? }`. The trigger de-dupes
        with the explicit emission inside `fn_contract_status_update` so
        only one activity row is written per transition.

        DB function: `fn_contract_status_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own)
      x-permissionRequired: contract.status.update
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractStatusDto" }
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateContractStatusResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/tree:
    get:
      tags: [M1a — Contracts]
      operationId: contractGetTree
      summary: Get parent/child amendment + renewal + extension + SOW timeline
      description: |
        Returns the full ancestor + descendant tree around the requested
        contract. Recursive CTE in both directions; depth capped at 20
        (`truncated=true` flag set when capped, AC-S7-05). Role-aware
        filtering omits invisible nodes from the returned tree.

        DB function: `fn_contract_get_tree`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractTreeResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/tags:
    put:
      tags: [M1a — Contracts]
      operationId: contractSetTags
      summary: Replace the tag set on a contract (atomic, idempotent)
      description: |
        Atomically replaces the contract's tag set. Empty array clears all
        tags. Idempotent - same input twice yields the same final state.
        Auto-emits a `tagged` activity with `metadata={ added, removed }`.

        Migration 008 takes SELECT FOR UPDATE on the parent contract row
        before computing the add/remove diff to serialise concurrent
        replacements (Codex BE-003).

        DB function: `fn_contract_set_tags`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own)
      x-permissionRequired: contract.tag.manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetContractTagsDto" }
      responses:
        "200":
          description: Tags replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetContractTagsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/versions:
    get:
      tags: [M1a — Contracts]
      operationId: contractVersionList
      summary: List versions for a contract (newest first)
      description: |
        Paginated version list, newest first. body_en/body_ar appear in the
        payload but are pino-redacted on logging.

        DB function: `fn_contract_version_list`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractVersionListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [M1a — Contracts]
      operationId: contractVersionCreate
      summary: Create a new version snapshot (atomic version_number increment)
      description: |
        Creates a new `contract_version` snapshot and updates
        `contract.body_en`/`body_ar` to match within a single transaction.
        Atomic version_number increment via SELECT FOR UPDATE on the parent
        contract row. Auto-emits `version_created` activity with
        `metadata.versionNumber`.

        At least one of `bodyEn` or `bodyAr` must be supplied (AC-S10-04).
        `changeNote` is required (AC-S10-05).

        DB function: `fn_contract_version_create`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own AND status IN draft|resubmission_requested)
      x-permissionRequired: contract.edit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContractVersionDto" }
      responses:
        "201":
          description: Version created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateContractVersionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT - defensive UNIQUE retry on (contract_id, version_number).
            Should be unreachable from outside the DB given SELECT FOR UPDATE
            serialisation (AC-S10-08; QA F-gap noted in test report).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}/activity:
    get:
      tags: [M1a — Contracts]
      operationId: contractActivityList
      summary: List the contract activity timeline (newest first)
      description: |
        Paginated activity timeline, newest first. Optional `activityType`
        filter. The `actor` field is enriched as `{ id, firstName, lastName }`
        when the underlying user is still active and `null` otherwise.

        Activity rows are write-only via the SECURITY DEFINER helper
        `fn_contract_activity_create` (called by triggers); there is no
        public POST endpoint for activity (DN4 - RLS denies direct INSERT).

        DB function: `fn_contract_activity_list`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: activityType
          in: query
          schema: { $ref: "#/components/schemas/ContractActivityType" }
      responses:
        "200":
          description: Paginated activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActivityListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

# Note: /api/health lives at the root, NOT under /api/v1. Documented as an
# absolute path here so generators emit it correctly.
x-paths-root:
  /api/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness / readiness probe
      description: |
        Returns 200 with `{status, db, uptime, version, timestamp, requestId}` when the
        database is reachable. Suitable for k8s liveness AND readiness probes.
        Returns 503 if the DB is unreachable.

        NB: this endpoint lives at `/api/health` (no `/v1` prefix) per M0 spec.
      x-rateLimit: unlimited (no auth)
      security: []
      responses:
        "200":
          description: Service healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example:
                status: ok
                db: reachable
                uptime: 1234.56
                version: 0.1.0
                timestamp: 2026-05-02T12:34:56.000Z
                requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
        "503":
          description: UNHEALTHY - database or critical dependency unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
