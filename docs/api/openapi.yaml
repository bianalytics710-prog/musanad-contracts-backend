        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/qa/session:
    post:
      tags: [M3 — Signer Q&A AI (verify_jwt=false)]
      operationId: signerQaSessionStart
      summary: PUBLIC — open a Q&A chat session for the signer
      description: |
        PUBLIC unauthenticated. Opens a signer_qa_session row and returns
        sessionTokenPlaintext ONCE — required as `X-Session-Token` header on
        subsequent /qa/message calls. Sliding-window enforcement when 5+
        active sessions per invitation (AN-12 Option A — soft-deactivate
        oldest by created_at ASC; never returns 429 on this path).

        Language is locked at session start (AC-S11-05 / AN-2 languageLock);
        defaults to invitation.language when omitted.

        DB function: `fn_signer_qa_session_start` (DEFINER, GRANT EXECUTE TO
        PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP)
      x-authentication: token-bearer (invitation_token in URL path)
      x-acsCovered: [AC-S11-01, AC-S11-02, AC-S11-03, AC-S11-04, AC-S11-05, AC-S11-06]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignerQaSessionStartDto" }
            example:
              language: en
      responses:
        "201":
          description: |
            CREATED — sessionTokenPlaintext returned ONCE; rateLimit metadata
            seeded with maxMessagesPerHour=20.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignerQaSessionStartResponse" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sign/{invitationToken}/qa/message:
    post:
      tags: [M3 — Signer Q&A AI (verify_jwt=false)]
      operationId: signerQaSessionRecordMessage
      summary: PUBLIC — submit Q&A message; AI response streams back via SSE
      description: |
        PUBLIC unauthenticated. **Server-Sent Events response** —
        `Content-Type: text/event-stream`. The only streaming endpoint in
        the project.

        Two-call rate-limit pattern (DN-10 / AN-2):
        - Pre-AI: controller invokes the fn_ in `mode='GATE'` to RESERVE a
          slot; raises 429 with retryAfterSeconds when the per-session
          (20/h rolling) or per-invitation (50/h rolling) cap is hit.
        - During AI: controller streams OpenAI gpt-4o tokens as
          `{ type: 'token', delta: '...' }` SSE chunks.
        - Post-AI: controller invokes the fn_ in `mode='COMMIT'` with actual
          tokensConsumed; emits terminal `{ type: 'done', tokensConsumed }`
          chunk.
        - On error past header-flip: emits terminal
          `{ type: 'error', code, message?, retryAfterSeconds? }` chunk.

        AI provider: OpenAI gpt-4o; system prompt loaded VERBATIM from
        `prompts/ai-signer-qa.txt` at request time (Mustache-style
        {{placeholder}} substitution; no auto-escaping). NO transcript is
        persisted (AN-2 transcriptStorage; DN-11) — only the per-session
        message_count + tokens_consumed counters.

        Header `X-Session-Token` carries the plaintext session_token returned
        ONCE by POST /qa/session; the fn_ hashes inside (SHA-256 hash-and-match).

        SENSITIVE — `userMessage` is pino-redacted because `ai_prompt_payload`
        is in project.config sensitiveFields (AC-S12-09).

        DB function: `fn_signer_qa_session_record_message` (DEFINER, GRANT
        EXECUTE TO PUBLIC).
      security: []
      x-rateLimit: publicSignerRateLimiter (60 req/min/IP) + per-session 20/h + per-invitation 50/h (fn_-enforced)
      x-authentication: token-bearer (invitation_token in URL path) + session-token-bearer (X-Session-Token header)
      x-acsCovered: [AC-S12-01, AC-S12-02, AC-S12-03, AC-S12-04, AC-S12-05, AC-S12-06, AC-S12-07, AC-S12-08, AC-S12-09, AC-S12-10]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Session-Token
          in: header
          required: true
          description: |
            SENSITIVE — plaintext session_token returned ONCE by
            POST /qa/session. Pino-redacted on egress logs.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignerQaRecordMessageDto" }
            examples:
              gate:
                summary: GATE — pre-AI slot reservation
                value:
                  mode: GATE
                  tokensConsumed: 0
                  userMessage: "What is the cancellation clause in section 7?"
              commit:
                summary: COMMIT — post-AI usage record
                value:
                  mode: COMMIT
                  tokensConsumed: 142
      responses:
        "200":
          description: |
            OK — Server-Sent Events stream. Each chunk is `data: <JSON>\n\n`.
            Three chunk variants — see SignerQaMessageStreamChunk schema.
            Headers include:
            - `Content-Type: text/event-stream; charset=utf-8`
            - `Cache-Control: no-cache, no-transform`
            - `Connection: keep-alive`
            - `X-Accel-Buffering: no` (Nginx flush)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Content-Type:
              schema: { type: string, enum: ["text/event-stream; charset=utf-8"] }
            Cache-Control:
              schema: { type: string, enum: ["no-cache, no-transform"] }
            Connection:
              schema: { type: string, enum: [keep-alive] }
            X-Accel-Buffering:
              schema: { type: string, enum: [no] }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each SSE event is `data: <JSON>\n\n` where JSON conforms to
                  SignerQaMessageStreamChunk. Multiple `token` chunks may
                  precede the terminal `done` (or `error`) chunk.
              example: |
                data: {"type":"token","delta":"The "}

                data: {"type":"token","delta":"cancellation "}

                data: {"type":"token","delta":"clause "}

                data: {"type":"done","tokensConsumed":142}

        "400":
          description: |
            VALIDATION_ERROR — Zod failure (mode/tokensConsumed/userMessage
            discriminator violation).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: |
            GONE — `session_invalid_or_expired` (AC-S12-10; session_token
            unknown or signer_qa_session.is_active=FALSE) OR
            `invitation_invalid_or_expired` (when GATE finds invitation
            already expired/cancelled).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: |
            RATE_LIMITED — per-session (20/h) OR per-invitation (50/h) cap
            hit (AC-S12-04 / AC-S12-05). Response includes
            `retryAfterSeconds` field. Note: when 429 happens AFTER the SSE
            header flip, it surfaces as a terminal SSE error chunk
            (`{ type: 'error', code: 'rate_limit_exceeded', retryAfterSeconds }`)
            instead of an HTTP 429 status.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }


  # ===== M4 — AI Features (introduced 2026-05-04) =====

  /ai/contract-insights:
    post:
      tags: [M4 — AI (Contract + Drafting + Executive)]
      operationId: aiContractInsights
      summary: Request AI insights on a contract (S1)
      description: |
        Modes: `summary | key_terms | risks | obligations | regulatory | rewrite`.
        - `summary` and `rewrite` stream Server-Sent Events
          (`Content-Type: text/event-stream`) — chunks conform to
          `AiInsightsStreamChunk`. The `done` chunk on mode='summary' carries
          `persisted: ContractAiSummaryPersistData` when fn_contract_ai_summary_persist
          succeeded.
        - The other 4 modes return synchronous JSON (`AiContractInsightsResponseBody`)
          via OpenAI tool-call.
        - Cache via `fn_ai_insight_get_cached` / `fn_ai_insight_upsert`
          (24 h TTL; entity_type='contract').
        - Rate limit pre-flight via `fn_ai_request_log_check_rate_limit`
          (60/h, 240/d defaults from ai_prompt seed).
        - Telemetry: one `ai_request_log` row per invocation in a
          `finally{}` block, regardless of cache_hit / success / error.
      x-rateLimit: fn_ai_request_log_check_rate_limit (per ai_prompt seed; 60/h, 240/d)
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter
      x-requiredPermissions: ai.invoke.contract + contract.read.<scope>
      x-authMode: jwt
      x-storyId: S1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiContractInsightsRequest" }
      responses:
        "200":
          description: |
            OK — synchronous tool-call JSON for non-streaming modes
            (`key_terms | risks | obligations | regulatory`) OR Server-Sent
            Events stream for `summary | rewrite`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-AI-Cache:
              description: HIT|MISS (cache layer indicator).
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AiContractInsightsResponseBody" }
                  requestId: { type: string, format: uuid }
            text/event-stream:
              schema:
                type: string
                description: |
                  Each SSE event is `data: <JSON of AiInsightsStreamChunk>\n\n`.
                  Multiple `token` chunks may precede the terminal `done` /
                  `error` chunk.
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Provider error (sanitised; logged via fn_ai_request_log_create with `outcome='error'`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: Provider timeout (logged with `outcome='timeout'`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

