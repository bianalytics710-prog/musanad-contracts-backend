            self-supersede (23514 → AC-S4-03), `supersededById` not found
            (23503 → AC-S4-04 — structured raise post-053 patch), invalid enum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Regulation not found (P0002 → AC-S4-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
