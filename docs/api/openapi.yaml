  /parties/{id}:
    patch:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyUpdate
      summary: Partial update of party (M9 — editable subset)
      description: |
        Partial update of party (db-design.md §3.4). M9 introduces this
        write path; `fn_party_create` from R-LC 073 stays UNTOUCHED per
        Q-DA6=6a — `fn_party_update` is the only path to set the
        editable subset (`parentId` / `uboId` / `aliases` / `esgScore` /
        `icvStatus` / `icvPct` / etc.).
        **`sanctions_*` fields are silently ignored** (AC-S9-05 /
        Q-DA4=4a — defence-in-depth; the fn signature does NOT accept
        them; the Zod schema also drops them). The CR-E rule engine
        (future) writes `sanctions_status` via a separate DEFINER
        carve-out, out of M9 scope.
        **Permission gate:** `contract.edit` OR `party.graph.manage`
        (RAISE 42501 if neither). All 3 authorised roles already have
        `contract.edit` per M0 / R-LC seeds.
        **Sentinel mapping:** `parentId` / `uboId` use `undefined` →
        leave alone; `null` → BE controller maps to `-1` which fn body
        interprets as explicit unset. Self-reference
        (`parentId === id || uboId === id`) raises 22023
        `self_reference_not_allowed`.
        **Aliases JSONB invariant:** the `aliases` payload MUST be a
        JSONB array of strings (AC-S9-04). The BE service-layer
        pre-stringifies the JS string array via `JSON.stringify` before
        binding to the JSONB parameter (DEFECT-1 fix — `db.callFunction`
        infers Postgres TEXT[] for raw string arrays, breaking the
        JSONB binding contract).
        **Response widens transitively:** ends with
        `RETURN fn_party_get_by_id(...)` so the response carries the
        full extended `PartyDetail` (recentContracts5 + all 11 new CR-B
        columns).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [contract.edit, party.graph.manage]
      x-permissionGate: "contract.edit OR party.graph.manage"
      x-authMode: jwt
      x-storyId: S9
      x-rateLimit: authedWriteRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyUpdatePayload" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PartyDetail" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — invalid email / out-of-range esgScore (CHECK
            violation 23514) / out-of-range icvPct / invalid icvStatus
            enum / aliases not array of strings / self-reference (22023 —
            AC-S9-02 / AC-S9-04 / AC-S9-06 / AC-S9-07).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks both `contract.edit` AND `party.graph.manage` (42501)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            NOT_FOUND — subject party not found OR `parentId` /
            `uboId` not found / inactive (P0002 — AC-S9-03). Error body
            includes `field='parentId' | 'uboId'` for inactive-pointee
            cases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/parties/sanctions-match:
    post:
      tags: [M9 — Admin Sanctions Match]
      operationId: partySanctionsMatch
      summary: Fuzzy entity match against parties (return-only)
      description: |
        Admin/system test endpoint (S7). Fuzzy entity match against
        `party.name_en` + `party.aliases` via pg_trgm (GIN trigram
        index on `name_en`; GIN on `aliases`); chain expansion via
        `fn_party_chain_traverse_up` + `_down` per direct match.
        **Return-only** (Q-DA4=4a) — does NOT update
        `party.sanctions_status`. The CR-E rule engine (future module)
        is the production caller and writes status via a separate
        DEFINER carve-out, out of M9 scope.
        **Threshold resolution order:** per-call `similarityThreshold`
        body param → `app.party_sanctions_match_threshold` GUC override
        → 0.7 default (Q-DA2=2a). `signalEntities[]` shape mirrors
        `osint_signal.affected_entities` verbatim per S2-19 cross-fn
        signature stability.
        **Performance NFR:** 5-entity signal < 200ms (AC-S7-07). Every
        match envelope includes `matchedEntityName` for
        source-traceability (AC-S7-05 / Production-Credibility
        Invariant #8). Verifiable via select-before / select-after on
        `party.sanctions_status` — the column is unchanged (AC-S7-06).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [party.graph.manage]
      x-authMode: jwt
      x-storyId: S7
      x-rateLimit: authedWriteRateLimiter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartySanctionsMatchInput" }
      responses:
        "200":
          description: OK — return-only matches
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PartySanctionsMatchResponse" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — `signalEntities` not array / element
            missing `name` / `similarityThreshold` out of 0..1
            (22023 — AC-S7-08). Empty `signalEntities` array enforced
            at Zod (`minItems:1`); the fn body itself iterates and
            naturally returns `{matches:[]}` if Zod is bypassed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.manage` (42501)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

