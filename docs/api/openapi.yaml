        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Source not found for current tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "Source is disabled — enable before test-pull (22023 → 409 per Smoke DEF-2 translatePgError extension — literal-prefix routing)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /signals:
    get:
      tags: [M7 — Signals]
      operationId: osintSignalList
      summary: Paginated list of normalised OSINT signals
      description: |
        Paginated list of normalised signals scoped to current tenant by
        RLS. Filters: `kind` (Annex B.2.1 SignalKind enum), `sourceId`
        (TEXT denorm — matches `osint_signal.source_id`, NOT the BIGINT
        FK — filter by 'ofac_sdn' / 'rss_reuters_energy' / etc.),
        `severityMin` (inclusive ordered minimum:
        informational(1) < low(2) < medium(3) < high(4) < critical(5);
        `severityMin='high'` returns rows with severity ∈ {high,
        critical}), `since` (ISO 8601 UTC; matches `fetched_at >= since`),
        `geographyIntersects` (ISO 3166-1 alpha-2 country code; matches
        via `@>` on `geographies` JSONB array; GIN(jsonb_path_ops)
        index), `affectedEntityId` (matches via `@>` on
        `affected_entities` JSONB array — `EntityReference.identifier`
        field; GIN index). Order: `event_date_v2 DESC NULLS LAST,
        fetched_at DESC`.
        `rawPayload` IS in the response body per design (legal_counsel
        needs SDN entry text for advisory drafting in CR-H); redacted
        only at log layer (Pino) + audit_log.
        DB function: `fn_osint_signal_list`.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, executive, compliance_esg]
      x-requiredPermissions: [signal.read.all]
      x-authMode: jwt
      x-storyId: S11
      x-rateLimit: authedReadRateLimiter
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/SignalKind" } }
        - { name: sourceId, in: query, description: "Matches osint_signal.source_id TEXT denorm column, NOT the BIGINT FK.", schema: { type: string } }
        - { name: severityMin, in: query, description: "Inclusive minimum: informational(1) < low(2) < medium(3) < high(4) < critical(5).", schema: { $ref: "#/components/schemas/Severity" } }
        - { name: since, in: query, description: "ISO 8601 UTC. Filters fetched_at >= since.", schema: { type: string, format: date-time } }
        - { name: geographyIntersects, in: query, description: "ISO 3166-1 alpha-2 country code (e.g. 'AE'). Matches via @> on geographies JSONB array (GIN index).", schema: { type: string } }
        - { name: affectedEntityId, in: query, description: "Matches via @> on affected_entities JSONB array (EntityReference.identifier field).", schema: { type: string } }
      responses:
        "200":
          description: Paginated normalised signal list.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/OsintSignalListResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks signal.read.all (42501 → AC-S11-05). PERMISSION_DENIED with permission='signal.read.all'."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/source-health:
    get:
      tags: [M7 — Source Health]
      operationId: sourceHealthList
      summary: Source health monitor — list of all sources with health badge
      description: |
        Source health monitor — list of all source_health rows for the
        current tenant joined with osint_source.display_name + kind.
        Sort: failing > unauthorised > degraded > healthy, then
        displayName.
        Returns a **bare array** (no pagination envelope) per S2-12
        documented design exception — bounded set per tenant; one row
        per (tenant_id, osint_source_id), ~14 rows max in CR-A. If the
        row count grows beyond ~50 in a future module, this can be
        paged with a follow-up endpoint.
        Audit trigger deliberately OFF on `source_health` table itself
        (Q-NEW6 / OQ-6); the table's own `checked_at + state` columns
        are its ledger.
        DB function: `fn_source_health_list`.
      x-authorisedRoles: [Super Admin, platform_admin, executive]
      x-requiredPermissions: [source.read]
      x-authMode: jwt
      x-storyId: S8
      x-rateLimit: authedReadRateLimiter
      responses:
        "200":
          description: Bare array of source health rows.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SourceHealthListItem" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks source.read (42501 → AC-S8-06)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ============================================================
  # M8 — Internal Signal Data Path (CR-A2 — CRIP Wave 1 follow-up to M7)
  #   /admin/internal-signals    POST  — system-only debug ingest
  #   /admin/internal-signal-kinds GET  — read-only catalogue viewer
  #   /internal-signals          GET   — paginated list
  #   /internal-signals/:id/resolve POST — idempotent manual resolve
  # ============================================================

  /admin/internal-signals:
    post:
      tags: [M8 — Internal Signal Ingest (Admin)]
      operationId: internalSignalIngest
      summary: Ingest an internal signal (system-only debug harness)
      description: |
        Ingest an internal signal of one of 8 SOT-sealed sub-types
        (`milestone_slippage` / `sla_breach` / `payment_delay` /
        `invoice_dispute` / `vendor_incident` / `ics_incident` /
        `icv_status_change` / `certificate_expiry`). Validates `signalType`
        against the tenant's `internal_signal_kind` catalogue and the
        per-signal-type `parameter_schema.required[]` field set, then
        DELEGATES to `fn_osint_signal_upsert` (S2-19 LOCK — constructed
        payload satisfies the M7 9-required-key contract verbatim).
        Idempotent on `dedup_hash UNIQUE(tenant_id, dedup_hash)` — same
        payload posted twice yields `{ inserted: false, dedupHashHit: true }`
        with the same `signalId` (201 in both cases, NOT 409).
        **System-only** — `fn_internal_signal_ingest` is DEFINER with
        `REVOKE EXECUTE FROM PUBLIC` and **no role grant**; only the
        neondb_owner pool connection invokes. The
        `internal_signal.ingest` permission row is granted to Super Admin +
        platform_admin so admins can hit this debug route via JWT.
        Defence-in-depth: fn body line 1 raises 42501 if caller lacks the
        permission. Tenant scoping auto via `app.current_tenant_id` GUC
        (rls.middleware sets from JWT `tenantId` claim with hard-coded
        ADNOC UUID fallback per Q-DA4 from M7).
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: [internal_signal.ingest]
      x-authMode: jwt
      x-storyId: S2
      x-rateLimit: authedWriteRateLimiter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalSignalIngestPayload" }
      responses:
        "201":
          description: |
            Created (or idempotent re-post). `inserted=true` on first
            insert; `inserted=false` + `dedupHashHit=true` on duplicate
            payload. Same `signalId` returned in both cases.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/InternalSignalIngestResponse" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — tenant context missing OR `signalType` not in
            8-value enum OR `parameter_schema.required[]` field missing
            (`Required field missing for signal_type=<type>: <field>`) OR
            severity override invalid (CHECK violation 23514) OR
            `contractId`/`vendorId` not BIGINT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
