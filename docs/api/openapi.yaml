                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/ImpactCategoryListResponse" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [M5 — Impact Categories]
      operationId: impactCategoryUpsert
      summary: Create or update an impact category (S15)
      description: |
        Single-call upsert keyed on `key` (ON CONFLICT (key) DO UPDATE — AC-S15-01/02).
        platform_admin only via `config.manage` (AC-S15-05 — legal_counsel
        cannot manage impact categories). Returns 200 for both create and
        update with `createdOrUpdated` discriminator (idiomatic upsert; differs
        from regulation/regulatory-update create which return 201).
      x-authorisedRoles: [Super Admin, platform_admin]
      x-requiredPermissions: config.manage
      x-authMode: jwt
      x-storyId: S15
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertImpactCategoryDto" }
      responses:
        "200":
          description: Upsert result.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/ImpactCategoryUpsertResult" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — `nameAr` empty (AC-S15-03), `severityScale` not
            array of strings (AC-S15-04), invalid `key` format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Insufficient permission (`config.manage`; legal_counsel denied — AC-S15-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

