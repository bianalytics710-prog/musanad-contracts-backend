openapi: 3.0.3
info:
  title: Musanad Contracts Hub API
  description: |
    Musanad Contracts Hub platform API. Covers M0 (authentication, user / role /
    permission catalog, health probe), M1a (contract core CRUD + lifecycle),
    M1b (Compose Wizard + Payment Schedules + PDF/XLSX exports), M1c
    (Bulk & Manual Import — 4 import-batch endpoints + 1 AI extraction stub +
    additive extension of GET /contracts), and M2 (Approval Workflows — 10 new
    endpoints under /approvals/* and /admin/approval-* + extension of
    PATCH /contracts/:id/status).

    All routes are prefixed with `/api/v1` except `/api/health` (infrastructural).

    Architecture: thin HTTP controllers call PostgreSQL `fn_*` functions
    (Database Objects First). RLS is enforced server-side via the
    `app.current_user_id` session GUC, set by middleware before every fn_ call.

    Every response carries an `X-Request-ID` correlation header.

    M2 introduces two new namespaces — `/api/v1/approvals/*` (drafter / approver
    actions) and `/api/v1/admin/approval-*` (admin matrix + chain monitor + step
    reassign). The approval engine writes the contract.status state machine via
    fn_contract_status_update_user (drafter, INVOKER) and a system-only
    fn_contract_status_update_internal (DEFINER, called only by fn_approval_decide
    on terminal chain transitions). Escalation (fn_approval_escalate) is invoked
    by an in-process node-cron driver, not exposed via HTTP.
  version: 0.5.0
  contact:
    name: Musanad Technologies FZ-LLC
servers:
  - url: http://localhost:4000/api/v1
    description: Local development backend
  - url: http://localhost:4000
    description: Local development backend (root - for /api/health only)

tags:
  - name: Auth
    description: Authentication endpoints (login, logout, refresh)
  - name: UAE Pass
    description: UAE Pass federated identity (mocked in M0; real provider stubbed)
  - name: Users
    description: User CRUD (admin)
  - name: Roles
    description: Role catalog (read-only in M0)
  - name: Permissions
    description: Permission catalog (read-only in M0)
  - name: Health
    description: Liveness / readiness probes
  - name: M1a — Contracts
    description: |
      Contracts core CRUD & lifecycle (M1a). 11 endpoints covering list/get/create/
      update/soft-delete, status transitions, parent/child tree, tag management,
      version history, and the contract activity timeline. body_en/body_ar are
      sensitive (pino-redacted on logs and audit_log JSONB-redacted by
      fn_audit_trigger).
  - name: M1b — Compose Wizard, Payment Schedules & Exports
    description: |
      Compose Wizard, Payment Schedules & PDF/XLSX exports (M1b). 4 new endpoints:
      list / replace payment schedule, single-contract PDF export, list-level XLSX
      export. Heavy bundles (jspdf / xlsx) moved off the FE per G6 — backend renders
      via Puppeteer (Chromium) and exceljs WorkbookWriter (streaming). Compose
      Wizard is FE-only orchestration (POST /contracts → PUT /payment-schedules)
      with NO new BE wrapper endpoint per Q2. M1b extends the contract_activity
      activity_type CHECK enum with `payment_schedule_replaced` and `exported`.
      W1 route-ordering: GET /contracts/export.xlsx (literal) MUST be declared
      before any /:id-prefixed route — see comment in src/routes/v1/contracts.routes.ts.
  - name: M1c — Imports
    description: |
      Bulk & Manual Import (M1c). 4 import-batch endpoints (S1 create, S2 update,
      S3 list, S4 get-by-id) + the M1a GET /contracts list extended with 3 import
      filter params (importBatchId, importConfidenceMin, importConfidenceMax) and
      3 list-row fields (importBatchId, importConfidence, importWarnings). FE-direct
      Supabase Storage upload (HQ1 ratified) — backend never sees the file bytes,
      only the already-extracted text + filename + size. Cancellation is a status
      transition (status='cancelled'), not is_active=false; the
      trg_import_batch_immutable_fields BEFORE UPDATE trigger blocks any direct
      flip of is_active or initiated_by (Codex C1 fix).
  - name: M1c — AI
    description: |
      AI namespace introduced in M1c. M1c ships ONE controller-only stub
      (POST /api/v1/ai/extract-contract-bulk) — no fn_, no DB persistence. The
      stub returns a deterministic mock derived from extractedText.length so
      routing-by-confidence tests are repeatable. Request + response DTOs are
      FROZEN per HQ2: M4 will replace the controller body without changing the
      route, auth, request DTO, or response DTO. extractedText is classified as
      ai_prompt_payload (project.config.json sensitiveFields) and pino-redacted
      across 7 paths (top-level, req.body.*, req.query.*, req.params.*, *.X,
      *.*.X) — Codex M1 fix.
  - name: M2 — Approvals
    description: |
      Approval engine — drafter + approver actions (M2). 6 endpoints under
      /api/v1/approvals/* and /api/v1/contracts/:id/* covering S1 my-pending
      inbox, S2 decide (approve / reject / request_resubmission), S3 voluntary
      delegation, S6 chain preview, S7 submit-for-approval, S10 read most-recent
      chain. The engine is DB-first — every endpoint is a thin pass-through to a
      fn_approval_* PL/pgSQL function with FOR UPDATE row locks on the relevant
      step / chain / contract. decisionNote is sensitive (pino-redacted on
      logs across 14 paths and JSONB-redacted by fn_audit_trigger). Approval
      events emit only contract_activity rows (HQ1 / HQ7 — no notification
      table). fn_approval_escalate (S9) is system-only; invoked by a node-cron
      driver inside the BE process, not exposed via HTTP.
  - name: M2 — Admin Approvals
    description: |
      Admin oversight + configuration endpoints (M2). 4 endpoints under
      /api/v1/admin/approval-* covering S4 matrix list, S5 matrix replace
      (PUT — atomic upsert via fn_approval_matrix_set with pg_advisory_xact_lock
      on the (contract_type, value range) hash), S8 admin step reassign, S11
      role-aware chain monitor list. matrixSnapshot is sensitive (pino-redacted
      and audit-redacted by fn_audit_trigger). The /api/v1/admin/* namespace is
      first introduced in M2 — convention parity with /api/v1/ai/* (M1c).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token (15-minute TTL). Validated claims: `aud`, `iss`, `exp`.
        Issued by `POST /api/v1/auth/login`.
        Refreshed via `POST /api/v1/auth/refresh` (rotation: both access AND
        refresh tokens are rotated; old refresh is blacklisted server-side).
        Logout blacklists the supplied refresh token via `fn_auth_blacklist_token`.

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  headers:
    X-Request-ID:
      description: Correlation UUID. Propagated through controller, fn_ calls, and Pino logs.
      schema:
        type: string
        format: uuid

  schemas:
    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 3 }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. VALIDATION_ERROR, UNAUTHORIZED).
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable, sanitized message. Raw PG errors are NEVER passed through.
              example: Email is required
            requestId:
              type: string
              format: uuid
              description: Correlation id, also returned in the X-Request-ID header.
            fields:
              type: object
              description: Optional per-field validation errors (Zod issues mapped here).
              additionalProperties:
                type: array
                items: { type: string }
      example:
        success: false
        error:
          code: VALIDATION_ERROR
          message: Invalid request body
          requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
          fields:
            email: ["Required"]

    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Super Admin }

    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description:
          type: string
          nullable: true
        permissionCount: { type: integer, example: 4 }

    Permission:
      type: object
      required: [id, code, module, action]
      properties:
        id: { type: integer }
        code:
          type: string
          example: user.read.all
          description: Canonical permission identifier (dot-notation). NOT a name.
        module: { type: string, example: user }
        action: { type: string, example: read.all }
        description:
          type: string
          nullable: true

    User:
      type: object
      required: [id, email, firstName, lastName, isActive, createdAt, updatedAt, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }
          description: Array of permission CODES held by this user (via role).
          example: ["audit.read", "role.manage", "user.manage", "user.read.all"]

    AuthUser:
      type: object
      description: User shape stored in frontend auth state. Strict subset of User; never contains passwordHash.
      required: [id, email, firstName, lastName, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }

    UserListItem:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"

    RefreshTokenDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    LogoutDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }

    CreateUserDto:
      type: object
      required: [email, password, firstName, lastName, roleId]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Plaintext on the wire only. BE bcrypt-hashes (12 rounds) before fn_user_create. Pino-redacted.
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        roleId: { type: integer, minimum: 1 }

    UpdateUserDto:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roleId: { type: integer, minimum: 1 }

    DeleteUserResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string, example: User deactivated }

    HealthResponse:
      type: object
      required: [status, db, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [reachable, unreachable]
        uptime:
          type: number
          description: Process uptime in seconds.
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    UaePassInitiateRequest:
      type: object
      additionalProperties: false
      properties:
        redirectAfter:
          type: string
          format: uri
          description: Optional client redirect target after callback completes.

    UaePassInitiateResponse:
      type: object
      required: [authorizeUrl, state]
      properties:
        authorizeUrl: { type: string, format: uri }
        state:
          type: string
          minLength: 32
          description: Random hex (>= 32 chars). Single-use, 5-minute TTL. Echo unchanged into /callback.

    UaePassCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code from the UAE Pass IdP.
        state:
          type: string
          minLength: 1
          description: Echo of the state issued by /initiate. Single-use, 5-min TTL. (CRX-3)

    UaePassCallbackResponse:
      type: object
      required: [success, provider, identity]
      properties:
        success: { type: boolean, enum: [true] }
        provider:
          type: string
          enum: [mock, live]
        identity:
          type: object
          required: [sub, trustLevel]
          properties:
            sub: { type: string }
            fullNameEn: { type: string, nullable: true }
            fullNameAr: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            trustLevel: { type: string, example: SOP2 }

    # ------------------------------------------------------------
    # M1a — Contracts: Core CRUD & Lifecycle
    # ------------------------------------------------------------
    ContractStatus:
      type: string
      description: |
        16-state contract lifecycle. M1a established 14 values; M2 extends the
        CHECK to 16 with `in_approval` and `cancelled` (migration 023). The
        enum membership is only one of two gates — M2 also enforces a per-
        transition matrix in fn_contract_status_update_user (drafter wrapper)
        and fn_contract_status_update_internal (system, called only by
        fn_approval_decide). See PATCH /contracts/{id}/status for the wire
        contract; see the M2 data dictionary for the full transition matrix.
      enum:
        - draft
        - in_review
        - in_approval
        - approved
        - awaiting_signature_employer
        - awaiting_signature_counterparty
        - fully_signed
        - active
        - expiring_soon
        - expired
        - amended
        - renewed
        - terminated
        - rejected
        - resubmission_requested
        - cancelled

    ContractLanguage:
      type: string
      enum: [en, ar, bilingual]

    ContractGoverningLaw:
      type: string
      enum: [uae_federal, dubai, abu_dhabi, sharjah, difc, adgm, english, other]
      nullable: true

    ContractRelationshipType:
      type: string
      description: Relationship to the parent contract when parentContractId is set.
      enum: [amendment, renewal, extension, superseded, sow_under_msa]
      nullable: true

    ContractActivityType:
      type: string
      description: |
        Activity event type. M1a set (7 values) extended in M1b via migration 010
        (`payment_schedule_replaced`, `exported`) and re-permitted in
        `fn_contract_activity_create` whitelist via migration 013. Total: 9 values.
        See dev-handoff §"How to extend M1a — To add a new activity_type" for the
        ALTER CHECK pattern.
      enum:
        - created
        - updated
        - status_changed
        - version_created
        - tagged
        - soft_deleted
        - restored
        - payment_schedule_replaced
        - exported

    ContractActorRef:
      type: object
      nullable: true
      required: [id, firstName, lastName]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }

    ContractListItem:
      type: object
      description: |
        Slim list payload. body_en/body_ar are NEVER returned here (AC-S1-08).
        M1c additively extends this shape with 3 new fields (importBatchId,
        importConfidence, importWarnings) — always present, null when the
        contract was not bulk-imported. fn_contract_list signature widened
        15→18 params in migration 017.
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - currency
        - currentVersion
        - tags
        - createdAt
        - updatedAt
        - importBatchId
        - importConfidence
        - importWarnings
      properties:
        id: { type: integer }
        contractNumber: { type: string, example: CT-2026-000123 }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        status: { $ref: "#/components/schemas/ContractStatus" }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string, example: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        ourPartyId: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string }
        currentVersion: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        importBatchId:
          type: integer
          nullable: true
          description: M1c addition. import_batch.id this contract belongs to. NULL when not bulk-imported.
        importConfidence:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: M1c addition. AI extraction confidence 0..100. NULL when not extracted.
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: M1c addition. Human-readable AI extraction warnings. NULL when none.

    Contract:
      type: object
      description: |
        Full contract payload. bodyEn/bodyAr appear in the response but are
        pino-redacted on logging.
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - language
        - currency
        - currentVersion
        - tags
        - attachmentCount
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        templateId: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        expiryNoticeDays: { type: integer, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        currentVersion: { type: integer }
        draftedBy: { $ref: "#/components/schemas/ContractActorRef" }
        reviewedBy: { $ref: "#/components/schemas/ContractActorRef" }
        approvedBy: { $ref: "#/components/schemas/ContractActorRef" }
        aiRiskScore: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        aiSummaryEn: { type: string, nullable: true }
        aiSummaryAr: { type: string, nullable: true }
        importBatchId:
          type: integer
          nullable: true
          description: |
            M1c addition (always present in projection post-migration 022 — Codex H1 fix).
            import_batch.id this contract belongs to. NULL when not bulk-imported.
        importConfidence:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: |
            M1c addition (always present in projection post-migration 022).
            AI extraction confidence 0..100. NULL when not extracted.
        importFilename:
          type: string
          nullable: true
          description: |
            M1c addition (always present in projection post-migration 022).
            Original uploaded filename (no path / no extension stripped).
            NULL when not bulk-imported. Deliberately NOT in fn_audit_trigger redact list
            (Design Note D1 — useful for forensics, not classified PII).
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            M1c addition (always present in projection post-migration 022).
            Human-readable AI extraction warnings.
            NULL when key absent on insert; '[]' when explicitly empty (key-exists semantics).
        tags:
          type: array
          items: { type: string }
        attachmentCount: { type: integer, example: 0 }
        commentCount: { type: integer, example: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContractDto:
      type: object
      required: [titleEn, contractType]
      additionalProperties: false
      description: |
        Create a contract. M1c additively extends this DTO with 4 optional
        import-trace fields (importBatchId, importFilename, importConfidence,
        importWarnings) consumed by the bulk-import flow (S5 auto-save) and the
        manual-entry flow (S7). Migration 019 extended fn_contract_create to
        read these from p_data; migration 020 hardened the body to preserve the
        Codex BE-001 SELECT FOR UPDATE on parent_contract_id and changed
        importWarnings missing-key semantics to NULL (key-exists check).
        Existing M1a/M1b callers passing the original 19 fields are unaffected
        — Zod .strict() permits, fn_ ignores when absent.
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, minLength: 1, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string, default: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        importBatchId:
          type: integer
          minimum: 1
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S5-08). import_batch.id this insert belongs to.
            FK fk_contract_import_batch_id (ON DELETE SET NULL) — bad id surfaces
            as 400 with field='importBatchId' (translatePgError 23503 mapping).
            Migration 020 also adds a SELECT FOR UPDATE existence check inside
            fn_contract_create so concurrent batch soft-deletes are serialised.
        importFilename:
          type: string
          maxLength: 500
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S7-04). Original uploaded filename. Persists
            unredacted into contract.import_filename — kept out of pino redact
            list per Design Note D1 (forensics use case; not project.config.json
            sensitiveFields).
        importConfidence:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S7-04). AI extraction confidence 0..100.
            In-fn range guard fires before column CHECK so error envelope is
            structured ('importConfidence:Confidence must be between 0 and 100').
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            M1c addition (OI-2 / AC-S5-09 indirect). Array of human-readable AI
            warnings. fn_contract_create uses JSONB key-exists semantics
            (post-migration 020): missing key → NULL; explicit `[]` → `'[]'::jsonb`;
            populated array → preserved verbatim.

    UpdateContractDto:
      type: object
      additionalProperties: false
      description: |
        Partial COALESCE update. Status MUST NOT be supplied here - use
        PATCH /contracts/{id}/status instead (AC-S4-04, .strict() rejects).
        Tags are not part of this DTO - use PUT /contracts/{id}/tags.
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }

    UpdateContractStatusDto:
      type: object
      required: [newStatus]
      additionalProperties: false
      properties:
        newStatus: { $ref: "#/components/schemas/ContractStatus" }
        reason: { type: string, maxLength: 500, nullable: true }

    SetContractTagsDto:
      type: object
      required: [tags]
      additionalProperties: false
      properties:
        tags:
          type: array
          description: Replacement tag set. Empty array clears all tags.
          items: { type: string, minLength: 1, maxLength: 64 }

    CreateContractVersionDto:
      type: object
      required: [changeNote]
      additionalProperties: false
      description: |
        At least one of bodyEn or bodyAr must be provided (AC-S10-04).
      properties:
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }
        changeNote: { type: string, minLength: 1, maxLength: 500 }
        diffSummary: { type: string, nullable: true }

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        bodyEn: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        bodyAr: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        diffSummary: { type: string, nullable: true }
        changeNote: { type: string, nullable: true }
        changedBy: { $ref: "#/components/schemas/ContractActorRef" }
        createdAt: { type: string, format: date-time }

    ContractTreeNode:
      type: object
      required: [id, contractNumber, titleEn, status, depth]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        parentContractId: { type: integer, nullable: true }
        depth:
          type: integer
          description: Distance (in node hops) from the root. 0 = root.
        currentVersion: { type: integer }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }

    ContractActivity:
      type: object
      required: [id, contractId, activityType, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        activityType: { $ref: "#/components/schemas/ContractActivityType" }
        actor: { $ref: "#/components/schemas/ContractActorRef" }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Free-form JSON. Examples:
            - status_changed: { fromStatus, toStatus, reason? }
            - version_created: { versionNumber }
            - tagged: { added: string[], removed: string[] }
        createdAt: { type: string, format: date-time }

    ContractListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractVersionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractVersion" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractActivityListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractActivity" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractTreeResponse:
      type: object
      required: [rootId, tree, currentNode, truncated]
      properties:
        rootId: { type: integer }
        tree:
          type: array
          items: { $ref: "#/components/schemas/ContractTreeNode" }
        currentNode: { $ref: "#/components/schemas/ContractTreeNode" }
        truncated:
          type: boolean
          description: True when traversal hit the depth-20 cap (AC-S7-05).

    UpdateContractStatusResponse:
      type: object
      required: [id, fromStatus, toStatus, changedAt]
      properties:
        id: { type: integer }
        fromStatus: { $ref: "#/components/schemas/ContractStatus" }
        toStatus: { $ref: "#/components/schemas/ContractStatus" }
        changedAt: { type: string, format: date-time }

    SetContractTagsResponse:
      type: object
      required: [id, tags]
      properties:
        id: { type: integer }
        tags:
          type: array
          items: { type: string }

    CreateContractVersionResponse:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        createdAt: { type: string, format: date-time }

    DeleteContractResponse:
      type: object
      required: [success, id, message]
      properties:
        success: { type: boolean, enum: [true] }
        id: { type: integer }
        message: { type: string, example: Contract soft-deleted }

    # ----------------------------------------------------------------------
    # M1b — Compose Wizard, Payment Schedules & Exports
    # ----------------------------------------------------------------------

    PaymentScheduleStatus:
      type: string
      description: Milestone lifecycle state (mirrors Lovable enum).
      enum: [pending, due, paid, overdue, waived, cancelled]

    PaymentScheduleRecurrence:
      type: string
      nullable: true
      description: Recurrence mode for recurring milestones. NULL = single (non-recurring).
      enum: [once, monthly, quarterly, annually]

    PaymentSchedule:
      type: object
      description: |
        Per-contract milestone payment row. CASCADE-deletes with the parent
        contract; soft-deleted by `fn_payment_schedule_create_bulk` replace path
        (the only writer that flips `is_active` outside CASCADE). Direct DELETE
        is denied by `payment_schedule_deny_direct_delete` RESTRICTIVE policy.
      required:
        - id
        - contractId
        - milestoneLabelEn
        - amountAed
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, example: 12 }
        contractId: { type: integer, example: 123 }
        milestoneLabelEn:
          type: string
          maxLength: 255
          description: Short display tag (e.g. "Milestone 1", "Phase 2 Payment"). Required.
          example: Milestone 1
        milestoneLabelAr:
          type: string
          maxLength: 255
          nullable: true
          description: Arabic counterpart of milestoneLabelEn. Optional.
        milestoneNameEn:
          type: string
          maxLength: 500
          nullable: true
          description: Descriptive title for the milestone. Optional. Both label AND name retained per Q6 — see data-dictionary.
          example: Initial deposit on signature
        milestoneNameAr:
          type: string
          maxLength: 500
          nullable: true
        amountAed:
          type: number
          format: double
          minimum: 0
          description: Milestone payment amount in AED. NUMERIC(15,2). Zero allowed for waived/cancelled milestones.
          example: 50000.00
        dueDate:
          type: string
          format: date
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status flips to `paid`. CHECK enforces (paid_at IS NULL OR status = 'paid').
        status:
          $ref: "#/components/schemas/PaymentScheduleStatus"
        recurrence:
          $ref: "#/components/schemas/PaymentScheduleRecurrence"
        invoiceRef:
          type: string
          maxLength: 100
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentScheduleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: |
            Active milestones for the contract, ordered by `due_date ASC NULLS LAST`
            then `id ASC`. Not paginated (per-contract counts typically 1–30).
          items: { $ref: "#/components/schemas/PaymentSchedule" }

    PaymentScheduleCreateDto:
      type: object
      required: [milestoneLabelEn, amountAed]
      properties:
        milestoneLabelEn: { type: string, minLength: 1, maxLength: 255 }
        milestoneLabelAr: { type: string, maxLength: 255, nullable: true }
        milestoneNameEn:  { type: string, maxLength: 500, nullable: true }
        milestoneNameAr:  { type: string, maxLength: 500, nullable: true }
        amountAed:        { type: number, format: double, minimum: 0 }
        dueDate:          { type: string, format: date, nullable: true }
        paidAt:           { type: string, format: date-time, nullable: true }
        status:           { $ref: "#/components/schemas/PaymentScheduleStatus" }
        recurrence:       { $ref: "#/components/schemas/PaymentScheduleRecurrence" }
        invoiceRef:       { type: string, maxLength: 100, nullable: true }

    PaymentScheduleBulkReplaceDto:
      type: object
      required: [rows]
      description: |
        Atomic bulk-replace request body. Controller hardcodes
        `p_replace_existing=true` (AC-S3-01) regardless of `replaceExisting`
        client field. `fn_payment_schedule_create_bulk` takes
        `SELECT FOR UPDATE` on the parent contract row to serialise concurrent
        callers (Codex BE-001 hardening, AC-S3-11).
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PaymentScheduleCreateDto" }
        replaceExisting:
          type: boolean
          description: Optional, ignored — endpoint always replaces.

    PaymentScheduleBulkReplaceResponse:
      type: object
      required: [contractId, inserted, softDeleted, rows]
      properties:
        contractId:   { type: integer }
        inserted:     { type: integer, description: Count of rows inserted by this call. }
        softDeleted:  { type: integer, description: Count of rows deactivated by the replace path. }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PaymentSchedule" }

    # ----------------------------------------------------------------------
    # M1c — Bulk & Manual Import
    # ----------------------------------------------------------------------

    ImportBatchStatus:
      type: string
      description: |
        4-value lifecycle enum for import_batch.status. CHECK constraint enforced
        on the column. Allowed transitions (AC-S2-02 — fn_import_batch_update):
          in_progress → paused | completed | cancelled
          paused      → in_progress | completed | cancelled
          completed   → (terminal — no transitions; AC-S2-08)
          cancelled   → (terminal — no transitions; AC-S2-08)
        Cancellation is a status transition, NOT is_active=false. The
        trg_import_batch_immutable_fields BEFORE UPDATE trigger raises
        SQLSTATE 42501 (BE 403) on any direct flip of is_active.
      enum: [in_progress, paused, completed, cancelled]

    ImportBatchStatusMode:
      type: string
      description: |
        3-value enum embedded in the import_batch.config JSONB key statusMode.
        Validated server-side inside fn_import_batch_create — NOT a DB CHECK
        on the table (Design Note D6 — JSONB-shape CHECK is brittle and slow).
          active — every imported contract lands with status='active'
          draft  — every imported contract lands with status='draft'
          auto   — use the AI-detected status from extract-contract-bulk
      enum: [active, draft, auto]

    ImportBatchConfig:
      type: object
      description: |
        Batch defaults JSONB (camelCase keys) stored in import_batch.config.
        Validated by fn_import_batch_create + Zod CreateImportBatchSchema (.strict).
      additionalProperties: false
      properties:
        contractType:
          type: string
          description: |
            Optional override of the M1a contract.contract_type CHECK enum value
            applied to every contract in this batch. Hardcoded 8-value list inside
            fn_import_batch_create (cross-ref M1a migration 003): service,
            employment, vendor, partnership, lease, license, nda, other.
        statusMode:
          $ref: "#/components/schemas/ImportBatchStatusMode"
        defaultCounterpartyId:
          type: integer
          minimum: 1
          description: |
            Optional default counterparty applied when AI does not detect one.
            Forward-references the (deferred) Parties module — kept nullable
            until that module ships.

    ImportBatch:
      type: object
      description: |
        Full import_batch shape returned by fn_import_batch_get_by_id (S4) and
        used as the response body of fn_import_batch_create (S1) +
        fn_import_batch_update (S2 — both end with `RETURN
        fn_import_batch_get_by_id(...)`). initiatedBy is hydrated as a UserRef
        via M0 fn_user_get_by_id (AC-S4-04). For the lighter list shape see
        ImportBatchListItem.
      required:
        - id
        - initiatedBy
        - config
        - totalFiles
        - autoSaved
        - reviewQueue
        - manualEntry
        - duplicatesSkipped
        - errored
        - status
        - startedAt
        - completedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, example: 42 }
        initiatedBy:
          allOf:
            - $ref: "#/components/schemas/ContractActorRef"
          description: |
            Operator identity. UserRef hydrated by fn_user_get_by_id. Immutable
            post-create — trg_import_batch_immutable_fields raises SQLSTATE
            42501 on any UPDATE that changes initiated_by (Codex C1 fix).
        config:
          $ref: "#/components/schemas/ImportBatchConfig"
        totalFiles:
          type: integer
          minimum: 1
          description: |
            Up-front file count, set on create; immutable thereafter. CHECK >= 1.
            Sum of the 5 counters is bounded by this value — chk_import_batch_counter_sum.
        autoSaved:
          type: integer
          minimum: 0
          description: |
            Files that AI extraction routed straight to active/draft contracts
            (high-confidence track). Mutated only via fn_import_batch_update
            with SELECT FOR UPDATE on the batch row (Codex BE-001).
        reviewQueue:
          type: integer
          minimum: 0
          description: Files routed to the human review queue (medium-confidence track).
        manualEntry:
          type: integer
          minimum: 0
          description: Files routed to the manual-entry track (low-confidence or extraction-failed).
        duplicatesSkipped:
          type: integer
          minimum: 0
          description: |
            Files skipped because the FE pre-check matched an existing active
            contract by detectedDuplicateContractNumber (AC-S5-09).
        errored:
          type: integer
          minimum: 0
          description: |
            Files that failed extraction or upload entirely (OI-6 / Design Note D3).
            Without this counter, batches with errors could never reach
            status='completed'. Sum-bounded with the 4 above against totalFiles.
        status:
          $ref: "#/components/schemas/ImportBatchStatus"
        startedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp set at row creation.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 timestamp. Non-NULL iff status is terminal (completed |
            cancelled) — enforced declaratively by chk_import_batch_completed_at_status
            (Design Note D2).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImportBatchListItem:
      type: object
      description: |
        Lighter list shape returned by fn_import_batch_list (S3). initiatedBy is
        a raw bigint user id (not a UserRef) to keep the admin list query lean.
        createdAt/updatedAt omitted (list shows startedAt + completedAt only).
      required:
        - id
        - initiatedBy
        - totalFiles
        - autoSaved
        - reviewQueue
        - manualEntry
        - duplicatesSkipped
        - errored
        - status
        - config
        - startedAt
        - completedAt
      properties:
        id: { type: integer }
        initiatedBy:
          type: integer
          description: Raw bigint user id. Drill-down to UserRef via GET /import-batches/:id.
        totalFiles: { type: integer, minimum: 1 }
        autoSaved: { type: integer, minimum: 0 }
        reviewQueue: { type: integer, minimum: 0 }
        manualEntry: { type: integer, minimum: 0 }
        duplicatesSkipped: { type: integer, minimum: 0 }
        errored: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        config: { $ref: "#/components/schemas/ImportBatchConfig" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ImportBatchListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ImportBatchListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateImportBatchDto:
      type: object
      required: [totalFiles]
      additionalProperties: false
      description: |
        Body of POST /api/v1/import-batches (S1). Maps to fn_import_batch_create
        p_data JSONB. initiated_by is set server-side from req.user.id (NOT a
        body field — AC-S1-05; RLS policy import_batch_insert_runner enforces
        post-image matches current_user_id, blocking impersonation).
      properties:
        totalFiles:
          type: integer
          minimum: 1
          description: AC-S1-02. CHECK total_files >= 1.
        config:
          $ref: "#/components/schemas/ImportBatchConfig"

    UpdateImportBatchDto:
      type: object
      additionalProperties: false
      description: |
        Body of PATCH /api/v1/import-batches/:id (S2). Counter deltas are SIGNED
        integers — negative deltas allowed iff result remains >= 0 (AC-S2-04
        underflow guard); the 5-counter sum is bounded by chk_import_batch_counter_sum
        (AC-S2-05 overflow guard). Status transitions validated against the
        4-value allowed-transition table (AC-S2-02). Zod .strict() rejects unknown
        keys; .refine() requires at least one field to be present.
      properties:
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        autoSavedDelta:
          type: integer
          description: |
            Default 0 (no-op). AC-S2-04 underflow → 400 with field='autoSaved'.
        reviewQueueDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='reviewQueue'.
        manualEntryDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='manualEntry'.
        duplicatesSkippedDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='duplicatesSkipped'.
        erroredDelta:
          type: integer
          description: |
            Default 0. OI-6 / Design Note D3 — 5th counter so 'completed' status
            can be reached when files fail extraction. AC-S2-04 underflow →
            400 with field='errored'.

    ExtractContractBulkRequest:
      type: object
      required: [filename, fileSize, extractedText, batchId]
      additionalProperties: false
      description: |
        Body of POST /api/v1/ai/extract-contract-bulk (S8). FROZEN per HQ2 —
        M4 must replace the controller body without changing this DTO. The
        already-extracted text is sent here (mammoth/pdfjs run in the browser
        per AC-S5-02 / HQ1 — backend never sees the file bytes).
      properties:
        filename:
          type: string
          minLength: 1
          description: Non-empty original filename.
        fileSize:
          type: integer
          minimum: 0
          description: File size in bytes (informational — locked for M4 use).
        extractedText:
          type: string
          minLength: 50
          description: |
            Already-extracted text. Min 50 chars (AC-S8-03). SENSITIVE —
            classified as ai_prompt_payload per project.config.json
            sensitiveFields. Pino-redacted across 7 paths (Codex M1 fix:
            top-level, req.body.*, req.body.*.*, req.query.*, req.params.*,
            *.X, *.*.X). The AI controller additionally never passes req.body
            to a logger call — only filename/fileSize/batchId/textLength.
        batchId:
          type: integer
          minimum: 1
          description: import_batch.id this file belongs to. Positive bigint.

    ExtractContractBulkResponse:
      type: object
      required: [importConfidence, importWarnings]
      additionalProperties: false
      description: |
        Response body of POST /api/v1/ai/extract-contract-bulk. FROZEN DTO per
        HQ2 — M4 replaces the controller body without changing this shape
        (AC-S8-07). Fields are the union of M1a CreateContractDto (all optional —
        AI may not detect every field) + M1c-specific extraction metadata.
        M1c stub computes importConfidence as
        round(min(95, max(20, extractedText.length / 100))) — pure deterministic
        function in src/services/ai/extract-contract-bulk.service.ts (BE-AI-stub-formula).
      properties:
        # M1a CreateContractDto fields (all optional)
        titleEn: { type: string }
        titleAr: { type: string }
        contractType: { type: string }
        templateId: { type: integer }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer }
        counterpartyId: { type: integer }
        valueAed: { type: number, format: double }
        currency: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        expiryNoticeDays: { type: integer }
        emirate: { type: string }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string }
        parentContractId: { type: integer }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn: { type: string, description: SENSITIVE — pino-redacted on log. }
        bodyAr: { type: string, description: SENSITIVE — pino-redacted on log. }
        tags:
          type: array
          items: { type: string }
        # M1c-specific extraction metadata
        importConfidence:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            REQUIRED. AI extraction confidence — routes the per-file result via
            IMPORT_CONFIDENCE_THRESHOLDS in S5:
              high   (>= 80) → auto-save track
              medium (50..79) → review queue
              low    (<50)   → manual entry track
            AC-S5-05 / AC-S8-04.
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            REQUIRED. Human-readable warnings produced during extraction.
            null when no warnings apply.
        detectedDuplicateContractNumber:
          type: string
          nullable: true
          description: |
            Optional. When the AI detects a contract number on the document, the
            FE pre-checks against existing active contracts; matching rows are
            skipped and duplicatesSkipped is incremented (AC-S5-09).

    # ===================================================================
    # M2 — Approval Workflows schemas
    # ===================================================================

    UserRef:
      type: object
      description: Lightweight user reference (id + display fields). Reused across M2 chain payloads.
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }

    ApprovalChainStatus:
      type: string
      description: Approval chain lifecycle. `in_progress` is the only non-terminal state. `cancelled` is set when a drafter or admin cancels a contract before chain completion (AE-3 contract.status='cancelled' counterpart).
      enum: [in_progress, approved, rejected, resubmission_requested, cancelled]

    ApprovalStepStatus:
      type: string
      description: |
        Approval step lifecycle. Note `delegated` and `reassigned` are reserved on the CHECK constraint but unwritten by M2 — fn_approval_delegate and fn_approval_reassign leave step.status='pending' (AC-S3-01 / AC-S8-03). Forward-compat reservation only.
      enum: [pending, approved, rejected, skipped, escalated, resubmission_requested, delegated, reassigned]

    ApprovalDecisionType:
      type: string
      enum: [approve, reject, request_resubmission, delegate, reassign, escalate]

    ApprovalPendingSort:
      type: string
      enum: [oldest, newest, highest_value]

    ApprovalMatrixRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        contractType: { type: string }
        valueMin: { type: number }
        valueMax: { type: number, nullable: true }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApprovalMatrixRuleInput:
      type: object
      required: [stepOrder, approverRole]
      properties:
        stepOrder: { type: integer, minimum: 1 }
        parallelGroup:
          type: integer
          nullable: true
          description: When set, MUST equal stepOrder (AC-S5-05).
        approverRole:
          type: string
          description: Must exist in role.name (AC-S5-03).
        isRequired: { type: boolean, default: true }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true, minimum: 1 }

    UpdateApprovalMatrixDto:
      type: object
      required: [contractType, valueMin, rules]
      properties:
        contractType:
          type: string
          description: M1a 8-value contract_type enum value.
        valueMin:
          type: number
          minimum: 0
        valueMax:
          type: number
          nullable: true
          description: ">= valueMin if set; NULL = no upper bound."
        rules:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApprovalMatrixRuleInput" }

    ApprovalMatrixListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApprovalMatrixRule" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ApprovalMatrixSetResponse:
      type: object
      properties:
        contractType: { type: string }
        minValueAed: { type: number }
        maxValueAed: { type: number, nullable: true }
        ruleCount: { type: integer }
        ruleIds:
          type: array
          items: { type: integer, format: int64 }

    RouteInitPreviewRequest:
      type: object
      required: [contractType, valueAed]
      properties:
        contractType: { type: string }
        valueAed: { type: number, minimum: 0 }

    RouteInitPreviewStep:
      type: object
      properties:
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }

    RouteInitPreviewResponse:
      type: object
      properties:
        contractType: { type: string }
        valueAed: { type: number }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RouteInitPreviewStep" }
        hasNoMatchingRule:
          type: boolean
          description: TRUE when matrix has no rule for the (contract_type, valueAed) pair (AC-S6-05).

    SubmitForApprovalResponse:
      type: object
      properties:
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        totalSteps: { type: integer }
        currentStepOrder: { type: integer, description: "Always 1 for a new chain." }
        newContractStatus: { type: string, enum: [in_approval] }

    DecideApprovalDto:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject, request_resubmission]
          description: |
            delegate / reassign / escalate are SEPARATE endpoints; fn_approval_decide rejects them at step 1 with HTTP 400. (AC-S2-01)
        decisionNote:
          type: string
          description: |
            Required when decision in (reject, request_resubmission). Sensitive — pino-redacted on logs (14 paths) and JSONB-redacted by fn_audit_trigger. (AC-S2-02 / AC-S2-03)

    DecideApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        newStepStatus: { $ref: "#/components/schemas/ApprovalStepStatus" }
        newChainStatus: { $ref: "#/components/schemas/ApprovalChainStatus" }
        newContractStatus: { $ref: "#/components/schemas/ContractStatus" }
        advancedToStepOrder:
          type: integer
          nullable: true
          description: NULL when chain halted or completed.
        allChainStepsResolved:
          type: boolean
          description: TRUE iff chain.status moved out of in_progress.

    DelegateApprovalDto:
      type: object
      required: [delegatedToUserId]
      properties:
        delegatedToUserId:
          type: integer
          format: int64
          description: |
            Target user.id. Must be active, hold a compatible approver role
            (contract_approver / contract_approver_2 / legal_counsel) and NOT
            equal the caller (AC-S3-03 / AC-S3-04).
        decisionNote:
          type: string
          description: Optional. Sensitive — pino-redacted.

    DelegateApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        delegatedTo: { $ref: "#/components/schemas/UserRef" }
        decisionId: { type: integer, format: int64 }

    ReassignApprovalDto:
      type: object
      required: [reassignedToUserId]
      properties:
        reassignedToUserId:
          type: integer
          format: int64
          description: |
            Target user.id. Role MUST equal step.approver_role OR be one of
            (platform_admin / legal_counsel / Super Admin). (AC-S8-05)
        decisionNote:
          type: string
          description: Optional. Sensitive — pino-redacted.

    ReassignApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        originalApprover:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: NULL when step had no prior approver_user_id (role-only assignment).
        reassignedTo: { $ref: "#/components/schemas/UserRef" }
        decisionId: { type: integer, format: int64 }

    MyPendingApprovalListItem:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNumber: { type: string }
        contractTitleEn: { type: string, nullable: true }
        contractTitleAr: { type: string, nullable: true }
        valueAed: { type: number, nullable: true }
        requesterUserRef: { $ref: "#/components/schemas/UserRef" }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        isRequired: { type: boolean }
        hoursPending: { type: integer }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }

    MyPendingApprovalListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MyPendingApprovalListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ApprovalChainStepDecisionItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        decision: { $ref: "#/components/schemas/ApprovalDecisionType" }
        decidedBy:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: NULL for system-emitted (cron) escalation rows.
        decidedAt: { type: string, format: date-time }
        decisionNote:
          type: string
          nullable: true
          description: Sensitive — redacted in audit_log.
        delegatedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        reassignedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true

    ApprovalChainStepDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        approver:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        delegatedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        reassignedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        status: { $ref: "#/components/schemas/ApprovalStepStatus" }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainStepDecisionItem" }

    ApprovalChainGetResponse:
      type: object
      description: matrixSnapshot is intentionally OMITTED from this projection (sensitive — visible only via admin / forensic paths).
      properties:
        chain:
          type: object
          properties:
            id: { type: integer, format: int64 }
            contractId: { type: integer, format: int64 }
            status: { $ref: "#/components/schemas/ApprovalChainStatus" }
            currentStepOrder: { type: integer }
            submittedBy: { $ref: "#/components/schemas/UserRef" }
            submittedAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time, nullable: true }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainStepDetail" }

    ApprovalChainListItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNumber: { type: string }
        status: { $ref: "#/components/schemas/ApprovalChainStatus" }
        currentStepOrder: { type: integer }
        totalSteps: { type: integer }
        submittedBy: { $ref: "#/components/schemas/UserRef" }
        submittedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        hoursPending: { type: integer }

    ApprovalChainListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    UpdateContractStatusUserDto:
      type: object
      required: [newStatus]
      description: |
        M2 (AE-2) wire DTO for PATCH /contracts/{id}/status. Same field shape
        as the M1a UpdateContractStatusDto (which is now deprecated as a type
        alias) but newStatus is restricted to the per-transition matrix
        enforced by fn_contract_status_update_user. Direct in_approval
        terminal targets (approved / rejected / resubmission_requested) are
        rejected with 409 — callers must use POST /approvals/{stepId}/decide.
      properties:
        newStatus: { $ref: "#/components/schemas/ContractStatus" }
        reason:
          type: string
          description: Optional. Captured in metadata.reason of the status_changed contract_activity row.

    UpdateContractStatusUserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fromStatus: { $ref: "#/components/schemas/ContractStatus" }
        toStatus: { $ref: "#/components/schemas/ContractStatus" }
        changedAt: { type: string, format: date-time }

  responses:
    Unauthenticated:
      description: UNAUTHORIZED - missing or invalid access token.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: FORBIDDEN - caller lacks required permission.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: VALIDATION_ERROR - request body / query params failed Zod validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: RATE_LIMITED - too many requests.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Authenticate with email + password
      description: |
        Authenticate the caller and issue a JWT access token (15m) + refresh
        token (7d) plus the AuthUser profile.

        - Lockout: 5 failed attempts within 15 minutes locks the account.
        - Email enumeration prevention (CRX-2): unknown emails still run a dummy
          bcrypt to equalize timing; response is always a generic 401.
        - Rate limit: 5 requests per 15 minutes per IP.

        DB functions used: `fn_auth_get_user_for_login`, `fn_auth_record_login_failure`, `fn_auth_record_login_success`.
      x-rateLimit: 5 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginDto" }
            example:
              email: admin@musanad.local
              password: ChangeMe@123
      responses:
        "200":
          description: Login successful. Tokens + user returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                user:
                  id: 1
                  email: admin@musanad.local
                  firstName: System
                  lastName: Admin
                  role: { id: 1, name: Super Admin }
                  permissions: [audit.read, role.manage, user.manage, user.read.all]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_CREDENTIALS - generic to prevent enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: ACCOUNT_LOCKED - too many failed attempts; account locked until lockedUntil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Blacklist the supplied refresh token
      description: |
        Blacklist the supplied refresh token so future refresh attempts return 401.
        The access token is verified for authentication only.
        Rate limit: 10 requests per 5 minutes per IP.
        DB function used: `fn_auth_blacklist_token`.
      x-rateLimit: 10 requests per 5 minutes per IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutDto" }
      responses:
        "200":
          description: Logged out successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
              example:
                success: true
                message: Logged out
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate access + refresh tokens
      description: |
        Exchange a non-blacklisted refresh token for a NEW access token (15m)
        AND a NEW refresh token (7d). The old refresh token is blacklisted
        atomically inside this call (`fn_auth_blacklist_if_absent`, CRX-1 fix).

        Clients MUST replace BOTH stored tokens. Reusing the old refresh after
        a successful rotation returns 401 (refresh-token-rotation pattern;
        OWASP / RFC 6749).

        Rate limit: 10 requests per 15 minutes per IP.
        DB functions used: `fn_auth_check_token_blacklist`, `fn_user_get_by_id`, `fn_auth_blacklist_if_absent`.
      x-rateLimit: 10 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenDto" }
      responses:
        "200":
          description: Refresh successful.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_REFRESH_TOKEN - expired, blacklisted, or user inactive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/uae-pass/initiate:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassInitiate
      summary: Begin UAE Pass federated login flow
      description: |
        Generates a server-side CSRF state value (32 random hex bytes), stores
        it in the state-store with a 5-minute TTL, and returns the authorize
        URL. The client must redirect the user agent there and echo the state
        unchanged in `/callback` (CRX-3 fix).

        State store: in-memory Map for dev (mock provider). MUST swap to Redis
        or a `uae_pass_state` DB table before multi-replica production deploy.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassInitiateRequest" }
      responses:
        "200":
          description: Authorize URL + state nonce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassInitiateResponse" }

  /auth/uae-pass/callback:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassCallback
      summary: Complete UAE Pass federated login (exchange code + state)
      description: |
        Validates `state` against the server-side store (single-use, 5-min TTL),
        then exchanges `code` with the UAE Pass provider for an identity payload.

        - Mock provider returns a synthetic identity (deterministic; dev only).
        - Live provider stub throws NotImplementedError until real UAE Pass
          credentials and SAML/PKCE wiring are completed (see
          `docs/uae-pass-integration.md`).

        CRX-3: missing, expired, or already-consumed state returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassCallbackRequest" }
      responses:
        "200":
          description: Identity payload (mock provider).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassCallbackResponse" }
        "401":
          description: Invalid or expired state parameter (CRX-3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: NOT_IMPLEMENTED - live provider not yet wired in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users:
    get:
      tags: [Users]
      operationId: userList
      summary: List users (paginated)
      description: |
        Paginated user list, optionally filtered by `search` (email / firstName / lastName)
        and `roleId`. Requires `user.read.all`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.read.all]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated user list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserListItem" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: userCreate
      summary: Create a new user
      description: |
        Admin-only. BE bcrypts the password (12 rounds) before passing to
        `fn_user_create`. The plaintext password never reaches the DB or the logs.
        Requires `user.manage`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserDto" }
            example:
              email: new.user@musanad.local
              password: Initial@Pass1
              firstName: New
              lastName: User
              roleId: 3
      responses:
        "201":
          description: User created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: EMAIL_IN_USE - an active user already exists with this email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Users]
      operationId: userGetById
      summary: Get a user profile
      description: Caller must be the user themselves OR have `user.read.all`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self, Super Admin, Admin]
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: userUpdate
      summary: Update user fields (partial)
      description: |
        Partial update of email / firstName / lastName / roleId.
        Self-updates restricted to firstName / lastName at controller level;
        admin updates may change all four. Password updates are NOT handled here
        (reserved for M1+ password reset flow).
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self (limited fields), Super Admin, Admin]
      x-requiredPermissions: [user.manage (or self for firstName/lastName only)]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserDto" }
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EMAIL_IN_USE - new email already in use by another active user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Users]
      operationId: userDelete
      summary: Soft-delete a user
      description: |
        Sets `is_active = false`. Self-protection: caller cannot deactivate their
        own account. Requires `user.manage`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      responses:
        "200":
          description: User deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN - caller lacks user.manage or attempted self-deactivation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles:
    get:
      tags: [Roles]
      operationId: roleList
      summary: List active roles (paginated)
      description: |
        Paginated list of active roles with `permissionCount`. Used to populate
        role-select dropdowns. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated role list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /permissions:
    get:
      tags: [Permissions]
      operationId: permissionList
      summary: List permissions (paginated; optional roleId filter)
      description: |
        Paginated permission catalog. If `roleId` is provided, returns only
        permissions held by that role. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated permission list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ============================================================
  # M1a — Contracts (11 endpoints, S1..S11; S12 is trigger-only)
  # ============================================================

  /contracts:
    get:
      tags: [M1a — Contracts]
      operationId: contractList
      summary: List contracts (paginated, role-aware, filter+search+tags)
      description: |
        Paginated contract list with role-aware filtering, status / type /
        counterparty / date filters, debounced search, and AND-semantic tag
        filter. body_en / body_ar are NEVER returned by this endpoint
        (AC-S1-08). DB function: `fn_contract_list`.
      x-rateLimit: authedReadRateLimiter (60 / min / authenticated user)
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contractType
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: draftedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approvedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: tags
          in: query
          description: AND-semantics; every supplied tag must match.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: search
          in: query
          description: ILIKE across contract_number / title_en / title_ar.
          schema: { type: string }
        # ----------------------------------------------------------------
        # M1c additive query params. fn_contract_list signature widened
        # 15→18 (migration 017). All three default NULL — backward
        # compatible. Used by M1c S4 (admin drill-down) and S6 (review queue).
        # ----------------------------------------------------------------
        - name: importBatchId
          in: query
          description: |
            M1c addition. Filter to a single import_batch — used by S4 admin
            drill-down (AC-S4-05). Positive bigint or omitted.
          schema: { type: integer, minimum: 1 }
        - name: importConfidenceMin
          in: query
          description: |
            M1c addition. Lower bound (inclusive) on contract.import_confidence —
            used by S6 review queue (AC-S6-01). Range 0..100.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: importConfidenceMax
          in: query
          description: |
            M1c addition. Upper bound (inclusive) on contract.import_confidence —
            used by S6 review queue (AC-S6-01). Range 0..100.
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: |
            Paginated contract list. Each row carries 3 M1c additions
            (importBatchId, importConfidence, importWarnings) — always present,
            null when contract was not bulk-imported.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [M1a — Contracts]
      operationId: contractCreate
      summary: Create a new contract (draft status, auto-numbered)
      description: |
        Creates a new contract row with `status='draft'`, auto-generated
        `contract_number` (format CT-YYYY-NNNNNN), `current_version=1`. A
        `created` activity row is auto-emitted by trigger. body_en/body_ar
        in the request body are pino-redacted on inbound logging.

        DB function: `fn_contract_create`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin, legal_counsel, contract_drafter]
      x-permissionRequired: contract.draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContractDto" }
      responses:
        "201":
          description: Contract created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            CONFLICT - contract number collision after 3 controller retries
            (AC-S3-09 defensive only; auto-generation should not race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}:
    get:
      tags: [M1a — Contracts]
      operationId: contractGetById
      summary: Get a single contract (with attachment + comment counts)
      description: |
        Returns the full contract payload including bodyEn/bodyAr (which are
        pino-redacted on logging). attachmentCount and commentCount are
        inline numeric fields; the underlying tables are forward references.

        AC-S2-03 layering: when the row exists in `contract` but is hidden by
        RLS for the caller, the controller returns 403 (not 404). The
        existence pre-check uses an allowlisted SECURITY DEFINER helper
        (`db.checkActiveRowExists`).

        DB function: `fn_contract_get_by_id`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [M1a — Contracts]
      operationId: contractUpdate
      summary: Update a contract (partial COALESCE; body changes create a version)
      description: |
        Partial COALESCE update. **`status` MUST NOT be in the payload** -
        Zod `.strict()` rejects it (AC-S4-04). Use PATCH /contracts/{id}/status
        for status transitions. Tags are not part of this DTO either - use
        PUT /contracts/{id}/tags. A body change auto-creates a new
        `contract_version` row in the same transaction (S4 + S10 wired
        together; AC-S4-02).

        Migration 008 adds SELECT FOR UPDATE on the contract row before
        reading existing values, serialising concurrent updates against
        each other and against soft-delete (Codex BE-002).

        DB function: `fn_contract_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own AND status IN draft|resubmission_requested)
      x-permissionRequired: contract.edit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractDto" }
      responses:
        "200":
          description: Contract updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [M1a — Contracts]
      operationId: contractDelete
      summary: Soft-delete a contract (cascades to tags; rejects if children active)
      description: |
        Soft-deletes the contract (sets `is_active=FALSE`). Cascades a
        soft-delete to `contract_tag` rows. `contract_version` rows are
        preserved verbatim (append-only; AC-S5-02).

        Cannot soft-delete a contract with active children (AC-S5-04 ->
        409 CONFLICT details.children).

        Defence-in-depth: `fn_contract_delete` is SECURITY DEFINER and sets
        the `app.fn_contract_delete='true'` GUC, takes
        SELECT...FOR UPDATE on the row, performs the child-active check
        inside the lock, then flips `is_active`. The companion RESTRICTIVE
        RLS policy `contract_deny_direct_is_active_update` prevents bypass
        via direct UPDATE. Codex G2 TOCTOU defense.

        DB function: `fn_contract_delete`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin]
      x-permissionRequired: contract.delete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract soft-deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteContractResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT - contract has active children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}/status:
    patch:
      tags: [M1a — Contracts]
      operationId: contractUpdateStatus
      summary: Update contract status (placeholder transitions; M2 adds state-machine)
      description: |
        Updates `contract.status` with **placeholder** transition rules:
        M1a validates enum membership only. The full state-machine
        (which transitions are legal from which terminal) lands in M2.

        Auto-emits a `status_changed` activity row with
        `metadata.{ fromStatus, toStatus, reason? }`. The trigger de-dupes
        with the explicit emission inside `fn_contract_status_update` so
        only one activity row is written per transition.

        DB function: `fn_contract_status_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own)
      x-permissionRequired: contract.status.update
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractStatusDto" }
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateContractStatusResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/tree:
    get:
      tags: [M1a — Contracts]
      operationId: contractGetTree
      summary: Get parent/child amendment + renewal + extension + SOW timeline
      description: |
        Returns the full ancestor + descendant tree around the requested
        contract. Recursive CTE in both directions; depth capped at 20
        (`truncated=true` flag set when capped, AC-S7-05). Role-aware
        filtering omits invisible nodes from the returned tree.

        DB function: `fn_contract_get_tree`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractTreeResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/tags:
    put:
      tags: [M1a — Contracts]
      operationId: contractSetTags
      summary: Replace the tag set on a contract (atomic, idempotent)
      description: |
        Atomically replaces the contract's tag set. Empty array clears all
        tags. Idempotent - same input twice yields the same final state.
        Auto-emits a `tagged` activity with `metadata={ added, removed }`.

        Migration 008 takes SELECT FOR UPDATE on the parent contract row
        before computing the add/remove diff to serialise concurrent
        replacements (Codex BE-003).

        DB function: `fn_contract_set_tags`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own)
      x-permissionRequired: contract.tag.manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetContractTagsDto" }
      responses:
        "200":
          description: Tags replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetContractTagsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/versions:
    get:
      tags: [M1a — Contracts]
      operationId: contractVersionList
      summary: List versions for a contract (newest first)
      description: |
        Paginated version list, newest first. body_en/body_ar appear in the
        payload but are pino-redacted on logging.

        DB function: `fn_contract_version_list`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractVersionListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [M1a — Contracts]
      operationId: contractVersionCreate
      summary: Create a new version snapshot (atomic version_number increment)
      description: |
        Creates a new `contract_version` snapshot and updates
        `contract.body_en`/`body_ar` to match within a single transaction.
        Atomic version_number increment via SELECT FOR UPDATE on the parent
        contract row. Auto-emits `version_created` activity with
        `metadata.versionNumber`.

        At least one of `bodyEn` or `bodyAr` must be supplied (AC-S10-04).
        `changeNote` is required (AC-S10-05).

        DB function: `fn_contract_version_create`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own AND status IN draft|resubmission_requested)
      x-permissionRequired: contract.edit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContractVersionDto" }
      responses:
        "201":
          description: Version created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateContractVersionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT - defensive UNIQUE retry on (contract_id, version_number).
            Should be unreachable from outside the DB given SELECT FOR UPDATE
            serialisation (AC-S10-08; QA F-gap noted in test report).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}/activity:
    get:
      tags: [M1a — Contracts]
      operationId: contractActivityList
      summary: List the contract activity timeline (newest first)
      description: |
        Paginated activity timeline, newest first. Optional `activityType`
        filter. The `actor` field is enriched as `{ id, firstName, lastName }`
        when the underlying user is still active and `null` otherwise.

        Activity rows are write-only via the SECURITY DEFINER helper
        `fn_contract_activity_create` (called by triggers); there is no
        public POST endpoint for activity (DN4 - RLS denies direct INSERT).

        DB function: `fn_contract_activity_list`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter (department)
        - contract_approver (department)
        - contract_approver_2 (department)
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: activityType
          in: query
          schema: { $ref: "#/components/schemas/ContractActivityType" }
      responses:
        "200":
          description: Paginated activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActivityListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # M1b paths
  #
  # W1 ROUTE-ORDERING NOTE (binds Express runtime, not the OpenAPI generator):
  #   `GET /contracts/export.xlsx` is a LITERAL path. In Express, route matching
  #   is order-sensitive — this literal route MUST be declared BEFORE any
  #   `/contracts/{id}` route or any `/contracts/{id}/...` matcher (otherwise
  #   the path binds `:id='export.xlsx'` and fails PositiveBigIntSchema with
  #   400 instead of reaching the export controller). Verified in
  #   `src/routes/v1/contracts.routes.ts` L73-80 (literal) declared before
  #   L109+ (any `:id` matchers). Smoke test: unauthenticated GET
  #   /api/v1/contracts/export.xlsx → 401 (auth fires first), NOT 400.
  # --------------------------------------------------------------------------

  /contracts/export.xlsx:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: contractExportXlsx
      summary: Export filtered contract list to XLSX
      description: |
        List-level XLSX export. Accepts the same filter set as
        `GET /contracts` (M1a `fn_contract_list`) plus an optional `maxRows`
        clamp (default 10000, hard-clamped 1..50000). Backend exceljs
        WorkbookWriter streams the workbook so memory stays bounded. Per G6:
        heavy bundles (xlsx 0.18.5) moved off the FE.

        - body_en / body_ar are EXCLUDED from the worksheet (AC-S5-02).
        - Role-aware visibility mirrors `fn_contract_list` (AC-S5-04).
        - When the result set exceeds `maxRows`, the workbook gets a
          translated "Result truncated…" footer row AND the response carries
          `X-Export-Truncated: true` (AC-S5-05).
        - Empty result → header row only, NOT an error (AC-S5-07).
        - Emits ONE `audit_log` row via SECURITY DEFINER `fn_audit_log_record`
          AFTER the workbook stream completes (AC-S5-08); discriminated by
          `new_values.event = 'EXPORT'`. NO `contract_activity` rows (per Q4).
        - Rate-limited via `exportRateLimiter` (30 req/min/user — AC-S5-10).

        DB function: `fn_contract_export_xlsx`. Audit helper:
        `fn_audit_log_record` (SECURITY DEFINER, EXECUTE GRANT to
        `neondb_owner` only).
      x-rateLimit: exportRateLimiter (30 / min / authenticated user)
      x-routeOrdering: |
        LITERAL path — declared BEFORE /contracts/{id} matchers in
        src/routes/v1/contracts.routes.ts (W1 enforcement).
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own only — via CMW-2 grant migration 010)
        - executive (read-all scope)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own AND contract.export
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contractType
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: draftedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approvedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: tags
          in: query
          description: AND-semantics tag filter. Repeated query param or comma-list.
          schema:
            type: array
            items: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: maxRows
          in: query
          description: Hard-clamped 1..50000. Default 10000. AC-S5-05/06.
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
      responses:
        "200":
          description: Workbook binary (XLSX).
          headers:
            Content-Disposition:
              description: Attachment filename `contracts-YYYYMMDD-HHmm.xlsx`.
              schema: { type: string }
            X-Export-Truncated:
              description: Present and `true` only when truncated=true (AC-S5-05).
              schema: { type: string, enum: ["true"] }
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          description: VALIDATION_ERROR — `maxRows` out of range (AC-S5-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /contracts/{id}/payment-schedules:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: paymentScheduleList
      summary: List the active payment milestone schedule for a contract
      description: |
        Returns the active milestones for a contract, ordered by `due_date ASC
        NULLS LAST` then `id ASC`. NOT paginated (typical 1–30 rows per
        contract). Empty `data` array — not 404 — when the contract exists but
        has no milestones (AC-S2-04). 404 (NOT 403) when the actor cannot see
        the parent contract per RLS (AC-S2-03 layered defense).

        DB function: `fn_payment_schedule_list` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - executive
        - contract_recipient (own)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentScheduleStatus" }
      responses:
        "200":
          description: Active payment schedule rows.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PaymentScheduleListResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: paymentScheduleReplace
      summary: Atomic bulk-replace of a contract's milestone schedule
      description: |
        Soft-deletes existing active rows for the contract then inserts the new
        set in a single transaction. Used by both the standalone Payment
        Schedule Editor modal AND the Compose Wizard submit flow (Q2 — FE-only
        orchestration: POST /contracts → PUT /:id/payment-schedules; NO new BE
        wrapper endpoint).

        - Controller hardcodes `p_replace_existing=true` (AC-S3-01) regardless
          of any client-supplied `replaceExisting`.
        - Concurrency: `fn_payment_schedule_create_bulk` takes
          `SELECT FOR UPDATE` on the parent contract row before any read/write
          of `payment_schedule` (Codex BE-001 pattern, AC-S3-11). Concurrent
          calls against the same contract id are serialised.
        - Emits ONE `contract_activity` row of type
          `payment_schedule_replaced` (AC-S3-10) with metadata
          `{insertedCount, softDeletedCount}`.
        - Permission: `contract.edit` OR (`contract.draft` AND own draft
          contract with status IN draft|resubmission_requested).

        DB function: `fn_payment_schedule_create_bulk`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own draft only)
      x-permissionRequired: contract.edit OR (contract.draft AND own draft)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentScheduleBulkReplaceDto" }
      responses:
        "200":
          description: Replace succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PaymentScheduleBulkReplaceResponse" }
                  requestId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/export.pdf:
    get:
      tags: [M1b — Compose Wizard, Payment Schedules & Exports]
      operationId: contractExportPdf
      summary: Export a single contract to PDF (en / ar / bilingual)
      description: |
        Single-contract PDF export. Backend Puppeteer (headless Chromium)
        renders an HTML template (i18n + Tailwind-derived CSS, `dir='rtl'` for
        Arabic) and pipes back `application/pdf` binary. Per G6: heavy bundles
        (jspdf) moved off the FE.

        - Languages: `en | ar | bilingual` (default `bilingual`) — AC-S4-05.
        - PDF includes contract head + parties placeholder + body in requested
          language(s) + tags + payment-schedule table (AC-S4-02).
        - body_en / body_ar are pino-redacted in BE logs (paths
          `*.bodyEn`, `*.body_en`, `*.bodyAr`, `*.body_ar`) — AC-S4-08.
        - Emits ONE `contract_activity` row of type `exported` (AC-S4-06) with
          metadata `{format:'pdf', language, includeAttachments}`. POST migration
          015, this row is emitted by the controller (AFTER render, BEFORE
          response) — NOT by the fn_ — so render-throw paths never write the
          row (Codex BE-M1b-004).
        - Rate-limited via `exportRateLimiter` (30 req/min/user — AC-S4-09).
        - `includeAttachments` is accepted but no-op (AC-S4-10) until the
          Attachments module ships.

        Renderer pipeline:
          1. fn_contract_export_pdf returns ContractExportPdfResponse JSONB
             (data prep — STABLE post-015, no side effects).
          2. BE controller renders HTML template; Puppeteer launches/uses the
             singleton Chromium (Codex BE-M1b-003 pool — `withPage()` /
             `p-limit(PUPPETEER_MAX_CONCURRENT)` semaphore).
          3. Buffer is streamed back; controller emits `contract_activity`
             AFTER successful render, BEFORE `res.send`.

        DB function: `fn_contract_export_pdf` (SECURITY INVOKER STABLE
        post-015).
      x-rateLimit: exportRateLimiter (30 / min / authenticated user)
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own only — via CMW-2 grant)
        - executive (read-all scope)
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own AND contract.export
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: language
          in: query
          schema:
            type: string
            enum: [en, ar, bilingual]
            default: bilingual
        - name: includeAttachments
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: PDF binary.
          headers:
            Content-Disposition:
              description: Attachment filename `<contractNumber>-<language>.pdf`.
              schema: { type: string }
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: VALIDATION_ERROR — invalid `language` (AC-S4-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ============================================================
  # M1c — Bulk & Manual Import (4 import-batch endpoints + 1 AI stub)
  #
  # Route ordering in src/routes/v1/import-batches.routes.ts:
  #   1. POST   /import-batches             (S1)
  #   2. GET    /import-batches             (S3 — list, no :id)
  #   3. GET    /import-batches/:id         (S4)
  #   4. PATCH  /import-batches/:id         (S2)
  # No literal-before-:id collision (no /import-batches/<keyword>) so the
  # M1b W1 ordering rule is informational here.
  #
  # AI namespace (NEW in M1c): src/routes/v1/ai.routes.ts
  #   1. POST   /ai/extract-contract-bulk   (S8 — controller-only stub)
  # Inherits these conventions for M4: JWT required; permission-gated at the
  # controller; authedWriteRateLimiter; pino-redact ai_prompt_payload; FROZEN
  # request + response DTOs (HQ2).
  # ============================================================

  /import-batches:
    post:
      tags: [M1c — Imports]
      operationId: importBatchCreate
      summary: Create a new bulk-import batch (S1)
      description: |
        Initiate a new bulk-import batch. Sets totalFiles up-front; counters
        start at 0; status='in_progress'; initiated_by = current user. Returns
        the full ImportBatch shape via fn_import_batch_get_by_id (initiatedBy
        hydrated as UserRef).

        - AC-S1-04: caller MUST hold `import.run` (BE authorise() gate +
          fn_ defense-in-depth + RLS WITH CHECK on import_batch_insert_runner).
        - AC-S1-05: initiated_by = current_setting('app.current_user_id'),
          NOT a body field — RLS WITH CHECK forbids impersonation.
        - AC-S1-02: totalFiles >= 1 — Zod first, fn_ second.
        - AC-S1-03: config.statusMode in {active|draft|auto} when present.

        DB function: `fn_import_batch_create` (SECURITY INVOKER,
        SET search_path = public, pg_temp).
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, contract_drafter]
      x-requiredPermissions: [import.run]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportBatchDto" }
            example:
              totalFiles: 50
              config:
                contractType: service
                statusMode: active
                defaultCounterpartyId: 12
      responses:
        "201":
          description: Batch created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400":
          description: |
            VALIDATION_ERROR — totalFiles < 1 (field='totalFiles'),
            invalid statusMode (field='config.statusMode'), or invalid
            contractType (field='config.contractType').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks `import.run` permission (AC-S1-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [M1c — Imports]
      operationId: importBatchList
      summary: List import batches (paginated, role-aware) (S3)
      description: |
        Paginated, role-aware list of import batches. Ordered by
        `started_at DESC, id DESC` tiebreaker (AC-S3-01). totalPages = 0 when
        total = 0 (M1a 007 patch precedent — AC-S3-02). Soft-deleted
        (is_active=false) batches universally excluded (AC-S3-08).

        Role narrowing (AC-S3-07):
          - platform_admin / legal_counsel / Super Admin / executive
              → see ALL active batches (v_role_can_see_all gate inside
                fn_import_batch_list + import_batch_select_role_aware RLS policy).
          - contract_drafter → sees ONLY own batches (initiated_by = current_user).

        Permission gate is upstream (controller checks anyOf(import.review,
        import.run)); fn_ enforces row visibility. Defense in depth — Codex
        G2 lesson + M1a precedent.

        DB function: `fn_import_batch_list` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own batches only)
      x-requiredPermissions: anyOf(import.review, import.run)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: AC-S3-05 — clamped 1..100.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ImportBatchStatus" }
          description: AC-S3-03 optional status filter.
        - name: initiatedBy
          in: query
          schema: { type: integer, minimum: 1 }
          description: AC-S3-03 optional initiator filter (raw bigint user id).
      responses:
        "200":
          description: Paginated batch list.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks both `import.review` AND `import.run` (AC-S3-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /import-batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        description: import_batch.id (positive bigint).
    get:
      tags: [M1c — Imports]
      operationId: importBatchGetById
      summary: Get a single import batch with hydrated initiator (S4)
      description: |
        Returns the full ImportBatch shape with initiatedBy hydrated as
        UserRef via M0 fn_user_get_by_id (AC-S4-04). Per-batch contract
        drill-down is served by `GET /api/v1/contracts?importBatchId={id}`
        (AC-S4-05) — see the M1a contracts list endpoint with M1c-extended
        params.

        Returns 404 (NOT 403) when the batch does not exist OR is_active=false
        OR not visible to the caller via RLS (Design Note D7 — matches
        M1a fn_contract_get_by_id pattern; avoids leaking existence to
        unauthorised callers).

        DB function: `fn_import_batch_get_by_id` (SECURITY INVOKER STABLE).
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - legal_counsel
        - contract_drafter (own batch only)
      x-requiredPermissions: anyOf(import.review, import.run)
      responses:
        "200":
          description: Batch found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            Batch not found, soft-deleted, or not visible to caller (AC-S4-02 +
            AC-S4-03). 404 is intentional — RLS-narrowed not-authorised surfaces
            as 404 (Design Note D7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    patch:
      tags: [M1c — Imports]
      operationId: importBatchUpdate
      summary: Update batch counters and/or transition lifecycle status (S2)
      description: |
        Apply counter deltas (signed integers) and/or transition lifecycle
        status. SELECT FOR UPDATE on the batch row inside fn_import_batch_update
        serialises concurrent counter writes (Codex BE-001 — Design Note D8).
        Returns the full updated ImportBatch shape via fn_import_batch_get_by_id.

        - AC-S2-01: counters incremented atomically.
        - AC-S2-02: allowed transitions:
            in_progress → paused | completed | cancelled
            paused      → in_progress | completed | cancelled
            completed   → (terminal)
            cancelled   → (terminal)
          Other transitions raise 'status:Invalid status transition' → 409.
        - AC-S2-03: when transitioning to completed/cancelled, completed_at =
          CURRENT_TIMESTAMP set in same transaction (also enforced by
          chk_import_batch_completed_at_status — Design Note D2).
        - AC-S2-04: per-counter underflow guard → 400 with the failing field name.
        - AC-S2-05: 5-counter sum overflow vs totalFiles → 400 (also enforced
          declaratively by chk_import_batch_counter_sum — Design Note D3).
        - AC-S2-07: caller must be initiator OR have import.run; defense in depth.
        - AC-S2-08: 'reopen' from terminal states is rejected → 409.

        Direct flips of `is_active` or `initiated_by` are blocked by the
        BEFORE UPDATE trigger `trg_import_batch_immutable_fields` (Codex C1
        fix, migration 021) — SQLSTATE 42501 → BE 403.

        DB function: `fn_import_batch_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - Super Admin
        - platform_admin
        - contract_drafter (initiator-self only)
        - legal_counsel (only when also initiator)
      x-requiredPermissions: anyOf(import.run, import.review) + initiator-self enforcement in fn_
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImportBatchDto" }
            example:
              autoSavedDelta: 1
              reviewQueueDelta: 0
      responses:
        "200":
          description: Updated batch shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400":
          description: |
            VALIDATION_ERROR — counter underflow (field one of autoSaved,
            reviewQueue, manualEntry, duplicatesSkipped, errored) or counter
            overflow (field='counters').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            FORBIDDEN — caller is neither admin nor initiator AND lacks
            import.run (AC-S2-07). Also: any direct UPDATE that flips
            is_active or initiated_by raises SQLSTATE 42501 (trigger).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Batch not found or is_active=false (AC-S2-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — invalid status transition (AC-S2-02 / AC-S2-08).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ai/extract-contract-bulk:
    post:
      tags: [M1c — AI]
      operationId: aiExtractContractBulk
      summary: AI extraction stub for bulk-import flow (S8 — controller-only)
      description: |
        Controller-only AI extraction STUB. NO fn_, NO DB persistence. Returns
        a deterministic mock derived from extractedText.length so routing-by-
        confidence tests are repeatable.

        Architecture (HQ1 + HQ2 ratified):
          - File extraction (mammoth/pdfjs) runs IN THE BROWSER per AC-S5-02.
            The backend receives only the extracted text + filename + size.
          - The Supabase 'contracts' bucket upload is FE-direct (best-effort,
            non-blocking) — no BE storage abstraction. Filename is captured on
            contract.import_filename for forensics.

        DTO contract is FROZEN (AC-S8-07): M4 will replace this controller body
        with a real AI provider call WITHOUT changing route, auth, request DTO,
        or response DTO.

        - AC-S8-02: caller MUST hold `import.run`.
        - AC-S8-03: extractedText min 50 chars.
        - AC-S8-04: confidence formula —
          `round(min(95, max(20, extractedText.length / 100)))`
          implemented in src/services/ai/extract-contract-bulk.service.ts.
        - AC-S8-05: rate-limited via authedWriteRateLimiter (429 on excess).
        - AC-S8-06: extractedText is `ai_prompt_payload` per
          project.config.json sensitiveFields. Pino-redacted across 7 paths
          (Codex M1 fix). Controller additionally avoids logging req.body —
          only filename / fileSize / batchId / textLength as derived metadata.

        DB function: NONE — this endpoint never touches the database.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, contract_drafter]
      x-requiredPermissions: [import.run]
      x-frozenDto: true
      x-replaceableBy: M4 (real AI provider call — controller body only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractContractBulkRequest" }
            example:
              filename: "service-agreement-acme-2026.pdf"
              fileSize: 184320
              extractedText: "<extracted text — pino-redacted on log; min 50 chars>"
              batchId: 42
      responses:
        "200":
          description: Deterministic mock extraction response.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractContractBulkResponse" }
        "400":
          description: |
            VALIDATION_ERROR — filename empty, fileSize < 0, extractedText
            < 50 chars (AC-S8-03), or batchId not a positive integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN — caller lacks `import.run` (AC-S8-02).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: RATE_LIMITED — authedWriteRateLimiter exceeded (AC-S8-05).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

# Note: /api/health lives at the root, NOT under /api/v1. Documented as an
# absolute path here so generators emit it correctly.
x-paths-root:
  /api/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness / readiness probe
      description: |
        Returns 200 with `{status, db, uptime, version, timestamp, requestId}` when the
        database is reachable. Suitable for k8s liveness AND readiness probes.
        Returns 503 if the DB is unreachable.

        NB: this endpoint lives at `/api/health` (no `/v1` prefix) per M0 spec.
      x-rateLimit: unlimited (no auth)
      security: []
      responses:
        "200":
          description: Service healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example:
                status: ok
                db: reachable
                uptime: 1234.56
                version: 0.1.0
                timestamp: 2026-05-02T12:34:56.000Z
                requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
        "503":
          description: UNHEALTHY - database or critical dependency unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # =====================================================================
  # M2 — Approval Workflows
  # =====================================================================

  /approvals/my-pending:
    get:
      tags: [M2 — Approvals]
      operationId: approvalListMyPending
      summary: List pending approval steps assigned to the calling user
      description: |
        Paginated list of pending approval steps assigned to the calling user
        via 4 OR-arms: (a) `approver_user_id = current_user`, (b)
        `approver_role IN current_user_roles AND approver_user_id IS NULL`,
        (c) `delegated_to = current_user`, (d) `reassigned_to = current_user`.
        RLS narrows naturally via approval_step → approval_chain → contract.
        DB function: `fn_approval_my_pending`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_approver, contract_approver_2, contract_drafter, executive]
      x-acsCovered: [AC-S1-01, AC-S1-02, AC-S1-03, AC-S1-04, AC-S1-05, AC-S1-06]
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalPendingSort" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
