            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /internal-signals/{id}/resolve:
    post:
      tags: [M8 — Internal Signals]
      operationId: internalSignalResolve
      summary: Mark an internal signal resolved (idempotent)
      description: |
        Mark an internal signal resolved. Updates `osint_signal.metadata`
        JSONB with `{ resolvedAt, resolvedBy, resolutionKind, resolutionNote }`,
        then emits `pg_notify('internal_signal_resolved')` for downstream
        re-evaluation by the future CR-E rule engine.
        **Idempotent** — re-resolve of an already-resolved signal returns
        the existing `{ signalId, resolvedAt, resolvedBy }` values
        unchanged AND skips the pg_notify emission (AC-S5-03; the fn
        detects this via `metadata->>'resolvedAt' IS NOT NULL`).
        Permission gate: `internal_signal.resolve` AND a per-signal_type
        role allowlist (Q-DA3 hardcoded mapping in fn body):
          - milestone_slippage / sla_breach → `operations`
          - payment_delay / invoice_dispute → `finance_treasury`
          - vendor_incident / ics_incident → `operations` OR `procurement`
          - icv_status_change → `compliance_esg` OR `procurement`
          - certificate_expiry → `compliance_esg` OR `legal_counsel`
        Super Admin + platform_admin always allowed across all 8 subtypes.
        The 4 deferred CR-G persona roles (`operations`, `finance_treasury`,
        `procurement`, `compliance_esg`) are referenced in the CASE but
        absent from the role table in v1 — the EXISTS subquery returns
        FALSE for any caller carrying those role names today (admin-only
        resolution in v1).
        Writes via the M7 `osint_signal_deny_direct_update` RESTRICTIVE
        policy permission-gated USING extension. Defence-in-depth: the
        DEFINER bypass route (used by M7 `fn_osint_signal_upsert`) still
        works; this INVOKER fn write path lands cleanly without DEFINER
        privilege.
        Production worker connections that LISTEN on
        `internal_signal_resolved` MUST use the Neon **direct** endpoint
        (M7 F-3 — `-pooler` PgBouncer transaction pooling drops session
        LISTEN).
      x-authorisedRoles: [Super Admin, platform_admin]
      x-deferredAuthorisedRoles: [operations, finance_treasury, procurement, compliance_esg, legal_counsel]
      x-requiredPermissions: [internal_signal.resolve]
      x-authMode: jwt
      x-storyId: S5
      x-rateLimit: authedWriteRateLimiter
      x-pgNotify:
        channel: internal_signal_resolved
        payloadShape: InternalSignalResolvedNotification
        emittedOn: first-resolve only (NOT on idempotent re-resolve)
        consumer: CR-E rule engine (future) — LISTENs for downstream re-evaluation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: "`osint_signal.id` of the signal to resolve."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalSignalResolvePayload" }
      responses:
        "200":
          description: |
            OK. Idempotent re-resolve returns the existing values unchanged
            and skips the pg_notify emission.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/InternalSignalResolveResponse" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — signal exists but `kind != 'internal'`
            ('Signal is not an internal signal') OR `resolutionKind` not
            in 4-value enum ('Invalid resolution kind').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            PERMISSION_DENIED — caller lacks `internal_signal.resolve`
            permission OR caller's role is not in the per-signal_type
            allowlist (message 'Permission denied for signal_type=<type>').
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            NOT_FOUND — signal id not found for current tenant. ERRCODE
            P0002 'Signal not found' routed via translatePgError default
            P0002 → 404 path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ============================================================
  # M9 — Counterparty Graph (CR-B)
  #   /parties/:id/relationships             GET, POST
  #   /parties/:id/relationships/:relId      PATCH, DELETE
  #   /parties/:id/chain                     GET (direction=up|down|both)
  #   /parties/:id/chain-summary             GET
  #   /parties/:id                           PATCH (M9 — write path)
  #   /admin/parties/sanctions-match         POST
  #
  # M9 also widens the existing M_parity endpoints (URL signatures and Zod
  # schemas unchanged; only the response projection grows additively):
  #   GET /api/v1/parties/:id   → response gains 11 PartyDetail fields
  #   GET /api/v1/parties       → each list item gains 6 badge fields
  # ============================================================

  /parties/{id}/relationships:
    get:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyRelationshipList
      summary: List direct edges of a party (incoming + outgoing)
      description: |
        List direct edges (incoming + outgoing) of the anchor party
        (db-design.md §6.2). Each edge embeds the joined other-party
        `{ partyId, nameEn, nameAr, sanctionsStatus }` so FE renders
        the panel without a follow-up GET /parties/:id roundtrip
        (AC-S4-02). Tenant-scoped via the
        `party_relationship_tenant_select` RLS policy on
        `current_setting('app.current_tenant_id')::uuid`. Bounded result
        (<50 edges typical) — bare-array (no pagination).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_approver, executive]
      x-deferredAuthorisedRoles: [compliance_esg]
      x-requiredPermissions: [party.graph.read]
      x-authMode: jwt
      x-storyId: S4
      x-rateLimit: authedReadRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
          description: "`party.id` of the anchor party."
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/ListRelationshipsResponse" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.read` (42501)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: "Anchor party not found (P0002 — AC-S4-03)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    post:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyRelationshipCreate
      summary: Add a directed-typed edge under the current tenant
      description: |
        Add a directed-typed edge (db-design.md §6.1). URL `:id` supplies
        `parentId`; body supplies `childId`. AddRelationshipDialog UX.
        Idempotency: ON CONFLICT
        `(tenant_id, parent_id, child_id, relationship_type)` DO NOTHING —
        duplicate returns 409 with `relationship_already_exists`
        (23505 — AC-S1-05). Self-loop (`childId === pathId`) raises
        22023 `self_loop_not_allowed` (AC-S1-06; defence-in-depth in Zod
        cross-field refine() AND in fn body).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [party.graph.manage]
      x-authMode: jwt
      x-storyId: S1
      x-rateLimit: authedWriteRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
          description: "Parent `party.id` (the URL `:id` is always the parent)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRelationshipPayload" }
      responses:
        "201":
          description: Created
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PartyRelationship" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — missing field / invalid relationshipType /
            self-loop / invalid ownershipPct / effectiveTo < effectiveFrom
            (22023 — AC-S1-03 / AC-S1-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.manage` (42501 — AC-S1-02)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            NOT_FOUND — `parentId` or `childId` not found / inactive
            (P0002 — AC-S1-04). Error body includes
            `field: 'parentId' | 'childId'`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            CONFLICT — `relationship_already_exists`. ON CONFLICT
            `(tenant_id, parent_id, child_id, relationship_type)` DO NOTHING
            mapped to 23505 → 409 (AC-S1-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /parties/{id}/relationships/{relId}:
    patch:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyRelationshipUpdate
      summary: Partial update of an edge
      description: |
        Partial update of an edge (db-design.md §6.3). `parentId` +
        `childId` are immutable post-create — body fields with those
        names are silently dropped (AC-S2-04). Tenant-scoped via RLS —
        cross-tenant `relId` returns 404 (AC-S2-05). RESTRICTIVE
        `party_relationship_deny_direct_delete` policy doesn't apply
        here (PATCH path); only DELETE is blocked.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [party.graph.manage]
      x-authMode: jwt
      x-storyId: S2
      x-rateLimit: authedWriteRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
          description: "Parent `party.id` (validated against the relationship's parent_id at controller layer)."
        - in: path
          name: relId
          required: true
          schema: { type: integer, minimum: 1 }
          description: "`party_relationship.id`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRelationshipPayload" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PartyRelationship" }
                  requestId: { type: string, format: uuid }
        "400":
          description: |
            VALIDATION_ERROR — invalid relationshipType / out-of-range
            ownershipPct or confidence / effectiveTo < effectiveFrom
            (22023).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.manage` (42501 — AC-S2-02)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            NOT_FOUND — `relId` not found OR `is_active=FALSE` OR
            cross-tenant (P0002 — AC-S2-03 / AC-S2-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyRelationshipDelete
      summary: Soft-delete an edge (idempotent)
      description: |
        Soft-delete (`is_active=FALSE`; preserves audit_log row).
        Idempotent — re-deleting an already-soft-deleted edge returns
        200 with the original `deletedAt` + `idempotent=true` (AC-S3-02).
        RESTRICTIVE `party_relationship_deny_direct_delete` policy
        prevents hard DELETE — only this fn path allowed.
        FE precondition: T9 destructive-confirmation modal
        (`DeleteRelationshipConfirm`) gates this call (AC-S3-05; UI
        deferred per DEFER-M9-FE-2 — service method wired).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel]
      x-requiredPermissions: [party.graph.manage]
      x-authMode: jwt
      x-storyId: S3
      x-rateLimit: authedWriteRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: relId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK (or idempotent re-delete)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/DeleteRelationshipResponse" }
                  requestId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.manage` (42501 — AC-S3-03)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: "relationship_not_found (P0002 — AC-S3-04)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /parties/{id}/chain:
    get:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyChainTraverse
      summary: Walk ancestors / descendants / both via recursive CTE
      description: |
        Walk the chain of ancestors (`direction=up`), descendants
        (`direction=down`), or both (`direction=both`, default).
        `maxDepth` bounded 1..10 (AC-S5-04 / AC-S6-03). Recursive CTE
        UNIONs the `party_relationship` edge table with the `party.parent_id`
        / `ubo_id` self-FK shortcuts; SOURCE A is tenant-scoped via RLS,
        SOURCE B is single-tenant in v1 per Q-DA7=7a (documented assumption).
        **Silent cap with `chainTruncated=true` + `depthReached`** on
        depth-limit hit (Q-DA3=3a lock); cycles are handled via path
        uniqueness (no RAISE NOTICE / EXCEPTION). Each node embeds
        `nameEn` / `nameAr` / `sanctionsStatus` for FE rendering without
        follow-up roundtrips (AC-S5-06).
        **Performance NFR:** depth=5 / ~100 parties / ~300 edges < 100ms
        (AC-S5-05 / AC-S6-04).
        **Response shape is a discriminated union on `direction`** —
        `up` returns `{ rootPartyId, ancestors[], chainTruncated, depthReached }`;
        `down` returns `{ rootPartyId, descendants[], ... }`; `both` (default)
        returns both arrays in a single envelope; BE merges via Promise.all
        of `_up` + `_down` fns and OR-merges `chainTruncated` /
        MAX-merges `depthReached`.
        **Convergent-paths dedup (DEFECT-2 / migration 122):** the
        recursive CTEs in `fn_party_chain_traverse_up` + `_down` previously
        emitted duplicate `(party_id, depth, via)` tuples when a node was
        reachable through both an edge AND a self-FK shortcut at the same
        depth. Migration 122 added `DISTINCT ON (party_id, depth, via)`
        representative-row dedup CTEs; FE keys are now stable.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_approver, executive]
      x-deferredAuthorisedRoles: [compliance_esg]
      x-requiredPermissions: [party.graph.read]
      x-authMode: jwt
      x-storyId: S5
      x-alsoServes: [S6, S10]
      x-rateLimit: authedReadRateLimiter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: direction
          required: false
          schema:
            $ref: "#/components/schemas/ChainDirection"
          description: "Default `both`."
        - in: query
          name: maxDepth
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
          description: "Out-of-range returns 400 with `field='maxDepth'`, `message='max_depth_out_of_range'`."
      responses:
        "200":
          description: |
            OK. Response shape varies by `direction` query param —
            see the `PartyChainTraverseResponse` discriminated union.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PartyChainTraverseResponse" }
                  requestId: { type: string, format: uuid }
        "400":
          description: "VALIDATION_ERROR — direction not in enum / maxDepth out of 1..10 (22023)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "Caller lacks `party.graph.read` (42501)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: "Anchor party not found (P0002)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /parties/{id}/chain-summary:
    get:
      tags: [M9 — Counterparty Graph (Parties)]
      operationId: partyChainSummary
      summary: Single-roundtrip pre-pivoted chain summary
      description: |
        Single-roundtrip flattened chain summary (db-design.md §6.4).
        Combines `fn_party_chain_traverse_up` + `_down` +
        `fn_party_relationship_list` internally. **Pre-pivots
        ancestors/descendants by depth** (AC-S8-02 — string-keyed map
        `{ "1": [...], "2": [...] }`); **emits all 6 relationshipType
        counts even when 0** (AC-S8-03 invariant); **single
        `chainTruncated` flag covering both directions** (AC-S8-04 — OR
        of up.chainTruncated and down.chainTruncated). Drives the FE
        `OwnershipChainTab` tree-layout component without further
        client-side grouping. Inherits the M9 migration 122 dedup CTEs
        from the underlying `fn_party_chain_traverse_*` fns (DEFECT-2).
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_approver, executive]
      x-deferredAuthorisedRoles: [compliance_esg]
