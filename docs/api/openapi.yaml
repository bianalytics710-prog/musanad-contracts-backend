    AiVersionDiffSummaryResponse:
      type: object
      required: [summary, persisted, cacheHit]
      properties:
        summary:
          type: string
          description: 1-line headline + max 5 bullets prefixed with `•` (controller post-processes).
        persisted: { $ref: "#/components/schemas/ContractVersionDiffSummaryPersistData" }
        cacheHit: { type: boolean }

    # ------------------------------------------------------------
    # M5 — Regulatory Radar
    # ------------------------------------------------------------
    RegulationType:
      type: string
      description: regulation.regulation_type CHECK enum — closed canonical set.
      enum:
        - federal_decree_law
        - cabinet_resolution
        - ministerial_decision
        - free_zone_regulation
        - circular
        - guideline

    RegulationJurisdiction:
      type: string
      description: regulation.jurisdiction + regulator.jurisdiction CHECK enum.
      enum:
        - uae_federal
        - dubai
        - abu_dhabi
        - sharjah
        - difc
        - adgm
        - dmcc
        - other
      nullable: true

    RegulationStatus:
      type: string
      description: regulation.status CHECK enum.
      enum: [active, superseded, repealed, draft]

    RegulatorySeverity:
      type: string
      description: regulatory_update.severity CHECK enum.
      enum: [low, medium, high, critical]

    RegulatoryImpactResolutionAction:
      type: string
      description: regulatory_impact.resolution_action CHECK enum.
      enum: [amended, waived, out_of_scope, pending]

    RegulatoryImpactStatus:
      type: string
      description: |
        Computed status alias for FE consumers — derived from
        `regulatory_impact.resolved` boolean + `resolution_action`. Not a DB
        column; provided as UI convenience.
      enum: [pending, resolved]

    M5ActivityType:
      type: string
      description: |
        M5 widened activity-type union (25 values). Extends M4's 23-value
        union with two new literals that fn_contract_activity_create's IF NOT IN
        whitelist accepts post-migration 047 (atomic with the
        contract_activity.activity_type CHECK enum extension). M5 emits
        `regulatory_impact_detected` per successfully-inserted impact in
        fn_regulatory_impact_create_bulk (Q9 EMIT) and `regulatory_impact_resolved`
        on terminal resolve in fn_regulatory_impact_resolve (only when
        v_resolved=TRUE; resolution_action='pending' un-resolves and emits
        nothing). M5 introduces 2 net-new values; cumulative chain
        M1a 7 → M1b 9 → M2 14 → M3 20 → M4 23 → M5 25.
      enum:
        - created
        - updated
        - status_changed
        - version_created
        - tagged
        - soft_deleted
        - restored
        - payment_schedule_replaced
        - exported
        - import_batch_created
        - import_batch_committed
        - import_batch_cancelled
        - approval_submitted
        - approval_decided
        - approval_delegated
        - approval_reassigned
        - approval_escalated
        - signature_sent
        - signature_signed
        - signature_declined
        - ai_summary_generated
        - ai_risk_score_updated
        - ai_diff_summary_generated
        - regulatory_impact_detected
        - regulatory_impact_resolved

    RegulatorRef:
      type: object
      description: |
        Lighter shape embedded inside regulation.issuer and
        regulatory_update.regulator JSONB. Returned by list/detail fn_'s; no
        own list endpoint in M5.
      required: [id, code, nameEn]
      properties:
        id: { type: integer }
        code: { type: string, example: MoHRE }
        nameEn: { type: string }
        nameAr: { type: string, nullable: true }

    Regulator:
      type: object
      description: |
        M5 shared lookup table for UAE regulators. 9 rows seeded in migration
        048 (MoHRE, FTA, Central Bank, DIFC, ADGM, TDRA, MoJ, MoE, Other).
        No CRUD endpoints in M5; admin extends via DDL/migration.
      required: [id, code, nameEn, displayOrder, isActive]
      properties:
        id: { type: integer }
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string, nullable: true }
        jurisdiction: { $ref: "#/components/schemas/RegulationJurisdiction" }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        displayOrder: { type: integer }
        isActive: { type: boolean }

    ImpactCategoryRef:
      type: object
      description: Lighter shape embedded inside regulatory_update.category.
      required: [id, key, nameEn, nameAr, icon, colour]
      properties:
        id: { type: integer }
        key: { type: string, example: data_protection }
        nameEn: { type: string }
        nameAr: { type: string }
        icon: { type: string, example: shield }
        colour: { type: string, example: amber }

    ImpactCategory:
      type: object
      description: |
        M5 configurable categorisation taxonomy for regulatory impact. PK is
        `id BIGSERIAL` (Q5 — id retained explicitly to keep audit trigger
        compatible; avoids the DB-IMPL-I-1 code-PK pattern that bit M3
        signature_party_side / signature_method and M4 ai_prompt). `key` is
        the stable snake_case join key for AI prompt context. `active` is
        FE-picker visibility (separate from `isActive` soft-delete).
      required: [id, key, nameEn, nameAr, icon, colour, active, displayOrder, sources, severityScale, defaultClauseCategories]
      properties:
        id: { type: integer }
        key: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        icon: { type: string }
        colour: { type: string }
        active: { type: boolean }
        displayOrder: { type: integer }
        sources:
          type: array
          items: { type: string }
          description: JSONB array of source-name strings.
        severityScale:
          type: array
          items: { type: string }
          description: JSONB array of severity strings; default `["low","medium","high","critical"]`.
        aiPromptContext:
          type: string
          nullable: true
          description: Admin-authored AI guidance content. Not user PII.
        defaultClauseCategories:
          type: array
          items: { type: string }
          description: TEXT[] (Q4 — junction normalization deferred to M7+).

    ImpactCategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ImpactCategory" }

    UpsertImpactCategoryDto:
      type: object
      required: [key, nameEn, nameAr]
      properties:
        key: { type: string, minLength: 1, maxLength: 60 }
        nameEn: { type: string, minLength: 1, maxLength: 200 }
        nameAr: { type: string, minLength: 1, maxLength: 200, description: AC-S15-03 — required (bilingual taxonomy). }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        icon: { type: string }
        colour: { type: string }
        active: { type: boolean }
        displayOrder: { type: integer }
        sources:
          type: array
          items: { type: string }
        severityScale:
          type: array
          items: { type: string }
          description: AC-S15-04 — JSON array of strings.
        aiPromptContext: { type: string, nullable: true }
        defaultClauseCategories:
          type: array
          items: { type: string }

    ImpactCategoryUpsertResult:
      type: object
      required: [id, key, createdOrUpdated]
      properties:
        id: { type: integer }
        key: { type: string }
        createdOrUpdated:
          type: string
          enum: [created, updated]

    RegulationSupersededByItem:
      type: object
      description: Recursive chain entry returned by fn_regulation_get_by_id (max 5 hops; AC-S2-02).
      required: [id, referenceCode, titleEn, status, depth]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/RegulationStatus" }
        depth: { type: integer }

    RegulationListItem:
      type: object
      description: |
        Lighter list-row shape than Regulation (omits summaryEn/Ar, sourceUrl,
        tags, supersededBy chain). Mirrors the M1a Contract / ContractListItem
        split. supersededByCode is the snake_case ↔ camelCase mapping of
        `superseded_by_id` resolved through a subquery on regulation s WHERE
        s.id = r.superseded_by_id.
      required: [id, referenceCode, titleEn, issuer, regulationType, status, isActive]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        issuer: { $ref: "#/components/schemas/RegulatorRef" }
        regulationType: { $ref: "#/components/schemas/RegulationType" }
        jurisdiction: { $ref: "#/components/schemas/RegulationJurisdiction" }
        effectiveDate: { type: string, format: date, nullable: true }
        supersededByCode: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/RegulationStatus" }
        isActive: { type: boolean }

    Regulation:
      type: object
      description: |
        Full detail returned by fn_regulation_get_by_id including the recursive
        supersession chain (max 5 hops; empty array when terminal).
      required: [id, referenceCode, titleEn, issuer, regulationType, tags, status, isActive, supersededBy]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        issuer: { $ref: "#/components/schemas/RegulatorRef" }
        regulationType: { $ref: "#/components/schemas/RegulationType" }
        jurisdiction: { $ref: "#/components/schemas/RegulationJurisdiction" }
        effectiveDate: { type: string, format: date, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: TEXT[] (Q4 — junction normalization deferred to M7+).
        status: { $ref: "#/components/schemas/RegulationStatus" }
        isActive: { type: boolean }
        supersededBy:
          type: array
          items: { $ref: "#/components/schemas/RegulationSupersededByItem" }

    RegulationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RegulationListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateRegulationDto:
      type: object
      required: [referenceCode, titleEn, issuerId, regulationType]
      properties:
        referenceCode: { type: string, minLength: 1, maxLength: 80 }
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, nullable: true, maxLength: 500 }
        issuerId:
          type: integer
          description: FK → regulator.id (Q3 = (b) shared lookup).
        regulationType: { $ref: "#/components/schemas/RegulationType" }
        jurisdiction: { $ref: "#/components/schemas/RegulationJurisdiction" }
        effectiveDate: { type: string, format: date, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: Defaults to `[]` when omitted.
        status:
          $ref: "#/components/schemas/RegulationStatus"
          description: Defaults to `active` per AC-S3-06.

    UpdateRegulationDto:
      type: object
      description: |
        Partial patch (camelCase keys). `referenceCode` is immutable post-create
        (fn raises 23501; AC-S4-05). Setting `supersededById` auto-flips status
        to `superseded` (AC-S4-02). Self-supersede rejected (AC-S4-03).
      properties:
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/RegulationStatus" }
        supersededById: { type: integer, nullable: true }
        regulationType: { $ref: "#/components/schemas/RegulationType" }
        jurisdiction: { $ref: "#/components/schemas/RegulationJurisdiction" }
        effectiveDate: { type: string, format: date, nullable: true }
        issuerId: { type: integer }

    RegulationCreateResult:
      type: object
      required: [id, referenceCode, createdAt]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        createdAt: { type: string, format: date-time }

    RegulationUpdateResult:
      type: object
      required: [id, updatedAt]
      properties:
        id: { type: integer }
        updatedAt: { type: string, format: date-time }

    RegulationDeleteResult:
      type: object
      required: [id, isActive]
      properties:
        id: { type: integer }
        isActive:
          type: boolean
          enum: [false]

    RegulatoryImpactSummary:
      type: object
      description: |
        Aggregate returned by fn_regulatory_update_get_by_id impactSummary
        subquery (AC-S7-02). RLS-aware — non-admin sees narrowed counts;
        executive sees system-wide (AC-S7-05).
      required: [totalImpacts, resolvedCount, pendingCount]
      properties:
        totalImpacts: { type: integer }
        resolvedCount: { type: integer }
        pendingCount: { type: integer }
        avgImpactScore:
          type: number
          nullable: true
          description: AC-S7-04 — null when totalImpacts == 0 (avoids div-by-zero).

    RegulatoryUpdateListItem:
      type: object
      required: [id, regulator, titleEn, publishedDate, severity, affectedClauseCategories]
      properties:
        id: { type: integer }
        regulator: { $ref: "#/components/schemas/RegulatorRef" }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate: { type: string, format: date, nullable: true }
        complianceDeadline: { type: string, format: date, nullable: true }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
          description: TEXT[] (Q4).
        category:
          $ref: "#/components/schemas/ImpactCategoryRef"
          nullable: true
        subSource: { type: string, nullable: true }

    RegulatoryUpdate:
      allOf:
        - $ref: "#/components/schemas/RegulatoryUpdateListItem"
        - type: object
          required: [impactSummary]
          properties:
            impactSummary: { $ref: "#/components/schemas/RegulatoryImpactSummary" }

    RegulatoryUpdateListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryUpdateListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateRegulatoryUpdateDto:
      type: object
      required: [regulatorId, titleEn, publishedDate]
      properties:
        regulatorId: { type: integer }
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, nullable: true, maxLength: 500 }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate:
          type: string
          format: date
          nullable: true
          description: AC-S8-03 — when present must be >= publishedDate.
        complianceDeadline:
          type: string
          format: date
          nullable: true
          description: AC-S8-04 — when present must be >= publishedDate.
        severity:
          $ref: "#/components/schemas/RegulatorySeverity"
          description: Defaults to `medium` per AC-S8-07.
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
        categoryId: { type: integer, nullable: true }
        subSource: { type: string, nullable: true }

    UpdateRegulatoryUpdateDto:
      type: object
      description: |
        Partial patch (camelCase keys). AC-S9-02 floor guard — `publishedDate`
        cannot be moved below MIN(detected_at) of associated impacts.
      properties:
        regulatorId: { type: integer }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate: { type: string, format: date, nullable: true }
        complianceDeadline: { type: string, format: date, nullable: true }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
        categoryId: { type: integer, nullable: true }
        subSource: { type: string, nullable: true }

    RegulatoryUpdateCreateResult:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }

    RegulatoryUpdateUpdateResult:
      type: object
      required: [id, updatedAt]
      properties:
        id: { type: integer }
        updatedAt: { type: string, format: date-time }

    RegulatoryUpdateDeleteResult:
      type: object
      description: AC-S10-01 cascade-soft-delete count returned alongside id.
      required: [id, isActive, cascadedImpacts]
      properties:
        id: { type: integer }
        isActive:
          type: boolean
          enum: [false]
        cascadedImpacts:
          type: integer
          description: AC-S10-02 — count of regulatory_impact rows soft-deleted by the cascade.

    RegulatoryImpactContractRef:
      type: object
      required: [id, contractNumber, titleEn]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }

    RegulatoryImpactRegulationRef:
      type: object
      required: [id, referenceCode, titleEn]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        titleEn: { type: string }

    RegulatoryImpactRegulatoryUpdateRef:
      type: object
      required: [id, titleEn, severity]
      properties:
        id: { type: integer }
        titleEn: { type: string }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }

    RegulatoryImpact:
      type: object
      description: |
        Per-contract impact analysis row. `regulatoryUpdate` is null when this
        is a structural impact (regulation only; FE renders as "Structural"
        badge). UNIQUE INDEX uses
        `COALESCE(regulatory_update_id, 0::BIGINT)` to enforce idempotency
        across both NULL and NOT NULL paths via the BIGSERIAL=0 sentinel
        (M4 ai_insight precedent; PG NULLS-DISTINCT default workaround).
      required: [id, contract, regulation, detectedAt, resolved]
      properties:
        id: { type: integer }
        contract: { $ref: "#/components/schemas/RegulatoryImpactContractRef" }
        regulation: { $ref: "#/components/schemas/RegulatoryImpactRegulationRef" }
        regulatoryUpdate:
          $ref: "#/components/schemas/RegulatoryImpactRegulatoryUpdateRef"
          nullable: true
        impactScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        impactNoteEn:
          type: string
          nullable: true
          description: Q6 — short-form tag (radar tooltip).
        impactNoteAr: { type: string, nullable: true }
        impactSummaryEn:
          type: string
          nullable: true
          description: Q6 — long-form AI executive summary.
        impactSummaryAr: { type: string, nullable: true }
        detectedAt: { type: string, format: date-time }
        resolved: { type: boolean }
        resolutionAction:
          $ref: "#/components/schemas/RegulatoryImpactResolutionAction"
          nullable: true
        resolutionNote:
          type: string
          nullable: true
          description: Q8 — admin-bounded free text; stored verbatim (NOT redacted).

    RegulatoryImpactListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryImpact" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ImpactPayloadEntry:
      type: object
      description: |
        Per-contract payload entry. Wire shape is keyed by `contractId.toString()`.
        SENSITIVE — pino-redacted at controller (covered by `ai_prompt_payload`
        class per M4 precedent).
      properties:
        impactScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        noteEn: { type: string, nullable: true }
        noteAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }

    BulkDetectRegulatoryImpactDto:
      type: object
      required: [regulatoryUpdateId, regulationId, contractIds, impactPayload]
      properties:
        regulatoryUpdateId: { type: integer }
        regulationId: { type: integer }
        contractIds:
          type: array
          minItems: 1
          items: { type: integer }
          description: AC-S11-03 — must be non-empty.
        impactPayload:
          type: object
          description: SENSITIVE — pino-redacted. Keyed by contractId stringified.
          additionalProperties:
            $ref: "#/components/schemas/ImpactPayloadEntry"

    BulkDetectRegulatoryImpactResult:
      type: object
      required: [createdCount, skippedDuplicateCount, impactIds]
      properties:
        createdCount: { type: integer }
        skippedDuplicateCount:
          type: integer
          description: AC-S11-02 — idempotent re-run skip count.
        impactIds:
          type: array
          items: { type: integer }

    ResolveRegulatoryImpactDto:
      type: object
      required: [resolutionAction]
      properties:
        resolutionAction: { $ref: "#/components/schemas/RegulatoryImpactResolutionAction" }
        resolutionNote:
          type: string
          nullable: true
          description: Q8 — stored verbatim (admin-bounded; not redacted).

    RegulatoryImpactResolveResult:
      type: object
      required: [id, resolved, resolutionAction, updatedAt]
      properties:
        id: { type: integer }
        resolved:
          type: boolean
          description: AC-S13-02 — derived as `resolution_action <> 'pending'`.
        resolutionAction: { $ref: "#/components/schemas/RegulatoryImpactResolutionAction" }
        updatedAt: { type: string, format: date-time }

    # ----------------------------------------------------------------
    # M6 — Dashboards & Reporting (10 endpoints)
    # ----------------------------------------------------------------

    DashboardKey:
      type: string
      enum: [admin, drafter, approver, legal_counsel, recipient, executive]
      description: |
        Computed dashboard key returned by `fn_dashboard_router` (S6).
        Decision tree codified in `db-design.md` §3.6 step 4. Default
        fallback is `recipient` (least-privilege view).

    HealthStatusOverall:
      type: string
      enum: [ok, degraded, unhealthy]
      description: Composed from `db.status` + `ai.estimatedHealthy`.

    HealthDbStatus:
      type: string
      enum: [ok, degraded]
      description: Derived from `CURRENT_TIMESTAMP` + `pg_is_in_recovery()`.

    PlaceholderKpi:
      type: object
      description: |
        Placeholder envelope for dashboard slots whose underlying domain
        tables do not yet exist (per Lovable S29 ACs referencing `parties` /
        `obligations`). FE renders disabled tiles with "feature pending"
        tooltips. Used in `LegalCounselDashboardKpis.templateUsageThisWindow`
        and `RecipientDashboardKpis.myObligationsCount`.
      required: [value, placeholder]
      properties:
        value:
          type: integer
          enum: [0]
          description: Always 0 for placeholder slots.
        placeholder:
          type: boolean
          enum: [true]
          description: Distinguishes from a real zero-value count.

    TrendDayCount:
      type: object
      description: "Daily trend point — date (YYYY-MM-DD) + count integer."
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    ApprovalDecisionDayPoint:
      type: object
      description: |
        Daily approval decision point — separates approved vs rejected counts.
        Source uses present-tense `decision='approve'/'reject'` literals
        (S2-22-WARN-1-FIX — past-tense `'approved'/'rejected'` would never
        match the live CHECK enum).
      required: [date, approved, rejected]
      properties:
        date: { type: string, format: date }
        approved: { type: integer }
        rejected: { type: integer }

    TrendMonthCount:
      type: object
      description: "Monthly trend point — month (YYYY-MM) + count integer."
      required: [month, count]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        count: { type: integer }

    TrendMonthValueAed:
      type: object
      description: Monthly value point — used by `fn_dashboard_executive.trends.valueOverTimeByMonth`.
      required: [month, totalValueAed]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        totalValueAed: { type: number }

    DashboardContractRow:
      type: object
      description: |
        Lightweight contract projection used by dashboard list slots
        (`myDrafts5` / `awaitingMyAction5` / `myContracts5`). NEVER
        includes `contract_body` or any other sensitive fields. Distinct
        from M1a `Contract` — M1a's full shape is unchanged in M6.
      required: [id, contractNumber, titleEn, status]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        valueAed: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }

    DrafterAwaitingActionRow:
      type: object
      description: Drafter awaiting-action row — extends `DashboardContractRow` with `lastDecisionNote`.
      required: [id, contractNumber, titleEn, status]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        lastDecisionNote:
          type: string
          nullable: true
          description: Most recent reject / request_resubmission note. SENSITIVE — pino-redacted on logs (M2 precedent); included in API response for the drafter only.

    ApproverPendingQueueRow:
      type: object
      description: |
        Joined `approval_step + contract` row — projected by
        `fn_dashboard_approver.lists.pendingQueue5`.
        post-057 patch: join chain is `approval_step JOIN approval_chain
        ON ch.id = step.approval_chain_id JOIN contract ON c.id =
        ch.contract_id` (M6-DB-IMPL-DEFECT-1 fix; original design referenced
        non-existent `step.contract_id`).
      required: [stepId, contractId, contractNumber, titleEn, requestedAt, hoursWaiting]
      properties:
        stepId: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        valueAed: { type: number, nullable: true }
        requestedAt:
          type: string
          format: date-time
          description: |
            `approval_step.created_at` — replaces non-existent `assigned_at`
            per S2-22-FIX-2b. Rows are immutable post-create
            (`trg_approval_step_immutable_fields`).
        hoursWaiting:
          type: number
          description: "EXTRACT(EPOCH FROM (NOW() - step.created_at))/3600 — decimal hours."

    RecipientMyContractsRow:
      type: object
      description: |
        Joined `contract + signature_party` row — projected by
        `fn_dashboard_recipient.lists.myContracts5`. Recipient is identified
        via `signature_party.signer_email = current_user.email`
        (case-insensitive). `counterpartyId` is always null until the
        parties module ships (db-design.md §3.5 explicit).
      required: [id, contractNumber, titleEn, status, ourPartyId]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        ourPartyId: { type: integer }
        counterpartyId:
          type: integer
          nullable: true
          enum: [null]

    RecipientPendingSignatureRow:
      type: object
      description: |
        Joined `signature_invitation + signature_party + contract` row —
        projected by `fn_dashboard_recipient.lists.pendingSignatures5`.
        `sentAt` aliased from `invitation_sent_at`; `expiresAt` aliased
        from `invitation_expires_at` (S2-22-FIX-5a — non-aliased columns
        were design-time references that don't exist on the live table).
      required: [invitationId, contractId, contractNumber, sentAt]
      properties:
        invitationId: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    DashboardRegulatoryUpdateRow:
      type: object
      description: |
        Recent regulatory-update row — lighter projection than M5
        `RegulatoryUpdate`. Embeds a `RegulatorRef`-like sub-object.
        Projected by `fn_dashboard_legal_counsel.lists.recentRegulatoryUpdates5`.
      required: [id, titleEn, severity, regulator]
      properties:
        id: { type: integer }
        titleEn: { type: string }
        severity: { type: string }
        effectiveDate: { type: string, format: date, nullable: true }
        regulator:
          type: object
          required: [id, nameEn]
          properties:
            id: { type: integer }
            nameEn: { type: string }

    DashboardOpenImpactRow:
      type: object
      description: |
        Open regulatory-impact row — lighter projection than M5
        `RegulatoryImpact`. Projected by
        `fn_dashboard_legal_counsel.lists.openImpacts5`.
      required: [id, contractId, contractNumber, regulationTitleEn, severity, detectedAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        regulationTitleEn: { type: string }
        severity:
          type: string
          description: "COALESCE(regulatory_update.severity, 'unknown') — db-design.md §3.4."
        detectedAt: { type: string, format: date-time }

    CounterpartyConcentrationRow:
      type: object
      description: |
        Counterparty concentration row — projected by
        `fn_dashboard_executive.kpis.topCounterpartiesByValue5`.
        `counterpartyName` is not joined (no parties table yet); FE shows
        `counterpartyId` with a "Name pending" fallback chip per AC-S7-04.
      required: [counterpartyId, totalValueAed, contractCount]
      properties:
        counterpartyId: { type: integer }
        totalValueAed: { type: number }
        contractCount: { type: integer }

    ValueDistributionBucket:
      type: object
      description: |
        Value-distribution histogram bucket — projected by
        `fn_dashboard_executive.kpis.valueDistribution`.
        Bucket labels: `<100k` / `100k-1M` / `1M-10M` / `10M+`.
      required: [bucket, count]
      properties:
        bucket: { type: string }
        count: { type: integer }

    AiCostTopPromptRow:
      type: object
      description: Top-prompt cost row — projected by `fn_dashboard_ai_cost_summary.topPromptsByCost5`.
      required: [promptId, requestCount, totalCostUsd]
      properties:
        promptId: { type: integer }
        requestCount:
          type: integer
          description: "successCount + errorCount per fn_ai_request_log_cost_report (M4 043)."
        totalCostUsd:
          type: number
          description: "totalCostUsdMicros / 1_000_000 — projected as USD with 2dp at FE per AC-S11-07."
        cacheHitRatio:
          type: number
          nullable: true
          description: NULL when prompt has zero successful requests in the window (S2-18 NULL semantic).

    ExecutiveAnomaly:
      type: object
      description: |
        One anomaly row — reshaped from M4 `fn_ai_insight_list` rows where
        `entity_type='executive_anomalies'`. `detectedAt` sourced from
        `ai_insight.created_at` (no `detected_at` column exists on
        `ai_insight`).
      required: [id, severity, detectedAt]
      properties:
        id: { type: integer }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        severity:
          type: string
          description: |
            Open string union (forward-compat with M4 ai_insight payload).
            M5 `RegulatorySeverity` is a different scope.
        detectedAt: { type: string, format: date-time }
        payload:
          type: object
          nullable: true
          description: Free-form payload from M4 `ai_insight.payload`.
          additionalProperties: true

    AdminDashboardKpis:
      type: object
      required: [totalContractsActive, totalContractsByStatus, expiringWithin30d, expiringWithin90d, pendingApprovals, pendingSignatures, openRegulatoryImpacts, recentAuditEvents, totalActiveUsers]
      properties:
        totalContractsActive: { type: integer }
        totalContractsByStatus:
          type: object
          additionalProperties: { type: integer }
          description: jsonb_object_agg(contract.status, count). Open key set — M1a may grow status literals; FE renders whatever keys come back.
        expiringWithin30d: { type: integer }
        expiringWithin90d:
          type: integer
          description: "AC-S1-04 monotonic — expiringWithin30d <= expiringWithin90d."
        pendingApprovals: { type: integer }
        pendingSignatures: { type: integer }
        openRegulatoryImpacts:
          type: integer
          description: "WHERE resolved = FALSE AND is_active = TRUE (CRIT-1 rewrite — no resolved_at column)."
        recentAuditEvents: { type: integer }
        totalActiveUsers: { type: integer }

    AdminDashboardTrends:
      type: object
      required: [contractsCreatedByDay, approvalDecisionsByDay]
      properties:
        contractsCreatedByDay:
          type: array
          items: { $ref: "#/components/schemas/TrendDayCount" }
        approvalDecisionsByDay:
          type: array
          items: { $ref: "#/components/schemas/ApprovalDecisionDayPoint" }

    AdminDashboardSnapshot:
      type: object
      required: [kpis, trends]
      properties:
        kpis: { $ref: "#/components/schemas/AdminDashboardKpis" }
        trends: { $ref: "#/components/schemas/AdminDashboardTrends" }

    DrafterDashboardKpis:
      type: object
      required: [myDraftsCount, awaitingMyActionCount, readyToSendCount, myRecentlyApprovedCount]
      properties:
        myDraftsCount: { type: integer }
        awaitingMyActionCount: { type: integer }
        readyToSendCount:
          type: integer
          description: "WHERE drafted_by = caller AND status = 'approved' AND id NOT IN (signature_invitation)."
        myRecentlyApprovedCount: { type: integer }

    DrafterDashboardLists:
      type: object
      required: [myDrafts5, awaitingMyAction5]
      properties:
        myDrafts5:
          type: array
          items: { $ref: "#/components/schemas/DashboardContractRow" }
        awaitingMyAction5:
          type: array
          items: { $ref: "#/components/schemas/DrafterAwaitingActionRow" }

    DrafterDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/DrafterDashboardKpis" }
        lists: { $ref: "#/components/schemas/DrafterDashboardLists" }

    ApproverDashboardKpis:
      type: object
      required: [pendingMyApprovalCount, decidedByMeCount]
      properties:
        pendingMyApprovalCount:
          type: integer
          description: |
            COUNT WHERE COALESCE(delegated_to, reassigned_to,
            approver_user_id) IS NOT DISTINCT FROM v_user_id AND
            status='pending' (S2-22-FIX-2a override-chain + S2-18 NULL-safe).
        decidedByMeCount:
          type: integer
          description: "ad.decided_by = caller AND ad.decided_at >= NOW() - p_window_days days (S2-22-FIX-3)."
        averageDecisionHoursMine:
          type: number
          nullable: true
          description: "AVG hours via approval_step.created_at (S2-22-FIX-2b). NULL when 0 decisions in window."
        averageDecisionHoursTeam:
          type: number
          nullable: true
          description: Same shape, OTHER users with the same approver_role.

    ApproverDashboardLists:
      type: object
      required: [pendingQueue5]
      properties:
        pendingQueue5:
          type: array
          items: { $ref: "#/components/schemas/ApproverPendingQueueRow" }

    ApproverDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/ApproverDashboardKpis" }
        lists: { $ref: "#/components/schemas/ApproverDashboardLists" }

    LegalCounselDashboardKpis:
      type: object
      required: [regulatoryUpdatesThisWindow, openRegulatoryImpacts, criticalSeverityCount, regulationCatalogSize, templateUsageThisWindow]
      properties:
        regulatoryUpdatesThisWindow: { type: integer }
        openRegulatoryImpacts:
          type: integer
          description: "WHERE resolved = FALSE AND is_active = TRUE (CRIT-1 rewrite)."
        criticalSeverityCount: { type: integer }
        regulationCatalogSize: { type: integer }
        templateUsageThisWindow:
          $ref: "#/components/schemas/PlaceholderKpi"
        auditSummary:
          type: object
          nullable: true
          additionalProperties: { type: integer }
          description: |
            jsonb_object_agg(table_name, count) FROM audit_log — keys are
            LIVE `audit_log.table_name` values (S2-22-FIX-4 — was
            `entity_type` which doesn't exist). NULL when caller lacks
            `audit.read` permission (CRIT-4 lock — NOT `audit.read.all`).

    LegalCounselDashboardLists:
      type: object
      required: [recentRegulatoryUpdates5, openImpacts5]
      properties:
        recentRegulatoryUpdates5:
          type: array
          items: { $ref: "#/components/schemas/DashboardRegulatoryUpdateRow" }
        openImpacts5:
          type: array
          items: { $ref: "#/components/schemas/DashboardOpenImpactRow" }

    LegalCounselDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/LegalCounselDashboardKpis" }
        lists: { $ref: "#/components/schemas/LegalCounselDashboardLists" }

    RecipientDashboardKpis:
      type: object
      required: [myContractsCount, pendingMySignatureCount, signedByMeWindow, myObligationsCount]
      properties:
        myContractsCount:
          type: integer
          description: DISTINCT contracts where caller is a `signature_party` (lower(email) match).
        pendingMySignatureCount:
          type: integer
          description: "signature_invitation rows assigned to caller's email AND status='pending'."
        signedByMeWindow:
          type: integer
          description: |
            signature_event WHERE actor_user_id = caller AND
            event_type='signed' AND created_at >= NOW() - p_window_days
            AND is_active=TRUE (S2-22-FIX-1 — was signer_user_id /
            signed_at / outcome; none exist). DN-19 semantic limitation:
            actor_user_id IS NULL for external-only invitation signers
            and they are NOT counted (acceptable trade-off — internal /
            UAE-PASS / app-authenticated recipients DO populate
            actor_user_id and ARE counted).
        myObligationsCount:
          $ref: "#/components/schemas/PlaceholderKpi"

    RecipientDashboardLists:
      type: object
      required: [myContracts5, pendingSignatures5]
      properties:
        myContracts5:
          type: array
          items: { $ref: "#/components/schemas/RecipientMyContractsRow" }
        pendingSignatures5:
          type: array
          items: { $ref: "#/components/schemas/RecipientPendingSignatureRow" }

    RecipientDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/RecipientDashboardKpis" }
        lists: { $ref: "#/components/schemas/RecipientDashboardLists" }

    DashboardPermissionsSummary:
      type: object
      required: [canViewAdminDashboard, canViewExecutiveDashboard]
      properties:
        canViewAdminDashboard: { type: boolean }
        canViewExecutiveDashboard: { type: boolean }

    DashboardRouterResponse:
      type: object
      description: |
        Returned by `fn_dashboard_router` (S6) — db-design.md §3.6.
        Honours the authoritative DB design over the orchestrator's earlier
        `{ roleSlug, dashboardSlug }` shorthand per
        `feedback_db_impl_report_dont_fix.md`.
      required: [userId, primaryRole, dashboardKey, permissionsSummary]
      properties:
        userId: { type: integer }
        primaryRole:
          type: string
          description: |
            Raw role.name as resolved via `fn_user_get_by_id`
            `v_user->'role'->>'name'` with COALESCE fallback to `'unknown'`
            (S2-22-WARN-3-FIX). Live shape is nested `role:{id,name}` —
            NOT flat `roleName`.
        dashboardKey: { $ref: "#/components/schemas/DashboardKey" }
        permissionsSummary: { $ref: "#/components/schemas/DashboardPermissionsSummary" }

    ExecutiveExpiryCliffs:
      type: object
      required: [next30d, next60d, next90d]
      properties:
        next30d: { type: integer }
        next60d:
          type: integer
          description: "AC-S7-03 monotonic: next30d <= next60d <= next90d."
        next90d: { type: integer }

    ExecutiveDashboardKpis:
      type: object
      required: [totalActiveValueAed, contractsByStatus, expiryCliffs, topCounterpartiesByValue5, valueDistribution, openRegulatoryImpactsCritical]
      properties:
        totalActiveValueAed: { type: number }
        contractsByStatus:
          type: object
          additionalProperties: { type: integer }
        expiryCliffs: { $ref: "#/components/schemas/ExecutiveExpiryCliffs" }
        topCounterpartiesByValue5:
          type: array
          items: { $ref: "#/components/schemas/CounterpartyConcentrationRow" }
        valueDistribution:
          type: array
          items: { $ref: "#/components/schemas/ValueDistributionBucket" }
        openRegulatoryImpactsCritical:
          type: integer
          description: WHERE ri.resolved = FALSE AND ru.severity = 'critical' (CRIT-1 + M5 join).
        aiCostUsdWindow:
          type: number
          nullable: true
          description: |
            Q5 inline figure derived from `fn_ai_request_log_cost_report`
            (M4 043). NULL when caller lacks `ai.observability.read` (no
            error — AC-S7-05 explicit panel marker). 90-day cap inherited
            from M4 even when `windowDays > 90` via the LEAST clause
            inside the fn_.

    ExecutiveDashboardTrends:
      type: object
      required: [valueOverTimeByMonth, contractsCreatedByMonth]
      properties:
        valueOverTimeByMonth:
          type: array
          items: { $ref: "#/components/schemas/TrendMonthValueAed" }
        contractsCreatedByMonth:
          type: array
          items: { $ref: "#/components/schemas/TrendMonthCount" }

    ExecutiveDashboardSnapshot:
      type: object
      required: [kpis, trends]
      properties:
        kpis: { $ref: "#/components/schemas/ExecutiveDashboardKpis" }
        trends: { $ref: "#/components/schemas/ExecutiveDashboardTrends" }

    ExecutiveAnomaliesHistoryResponse:
      type: object
      required: [anomalies]
      properties:
        anomalies:
          type: array
          description: Empty array (NOT 404) when ai_insight cache empty — AC-S8-02.
          items: { $ref: "#/components/schemas/ExecutiveAnomaly" }

    AiCostSummary:
      type: object
      description: |
        Used by S11 standalone endpoint AND by S7 inline (`kpis.aiCostUsdWindow`
        is derived from this same fn_'s `totalCostUsdWindow`). Q5 architect
        lock: `vw_ai_cost_rollup` was DROPPED — single source of compute is
        `fn_ai_request_log_cost_report` (M4 043) wrapped by
        `fn_dashboard_ai_cost_summary`.
      required: [totalCostUsdWindow, totalRequestsWindow, topPromptsByCost5]
      properties:
        totalCostUsdWindow: { type: number }
        totalRequestsWindow: { type: integer }
        cacheHitRatioOverall:
          type: number
          nullable: true
          description: NULL when totalRequestsWindow = 0 (S2-18 NULL semantic).
        topPromptsByCost5:
          type: array
          items: { $ref: "#/components/schemas/AiCostTopPromptRow" }

    HealthCheckDb:
      type: object
      required: [status, currentTimestamp]
      properties:
        status: { $ref: "#/components/schemas/HealthDbStatus" }
        latestMigration:
          type: integer
          nullable: true
          description: |
            MAX(version) FROM schema_migrations. NULL when the
            `schema_migrations_select_admin` RLS SELECT policy (migration
            054 / ARCH-NEW-3 option (c)) is missing OR the table is empty.
        currentTimestamp: { type: string, format: date-time }

    HealthCheckAi:
      type: object
      required: [estimatedHealthy]
      properties:
        lastSuccessfulRequestAt:
          type: string
          format: date-time
          nullable: true
          description: MAX(ai_request_log.created_at) WHERE outcome = 'success'.
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
          description: "MAX(ai_request_log.created_at) WHERE outcome IN ('error','timeout','rate_limited','cancelled')."
        estimatedHealthy:
          type: boolean
          description: lastSuccessfulRequestAt IS NOT NULL AND (lastFailureAt IS NULL OR lastSuccessfulRequestAt > lastFailureAt).

    HealthCheckSnapshot:
      type: object
      required: [db, ai, overall]
      properties:
        db: { $ref: "#/components/schemas/HealthCheckDb" }
        ai: { $ref: "#/components/schemas/HealthCheckAi" }
        overall: { $ref: "#/components/schemas/HealthStatusOverall" }

  responses:
    Unauthenticated:
      description: UNAUTHORIZED - missing or invalid access token.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: FORBIDDEN - caller lacks required permission.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: VALIDATION_ERROR - request body / query params failed Zod validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: RATE_LIMITED - too many requests.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Gone:
      description: |
        GONE — single generic message that does NOT distinguish unknown /
        expired / cancelled (AC-S3-04 / AC-S4-05 / AC-S5-04 / AC-S11-02 /
        AC-S12-10). Introduced in M3 for the /sign/* namespace.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Authenticate with email + password
      description: |
        Authenticate the caller and issue a JWT access token (15m) + refresh
        token (7d) plus the AuthUser profile.

        - Lockout: 5 failed attempts within 15 minutes locks the account.
        - Email enumeration prevention (CRX-2): unknown emails still run a dummy
          bcrypt to equalize timing; response is always a generic 401.
        - Rate limit: 5 requests per 15 minutes per IP.

        DB functions used: `fn_auth_get_user_for_login`, `fn_auth_record_login_failure`, `fn_auth_record_login_success`.
      x-rateLimit: 5 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginDto" }
            example:
              email: admin@musanad.local
              password: ChangeMe@123
      responses:
        "200":
          description: Login successful. Tokens + user returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                user:
                  id: 1
                  email: admin@musanad.local
                  firstName: System
                  lastName: Admin
                  role: { id: 1, name: Super Admin }
                  permissions: [audit.read, role.manage, user.manage, user.read.all]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_CREDENTIALS - generic to prevent enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: ACCOUNT_LOCKED - too many failed attempts; account locked until lockedUntil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Blacklist the supplied refresh token
      description: |
        Blacklist the supplied refresh token so future refresh attempts return 401.
        The access token is verified for authentication only.
        Rate limit: 10 requests per 5 minutes per IP.
        DB function used: `fn_auth_blacklist_token`.
      x-rateLimit: 10 requests per 5 minutes per IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutDto" }
      responses:
        "200":
          description: Logged out successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
              example:
                success: true
                message: Logged out
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate access + refresh tokens
      description: |
        Exchange a non-blacklisted refresh token for a NEW access token (15m)
        AND a NEW refresh token (7d). The old refresh token is blacklisted
        atomically inside this call (`fn_auth_blacklist_if_absent`, CRX-1 fix).

        Clients MUST replace BOTH stored tokens. Reusing the old refresh after
        a successful rotation returns 401 (refresh-token-rotation pattern;
        OWASP / RFC 6749).

        Rate limit: 10 requests per 15 minutes per IP.
        DB functions used: `fn_auth_check_token_blacklist`, `fn_user_get_by_id`, `fn_auth_blacklist_if_absent`.
      x-rateLimit: 10 requests per 15 minutes per IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenDto" }
      responses:
        "200":
          description: Refresh successful.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_REFRESH_TOKEN - expired, blacklisted, or user inactive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/uae-pass/initiate:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassInitiate
      summary: Begin UAE Pass federated login flow
      description: |
        Generates a server-side CSRF state value (32 random hex bytes), stores
        it in the state-store with a 5-minute TTL, and returns the authorize
        URL. The client must redirect the user agent there and echo the state
        unchanged in `/callback` (CRX-3 fix).

        State store: in-memory Map for dev (mock provider). MUST swap to Redis
        or a `uae_pass_state` DB table before multi-replica production deploy.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassInitiateRequest" }
      responses:
        "200":
          description: Authorize URL + state nonce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassInitiateResponse" }

  /auth/uae-pass/callback:
    post:
      tags: [Auth, UAE Pass]
      operationId: authUaePassCallback
      summary: Complete UAE Pass federated login (exchange code + state)
      description: |
        Validates `state` against the server-side store (single-use, 5-min TTL),
        then exchanges `code` with the UAE Pass provider for an identity payload.

        - Mock provider returns a synthetic identity (deterministic; dev only).
        - Live provider stub throws NotImplementedError until real UAE Pass
          credentials and SAML/PKCE wiring are completed (see
          `docs/uae-pass-integration.md`).

        CRX-3: missing, expired, or already-consumed state returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UaePassCallbackRequest" }
      responses:
        "200":
          description: Identity payload (mock provider).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UaePassCallbackResponse" }
        "401":
          description: Invalid or expired state parameter (CRX-3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: NOT_IMPLEMENTED - live provider not yet wired in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users:
    get:
      tags: [Users]
      operationId: userList
      summary: List users (paginated)
      description: |
        Paginated user list, optionally filtered by `search` (email / firstName / lastName)
        and `roleId`. Requires `user.read.all`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.read.all]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated user list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserListItem" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: userCreate
      summary: Create a new user
      description: |
        Admin-only. BE bcrypts the password (12 rounds) before passing to
        `fn_user_create`. The plaintext password never reaches the DB or the logs.
        Requires `user.manage`.
        Rate limit: 60 requests per minute per authenticated user.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserDto" }
            example:
              email: new.user@musanad.local
              password: Initial@Pass1
              firstName: New
              lastName: User
              roleId: 3
      responses:
        "201":
          description: User created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: EMAIL_IN_USE - an active user already exists with this email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Users]
      operationId: userGetById
      summary: Get a user profile
      description: Caller must be the user themselves OR have `user.read.all`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self, Super Admin, Admin]
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: userUpdate
      summary: Update user fields (partial)
      description: |
        Partial update of email / firstName / lastName / roleId.
        Self-updates restricted to firstName / lastName at controller level;
        admin updates may change all four. Password updates are NOT handled here
        (reserved for M1+ password reset flow).
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [self (limited fields), Super Admin, Admin]
      x-requiredPermissions: [user.manage (or self for firstName/lastName only)]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserDto" }
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EMAIL_IN_USE - new email already in use by another active user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: INVALID_ROLE - roleId references missing or inactive role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Users]
      operationId: userDelete
      summary: Soft-delete a user
      description: |
        Sets `is_active = false`. Self-protection: caller cannot deactivate their
        own account. Requires `user.manage`.
      x-rateLimit: 60 requests per minute per user
      x-authorisedRoles: [Super Admin, Admin]
      x-requiredPermissions: [user.manage]
      responses:
        "200":
          description: User deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN - caller lacks user.manage or attempted self-deactivation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles:
    get:
      tags: [Roles]
      operationId: roleList
      summary: List active roles (paginated)
      description: |
        Paginated list of active roles with `permissionCount`. Used to populate
        role-select dropdowns. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated role list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /permissions:
    get:
      tags: [Permissions]
      operationId: permissionList
      summary: List permissions (paginated; optional roleId filter)
      description: |
        Paginated permission catalog. If `roleId` is provided, returns only
        permissions held by that role. Authenticated users only.
        Rate limit: 120 requests per minute per authenticated user.
      x-rateLimit: 120 requests per minute per user
      x-authorisedRoles: ["*"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: roleId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated permission list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ============================================================
  # M1a — Contracts (11 endpoints, S1..S11; S12 is trigger-only)
  # ============================================================

  /contracts:
    get:
      tags: [M1a — Contracts]
      operationId: contractList
      summary: List contracts (paginated, role-aware, filter+search+tags)
      description: |
        Paginated contract list with role-aware filtering, status / type /
        counterparty / date filters, debounced search, and AND-semantic tag
        filter. body_en / body_ar are NEVER returned by this endpoint
        (AC-S1-08). DB function: `fn_contract_list`.
      x-rateLimit: authedReadRateLimiter (60 / min / authenticated user)
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contractType
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: draftedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approvedBy
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: tags
          in: query
          description: AND-semantics; every supplied tag must match.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: search
          in: query
          description: ILIKE across contract_number / title_en / title_ar.
          schema: { type: string }
        # ----------------------------------------------------------------
        # M1c additive query params. fn_contract_list signature widened
        # 15→18 (migration 017). All three default NULL — backward
        # compatible. Used by M1c S4 (admin drill-down) and S6 (review queue).
        # ----------------------------------------------------------------
        - name: importBatchId
          in: query
          description: |
            M1c addition. Filter to a single import_batch — used by S4 admin
            drill-down (AC-S4-05). Positive bigint or omitted.
          schema: { type: integer, minimum: 1 }
        - name: importConfidenceMin
          in: query
          description: |
            M1c addition. Lower bound (inclusive) on contract.import_confidence —
            used by S6 review queue (AC-S6-01). Range 0..100.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: importConfidenceMax
          in: query
          description: |
            M1c addition. Upper bound (inclusive) on contract.import_confidence —
            used by S6 review queue (AC-S6-01). Range 0..100.
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: |
            Paginated contract list. Each row carries 3 M1c additions
            (importBatchId, importConfidence, importWarnings) — always present,
            null when contract was not bulk-imported.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [M1a — Contracts]
      operationId: contractCreate
      summary: Create a new contract (draft status, auto-numbered)
      description: |
        Creates a new contract row with `status='draft'`, auto-generated
        `contract_number` (format CT-YYYY-NNNNNN), `current_version=1`. A
        `created` activity row is auto-emitted by trigger. body_en/body_ar
        in the request body are pino-redacted on inbound logging.

        DB function: `fn_contract_create`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin, legal_counsel, contract_drafter]
      x-permissionRequired: contract.draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContractDto" }
      responses:
        "201":
          description: Contract created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            CONFLICT - contract number collision after 3 controller retries
            (AC-S3-09 defensive only; auto-generation should not race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /contracts/{id}:
    get:
      tags: [M1a — Contracts]
      operationId: contractGetById
      summary: Get a single contract (with attachment + comment counts)
      description: |
        Returns the full contract payload including bodyEn/bodyAr (which are
        pino-redacted on logging). attachmentCount and commentCount are
        inline numeric fields; the underlying tables are forward references.

        AC-S2-03 layering: when the row exists in `contract` but is hidden by
        RLS for the caller, the controller returns 403 (not 404). The
        existence pre-check uses an allowlisted SECURITY DEFINER helper
        (`db.checkActiveRowExists`).

        DB function: `fn_contract_get_by_id`.
      x-rateLimit: authedReadRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - executive
        - contract_drafter
        - contract_approver
        - contract_approver_2
        - contract_recipient
      x-permissionRequired: any of contract.read.all | contract.read.department | contract.read.own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [M1a — Contracts]
      operationId: contractUpdate
      summary: Update a contract (partial COALESCE; body changes create a version)
      description: |
        Partial COALESCE update. **`status` MUST NOT be in the payload** -
        Zod `.strict()` rejects it (AC-S4-04). Use PATCH /contracts/{id}/status
        for status transitions. Tags are not part of this DTO either - use
        PUT /contracts/{id}/tags. A body change auto-creates a new
        `contract_version` row in the same transaction (S4 + S10 wired
        together; AC-S4-02).

        Migration 008 adds SELECT FOR UPDATE on the contract row before
        reading existing values, serialising concurrent updates against
        each other and against soft-delete (Codex BE-002).

        DB function: `fn_contract_update`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles:
        - platform_admin
        - legal_counsel
        - contract_drafter (own AND status IN draft|resubmission_requested)
      x-permissionRequired: contract.edit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractDto" }
      responses:
        "200":
          description: Contract updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [M1a — Contracts]
      operationId: contractDelete
      summary: Soft-delete a contract (cascades to tags; rejects if children active)
      description: |
        Soft-deletes the contract (sets `is_active=FALSE`). Cascades a
        soft-delete to `contract_tag` rows. `contract_version` rows are
        preserved verbatim (append-only; AC-S5-02).

        Cannot soft-delete a contract with active children (AC-S5-04 ->
        409 CONFLICT details.children).

        Defence-in-depth: `fn_contract_delete` is SECURITY DEFINER and sets
        the `app.fn_contract_delete='true'` GUC, takes
        SELECT...FOR UPDATE on the row, performs the child-active check
        inside the lock, then flips `is_active`. The companion RESTRICTIVE
        RLS policy `contract_deny_direct_is_active_update` prevents bypass
        via direct UPDATE. Codex G2 TOCTOU defense.

        DB function: `fn_contract_delete`.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [platform_admin]
      x-permissionRequired: contract.delete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Contract soft-deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteContractResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT - contract has active children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

