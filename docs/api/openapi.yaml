  /contracts/{id}/status:
    patch:
      tags: [M2 — Approvals, M1a — Contracts]
      operationId: contractUpdateStatus
      summary: |
        Update contract status (M1a endpoint, narrowed-transitions extension by M2 / AE-2).
      description: |
        M2 (AE-2) OWN-AND-SPLIT extension of the M1a endpoint. Wire DTO field
        shape preserved (newStatus + optional reason); the body schema is
        UpdateContractStatusUserDto, with newStatus restricted to the
        per-transition matrix enforced by fn_contract_status_update_user.

        Per-transition permission gates (fn_-side authoritative):
          - draft → in_review        : approval.submit_for_review
          - in_review → in_approval  : approval.submit_for_review (atomic — internally calls fn_approval_route_init)
          - in_review → draft        : approval.submit_for_review (own) OR contract.delete
          - approved → active        : contract.edit
          - any non-terminal → cancelled : contract.delete OR (contract.draft AND ownership)

        Direct in_approval terminal targets (approved / rejected /
        resubmission_requested) are REJECTED with 409 — callers must use
        POST /approvals/{stepId}/decide. (AC-S12-02 / AC-S12-09 / M2-NEW-1.)

        FE migration note: previously-permissive M1a transitions
        (e.g. draft → approved direct) now return 409. Existing M1a tests
        that exercised valid transitions continue to pass; tests that
        exercised permissive transitions MUST be updated to use the
        chain-driven path.

        DB function: `fn_contract_status_update_user` (M2 INVOKER, FOR UPDATE
        on contract — UPGRADE over M1a placeholder which had no lock). Replaces
        the M1a fn_contract_status_update placeholder. The system-only
        fn_contract_status_update_internal (DEFINER) is invoked ONLY by
        fn_approval_decide and is not exposed via HTTP.
      x-rateLimit: authedWriteRateLimiter
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter]
      x-permission: anyOf(contract.status.update, approval.submit_for_review, contract.edit, contract.delete, contract.draft)
      x-acsCovered: [AC-S12-01, AC-S12-02, AC-S12-03, AC-S12-04, AC-S12-05, AC-S12-06, AC-S12-07, AC-S12-08, AC-S12-09, AC-S12-10]
      x-extensionType: M2 / AE-2 OWN-AND-SPLIT (wire-compatible)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContractStatusUserDto" }
            examples:
              submitForReview:
                summary: draft → in_review
                value: { newStatus: in_review }
              submitForApproval:
                summary: in_review → in_approval (atomic — chain created)
                value: { newStatus: in_approval, reason: "Ready for legal sign-off" }
              activate:
                summary: approved → active
                value: { newStatus: active }
              cancel:
                summary: any non-terminal → cancelled
                value: { newStatus: cancelled, reason: "Counterparty withdrew." }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateContractStatusUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT — invalid transition. Common causes: (a) target is
            in_approval terminal direct override (use fn_approval_decide /
            POST /approvals/{stepId}/decide); (b) transition pair not in the
            whitelist (AC-S12-03).
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

