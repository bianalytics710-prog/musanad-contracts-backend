openapi: 3.0.3
info:
  title: Musanad Contracts Hub API
  description: |
    Musanad Contracts Hub platform API. Covers M0 (authentication, user / role /
    permission catalog, health probe), M1a (contract core CRUD + lifecycle),
    M1b (Compose Wizard + Payment Schedules + PDF/XLSX exports), M1c
    (Bulk & Manual Import — 4 import-batch endpoints + 1 AI extraction stub +
    additive extension of GET /contracts), and M2 (Approval Workflows — 10 new
    endpoints under /approvals/* and /admin/approval-* + extension of
    PATCH /contracts/:id/status).

    All routes are prefixed with `/api/v1` except `/api/health` (infrastructural).

    Architecture: thin HTTP controllers call PostgreSQL `fn_*` functions
    (Database Objects First). RLS is enforced server-side via the
    `app.current_user_id` session GUC, set by middleware before every fn_ call.

    Every response carries an `X-Request-ID` correlation header.

    M2 introduces two new namespaces — `/api/v1/approvals/*` (drafter / approver
    actions) and `/api/v1/admin/approval-*` (admin matrix + chain monitor + step
    reassign). The approval engine writes the contract.status state machine via
    fn_contract_status_update_user (drafter, INVOKER) and a system-only
    fn_contract_status_update_internal (DEFINER, called only by fn_approval_decide
    on terminal chain transitions). Escalation (fn_approval_escalate) is invoked
    by an in-process node-cron driver, not exposed via HTTP.

    M3 introduces three new namespaces and 10 new endpoints — 5 JWT-authenticated
    (admin/drafter signature management under `/api/v1/contracts/:id/...`,
    `/api/v1/signature-parties/:id/resend`, `/api/v1/signature-invitations/:id/cancel`)
    and **5 PUBLIC token-bearer** under `/api/v1/sign/*` (verify_jwt=false; the
    first such namespace in the project). The 5 public endpoints authenticate via
    a SHA-256-hashed `invitation_token` plaintext in the URL path (and
    `X-Session-Token` header on `/qa/message`); GRANT EXECUTE TO PUBLIC is
    applied to exactly 5 SECURITY DEFINER fn_'s (CC-4 Option A, ratified at HITL
    Gate 2). M3 also adds the SSE response on `POST /sign/:invitationToken/qa/message`
    (Content-Type: `text/event-stream`) — the only streaming endpoint in the
    project. Cron-driven invitation expiry (`fn_signature_invitation_expire_due`)
    runs in-process via `SIGNATURE_EXPIRATION_INTERVAL_CRON` and is not exposed
    via HTTP.

    M4 introduces 10 new endpoints: 6 AI invocation endpoints under
    `/api/v1/ai/*` (5 JWT-authenticated + 1 PUBLIC behind a signed-PDF-token)
    and 4 admin observability endpoints under `/api/v1/admin/ai/*` (JWT,
    `ai.observability.read`). Three AI invocation endpoints stream Server-Sent
    Events (`/ai/contract-insights` modes summary/rewrite,
    `/ai/drafting-assistant` modes chat/explain/rewrite, `/ai/regulatory-impact`
    modes explain/amendment) — bringing the project SSE endpoint count from 1
    to 4. M4 introduces a NEW security scheme `signedPdfToken` (HMAC-validated
    short-lived token; `aud='regulatory-impact-pdf'`, validated at the Express
    middleware layer before the controller invokes `neondb_owner`-only fn_'s)
    — distinct from M3's `verify_jwt=false` PUBLIC namespace, and the first
    `signed-token` auth mode in the project. **PUBLIC EXECUTE on fn_'s remains
    at exactly the M3 set of 5 names** (Q3 Option A; M4 contributes 0 new
    PUBLIC fn_ grants — S2-21 promotion criterion satisfied). M4 introduces a
    3rd in-process cron driver (`fn_ai_insight_evict_expired` — 15-minute
    sweep of expired ai_insight cache rows; `AI_INSIGHT_EVICTION_INTERVAL_CRON`
    env var). AI provider: OpenAI `gpt-4o` (and `gpt-4o-mini` for the cheaper
    executive-anomalies + version-diff-summary prompts) — reuses the M0
    AIProvider abstraction unchanged. Six prompt files in `[backend]/prompts/`
    are loaded VERBATIM at boot (G7 — Mustache-style placeholder substitution
    only at runtime; never edit the prompt body).

    M5 introduces 15 new endpoints under four namespaces —
    `/api/v1/regulations/*`, `/api/v1/regulatory-updates/*`,
    `/api/v1/regulatory-impacts/*`, and `/api/v1/impact-categories` — covering
    the Regulatory Radar surface (UAE regulations master library, regulatory-
    update radar feed, per-contract impact analysis, and impact-category
    taxonomy admin). All 15 are JWT-authed (zero new PUBLIC fn_'s; the
    `signed-token` and `verify_jwt=false` modes remain M3/M4-only). 5 new
    tables: `regulator` (shared lookup), `regulation` (master library;
    self-referential supersession), `impact_category` (configurable taxonomy),
    `regulatory_update` (radar feed), and `regulatory_impact`
    (G1-reconstituted; nullable `regulatory_update_id` for structural impacts;
    COALESCE-sentinel UNIQUE for idempotent bulk-detect). 15 new fn_'s + 1
    extended (`fn_contract_activity_create` whitelist 23→25 atomically with
    the `contract_activity.activity_type` CHECK enum extension in migration
    047). One DEFINER carve-out: `fn_regulatory_impact_create_bulk` —
    legal_counsel writes impacts on contracts they don't directly own;
    defence-in-depth permission gate at fn body line 1 plus an S2-17 atomic
    gate+commit (SELECT FOR UPDATE on regulatory_update before the per-contract
    INSERT loop) preserve security invariants. **PUBLIC EXECUTE on fn_'s
    remains at exactly the M3 set of 5 names** (S2-21 mandatory; M5 confirms —
    4th consecutive validation). M5 introduces NO new cron driver (event-
    driven only). 3 new permission codes (`regulations.read`,
    `regulations.manage`, `config.manage`) seeded in migration 046 with 12
    role_permission grants. Migrations applied: 046..052 + 053
    (M5-PROD-DEFECT-1 patch — structured FK pre-check on
    `fn_regulation_update.supersededById` so the BE `translatePgError` 23503
    STRUCTURED_RAISE_RE branch returns 400 with
    `{ supersededById: 'Referenced regulation not found' }` instead of
    raw-FK-fallthrough 422; codifies S2-23 mandatory check).
    `schema_migrations.version=53` on both `test` and `m0-foundation`
    branches. M5 also closes M4-FE-OI-3 — `RegulatoryImpactPanel.sampleContracts`
    prop wired (surgical 2-line additive change to the M4 panel; no M0..M4
    type files modified).

    M6 introduces 10 new endpoints under two namespaces — 9 under
    `/api/v1/dashboards/*` (admin / drafter / approver / legal-counsel /
    recipient / router / executive / executive/anomalies-history /
    ai-cost-summary) plus 1 admin observability probe under
    `/api/v1/admin/health`. All 10 are JWT-authenticated (zero new PUBLIC
    fn_'s; **PUBLIC EXECUTE on fn_'s remains at exactly the M3 set of 5
    names** — S2-21 sustained at sixth-consecutive-clean module). M6 is a
    READ-ONLY module: 0 new tables, 0 ALTER TABLE, 0 new columns, 0 new cron
    drivers. The DB surface is 4 plain views (`vw_contract_status_summary`,
    `vw_approval_queue_metrics`, `vw_signature_status_summary`,
    `vw_regulatory_impact_summary`), 10 new fn_'s (all SECURITY INVOKER), 1
    new permission code (`insights.executive`) seeded with 3 role grants
    (executive + platform_admin + Super Admin), and 1 new RLS SELECT policy
    (`schema_migrations_select_admin` — ARCH-NEW-3 option (c) — enables
    `fn_health_check.db.latestMigration` to read `MAX(version)` while the
    pre-existing RESTRICTIVE deny-all continues to block writes for non-
    superusers). Migrations applied: 054..056 (3 designed) + 057
    (M6-DB-IMPL-DEFECT-1 patch — `CREATE OR REPLACE` of `fn_dashboard_approver`
    correcting the JOIN-target column drift on `step.contract_id`; the
    correct join chain is `approval_step JOIN approval_chain JOIN contract`).
    `schema_migrations.version=57` on both `test` and `m0-foundation`
    branches. The `fn_dashboard_executive.kpis.aiCostUsdWindow` field is
    inline (Q5 single-source-of-compute lock — both S7 inline and S11
    standalone read from `fn_ai_request_log_cost_report` via the wrapping
    `fn_dashboard_ai_cost_summary`; `vw_ai_cost_rollup` was intentionally
    not designed). M6 also closes **M4-FE-OI-2** (both halves) — the
    `ExecutiveAnomaliesCard` (M4) is now mounted into the new
    `ExecutiveDashboard` (S9), and the `VersionDiffSummaryPanel` (M4) is
    now mounted into `ContractVersionList` (S10) — pure FE wiring, zero
    M4 BE changes.
  version: 0.9.0
  contact:
    name: Musanad Technologies FZ-LLC
servers:
  - url: http://localhost:4000/api/v1
    description: Local development backend
  - url: http://localhost:4000
    description: Local development backend (root - for /api/health only)

tags:
  - name: Auth
    description: Authentication endpoints (login, logout, refresh)
  - name: UAE Pass
    description: UAE Pass federated identity (mocked in M0; real provider stubbed)
  - name: Users
    description: User CRUD (admin)
  - name: Roles
    description: Role catalog (read-only in M0)
  - name: Permissions
    description: Permission catalog (read-only in M0)
  - name: Health
    description: Liveness / readiness probes
  - name: M1a — Contracts
    description: |
      Contracts core CRUD & lifecycle (M1a). 11 endpoints covering list/get/create/
      update/soft-delete, status transitions, parent/child tree, tag management,
      version history, and the contract activity timeline. body_en/body_ar are
      sensitive (pino-redacted on logs and audit_log JSONB-redacted by
      fn_audit_trigger).
  - name: M1b — Compose Wizard, Payment Schedules & Exports
    description: |
      Compose Wizard, Payment Schedules & PDF/XLSX exports (M1b). 4 new endpoints:
      list / replace payment schedule, single-contract PDF export, list-level XLSX
      export. Heavy bundles (jspdf / xlsx) moved off the FE per G6 — backend renders
      via Puppeteer (Chromium) and exceljs WorkbookWriter (streaming). Compose
      Wizard is FE-only orchestration (POST /contracts → PUT /payment-schedules)
      with NO new BE wrapper endpoint per Q2. M1b extends the contract_activity
      activity_type CHECK enum with `payment_schedule_replaced` and `exported`.
      W1 route-ordering: GET /contracts/export.xlsx (literal) MUST be declared
      before any /:id-prefixed route — see comment in src/routes/v1/contracts.routes.ts.
  - name: M1c — Imports
    description: |
      Bulk & Manual Import (M1c). 4 import-batch endpoints (S1 create, S2 update,
      S3 list, S4 get-by-id) + the M1a GET /contracts list extended with 3 import
      filter params (importBatchId, importConfidenceMin, importConfidenceMax) and
      3 list-row fields (importBatchId, importConfidence, importWarnings). FE-direct
      Supabase Storage upload (HQ1 ratified) — backend never sees the file bytes,
      only the already-extracted text + filename + size. Cancellation is a status
      transition (status='cancelled'), not is_active=false; the
      trg_import_batch_immutable_fields BEFORE UPDATE trigger blocks any direct
      flip of is_active or initiated_by (Codex C1 fix).
  - name: M1c — AI
    description: |
      AI namespace introduced in M1c. M1c ships ONE controller-only stub
      (POST /api/v1/ai/extract-contract-bulk) — no fn_, no DB persistence. The
      stub returns a deterministic mock derived from extractedText.length so
      routing-by-confidence tests are repeatable. Request + response DTOs are
      FROZEN per HQ2: M4 will replace the controller body without changing the
      route, auth, request DTO, or response DTO. extractedText is classified as
      ai_prompt_payload (project.config.json sensitiveFields) and pino-redacted
      across 7 paths (top-level, req.body.*, req.query.*, req.params.*, *.X,
      *.*.X) — Codex M1 fix.
  - name: M2 — Approvals
    description: |
      Approval engine — drafter + approver actions (M2). 6 endpoints under
      /api/v1/approvals/* and /api/v1/contracts/:id/* covering S1 my-pending
      inbox, S2 decide (approve / reject / request_resubmission), S3 voluntary
      delegation, S6 chain preview, S7 submit-for-approval, S10 read most-recent
      chain. The engine is DB-first — every endpoint is a thin pass-through to a
      fn_approval_* PL/pgSQL function with FOR UPDATE row locks on the relevant
      step / chain / contract. decisionNote is sensitive (pino-redacted on
      logs across 14 paths and JSONB-redacted by fn_audit_trigger). Approval
      events emit only contract_activity rows (HQ1 / HQ7 — no notification
      table). fn_approval_escalate (S9) is system-only; invoked by a node-cron
      driver inside the BE process, not exposed via HTTP.
  - name: M2 — Admin Approvals
    description: |
      Admin oversight + configuration endpoints (M2). 4 endpoints under
      /api/v1/admin/approval-* covering S4 matrix list, S5 matrix replace
      (PUT — atomic upsert via fn_approval_matrix_set with pg_advisory_xact_lock
      on the (contract_type, value range) hash), S8 admin step reassign, S11
      role-aware chain monitor list. matrixSnapshot is sensitive (pino-redacted
      and audit-redacted by fn_audit_trigger). The /api/v1/admin/* namespace is
      first introduced in M2 — convention parity with /api/v1/ai/* (M1c).
  - name: M3 — Signatures (Admin)
    description: |
      Admin / drafter-facing signature ceremony endpoints (M3). 5 endpoints
      requiring JWT auth: bulk-create signer roster, send-for-signature (issues
      invitation tokens), resend invitation, cancel invitation, and per-contract
      signature-progress list. Permission gates: `signature.send` (create roster,
      send, resend), `signature.cancel` (cancel — drafter cannot self-cancel,
      AC-S8-03), `contract.read.* OR signature.read.all` (list).
      `invitationTokenPlaintext` is returned ONCE on creation (persisted as
      SHA-256 hash in `signature_invitation.invitation_token_hash`); the
      response field is pino-redacted on egress. `signer_email` is masked
      (`j***@example.com`) for non-privileged roles on the list endpoint
      (AC-S6-04). `signature_data` and `signature_image_url` are NEVER
      returned regardless of role (AC-S6-05).
  - name: M3 — Signer Public (verify_jwt=false)
    description: |
      Public signer ceremony endpoints (M3). 3 endpoints under `/api/v1/sign/*`
      (no Authorization header). Token-bearer authenticated — invitation_token
      plaintext in URL path is hashed (SHA-256) and matched server-side inside
      a SECURITY DEFINER fn_. GRANT EXECUTE TO PUBLIC is applied to exactly the
      named fn_'s (CC-4 Option A, HITL Gate 2 locked):
      `fn_signature_get_by_invitation_token`, `fn_signature_sign`,
      `fn_signature_decline`. Errors return single generic
      `invitation_invalid_or_expired` (HTTP 410) that does NOT distinguish
      unknown / expired / cancelled (AC-S3-04 / AC-S4-05 / AC-S5-04).
      Email is ALWAYS masked on the public read; `signature_data` and
      `signature_image_url` are NEVER returned. Rate limit:
      `publicSignerRateLimiter` (60 req/min/IP).
  - name: M4 — AI (Contract + Drafting + Executive)
    description: |
      AI invocation endpoints (M4) for contract-scoped insights, drafting
      assistance, and executive anomaly detection. 3 endpoints under
      `/api/v1/ai/*`: `POST /contract-insights` (S1 — summary/key_terms/risks/
      obligations/regulatory/rewrite; SSE on summary+rewrite, JSON tool-call
      otherwise; cache via ai_insight 24h; persists summary + risk score to
      contract.ai_summary_*/ai_risk_score), `POST /drafting-assistant` (S2 —
      suggest/chat/explain/rewrite; SSE on chat/explain/rewrite; NO caching;
      separate hourly + daily rate limits per prompt), `POST /executive-anomalies`
      (S3 — non-streaming tool-call; cache via ai_insight 1h; entity_type=
      'executive_dashboard' with entity_id=NULL). Permission gates:
      `ai.invoke.contract` (Super Admin / platform_admin / legal_counsel /
      contract_drafter), `ai.invoke.executive` (Super Admin / platform_admin /
      executive). Sensitive fields: `selectedText`, `chatHistory`,
      `draftSummary`, `ai_prompt_payload` — pino-redacted at controller; DB
      defence-in-depth via `payload` redact in `fn_audit_trigger` post-
      migration 041. Each invocation appends one `ai_request_log` row in a
      controller `finally{}` block (success / error / cache_hit / rate_limited
      / timeout / cancelled). All fn_'s are `neondb_owner`-only DEFINER /
      INVOKER — NO PUBLIC EXECUTE grants (S2-21 invariant).
  - name: M4 — AI (Regulatory Impact)
    description: |
      Regulatory-update impact endpoints (M4). 2 endpoints under `/api/v1/ai/*`:
      `POST /regulatory-impact` (S4 — JWT; SSE explain/amendment streaming;
      stateless / payload-driven because the `regulatory_update` table doesn't
      exist yet — Q1 deferred to M5+; cache via ai_insight 24h with
      entity_type='regulatory_update' + entity_id=NULL), and `POST
      /regulatory-impact-summary` (S5 — PUBLIC behind a signed-PDF-token;
      consumed server-side by the future PDF generator pipeline; cache 30 days
      content-addressed by SHA-256 of canonicalised inputs). Permission gate
      for S4: `ai.invoke.regulatory` (Super Admin / platform_admin /
      legal_counsel). S5 is token-bearer authenticated — see the
      `signedPdfToken` security scheme. M4 introduces this `signed-token`
      auth mode; the underlying `fn_ai_regulatory_impact_summary_*` fn_'s are
      `neondb_owner`-only — NOT in the PUBLIC EXECUTE allowlist (Q3 Option A).
      Sensitive fields: `summaryEn`, `signedToken`, `ai_prompt_payload`. The
      S5 controller enforces a per-token in-memory hourly rate limit (10/h)
      because there is no actor user id; this caveat is documented in
      BE-IMPL-INFO-2 (single-replica only; switch to Redis when scaling).
  - name: M4 — AI (Version Diff Summary)
    description: |
      Plain-language AI summary of differences between two contract versions
      (M4 — S6). Single endpoint `POST /api/v1/ai/version-diff-summary`. JWT;
      `ai.invoke.contract` permission. Non-streaming. Persists the resulting
      summary to `contract_version.diff_summary` via the DEFINER carve-out
      `fn_contract_version_diff_summary_persist` — the ONLY allowed UPDATE
      path on that column (table is otherwise append-only at M1a). Cache via
      ai_insight 7 days, entity_type='contract_version'. Sensitive fields:
      `additions`, `deletions`, `modifiedClauses`, `ai_prompt_payload`.
      Migration 045 patches the fn_ body for the column-existence escape
      caught by the Testing Agent (DEFECT-1; UPDATE clause referenced
      nonexistent `updated_at`/`updated_by` on `contract_version`); the post-
      patch fn signature and JSONB return shape are byte-identical to 043 —
      controller bindings unchanged.
  - name: M4 — Admin AI Observability
    description: |
      Admin observability + read endpoints for the AI subsystem (M4 — S11/S12/
      S13). 4 endpoints under `/api/v1/admin/ai/*`: `GET /insights` (paginated
      cache contents — fn_ai_insight_list), `GET /requests` (paginated
      ai_request_log with filters — fn_ai_request_log_list), `GET /cost-report`
      (aggregated by promptId + optional userId; 90-day max window —
      fn_ai_request_log_cost_report), `GET /prompts` (list registered AI
      prompts and their default model + rate limits; read-only in M4 —
      fn_ai_prompt_list). All require JWT + `ai.observability.read` permission
      (Super Admin / platform_admin). Sensitive fields surfaced in payloads
      (`payload`, `errorMessage`) are pino-redacted on log lines; the API
      response itself returns the data verbatim because admins legitimately
      need to inspect cache contents and provider error messages for debug.
  - name: M3 — Signer Q&A AI (verify_jwt=false)
    description: |
      Public signer Q&A endpoints (M3). 2 endpoints under `/api/v1/sign/:invitationToken/qa/*`.
      `POST /qa/session` returns a `sessionTokenPlaintext` ONCE (persisted as
      SHA-256 `session_token_hash`); subsequent `POST /qa/message` calls require
      the plaintext in the `X-Session-Token` header. Sliding-window
      enforcement when 5+ active sessions per invitation (AN-12 Option A —
      soft-deactivate oldest, never returns 429). `POST /qa/message` returns
      a Server-Sent Events stream (`Content-Type: text/event-stream`) — the
      only streaming endpoint in the project. Two-call rate-limit pattern
      (DN-10 / AN-2 — GATE pre-AI reservation, COMMIT post-AI usage record);
      per-session cap 20/h, per-invitation cap 50/h enforced inside the fn_
      (HTTP 429 surfaces with `retryAfterSeconds`). AI provider: OpenAI
      `gpt-4o`; system prompt loaded VERBATIM from `prompts/ai-signer-qa.txt`
      at request time (no transcript persisted — AN-2 transcriptStorage,
      DN-11). `userMessage` is sensitive (pino-redacted as `ai_prompt_payload`,
      AC-S12-09).
  - name: M5 — Regulations
    description: |
      Regulations master library (M5 — S1..S5). 5 endpoints under
      `/api/v1/regulations/*`. CRUD + list with filters (jurisdiction,
      regulationType, issuerId, status, search) + recursive supersession chain
      on detail (max 5 hops). `regulations.read` covers list/get; `regulations.manage`
      gates create/update/patch; DELETE additionally requires platform_admin role
      at the function body (legal_counsel cannot delete — AC-S5-04). `referenceCode`
      is immutable post-create (fn raises 23501; AC-S4-05). Setting `supersededById`
      auto-flips status to `superseded` (AC-S4-02). Self-supersede rejected
      (AC-S4-03). DELETE 409s when active impact rows reference the regulation
      (AC-S5-02 — cleaner UX than raw 23503 FK violation). M5-PROD-DEFECT-1
      (migration 053): structured FK pre-check on `supersededById` returns 400
      with `{ supersededById: 'Referenced regulation not found' }` instead of
      raw-FK-fallthrough 422.
  - name: M5 — Regulatory Updates
    description: |
      Regulatory update radar feed (M5 — S6..S10). 5 endpoints under
      `/api/v1/regulatory-updates/*`. CRUD + list with severity / regulator /
      category / effective-window / compliance-deadline-cliff filters (sort
      `published_date DESC`). Get-by-id embeds an RLS-aware impactSummary
      aggregate (`totalImpacts`, `resolvedCount`, `pendingCount`,
      `avgImpactScore`; null when totalImpacts=0). DELETE cascade-soft-deletes
      regulatory_impact rows where `regulatory_update_id = :id`; structural
      impacts (column IS NULL) are not affected (AC-S10-02). Date-ordering
      guards: `effectiveDate >= publishedDate` (AC-S8-03);
      `complianceDeadline >= publishedDate` (AC-S8-04). UPDATE has an
      `publishedDate` floor guard — cannot move below MIN(detected_at) of
      associated impacts (AC-S9-02).
  - name: M5 — Regulatory Impacts
    description: |
      Per-contract regulatory impact analysis (M5 — S11..S13). 3 endpoints
      under `/api/v1/regulatory-impacts/*`. **Bulk-detect** (POST
      `/bulk-detect`) is the only DEFINER carve-out in M5 — `fn_regulatory_impact_create_bulk`
      runs `SECURITY DEFINER` so legal_counsel can write impacts on contracts
      they don't directly own; defence-in-depth permission gate at fn body
      line 1 + S2-17 atomic gate+commit (SELECT FOR UPDATE on regulatory_update
      before the per-contract INSERT loop) preserve invariants. Idempotent
      re-runs via ON CONFLICT DO NOTHING on the COALESCE-sentinel UNIQUE
      `(contract_id, regulation_id, COALESCE(regulatory_update_id, 0::BIGINT))`
      partial index (Postgres NULLS-DISTINCT default; M4 ai_insight precedent).
      `impactPayload` is SENSITIVE — pino-redacted at controller (covered by
      `ai_prompt_payload` class per M4 precedent). **List** (GET) requires at
      least one of contractId/regulationId/regulatoryUpdateId (AC-S12-02);
      RLS narrows for non-admin (drafter sees only their drafted contracts;
      executive sees system-wide). S2-18 NULL-safe equality on
      regulatoryUpdateId via `IS NOT DISTINCT FROM`. **Resolve** (PATCH
      `/:id/resolve`) is polymorphic-permission: regulations.manage OR
      contract.drafted_by = current_user (AC-S13-05). resolutionAction='pending'
      un-resolves (resolved=FALSE). Q9 EMIT — emits `regulatory_impact_detected`
      activity per successfully-inserted impact (bulk-detect) and
      `regulatory_impact_resolved` (resolve, only when v_resolved=TRUE).
  - name: M5 — Impact Categories
    description: |
      Impact category taxonomy admin (M5 — S14..S15). 2 endpoints under
      `/api/v1/impact-categories`. **List** (GET) sorted by `display_order ASC`;
      no pagination (small reference table, ~8-12 rows seeded in migration
      052); accessible to ALL authenticated roles including `contract_recipient`
      (AC-S14-05 — only M5 endpoint without a permission gate beyond JWT;
      taxonomy used by FE form pickers). **Upsert** (POST) is single-call
      keyed on `key` (ON CONFLICT (key) DO UPDATE — AC-S15-01/02); returns
      200 for both create and update with `createdOrUpdated` discriminator
      (idiomatic upsert; differs from regulation/regulatory-update create
      which return 201). `config.manage` permission required (AC-S15-05 —
      legal_counsel cannot manage impact categories — platform_admin only).
  - name: M6 — Dashboards
    description: |
      Dashboards & Reporting (M6 — S1..S8 + S11). 9 endpoints under
      `/api/v1/dashboards/*` covering 5 role-scoped dashboards (admin /
      drafter / approver / legal-counsel / recipient), 1 dashboard router
      helper (S6), the executive enterprise overview (S7) plus its anomalies
      history viewer (S8), and the standalone AI cost summary (S11). Each
      role-scoped dashboard returns a `kpis + (trends|lists)` snapshot
      derived from M0..M5 telemetry — contract / approval_step /
      approval_decision / signature_event / signature_invitation /
      regulatory_impact / ai_request_log / ai_insight — without introducing
      any new persistent tables. All 9 are JWT-authed. Permission posture:
      role-based gates inside the fn body (RAISE 42501 → HTTP 403); the
      executive dashboard adds an **OR** path on the new `insights.executive`
      permission code (3 role grants seeded in migration 054); S11 requires
      the M4-seeded `ai.observability.read` (defence-in-depth pre-gate at
      route + fn body). The router endpoint (S6) accepts no params; all
      others accept `windowDays` (1..365 for operational dashboards; 1..90
      for `ai-cost-summary`; default 30 for operational, 90 for executive,
      30 for ai-cost; default `limit=10` range 1..50 for
      `executive/anomalies-history`). Q5 single-source-of-compute lock:
      `fn_dashboard_executive.kpis.aiCostUsdWindow` (S7 inline) and the
      standalone `fn_dashboard_ai_cost_summary` (S11) BOTH read from
      `fn_ai_request_log_cost_report` (M4 043). The S7 inline field returns
      `null` (no error) when the caller lacks `ai.observability.read`. S6
      `dashboardKey` is computed via the live nested `role:{id,name}` shape
      from `fn_user_get_by_id` (S2-22-WARN-3-FIX COALESCE chain). All 10
      M6 fn_'s are SECURITY INVOKER; **zero new PUBLIC EXECUTE grants**
      (S2-21 sustained at the M3 set of 5 — sixth consecutive validation).
      No cron driver added (M6 is read-only).
  - name: M6 — Admin Health
    description: |
      Admin observability health probe (M6 — S12). Single endpoint
      `GET /api/v1/admin/health` — distinct from M0's existing public
      liveness `/api/health` (no version prefix; no auth). Admin-scoped:
      JWT + `platform_admin` OR Super Admin role check inside the fn body.
      Returns `db` (status / latestMigration / currentTimestamp), `ai`
      (lastSuccessfulRequestAt / lastFailureAt / estimatedHealthy), and
      `overall` (`'ok'` | `'degraded'` | `'unhealthy'`) computed from the
      composition. `db.latestMigration` reads
      `MAX(schema_migrations.version)` and **requires the new RLS SELECT
      policy** `schema_migrations_select_admin` from migration 054
      (ARCH-NEW-3 option (c)) — without it the deny-all RLS would block
      the read on a non-superuser pool connection and `latestMigration`
      would return NULL. The audit probe (errorCountLastHour + lastErrorAt)
      was DROPPED in design Patch Round 1 (S2-22-WARN-2-FIX) — the
      `audit_log.action` CHECK enum is `'INSERT','UPDATE','DELETE'` only,
      so the `'ERROR'` literal could never match; the error signal is now
      sourced exclusively from `ai_request_log.outcome`. `fn_health_check`
      stays SECURITY INVOKER (no DEFINER carve-out); the new permissive
      SELECT policy is what unlocks the latestMigration read.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token (15-minute TTL). Validated claims: `aud`, `iss`, `exp`.
        Issued by `POST /api/v1/auth/login`.
        Refreshed via `POST /api/v1/auth/refresh` (rotation: both access AND
        refresh tokens are rotated; old refresh is blacklisted server-side).
        Logout blacklists the supplied refresh token via `fn_auth_blacklist_token`.

    signedPdfToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        **M4 — NEW security scheme.** Short-lived HMAC-signed token bearer
        authentication for the single PUBLIC AI endpoint
        `POST /api/v1/ai/regulatory-impact-summary` (S5). The token is a
        compact JWT (HS256) issued by the future PDF generator pipeline;
        it is NOT a session JWT and does NOT carry a user id.

        **Validation chain** (`signedPdfTokenMiddleware`):
        - Algorithm: HS256 only.
        - Audience (`aud`): MUST equal `SIGNED_PDF_TOKEN_AUDIENCE`
          (default `regulatory-impact-pdf`).
        - Issuer (`iss`): MUST equal `SIGNED_PDF_TOKEN_ISSUER` (default
          `musanad-contracts-pdf`).
        - Expiry (`exp`): enforced by `jsonwebtoken.verify`.
        - Nonce (`jti`): single-use guard (in-process Set; per-replica only).
        - Header source: `Authorization: Bearer <token>` OR `X-Signed-Pdf-Token: <token>`.

        **Required environment variable:** `SIGNED_PDF_TOKEN_SECRET` — if
        unset at boot, S5 returns `503 service_unavailable` (intentional;
        S5 is the only endpoint affected; documented in BE-IMPL-INFO-2 +
        ops-runbook M4 section).

        **Rate limit:** in-process per-token bucket (10 calls / hour) —
        BE-IMPL-INFO-2 single-replica caveat. Substituted for
        `fn_ai_request_log_check_rate_limit` because the public endpoint has
        no actor user id; one `ai_request_log` row is still appended per
        invocation with `actor_user_id=NULL` so cost telemetry is preserved.

        **Important:** the underlying database functions
        (`fn_ai_insight_get_cached`, `fn_ai_insight_upsert`,
        `fn_ai_prompt_get`, `fn_ai_request_log_create`) remain
        `neondb_owner`-only DEFINER — NOT in the PUBLIC EXECUTE allowlist.
        This is Q3 Option A: controller-mediated PUBLIC; underlying fn_'s
        keep DB-layer least-privilege. Loses DB-layer defence-in-depth for
        the public path; trade-off documented in db-design.md DN-3.
        S2-21 invariant: PUBLIC EXECUTE on fn_'s stays at exactly the M3 set
        of 5 names (M4 contributes 0 new PUBLIC fn_ grants).

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  headers:
    X-Request-ID:
      description: Correlation UUID. Propagated through controller, fn_ calls, and Pino logs.
      schema:
        type: string
        format: uuid

  schemas:
    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 3 }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. VALIDATION_ERROR, UNAUTHORIZED).
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable, sanitized message. Raw PG errors are NEVER passed through.
              example: Email is required
            requestId:
              type: string
              format: uuid
              description: Correlation id, also returned in the X-Request-ID header.
            fields:
              type: object
              description: Optional per-field validation errors (Zod issues mapped here).
              additionalProperties:
                type: array
                items: { type: string }
      example:
        success: false
        error:
          code: VALIDATION_ERROR
          message: Invalid request body
          requestId: 7d0c1d2e-7c0f-4d6f-9b6c-9b9b1f7c2d3e
          fields:
            email: ["Required"]

    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Super Admin }

    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description:
          type: string
          nullable: true
        permissionCount: { type: integer, example: 4 }

    Permission:
      type: object
      required: [id, code, module, action]
      properties:
        id: { type: integer }
        code:
          type: string
          example: user.read.all
          description: Canonical permission identifier (dot-notation). NOT a name.
        module: { type: string, example: user }
        action: { type: string, example: read.all }
        description:
          type: string
          nullable: true

    User:
      type: object
      required: [id, email, firstName, lastName, isActive, createdAt, updatedAt, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }
          description: Array of permission CODES held by this user (via role).
          example: ["audit.read", "role.manage", "user.manage", "user.read.all"]

    AuthUser:
      type: object
      description: User shape stored in frontend auth state. Strict subset of User; never contains passwordHash.
      required: [id, email, firstName, lastName, role, permissions]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          items: { type: string }

    UserListItem:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          $ref: "#/components/schemas/RoleRef"
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"

    RefreshTokenDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    LogoutDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }

    CreateUserDto:
      type: object
      required: [email, password, firstName, lastName, roleId]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Plaintext on the wire only. BE bcrypt-hashes (12 rounds) before fn_user_create. Pino-redacted.
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        roleId: { type: integer, minimum: 1 }

    UpdateUserDto:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roleId: { type: integer, minimum: 1 }

    DeleteUserResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string, example: User deactivated }

    HealthResponse:
      type: object
      required: [status, db, timestamp, requestId]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [reachable, unreachable]
        uptime:
          type: number
          description: Process uptime in seconds.
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    UaePassInitiateRequest:
      type: object
      additionalProperties: false
      properties:
        redirectAfter:
          type: string
          format: uri
          description: Optional client redirect target after callback completes.

    UaePassInitiateResponse:
      type: object
      required: [authorizeUrl, state]
      properties:
        authorizeUrl: { type: string, format: uri }
        state:
          type: string
          minLength: 32
          description: Random hex (>= 32 chars). Single-use, 5-minute TTL. Echo unchanged into /callback.

    UaePassCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code from the UAE Pass IdP.
        state:
          type: string
          minLength: 1
          description: Echo of the state issued by /initiate. Single-use, 5-min TTL. (CRX-3)

    UaePassCallbackResponse:
      type: object
      required: [success, provider, identity]
      properties:
        success: { type: boolean, enum: [true] }
        provider:
          type: string
          enum: [mock, live]
        identity:
          type: object
          required: [sub, trustLevel]
          properties:
            sub: { type: string }
            fullNameEn: { type: string, nullable: true }
            fullNameAr: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            trustLevel: { type: string, example: SOP2 }

    # ------------------------------------------------------------
    # M1a — Contracts: Core CRUD & Lifecycle
    # ------------------------------------------------------------
    ContractStatus:
      type: string
      description: |
        16-state contract lifecycle. M1a established 14 values; M2 extends the
        CHECK to 16 with `in_approval` and `cancelled` (migration 023). The
        enum membership is only one of two gates — M2 also enforces a per-
        transition matrix in fn_contract_status_update_user (drafter wrapper)
        and fn_contract_status_update_internal (system, called only by
        fn_approval_decide). See PATCH /contracts/{id}/status for the wire
        contract; see the M2 data dictionary for the full transition matrix.
      enum:
        - draft
        - in_review
        - in_approval
        - approved
        - awaiting_signature_employer
        - awaiting_signature_counterparty
        - fully_signed
        - active
        - expiring_soon
        - expired
        - amended
        - renewed
        - terminated
        - rejected
        - resubmission_requested
        - cancelled

    ContractLanguage:
      type: string
      enum: [en, ar, bilingual]

    ContractGoverningLaw:
      type: string
      enum: [uae_federal, dubai, abu_dhabi, sharjah, difc, adgm, english, other]
      nullable: true

    ContractRelationshipType:
      type: string
      description: Relationship to the parent contract when parentContractId is set.
      enum: [amendment, renewal, extension, superseded, sow_under_msa]
      nullable: true

    ContractActivityType:
      type: string
      description: |
        Activity event type. M1a set (7 values) extended in M1b via migration 010
        (`payment_schedule_replaced`, `exported`) and re-permitted in
        `fn_contract_activity_create` whitelist via migration 013. Total: 9 values.
        See dev-handoff §"How to extend M1a — To add a new activity_type" for the
        ALTER CHECK pattern.
      enum:
        - created
        - updated
        - status_changed
        - version_created
        - tagged
        - soft_deleted
        - restored
        - payment_schedule_replaced
        - exported

    ContractActorRef:
      type: object
      nullable: true
      required: [id, firstName, lastName]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }

    ContractListItem:
      type: object
      description: |
        Slim list payload. body_en/body_ar are NEVER returned here (AC-S1-08).
        M1c additively extends this shape with 3 new fields (importBatchId,
        importConfidence, importWarnings) — always present, null when the
        contract was not bulk-imported. fn_contract_list signature widened
        15→18 params in migration 017.
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - currency
        - currentVersion
        - tags
        - createdAt
        - updatedAt
        - importBatchId
        - importConfidence
        - importWarnings
      properties:
        id: { type: integer }
        contractNumber: { type: string, example: CT-2026-000123 }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        status: { $ref: "#/components/schemas/ContractStatus" }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string, example: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        ourPartyId: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string }
        currentVersion: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        importBatchId:
          type: integer
          nullable: true
          description: M1c addition. import_batch.id this contract belongs to. NULL when not bulk-imported.
        importConfidence:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: M1c addition. AI extraction confidence 0..100. NULL when not extracted.
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: M1c addition. Human-readable AI extraction warnings. NULL when none.

    Contract:
      type: object
      description: |
        Full contract payload. bodyEn/bodyAr appear in the response but are
        pino-redacted on logging.
      required:
        - id
        - contractNumber
        - titleEn
        - contractType
        - status
        - language
        - currency
        - currentVersion
        - tags
        - attachmentCount
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        contractType: { type: string }
        templateId: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        expiryNoticeDays: { type: integer, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on logging; redacted in audit_log.
        currentVersion: { type: integer }
        draftedBy: { $ref: "#/components/schemas/ContractActorRef" }
        reviewedBy: { $ref: "#/components/schemas/ContractActorRef" }
        approvedBy: { $ref: "#/components/schemas/ContractActorRef" }
        aiRiskScore: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        aiSummaryEn: { type: string, nullable: true }
        aiSummaryAr: { type: string, nullable: true }
        importBatchId:
          type: integer
          nullable: true
          description: |
            M1c addition (always present in projection post-migration 022 — Codex H1 fix).
            import_batch.id this contract belongs to. NULL when not bulk-imported.
        importConfidence:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: |
            M1c addition (always present in projection post-migration 022).
            AI extraction confidence 0..100. NULL when not extracted.
        importFilename:
          type: string
          nullable: true
          description: |
            M1c addition (always present in projection post-migration 022).
            Original uploaded filename (no path / no extension stripped).
            NULL when not bulk-imported. Deliberately NOT in fn_audit_trigger redact list
            (Design Note D1 — useful for forensics, not classified PII).
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            M1c addition (always present in projection post-migration 022).
            Human-readable AI extraction warnings.
            NULL when key absent on insert; '[]' when explicitly empty (key-exists semantics).
        tags:
          type: array
          items: { type: string }
        attachmentCount: { type: integer, example: 0 }
        commentCount: { type: integer, example: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContractDto:
      type: object
      required: [titleEn, contractType]
      additionalProperties: false
      description: |
        Create a contract. M1c additively extends this DTO with 4 optional
        import-trace fields (importBatchId, importFilename, importConfidence,
        importWarnings) consumed by the bulk-import flow (S5 auto-save) and the
        manual-entry flow (S7). Migration 019 extended fn_contract_create to
        read these from p_data; migration 020 hardened the body to preserve the
        Codex BE-001 SELECT FOR UPDATE on parent_contract_id and changed
        importWarnings missing-key semantics to NULL (key-exists check).
        Existing M1a/M1b callers passing the original 19 fields are unaffected
        — Zod .strict() permits, fn_ ignores when absent.
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, minLength: 1, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string, default: AED }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0, default: 30 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        bodyAr:
          type: string
          nullable: true
          description: SENSITIVE - pino-redacted on inbound request body.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        importBatchId:
          type: integer
          minimum: 1
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S5-08). import_batch.id this insert belongs to.
            FK fk_contract_import_batch_id (ON DELETE SET NULL) — bad id surfaces
            as 400 with field='importBatchId' (translatePgError 23503 mapping).
            Migration 020 also adds a SELECT FOR UPDATE existence check inside
            fn_contract_create so concurrent batch soft-deletes are serialised.
        importFilename:
          type: string
          maxLength: 500
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S7-04). Original uploaded filename. Persists
            unredacted into contract.import_filename — kept out of pino redact
            list per Design Note D1 (forensics use case; not project.config.json
            sensitiveFields).
        importConfidence:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            M1c addition (OI-2 / AC-S7-04). AI extraction confidence 0..100.
            In-fn range guard fires before column CHECK so error envelope is
            structured ('importConfidence:Confidence must be between 0 and 100').
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            M1c addition (OI-2 / AC-S5-09 indirect). Array of human-readable AI
            warnings. fn_contract_create uses JSONB key-exists semantics
            (post-migration 020): missing key → NULL; explicit `[]` → `'[]'::jsonb`;
            populated array → preserved verbatim.

    UpdateContractDto:
      type: object
      additionalProperties: false
      description: |
        Partial COALESCE update. Status MUST NOT be supplied here - use
        PATCH /contracts/{id}/status instead (AC-S4-04, .strict() rejects).
        Tags are not part of this DTO - use PUT /contracts/{id}/tags.
      properties:
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, maxLength: 500, nullable: true }
        contractType: { type: string, maxLength: 50 }
        templateId: { type: integer, nullable: true }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer, nullable: true }
        counterpartyId: { type: integer, nullable: true }
        valueAed: { type: number, format: double, minimum: 0, nullable: true }
        currency: { type: string }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        expiryNoticeDays: { type: integer, minimum: 0 }
        emirate: { type: string, nullable: true }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string, nullable: true }
        parentContractId: { type: integer, nullable: true }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }

    UpdateContractStatusDto:
      type: object
      required: [newStatus]
      additionalProperties: false
      properties:
        newStatus: { $ref: "#/components/schemas/ContractStatus" }
        reason: { type: string, maxLength: 500, nullable: true }

    SetContractTagsDto:
      type: object
      required: [tags]
      additionalProperties: false
      properties:
        tags:
          type: array
          description: Replacement tag set. Empty array clears all tags.
          items: { type: string, minLength: 1, maxLength: 64 }

    CreateContractVersionDto:
      type: object
      required: [changeNote]
      additionalProperties: false
      description: |
        At least one of bodyEn or bodyAr must be provided (AC-S10-04).
      properties:
        bodyEn: { type: string, nullable: true, description: SENSITIVE }
        bodyAr: { type: string, nullable: true, description: SENSITIVE }
        changeNote: { type: string, minLength: 1, maxLength: 500 }
        diffSummary: { type: string, nullable: true }

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        bodyEn: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        bodyAr: { type: string, nullable: true, description: SENSITIVE - pino-redacted on log }
        diffSummary: { type: string, nullable: true }
        changeNote: { type: string, nullable: true }
        changedBy: { $ref: "#/components/schemas/ContractActorRef" }
        createdAt: { type: string, format: date-time }

    ContractTreeNode:
      type: object
      required: [id, contractNumber, titleEn, status, depth]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ContractStatus" }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        parentContractId: { type: integer, nullable: true }
        depth:
          type: integer
          description: Distance (in node hops) from the root. 0 = root.
        currentVersion: { type: integer }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }

    ContractActivity:
      type: object
      required: [id, contractId, activityType, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        activityType: { $ref: "#/components/schemas/ContractActivityType" }
        actor: { $ref: "#/components/schemas/ContractActorRef" }
        descriptionEn: { type: string, nullable: true }
        descriptionAr: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Free-form JSON. Examples:
            - status_changed: { fromStatus, toStatus, reason? }
            - version_created: { versionNumber }
            - tagged: { added: string[], removed: string[] }
        createdAt: { type: string, format: date-time }

    ContractListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractVersionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractVersion" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractActivityListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractActivity" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ContractTreeResponse:
      type: object
      required: [rootId, tree, currentNode, truncated]
      properties:
        rootId: { type: integer }
        tree:
          type: array
          items: { $ref: "#/components/schemas/ContractTreeNode" }
        currentNode: { $ref: "#/components/schemas/ContractTreeNode" }
        truncated:
          type: boolean
          description: True when traversal hit the depth-20 cap (AC-S7-05).

    UpdateContractStatusResponse:
      type: object
      required: [id, fromStatus, toStatus, changedAt]
      properties:
        id: { type: integer }
        fromStatus: { $ref: "#/components/schemas/ContractStatus" }
        toStatus: { $ref: "#/components/schemas/ContractStatus" }
        changedAt: { type: string, format: date-time }

    SetContractTagsResponse:
      type: object
      required: [id, tags]
      properties:
        id: { type: integer }
        tags:
          type: array
          items: { type: string }

    CreateContractVersionResponse:
      type: object
      required: [id, contractId, versionNumber, createdAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        versionNumber: { type: integer }
        createdAt: { type: string, format: date-time }

    DeleteContractResponse:
      type: object
      required: [success, id, message]
      properties:
        success: { type: boolean, enum: [true] }
        id: { type: integer }
        message: { type: string, example: Contract soft-deleted }

    # ----------------------------------------------------------------------
    # M1b — Compose Wizard, Payment Schedules & Exports
    # ----------------------------------------------------------------------

    PaymentScheduleStatus:
      type: string
      description: Milestone lifecycle state (mirrors Lovable enum).
      enum: [pending, due, paid, overdue, waived, cancelled]

    PaymentScheduleRecurrence:
      type: string
      nullable: true
      description: Recurrence mode for recurring milestones. NULL = single (non-recurring).
      enum: [once, monthly, quarterly, annually]

    PaymentSchedule:
      type: object
      description: |
        Per-contract milestone payment row. CASCADE-deletes with the parent
        contract; soft-deleted by `fn_payment_schedule_create_bulk` replace path
        (the only writer that flips `is_active` outside CASCADE). Direct DELETE
        is denied by `payment_schedule_deny_direct_delete` RESTRICTIVE policy.
      required:
        - id
        - contractId
        - milestoneLabelEn
        - amountAed
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, example: 12 }
        contractId: { type: integer, example: 123 }
        milestoneLabelEn:
          type: string
          maxLength: 255
          description: Short display tag (e.g. "Milestone 1", "Phase 2 Payment"). Required.
          example: Milestone 1
        milestoneLabelAr:
          type: string
          maxLength: 255
          nullable: true
          description: Arabic counterpart of milestoneLabelEn. Optional.
        milestoneNameEn:
          type: string
          maxLength: 500
          nullable: true
          description: Descriptive title for the milestone. Optional. Both label AND name retained per Q6 — see data-dictionary.
          example: Initial deposit on signature
        milestoneNameAr:
          type: string
          maxLength: 500
          nullable: true
        amountAed:
          type: number
          format: double
          minimum: 0
          description: Milestone payment amount in AED. NUMERIC(15,2). Zero allowed for waived/cancelled milestones.
          example: 50000.00
        dueDate:
          type: string
          format: date
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status flips to `paid`. CHECK enforces (paid_at IS NULL OR status = 'paid').
        status:
          $ref: "#/components/schemas/PaymentScheduleStatus"
        recurrence:
          $ref: "#/components/schemas/PaymentScheduleRecurrence"
        invoiceRef:
          type: string
          maxLength: 100
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentScheduleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: |
            Active milestones for the contract, ordered by `due_date ASC NULLS LAST`
            then `id ASC`. Not paginated (per-contract counts typically 1–30).
          items: { $ref: "#/components/schemas/PaymentSchedule" }

    PaymentScheduleCreateDto:
      type: object
      required: [milestoneLabelEn, amountAed]
      properties:
        milestoneLabelEn: { type: string, minLength: 1, maxLength: 255 }
        milestoneLabelAr: { type: string, maxLength: 255, nullable: true }
        milestoneNameEn:  { type: string, maxLength: 500, nullable: true }
        milestoneNameAr:  { type: string, maxLength: 500, nullable: true }
        amountAed:        { type: number, format: double, minimum: 0 }
        dueDate:          { type: string, format: date, nullable: true }
        paidAt:           { type: string, format: date-time, nullable: true }
        status:           { $ref: "#/components/schemas/PaymentScheduleStatus" }
        recurrence:       { $ref: "#/components/schemas/PaymentScheduleRecurrence" }
        invoiceRef:       { type: string, maxLength: 100, nullable: true }

    PaymentScheduleBulkReplaceDto:
      type: object
      required: [rows]
      description: |
        Atomic bulk-replace request body. Controller hardcodes
        `p_replace_existing=true` (AC-S3-01) regardless of `replaceExisting`
        client field. `fn_payment_schedule_create_bulk` takes
        `SELECT FOR UPDATE` on the parent contract row to serialise concurrent
        callers (Codex BE-001 hardening, AC-S3-11).
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PaymentScheduleCreateDto" }
        replaceExisting:
          type: boolean
          description: Optional, ignored — endpoint always replaces.

    PaymentScheduleBulkReplaceResponse:
      type: object
      required: [contractId, inserted, softDeleted, rows]
      properties:
        contractId:   { type: integer }
        inserted:     { type: integer, description: Count of rows inserted by this call. }
        softDeleted:  { type: integer, description: Count of rows deactivated by the replace path. }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PaymentSchedule" }

    # ----------------------------------------------------------------------
    # M1c — Bulk & Manual Import
    # ----------------------------------------------------------------------

    ImportBatchStatus:
      type: string
      description: |
        4-value lifecycle enum for import_batch.status. CHECK constraint enforced
        on the column. Allowed transitions (AC-S2-02 — fn_import_batch_update):
          in_progress → paused | completed | cancelled
          paused      → in_progress | completed | cancelled
          completed   → (terminal — no transitions; AC-S2-08)
          cancelled   → (terminal — no transitions; AC-S2-08)
        Cancellation is a status transition, NOT is_active=false. The
        trg_import_batch_immutable_fields BEFORE UPDATE trigger raises
        SQLSTATE 42501 (BE 403) on any direct flip of is_active.
      enum: [in_progress, paused, completed, cancelled]

    ImportBatchStatusMode:
      type: string
      description: |
        3-value enum embedded in the import_batch.config JSONB key statusMode.
        Validated server-side inside fn_import_batch_create — NOT a DB CHECK
        on the table (Design Note D6 — JSONB-shape CHECK is brittle and slow).
          active — every imported contract lands with status='active'
          draft  — every imported contract lands with status='draft'
          auto   — use the AI-detected status from extract-contract-bulk
      enum: [active, draft, auto]

    ImportBatchConfig:
      type: object
      description: |
        Batch defaults JSONB (camelCase keys) stored in import_batch.config.
        Validated by fn_import_batch_create + Zod CreateImportBatchSchema (.strict).
      additionalProperties: false
      properties:
        contractType:
          type: string
          description: |
            Optional override of the M1a contract.contract_type CHECK enum value
            applied to every contract in this batch. Hardcoded 8-value list inside
            fn_import_batch_create (cross-ref M1a migration 003): service,
            employment, vendor, partnership, lease, license, nda, other.
        statusMode:
          $ref: "#/components/schemas/ImportBatchStatusMode"
        defaultCounterpartyId:
          type: integer
          minimum: 1
          description: |
            Optional default counterparty applied when AI does not detect one.
            Forward-references the (deferred) Parties module — kept nullable
            until that module ships.

    ImportBatch:
      type: object
      description: |
        Full import_batch shape returned by fn_import_batch_get_by_id (S4) and
        used as the response body of fn_import_batch_create (S1) +
        fn_import_batch_update (S2 — both end with `RETURN
        fn_import_batch_get_by_id(...)`). initiatedBy is hydrated as a UserRef
        via M0 fn_user_get_by_id (AC-S4-04). For the lighter list shape see
        ImportBatchListItem.
      required:
        - id
        - initiatedBy
        - config
        - totalFiles
        - autoSaved
        - reviewQueue
        - manualEntry
        - duplicatesSkipped
        - errored
        - status
        - startedAt
        - completedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, example: 42 }
        initiatedBy:
          allOf:
            - $ref: "#/components/schemas/ContractActorRef"
          description: |
            Operator identity. UserRef hydrated by fn_user_get_by_id. Immutable
            post-create — trg_import_batch_immutable_fields raises SQLSTATE
            42501 on any UPDATE that changes initiated_by (Codex C1 fix).
        config:
          $ref: "#/components/schemas/ImportBatchConfig"
        totalFiles:
          type: integer
          minimum: 1
          description: |
            Up-front file count, set on create; immutable thereafter. CHECK >= 1.
            Sum of the 5 counters is bounded by this value — chk_import_batch_counter_sum.
        autoSaved:
          type: integer
          minimum: 0
          description: |
            Files that AI extraction routed straight to active/draft contracts
            (high-confidence track). Mutated only via fn_import_batch_update
            with SELECT FOR UPDATE on the batch row (Codex BE-001).
        reviewQueue:
          type: integer
          minimum: 0
          description: Files routed to the human review queue (medium-confidence track).
        manualEntry:
          type: integer
          minimum: 0
          description: Files routed to the manual-entry track (low-confidence or extraction-failed).
        duplicatesSkipped:
          type: integer
          minimum: 0
          description: |
            Files skipped because the FE pre-check matched an existing active
            contract by detectedDuplicateContractNumber (AC-S5-09).
        errored:
          type: integer
          minimum: 0
          description: |
            Files that failed extraction or upload entirely (OI-6 / Design Note D3).
            Without this counter, batches with errors could never reach
            status='completed'. Sum-bounded with the 4 above against totalFiles.
        status:
          $ref: "#/components/schemas/ImportBatchStatus"
        startedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp set at row creation.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 timestamp. Non-NULL iff status is terminal (completed |
            cancelled) — enforced declaratively by chk_import_batch_completed_at_status
            (Design Note D2).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImportBatchListItem:
      type: object
      description: |
        Lighter list shape returned by fn_import_batch_list (S3). initiatedBy is
        a raw bigint user id (not a UserRef) to keep the admin list query lean.
        createdAt/updatedAt omitted (list shows startedAt + completedAt only).
      required:
        - id
        - initiatedBy
        - totalFiles
        - autoSaved
        - reviewQueue
        - manualEntry
        - duplicatesSkipped
        - errored
        - status
        - config
        - startedAt
        - completedAt
      properties:
        id: { type: integer }
        initiatedBy:
          type: integer
          description: Raw bigint user id. Drill-down to UserRef via GET /import-batches/:id.
        totalFiles: { type: integer, minimum: 1 }
        autoSaved: { type: integer, minimum: 0 }
        reviewQueue: { type: integer, minimum: 0 }
        manualEntry: { type: integer, minimum: 0 }
        duplicatesSkipped: { type: integer, minimum: 0 }
        errored: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        config: { $ref: "#/components/schemas/ImportBatchConfig" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ImportBatchListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ImportBatchListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateImportBatchDto:
      type: object
      required: [totalFiles]
      additionalProperties: false
      description: |
        Body of POST /api/v1/import-batches (S1). Maps to fn_import_batch_create
        p_data JSONB. initiated_by is set server-side from req.user.id (NOT a
        body field — AC-S1-05; RLS policy import_batch_insert_runner enforces
        post-image matches current_user_id, blocking impersonation).
      properties:
        totalFiles:
          type: integer
          minimum: 1
          description: AC-S1-02. CHECK total_files >= 1.
        config:
          $ref: "#/components/schemas/ImportBatchConfig"

    UpdateImportBatchDto:
      type: object
      additionalProperties: false
      description: |
        Body of PATCH /api/v1/import-batches/:id (S2). Counter deltas are SIGNED
        integers — negative deltas allowed iff result remains >= 0 (AC-S2-04
        underflow guard); the 5-counter sum is bounded by chk_import_batch_counter_sum
        (AC-S2-05 overflow guard). Status transitions validated against the
        4-value allowed-transition table (AC-S2-02). Zod .strict() rejects unknown
        keys; .refine() requires at least one field to be present.
      properties:
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        autoSavedDelta:
          type: integer
          description: |
            Default 0 (no-op). AC-S2-04 underflow → 400 with field='autoSaved'.
        reviewQueueDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='reviewQueue'.
        manualEntryDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='manualEntry'.
        duplicatesSkippedDelta:
          type: integer
          description: Default 0. AC-S2-04 underflow → 400 with field='duplicatesSkipped'.
        erroredDelta:
          type: integer
          description: |
            Default 0. OI-6 / Design Note D3 — 5th counter so 'completed' status
            can be reached when files fail extraction. AC-S2-04 underflow →
            400 with field='errored'.

    ExtractContractBulkRequest:
      type: object
      required: [filename, fileSize, extractedText, batchId]
      additionalProperties: false
      description: |
        Body of POST /api/v1/ai/extract-contract-bulk (S8). FROZEN per HQ2 —
        M4 must replace the controller body without changing this DTO. The
        already-extracted text is sent here (mammoth/pdfjs run in the browser
        per AC-S5-02 / HQ1 — backend never sees the file bytes).
      properties:
        filename:
          type: string
          minLength: 1
          description: Non-empty original filename.
        fileSize:
          type: integer
          minimum: 0
          description: File size in bytes (informational — locked for M4 use).
        extractedText:
          type: string
          minLength: 50
          description: |
            Already-extracted text. Min 50 chars (AC-S8-03). SENSITIVE —
            classified as ai_prompt_payload per project.config.json
            sensitiveFields. Pino-redacted across 7 paths (Codex M1 fix:
            top-level, req.body.*, req.body.*.*, req.query.*, req.params.*,
            *.X, *.*.X). The AI controller additionally never passes req.body
            to a logger call — only filename/fileSize/batchId/textLength.
        batchId:
          type: integer
          minimum: 1
          description: import_batch.id this file belongs to. Positive bigint.

    ExtractContractBulkResponse:
      type: object
      required: [importConfidence, importWarnings]
      additionalProperties: false
      description: |
        Response body of POST /api/v1/ai/extract-contract-bulk. FROZEN DTO per
        HQ2 — M4 replaces the controller body without changing this shape
        (AC-S8-07). Fields are the union of M1a CreateContractDto (all optional —
        AI may not detect every field) + M1c-specific extraction metadata.
        M1c stub computes importConfidence as
        round(min(95, max(20, extractedText.length / 100))) — pure deterministic
        function in src/services/ai/extract-contract-bulk.service.ts (BE-AI-stub-formula).
      properties:
        # M1a CreateContractDto fields (all optional)
        titleEn: { type: string }
        titleAr: { type: string }
        contractType: { type: string }
        templateId: { type: integer }
        language: { $ref: "#/components/schemas/ContractLanguage" }
        ourPartyId: { type: integer }
        counterpartyId: { type: integer }
        valueAed: { type: number, format: double }
        currency: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        expiryNoticeDays: { type: integer }
        emirate: { type: string }
        governingLaw: { $ref: "#/components/schemas/ContractGoverningLaw" }
        jurisdictionCourt: { type: string }
        parentContractId: { type: integer }
        relationshipType: { $ref: "#/components/schemas/ContractRelationshipType" }
        bodyEn: { type: string, description: SENSITIVE — pino-redacted on log. }
        bodyAr: { type: string, description: SENSITIVE — pino-redacted on log. }
        tags:
          type: array
          items: { type: string }
        # M1c-specific extraction metadata
        importConfidence:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            REQUIRED. AI extraction confidence — routes the per-file result via
            IMPORT_CONFIDENCE_THRESHOLDS in S5:
              high   (>= 80) → auto-save track
              medium (50..79) → review queue
              low    (<50)   → manual entry track
            AC-S5-05 / AC-S8-04.
        importWarnings:
          type: array
          nullable: true
          items: { type: string }
          description: |
            REQUIRED. Human-readable warnings produced during extraction.
            null when no warnings apply.
        detectedDuplicateContractNumber:
          type: string
          nullable: true
          description: |
            Optional. When the AI detects a contract number on the document, the
            FE pre-checks against existing active contracts; matching rows are
            skipped and duplicatesSkipped is incremented (AC-S5-09).

    # ===================================================================
    # M2 — Approval Workflows schemas
    # ===================================================================

    UserRef:
      type: object
      description: Lightweight user reference (id + display fields). Reused across M2 chain payloads.
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }

    ApprovalChainStatus:
      type: string
      description: Approval chain lifecycle. `in_progress` is the only non-terminal state. `cancelled` is set when a drafter or admin cancels a contract before chain completion (AE-3 contract.status='cancelled' counterpart).
      enum: [in_progress, approved, rejected, resubmission_requested, cancelled]

    ApprovalStepStatus:
      type: string
      description: |
        Approval step lifecycle. Note `delegated` and `reassigned` are reserved on the CHECK constraint but unwritten by M2 — fn_approval_delegate and fn_approval_reassign leave step.status='pending' (AC-S3-01 / AC-S8-03). Forward-compat reservation only.
      enum: [pending, approved, rejected, skipped, escalated, resubmission_requested, delegated, reassigned]

    ApprovalDecisionType:
      type: string
      enum: [approve, reject, request_resubmission, delegate, reassign, escalate]

    ApprovalPendingSort:
      type: string
      enum: [oldest, newest, highest_value]

    ApprovalMatrixRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        contractType: { type: string }
        valueMin: { type: number }
        valueMax: { type: number, nullable: true }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApprovalMatrixRuleInput:
      type: object
      required: [stepOrder, approverRole]
      properties:
        stepOrder: { type: integer, minimum: 1 }
        parallelGroup:
          type: integer
          nullable: true
          description: When set, MUST equal stepOrder (AC-S5-05).
        approverRole:
          type: string
          description: Must exist in role.name (AC-S5-03).
        isRequired: { type: boolean, default: true }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true, minimum: 1 }

    UpdateApprovalMatrixDto:
      type: object
      required: [contractType, valueMin, rules]
      properties:
        contractType:
          type: string
          description: M1a 8-value contract_type enum value.
        valueMin:
          type: number
          minimum: 0
        valueMax:
          type: number
          nullable: true
          description: ">= valueMin if set; NULL = no upper bound."
        rules:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApprovalMatrixRuleInput" }

    ApprovalMatrixListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApprovalMatrixRule" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ApprovalMatrixSetResponse:
      type: object
      properties:
        contractType: { type: string }
        minValueAed: { type: number }
        maxValueAed: { type: number, nullable: true }
        ruleCount: { type: integer }
        ruleIds:
          type: array
          items: { type: integer, format: int64 }

    RouteInitPreviewRequest:
      type: object
      required: [contractType, valueAed]
      properties:
        contractType: { type: string }
        valueAed: { type: number, minimum: 0 }

    RouteInitPreviewStep:
      type: object
      properties:
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }

    RouteInitPreviewResponse:
      type: object
      properties:
        contractType: { type: string }
        valueAed: { type: number }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RouteInitPreviewStep" }
        hasNoMatchingRule:
          type: boolean
          description: TRUE when matrix has no rule for the (contract_type, valueAed) pair (AC-S6-05).

    SubmitForApprovalResponse:
      type: object
      properties:
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        totalSteps: { type: integer }
        currentStepOrder: { type: integer, description: "Always 1 for a new chain." }
        newContractStatus: { type: string, enum: [in_approval] }

    DecideApprovalDto:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject, request_resubmission]
          description: |
            delegate / reassign / escalate are SEPARATE endpoints; fn_approval_decide rejects them at step 1 with HTTP 400. (AC-S2-01)
        decisionNote:
          type: string
          description: |
            Required when decision in (reject, request_resubmission). Sensitive — pino-redacted on logs (14 paths) and JSONB-redacted by fn_audit_trigger. (AC-S2-02 / AC-S2-03)

    DecideApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        newStepStatus: { $ref: "#/components/schemas/ApprovalStepStatus" }
        newChainStatus: { $ref: "#/components/schemas/ApprovalChainStatus" }
        newContractStatus: { $ref: "#/components/schemas/ContractStatus" }
        advancedToStepOrder:
          type: integer
          nullable: true
          description: NULL when chain halted or completed.
        allChainStepsResolved:
          type: boolean
          description: TRUE iff chain.status moved out of in_progress.

    DelegateApprovalDto:
      type: object
      required: [delegatedToUserId]
      properties:
        delegatedToUserId:
          type: integer
          format: int64
          description: |
            Target user.id. Must be active, hold a compatible approver role
            (contract_approver / contract_approver_2 / legal_counsel) and NOT
            equal the caller (AC-S3-03 / AC-S3-04).
        decisionNote:
          type: string
          description: Optional. Sensitive — pino-redacted.

    DelegateApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        delegatedTo: { $ref: "#/components/schemas/UserRef" }
        decisionId: { type: integer, format: int64 }

    ReassignApprovalDto:
      type: object
      required: [reassignedToUserId]
      properties:
        reassignedToUserId:
          type: integer
          format: int64
          description: |
            Target user.id. Role MUST equal step.approver_role OR be one of
            (platform_admin / legal_counsel / Super Admin). (AC-S8-05)
        decisionNote:
          type: string
          description: Optional. Sensitive — pino-redacted.

    ReassignApprovalResponse:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        originalApprover:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: NULL when step had no prior approver_user_id (role-only assignment).
        reassignedTo: { $ref: "#/components/schemas/UserRef" }
        decisionId: { type: integer, format: int64 }

    MyPendingApprovalListItem:
      type: object
      properties:
        stepId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNumber: { type: string }
        contractTitleEn: { type: string, nullable: true }
        contractTitleAr: { type: string, nullable: true }
        valueAed: { type: number, nullable: true }
        requesterUserRef: { $ref: "#/components/schemas/UserRef" }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        isRequired: { type: boolean }
        hoursPending: { type: integer }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }

    MyPendingApprovalListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MyPendingApprovalListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ApprovalChainStepDecisionItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        decision: { $ref: "#/components/schemas/ApprovalDecisionType" }
        decidedBy:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: NULL for system-emitted (cron) escalation rows.
        decidedAt: { type: string, format: date-time }
        decisionNote:
          type: string
          nullable: true
          description: Sensitive — redacted in audit_log.
        delegatedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        reassignedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true

    ApprovalChainStepDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepOrder: { type: integer }
        parallelGroup: { type: integer, nullable: true }
        approverRole: { type: string }
        approver:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        delegatedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        reassignedTo:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        status: { $ref: "#/components/schemas/ApprovalStepStatus" }
        isRequired: { type: boolean }
        escalationRole: { type: string, nullable: true }
        escalationAfterHours: { type: integer, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainStepDecisionItem" }

    ApprovalChainGetResponse:
      type: object
      description: matrixSnapshot is intentionally OMITTED from this projection (sensitive — visible only via admin / forensic paths).
      properties:
        chain:
          type: object
          properties:
            id: { type: integer, format: int64 }
            contractId: { type: integer, format: int64 }
            status: { $ref: "#/components/schemas/ApprovalChainStatus" }
            currentStepOrder: { type: integer }
            submittedBy: { $ref: "#/components/schemas/UserRef" }
            submittedAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time, nullable: true }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainStepDetail" }

    ApprovalChainListItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNumber: { type: string }
        status: { $ref: "#/components/schemas/ApprovalChainStatus" }
        currentStepOrder: { type: integer }
        totalSteps: { type: integer }
        submittedBy: { $ref: "#/components/schemas/UserRef" }
        submittedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        hoursPending: { type: integer }

    ApprovalChainListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApprovalChainListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    UpdateContractStatusUserDto:
      type: object
      required: [newStatus]
      description: |
        M2 (AE-2) wire DTO for PATCH /contracts/{id}/status. Same field shape
        as the M1a UpdateContractStatusDto (which is now deprecated as a type
        alias) but newStatus is restricted to the per-transition matrix
        enforced by fn_contract_status_update_user. Direct in_approval
        terminal targets (approved / rejected / resubmission_requested) are
        rejected with 409 — callers must use POST /approvals/{stepId}/decide.
      properties:
        newStatus: { $ref: "#/components/schemas/ContractStatus" }
        reason:
          type: string
          description: Optional. Captured in metadata.reason of the status_changed contract_activity row.

    UpdateContractStatusUserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fromStatus: { $ref: "#/components/schemas/ContractStatus" }
        toStatus: { $ref: "#/components/schemas/ContractStatus" }
        changedAt: { type: string, format: date-time }

    # ========================================================================
    # M3 — Signatures + Signer Q&A AI schemas
    # ========================================================================

    SignerSide:
      type: string
      enum: [employer, counterparty, witness]
      description: |
        signature_party.signer_side — FK to signature_party_side(code).
        Seeded in migration 035 §7.1 (3 stable rows).

    SignatureMethod:
      type: string
      enum: [uae_pass, ds_otp, drawn, typed]
      description: |
        signature_method.code — FK target referenced from signature_event.signature_method.
        Seeded in migration 035 §7.2 (4 stable rows). is_enabled=FALSE
        surfaces as 400 invalid_method (AC-S4-12).

    UaePassVerificationLevel:
      type: string
      enum: [basic, verified, premium]
      description: |
        Required when signature_method='uae_pass' (CHECK chk_signature_event_uae_pass_level_required).

    SignatureInvitationStatus:
      type: string
      enum: [pending, viewed, signed, declined, expired, cancelled]
      description: |
        signature_invitation.status — 6-value lifecycle CHECK enum
        (db-design.md §1.4). Allowed transitions enforced inside fn_signature_*.

    SignatureEventType:
      type: string
      enum: [viewed, signed, declined, expired, cancelled, resent]
      description: |
        signature_event.event_type — 6-value CHECK enum (db-design.md §1.5).
        Append-only audit event log. 'viewed' is emitted ONCE per invitation
        (idempotent — gated on first_viewed_at IS NULL).

    SignatureLanguage:
      type: string
      enum: [en, ar]
      description: |
        signature_invitation.language / signer_qa_session.language —
        Locked at session start for QA per AN-2 languageLock (AC-S11-05).

    SignerQaRecordMessageMode:
      type: string
      enum: [GATE, COMMIT]
      description: |
        Two-call rate-limit pattern discriminator (AN-2 / DN-10).
        - GATE   — pre-AI slot reservation; ignores tokensConsumed; raises 429 when limit exceeded.
        - COMMIT — post-AI commit; records actual tokens; does NOT re-check limit.

    SignaturePartyInput:
      type: object
      required: [signerSide, signerNameEn, stepOrder]
      properties:
        signerSide: { $ref: "#/components/schemas/SignerSide" }
        signerUserId:
          type: integer
          format: int64
          nullable: true
          description: NULL for external counterparty signers without a user account.
        signerNameEn: { type: string, minLength: 1, maxLength: 200 }
        signerNameAr:
          type: string
          maxLength: 200
          nullable: true
        signerEmail:
          type: string
          format: email
          nullable: true
          description: |
            SENSITIVE — pino-redacted in logs. NEVER in error messages
            (AC-S1-08). Already in M2 029 audit redact list.
        signerPhone:
          type: string
          maxLength: 40
          nullable: true
          description: |
            SENSITIVE — pino-redacted in logs; never returned in any response.
        signerPartyId:
          type: integer
          format: int64
          nullable: true
          description: |
            Forward-reference to future party(id). NO FK constraint in M3
            (AN-6 / ND-2; mirrors M1a contract.our_party_id forward-FK).
        stepOrder:
          type: integer
          minimum: 1
          description: 1..N — determines signature order. Employer typically signs first.
        isRequired:
          type: boolean
          default: true
          description: Defaults TRUE on the DB column.

    SignaturePartyCreateBulkDto:
      type: object
      required: [signers]
      description: |
        AC-S1-01 — bulk-create roster. signers length 1..20 (AC-S1-04 +
        DB validation). At least one element MUST have signerSide='employer'
        AND isRequired=TRUE (AC-S1-04).
      properties:
        signers:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/SignaturePartyInput" }

    SignatureParty:
      type: object
      required:
        - id
        - signerSide
        - signerNameEn
        - stepOrder
        - isRequired
        - currentInvitationId
        - currentInvitationStatus
        - lastEventType
      properties:
        id: { type: integer, format: int64 }
        signerSide: { $ref: "#/components/schemas/SignerSide" }
        signerNameEn: { type: string }
        signerNameAr: { type: string, nullable: true }
        signerEmail:
          type: string
          nullable: true
          description: |
            Masked (`j***@example.com`) for contract_drafter / contract_recipient
            roles; full plaintext for legal_counsel / platform_admin / Super Admin
            on the admin path (AC-S6-04). Never the full plaintext on PUBLIC
            fn_ paths.
        stepOrder: { type: integer }
        isRequired: { type: boolean }
        currentInvitationId:
          type: integer
          format: int64
          nullable: true
          description: |
            Active signature_invitation row id for this party (NULL when no
            invitation issued yet). Added by migration 038 — used by FE
            Signatures tab to target POST /signature-invitations/:id/cancel.
        currentInvitationStatus:
          allOf: [{ $ref: "#/components/schemas/SignatureInvitationStatus" }]
          nullable: true
        invitationSentAt: { type: string, format: date-time, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        declinedAt: { type: string, format: date-time, nullable: true }
        lastEventType:
          allOf: [{ $ref: "#/components/schemas/SignatureEventType" }]
          nullable: true
        signatureMethod:
          allOf: [{ $ref: "#/components/schemas/SignatureMethod" }]
          nullable: true
        uaePassVerificationLevel:
          allOf: [{ $ref: "#/components/schemas/UaePassVerificationLevel" }]
          nullable: true

    SignaturePartyCreateBulkResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [signatureParties, createdCount, skippedCount]
          properties:
            signatureParties:
              type: array
              items: { $ref: "#/components/schemas/SignatureParty" }
            createdCount: { type: integer }
            skippedCount: { type: integer, description: ON CONFLICT DO NOTHING per AC-S1-08 idempotency. }

    SignatureSendInvitationItem:
      type: object
      required: [signaturePartyId, invitationTokenPlaintext, expiresAt]
      properties:
        signaturePartyId: { type: integer, format: int64 }
        invitationTokenPlaintext:
          type: string
          description: |
            @once-only — never persisted, never re-derivable. Plaintext
            base64 (32-byte random). The DB persists only invitation_token_hash
            (SHA-256 hex). Pino-redacted on egress logs. Mailer-bound only.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 UTC. Default invitation_sent_at + 14 days.
        signerEmail:
          type: string
          nullable: true
          description: |
            Plaintext (mailer-bound). Pino-redacted on egress logs. Internal
            callers only — never echoed to the public signer page.

    SendForSignatureDto:
      type: object
      description: |
        AC-S2-01. POST /api/v1/contracts/:id/send-for-signature has no request
        body — p_contract_id from the path, p_actor_id from the JWT. Empty
        body schema preserved for symmetry with the Zod schema (z.object({}).strict()).

    SendForSignatureResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [contractId, newStatus, invitations]
          properties:
            contractId: { type: integer, format: int64 }
            newStatus:
              allOf: [{ $ref: "#/components/schemas/ContractStatus" }]
              description: Always 'awaiting_signature_employer' on success (AC-S2-01).
            invitations:
              type: array
              items: { $ref: "#/components/schemas/SignatureSendInvitationItem" }
              description: |
                One element per signer at MIN(step_order). Each carries the
                plaintext invitation token returned ONCE.

    ResendInvitationDto:
      type: object
      description: |
        AC-S7-01. reason is optional (no min length when present — DB-side
        accepts NULL).
      properties:
        reason: { type: string, nullable: true, maxLength: 500 }

    ResendInvitationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [newInvitationId, invitationTokenPlaintext, expiresAt]
          properties:
            newInvitationId: { type: integer, format: int64 }
            invitationTokenPlaintext:
              type: string
              description: |
                @once-only — never persisted, never re-derivable. Returned
                exactly once on creation. Pino-redacted on egress.
            expiresAt:
              type: string
              format: date-time
              description: ISO-8601 UTC. NOW() + 14 days.

    CancelInvitationDto:
      type: object
      required: [reason]
      description: |
        AC-S8-06 — reason is REQUIRED non-empty.
        AC-S8-03 — permission gate: signature.cancel (NOT granted to drafter).
      properties:
        reason: { type: string, minLength: 1 }

    CancelInvitationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [invitationId, status, contractRolledBack]
          properties:
            invitationId: { type: integer, format: int64 }
            status:
              allOf: [{ $ref: "#/components/schemas/SignatureInvitationStatus" }]
              description: Always 'cancelled' on success.
            contractRolledBack:
              type: boolean
              description: |
                TRUE when this was the last active invitation at the current
                step and fn_contract_status_update_internal rolled the contract
                back to 'approved' (AC-S8-02).

    SignatureMethodRef:
      type: object
      required: [code, labelEn, labelAr, verificationStrength, isEnabled]
      properties:
        code: { $ref: "#/components/schemas/SignatureMethod" }
        labelEn: { type: string }
        labelAr: { type: string }
        verificationStrength:
          type: integer
          minimum: 1
          maximum: 4
          description: 1=lowest (typed), 4=highest (uae_pass). Used for sort + UX hint.
        isEnabled: { type: boolean }
        isActive: { type: boolean }

    SignaturePublicView:
      type: object
      required: [invitation, signer, contract, availableMethods]
      description: |
        Sensitive-field policy is the strictest of any read path:
        - signerEmail ALWAYS masked (`j***@example.com` per DN-9)
        - signerPhone NEVER returned
        - body TRUNCATED to LEFT(body_*, 4000) chars
        - signature_data + signature_image_url NEVER returned (AC-S3-05)
      properties:
        invitation:
          type: object
          required: [id, status, expiresAt, viewCount, language]
          properties:
            id: { type: integer, format: int64 }
            status: { $ref: "#/components/schemas/SignatureInvitationStatus" }
            expiresAt: { type: string, format: date-time }
            viewCount: { type: integer }
            language: { $ref: "#/components/schemas/SignatureLanguage" }
        signer:
          type: object
          required: [side, nameEn]
          properties:
            side: { $ref: "#/components/schemas/SignerSide" }
            nameEn: { type: string }
            nameAr: { type: string, nullable: true }
            email:
              type: string
              nullable: true
              description: Masked form ONLY (e.g., `j***@example.com`). Plaintext NEVER returned.
        contract:
          type: object
          required: [id, contractNumber, titleEn, contractType]
          properties:
            id: { type: integer, format: int64 }
            contractNumber: { type: string }
            titleEn: { type: string }
            titleAr: { type: string, nullable: true }
            contractType: { type: string }
            valueAed:
              type: number
              format: double
              nullable: true
              description: AED — NUMERIC(15,2) on the DB.
            startDate: { type: string, format: date, nullable: true }
            endDate: { type: string, format: date, nullable: true }
            ourPartyName: { type: string, nullable: true }
            counterpartyName: { type: string, nullable: true }
            aiSummaryEn: { type: string, nullable: true }
            aiSummaryAr: { type: string, nullable: true }
            bodyEnExcerpt:
              type: string
              nullable: true
              description: TRUNCATED to LEFT(body_en, 4000). Full body NEVER returned to PUBLIC.
            bodyArExcerpt:
              type: string
              nullable: true
        availableMethods:
          type: array
          items: { $ref: "#/components/schemas/SignatureMethodRef" }
          description: Filtered to is_enabled=TRUE; sorted by verificationStrength DESC.

    SignaturePublicViewResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SignaturePublicView" }

    SignContractDto:
      type: object
      required: [signatureMethod]
      description: |
        AC-S4-01..AC-S4-12. Method gating (validated by fn_, mirrored in Zod):
        - signatureMethod='typed'    → signatureData required (>= 2 chars).
        - signatureMethod='drawn'    → signatureData AND signatureImageUrl required.
        - signatureMethod='uae_pass' → uaePassVerificationLevel required.
        - signatureMethod='ds_otp'   → metadata.otpReceipt required (non-empty).

        SENSITIVE — signatureData and signatureImageUrl are pino-redacted
        on the request envelope and audit_log JSONB-redacted by fn_audit_trigger
        (added in M3 034 — the 4 net-new redact-list names).
      properties:
        signatureMethod: { $ref: "#/components/schemas/SignatureMethod" }
        signatureData:
          type: string
          nullable: true
          description: SENSITIVE. Required for typed/drawn (>= 2 chars trimmed). NULL otherwise.
        signatureImageUrl:
          type: string
          nullable: true
          description: SENSITIVE. Required for drawn. Storage URL of canvas-rendered PNG.
        uaePassVerificationLevel:
          allOf: [{ $ref: "#/components/schemas/UaePassVerificationLevel" }]
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Free-form camelCase. Examples:
            - { otpReceipt: '...' } — required for ds_otp
            - { uaePassAttestationId, browserFingerprint } — uae_pass evidence
            Controllers forward req.ip / req.headers['user-agent'] as separate
            fn_ parameters (NOT inside metadata).

    RemainingSignerSummary:
      type: object
      required: [signaturePartyId, signerSide, status]
      properties:
        signaturePartyId: { type: integer, format: int64 }
        signerSide: { $ref: "#/components/schemas/SignerSide" }
        status: { $ref: "#/components/schemas/SignatureInvitationStatus" }

    SignContractResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [invitationId, status, signedAt, stepCompleted, remainingSigners]
          properties:
            invitationId: { type: integer, format: int64 }
            status:
              allOf: [{ $ref: "#/components/schemas/SignatureInvitationStatus" }]
              description: Always 'signed' on success.
            signedAt: { type: string, format: date-time }
            stepCompleted:
              type: boolean
              description: TRUE when this signer was the LAST required at their step.
            contractNewStatus:
              allOf: [{ $ref: "#/components/schemas/ContractStatus" }]
              nullable: true
              description: |
                NULL when stepCompleted=false. Otherwise:
                'awaiting_signature_counterparty' | 'fully_signed'.
            remainingSigners:
              type: array
              items: { $ref: "#/components/schemas/RemainingSignerSummary" }

    DeclineContractDto:
      type: object
      required: [declineReason]
      description: |
        AC-S5-02 / AC-S5-03 — declineReason length 5..2000.
      properties:
        declineReason: { type: string, minLength: 5, maxLength: 2000 }

    DeclineContractResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [invitationId, status]
          properties:
            invitationId: { type: integer, format: int64 }
            status:
              allOf: [{ $ref: "#/components/schemas/SignatureInvitationStatus" }]
              description: Always 'declined' on success.
            contractNewStatus:
              allOf: [{ $ref: "#/components/schemas/ContractStatus" }]
              nullable: true
              description: |
                'rejected' when the declining signer was required (AC-S5-01).
                NULL when the declining signer was a non-required witness (AC-S5-05).

    SignatureStepProgress:
      type: object
      required: [stepOrder, totalRequired, signedCount, declinedCount, pendingCount]
      properties:
        stepOrder: { type: integer }
        totalRequired: { type: integer }
        signedCount: { type: integer }
        declinedCount: { type: integer }
        pendingCount: { type: integer }

    SignatureListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [contractId, currentStatus, signers, stepProgress]
          properties:
            contractId: { type: integer, format: int64 }
            currentStatus: { $ref: "#/components/schemas/ContractStatus" }
            signers:
              type: array
              items: { $ref: "#/components/schemas/SignatureParty" }
              description: AC-S6-07 — ordered by stepOrder ASC, then created_at ASC. May be empty array.
            stepProgress:
              type: array
              items: { $ref: "#/components/schemas/SignatureStepProgress" }

    SignerQaSessionStartDto:
      type: object
      description: |
        AC-S11-01. language defaults to invitation.language; LOCKED at session
        start (AC-S11-05 / AN-2). Cannot be changed mid-session.
      properties:
        language:
          allOf: [{ $ref: "#/components/schemas/SignatureLanguage" }]
          nullable: true

    SignerQaRateLimitMeta:
      type: object
      required: [maxMessagesPerHour, remaining]
      properties:
        maxMessagesPerHour:
          type: integer
          description: AC-S12-05 default = 20 (per-session, rolling 1-hour window).
        remaining:
          type: integer
          description: Min(per-session-remaining, per-invitation-remaining).

    SignerQaSessionStartResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [sessionTokenPlaintext, sessionId, rateLimit, language]
          properties:
            sessionTokenPlaintext:
              type: string
              description: |
                @once-only — never persisted, never re-derivable. Plaintext
                base64 (32-byte random). Caller stores transiently (sessionStorage)
                for the X-Session-Token header on subsequent /qa/message calls.
                Pino-redacted on egress.
            sessionId: { type: integer, format: int64 }
            rateLimit: { $ref: "#/components/schemas/SignerQaRateLimitMeta" }
            language: { $ref: "#/components/schemas/SignatureLanguage" }

    SignerQaRecordMessageDto:
      type: object
      required: [mode, tokensConsumed]
      description: |
        AC-S12-01..AC-S12-10. Two-call rate-limit pattern (DN-10 / AN-2):
        - mode='GATE'   → tokensConsumed=0 (ignored). Reserves a slot or 429s.
                          userMessage required for AI invocation (controller-side).
        - mode='COMMIT' → tokensConsumed=<actual>. No re-check. userMessage omitted.
      properties:
        mode: { $ref: "#/components/schemas/SignerQaRecordMessageMode" }
        tokensConsumed:
          type: integer
          minimum: 0
          description: Must be 0 for GATE; actual usage for COMMIT.
        userMessage:
          type: string
          nullable: true
          description: |
            Only used in GATE mode for the controller-side AI invocation.
            NEVER persisted (G7 + DN-11 — no transcript storage). Pino-redacted
            because `ai_prompt_payload` is in project.config sensitiveFields
            (AC-S12-09).

    SignerQaMessageStreamChunk:
      type: object
      description: |
        SSE chunk shape for POST /api/v1/sign/:invitationToken/qa/message.
        Wire format per chunk: `data: <JSON of SignerQaMessageStreamChunk>\n\n`.
        Three terminal chunk types — `token` is non-terminal and may repeat;
        `done` and `error` are terminal.
      oneOf:
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [token] }
            delta: { type: string, description: Streaming AI token delta. Multiple chunks per response. }
        - type: object
          required: [type, tokensConsumed]
          properties:
            type: { type: string, enum: [done] }
            tokensConsumed: { type: integer, description: Terminal — controller follows with COMMIT call. }
        - type: object
          required: [type, code]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string, description: e.g. 'rate_limit_exceeded'. }
            message: { type: string, nullable: true }
            retryAfterSeconds: { type: integer, nullable: true }

    # ===== M4 — AI Features schemas (introduced 2026-05-04) =====

    AiLanguage:
      type: string
      enum: [en, ar, bilingual]
      description: |
        ai_insight + ai_request_log language CHECK enum. S5 narrows to
        `en | ar` only (bilingual rejected at validation).

    AiProvider:
      type: string
      enum: [openai, anthropic]
      description: ai_insight + ai_request_log provider CHECK enum.

    AiRequestOutcome:
      type: string
      enum: [success, error, timeout, rate_limited, cancelled]
      description: ai_request_log.outcome CHECK enum.

    AiInsightEntityType:
      type: string
      enum: [contract, contract_version, regulatory_update, regulatory_update_summary, executive_dashboard]
      description: |
        Open-set in DB (no CHECK constraint), but the closed union here lists
        the values currently in use. Future modules MAY add new values without
        schema migration; the matching RLS clause MUST be added in tandem.

    AiInsightType:
      type: string
      enum:
        - contract_summary
        - contract_key_terms
        - contract_risks
        - contract_obligations
        - contract_regulatory
        - contract_rewrite
        - version_diff_summary
        - executive_anomalies
        - regulatory_impact_explain
        - regulatory_impact_amendment
        - regulatory_impact_summary
      description: |
        Open-set in DB (free-text VARCHAR(60)). Closed union for editor
        ergonomics. Future modules adding new values MUST extend the union
        OR widen via M5_INSIGHT_TYPE_EXTENSIONS pattern.

    M4PromptId:
      type: string
      enum:
        - ai-contract-insights
        - ai-drafting-assistant
        - ai-executive-anomalies
        - ai-regulatory-impact
        - ai-regulatory-impact-summary
        - ai-version-diff-summary
      description: ai_prompt.prompt_id (code-PK). Mirrors the 6 seed rows in migration 044.

    AiContractInsightsMode:
      type: string
      enum: [summary, key_terms, risks, obligations, regulatory, rewrite]

    AiDraftingAssistantMode:
      type: string
      enum: [suggest, explain, rewrite, chat]

    AiDraftingAssistantTone:
      type: string
      enum: [simpler, formal, stronger, balanced]

    AiRegulatoryImpactMode:
      type: string
      enum: [explain, amendment]

    AiInsightsStreamChunk:
      type: object
      description: |
        SSE chunk shape for `POST /api/v1/ai/contract-insights` modes
        `summary` and `rewrite`. Wire format per chunk: `data: <JSON>\n\n`.
        Mirrors M3 SignerQaMessageStreamChunk pattern; one parser handles
        all four streaming endpoints in the project.
      oneOf:
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [token] }
            delta: { type: string }
        - type: object
          required: [type, tokensConsumed]
          properties:
            type: { type: string, enum: [done] }
            tokensConsumed: { type: integer }
            persisted:
              nullable: true
              description: |
                Returned only on mode='summary' when fn_contract_ai_summary_persist
                ran successfully. Shape = ContractAiSummaryPersistData.
              $ref: "#/components/schemas/ContractAiSummaryPersistData"
        - type: object
          required: [type, code]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string }
            message: { type: string, nullable: true }
            retryAfterSeconds: { type: integer, nullable: true }

    AiDraftingAssistantStreamChunk:
      type: object
      description: |
        SSE chunk shape for `POST /api/v1/ai/drafting-assistant` modes
        `chat`, `explain`, `rewrite`. mode='suggest' is non-streaming and
        returns AiDraftingAssistantSuggestResponse synchronously.
      oneOf:
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [token] }
            delta: { type: string }
        - type: object
          required: [type, tokensConsumed]
          properties:
            type: { type: string, enum: [done] }
            tokensConsumed: { type: integer }
        - type: object
          required: [type, code]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string }
            message: { type: string, nullable: true }
            retryAfterSeconds: { type: integer, nullable: true }

    AiRegulatoryImpactStreamChunk:
      type: object
      description: |
        SSE chunk shape for `POST /api/v1/ai/regulatory-impact` modes
        `explain` and `amendment`.
      oneOf:
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [token] }
            delta: { type: string }
        - type: object
          required: [type, tokensConsumed]
          properties:
            type: { type: string, enum: [done] }
            tokensConsumed: { type: integer }
        - type: object
          required: [type, code]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string }
            message: { type: string, nullable: true }
            retryAfterSeconds: { type: integer, nullable: true }

    # ----- ai_insight payload variants (discriminated union by insightType) -----

    AiContractSummaryPayload:
      type: object
      required: [insightType, summary, language]
      properties:
        insightType: { type: string, enum: [contract_summary] }
        summary: { type: string }
        riskScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        language: { $ref: "#/components/schemas/AiLanguage" }

    AiContractKeyTerm:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        clauseAnchor: { type: string, nullable: true }
        clauseExcerpt: { type: string, nullable: true }

    AiContractKeyTermsPayload:
      type: object
      required: [insightType, keyTerms]
      properties:
        insightType: { type: string, enum: [contract_key_terms] }
        keyTerms:
          type: array
          items: { $ref: "#/components/schemas/AiContractKeyTerm" }

    AiContractRisk:
      type: object
      required: [title, severity, clauseAnchor, clauseExcerpt, rationale]
      properties:
        title: { type: string }
        severity: { type: string, enum: [high, medium, low] }
        clauseAnchor: { type: string }
        clauseExcerpt: { type: string }
        rationale: { type: string }

    AiContractRisksPayload:
      type: object
      required: [insightType, risks]
      properties:
        insightType: { type: string, enum: [contract_risks] }
        risks:
          type: array
          items: { $ref: "#/components/schemas/AiContractRisk" }

    AiContractObligation:
      type: object
      required: [party, obligation]
      properties:
        party: { type: string }
        obligation: { type: string }
        deadline: { type: string, nullable: true }
        clauseAnchor: { type: string, nullable: true }

    AiContractObligationsPayload:
      type: object
      required: [insightType, obligations]
      properties:
        insightType: { type: string, enum: [contract_obligations] }
        obligations:
          type: array
          items: { $ref: "#/components/schemas/AiContractObligation" }

    AiContractRegulatoryItem:
      type: object
      required: [citation, relevance]
      properties:
        citation: { type: string }
        relevance: { type: string }
        clauseAnchor: { type: string, nullable: true }

    AiContractRegulatoryPayload:
      type: object
      required: [insightType, regulations]
      properties:
        insightType: { type: string, enum: [contract_regulatory] }
        regulations:
          type: array
          items: { $ref: "#/components/schemas/AiContractRegulatoryItem" }

    AiContractRewritePayload:
      type: object
      required: [insightType, rewrittenText]
      properties:
        insightType: { type: string, enum: [contract_rewrite] }
        rewrittenText: { type: string }

    AiExecutiveAnomaly:
      type: object
      required: [insight, severity, drillDownFilter]
      properties:
        insight: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        drillDownFilter: { type: string }

    AiExecutiveAnomaliesPayload:
      type: object
      required: [insightType, anomalies, generatedAt]
      properties:
        insightType: { type: string, enum: [executive_anomalies] }
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/AiExecutiveAnomaly" }
        generatedAt: { type: string, format: date-time }

    AiVersionDiffSummaryPayload:
      type: object
      required: [insightType, summary]
      properties:
        insightType: { type: string, enum: [version_diff_summary] }
        summary: { type: string }

    AiRegulatoryImpactPayload:
      type: object
      required: [insightType, text]
      properties:
        insightType:
          type: string
          enum: [regulatory_impact_explain, regulatory_impact_amendment]
        text: { type: string }

    AiRegulatoryImpactSummaryPayload:
      type: object
      required: [insightType, executive, keyChanges, recommendedActions]
      properties:
        insightType: { type: string, enum: [regulatory_impact_summary] }
        executive: { type: string }
        keyChanges:
          type: array
          items: { type: string }
        recommendedActions:
          type: array
          items: { type: string }

    AiInsightPayload:
      description: |
        Discriminated union of ai_insight.payload variants by `insightType`.
        The discriminator is normalised onto the JSONB payload by the
        controller layer (the prompt itself does not always emit it).
      oneOf:
        - $ref: "#/components/schemas/AiContractSummaryPayload"
        - $ref: "#/components/schemas/AiContractKeyTermsPayload"
        - $ref: "#/components/schemas/AiContractRisksPayload"
        - $ref: "#/components/schemas/AiContractObligationsPayload"
        - $ref: "#/components/schemas/AiContractRegulatoryPayload"
        - $ref: "#/components/schemas/AiContractRewritePayload"
        - $ref: "#/components/schemas/AiExecutiveAnomaliesPayload"
        - $ref: "#/components/schemas/AiVersionDiffSummaryPayload"
        - $ref: "#/components/schemas/AiRegulatoryImpactPayload"
        - $ref: "#/components/schemas/AiRegulatoryImpactSummaryPayload"
      discriminator:
        propertyName: insightType
        mapping:
          contract_summary: "#/components/schemas/AiContractSummaryPayload"
          contract_key_terms: "#/components/schemas/AiContractKeyTermsPayload"
          contract_risks: "#/components/schemas/AiContractRisksPayload"
          contract_obligations: "#/components/schemas/AiContractObligationsPayload"
          contract_regulatory: "#/components/schemas/AiContractRegulatoryPayload"
          contract_rewrite: "#/components/schemas/AiContractRewritePayload"
          executive_anomalies: "#/components/schemas/AiExecutiveAnomaliesPayload"
          version_diff_summary: "#/components/schemas/AiVersionDiffSummaryPayload"
          regulatory_impact_explain: "#/components/schemas/AiRegulatoryImpactPayload"
          regulatory_impact_amendment: "#/components/schemas/AiRegulatoryImpactPayload"
          regulatory_impact_summary: "#/components/schemas/AiRegulatoryImpactSummaryPayload"

    # ----- AI insight + request log entity shapes -----

    AiInsight:
      type: object
      description: |
        Polymorphic AI cache row. SELECT-only via fn_ai_insight_get_cached
        (controller cache lookup) and fn_ai_insight_list (admin observability).
        INSERT/UPDATE/DELETE deny-direct via RLS — only the DEFINER
        fn_ai_insight_upsert + fn_ai_insight_evict_expired (cron) write.
      required:
        - id
        - entityType
        - insightType
        - language
        - promptId
        - provider
        - modelUsed
        - payload
        - payloadHash
        - expiresAt
        - createdAt
      properties:
        id: { type: integer, format: int64 }
        entityType: { $ref: "#/components/schemas/AiInsightEntityType" }
        entityId:
          type: integer
          format: int64
          nullable: true
          description: |
            NULL allowed for executive_dashboard rows (cross-contract). The
            composite UNIQUE INDEX uses COALESCE(entity_id, 0::BIGINT) to
            enforce uniqueness across NULL entity_ids.
        insightType: { $ref: "#/components/schemas/AiInsightType" }
        language: { $ref: "#/components/schemas/AiLanguage" }
        promptId: { $ref: "#/components/schemas/M4PromptId" }
        provider: { $ref: "#/components/schemas/AiProvider" }
        modelUsed: { type: string }
        payload: { $ref: "#/components/schemas/AiInsightPayload" }
        payloadHash:
          type: string
          description: SHA-256 of canonicalised inputs (entity content + prompt_id + language).
        tokensInput: { type: integer, nullable: true }
        tokensOutput: { type: integer, nullable: true }
        costUsdMicros: { type: integer, format: int64, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AiInsightListItem:
      allOf:
        - $ref: "#/components/schemas/AiInsight"
        - type: object
          required: [isActive]
          properties:
            isActive: { type: boolean }

    AiInsightListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AiInsightListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    AiRequestLogActor:
      type: object
      description: Joined from "user" via fn_user_get_by_id (M1c precedent). NULL for public-endpoint requests (S5 signed-PDF-token path).
      required: [id, email, fullName]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }

    AiRequestLogListItem:
      type: object
      required:
        - id
        - requestId
        - promptId
        - language
        - provider
        - modelUsed
        - cacheHit
        - streamMode
        - outcome
        - createdAt
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: string, format: uuid }
        promptId: { $ref: "#/components/schemas/M4PromptId" }
        mode: { type: string, nullable: true }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AiRequestLogActor"
            - type: "null"
        entityType: { type: string, nullable: true }
        entityId: { type: integer, format: int64, nullable: true }
        language: { $ref: "#/components/schemas/AiLanguage" }
        provider: { $ref: "#/components/schemas/AiProvider" }
        modelUsed: { type: string }
        tokensInput: { type: integer, nullable: true }
        tokensOutput: { type: integer, nullable: true }
        costUsdMicros: { type: integer, format: int64, nullable: true }
        latencyMs: { type: integer, nullable: true }
        cacheHit: { type: boolean }
        streamMode: { type: boolean }
        outcome: { $ref: "#/components/schemas/AiRequestOutcome" }
        errorClass: { type: string, nullable: true }
        errorMessage:
          type: string
          nullable: true
          description: |
            SENSITIVE — pino-redacted on log lines; pre-sanitized at controller
            before fn_ai_request_log_create write (AC-S10-07). Defence-in-depth:
            fn_audit_trigger v_redact_fields includes `error_message` post-
            migration 041.
        createdAt: { type: string, format: date-time }

    AiRequestLogListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AiRequestLogListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    AiCostReportRow:
      type: object
      required: [promptId, totalCostUsdMicros, totalTokensInput, totalTokensOutput, successCount, errorCount]
      properties:
        promptId: { $ref: "#/components/schemas/M4PromptId" }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AiRequestLogActor"
            - type: "null"
          description: Present only when `groupByUser=true`.
        totalCostUsdMicros: { type: integer, format: int64 }
        totalTokensInput: { type: integer, format: int64 }
        totalTokensOutput: { type: integer, format: int64 }
        successCount: { type: integer }
        errorCount: { type: integer }
        avgLatencyMs: { type: number, nullable: true }
        cacheHitRatio:
          type: number
          nullable: true
          description: NULL when denominator (success+error) is 0.

    AiCostReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AiCostReportRow" }

    AiPrompt:
      type: object
      description: ai_prompt reference row (code-PK; AUDIT TRIGGER OMITTED per DB-IMPL-I-1).
      required:
        - promptId
        - descriptionEn
        - descriptionAr
        - defaultModel
        - defaultTemperature
        - defaultMaxTokens
        - defaultTtlSeconds
        - supportsStreaming
        - supportsToolCall
        - publicEndpoint
        - promptFilePath
        - rateLimitPerUserPerHour
        - rateLimitPerUserPerDay
        - isActive
      properties:
        promptId: { $ref: "#/components/schemas/M4PromptId" }
        descriptionEn: { type: string }
        descriptionAr: { type: string }
        defaultModel: { type: string, example: gpt-4o }
        defaultTemperature: { type: number, minimum: 0, maximum: 2 }
        defaultMaxTokens: { type: integer, minimum: 1 }
        defaultTtlSeconds:
          type: integer
          minimum: 0
          description: 0 = no caching (currently only ai-drafting-assistant).
        supportsStreaming: { type: boolean }
        supportsToolCall: { type: boolean }
        publicEndpoint: { type: boolean }
        promptFilePath: { type: string, example: prompts/ai-contract-insights.txt }
        rateLimitPerUserPerHour: { type: integer, minimum: 1 }
        rateLimitPerUserPerDay: { type: integer, minimum: 1 }
        isActive: { type: boolean }

    AiPromptListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AiPrompt" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    # ----- Persist response shapes (S1 + S6 DEFINER carve-outs) -----

    ContractAiSummaryPersistData:
      type: object
      description: fn_contract_ai_summary_persist response payload (writes contract.ai_summary_*/ai_risk_score reserved columns).
      required: [contractId, updatedAt]
      properties:
        contractId: { type: integer, format: int64 }
        aiSummaryEn: { type: string, nullable: true }
        aiSummaryAr: { type: string, nullable: true }
        aiRiskScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        updatedAt: { type: string, format: date-time }

    ContractVersionDiffSummaryPersistData:
      type: object
      description: |
        fn_contract_version_diff_summary_persist response payload. After
        DEFECT-1 patch (migration 045) the fn body materialises updatedAt
        locally because contract_version is append-only at the table level
        (no updated_at/updated_by columns). The JSONB return shape is
        byte-identical to the pre-patch design.
      required: [contractVersionId, diffSummary, updatedAt]
      properties:
        contractVersionId: { type: integer, format: int64 }
        diffSummary: { type: string }
        updatedAt: { type: string, format: date-time }

    # ----- Request DTOs -----

    AiContractInsightsRequest:
      type: object
      required: [contractId, mode, language]
      properties:
        contractId: { type: integer, format: int64, minimum: 1 }
        mode: { $ref: "#/components/schemas/AiContractInsightsMode" }
        language: { $ref: "#/components/schemas/AiLanguage" }
        selectedText:
          type: string
          description: |
            SENSITIVE — pino-redacted. Required when `mode='rewrite'` (max
            20000 chars); ignored otherwise.

    AiContractInsightsResponseBody:
      description: |
        Non-streaming response body (JSON tool-call) for `mode IN
        (key_terms | risks | obligations | regulatory)`. Streaming modes
        (`summary`, `rewrite`) emit AiInsightsStreamChunk SSE events instead.
      oneOf:
        - type: object
          required: [mode, payload]
          properties:
            mode: { type: string, enum: [key_terms] }
            payload: { $ref: "#/components/schemas/AiContractKeyTermsPayload" }
        - type: object
          required: [mode, payload]
          properties:
            mode: { type: string, enum: [risks] }
            payload: { $ref: "#/components/schemas/AiContractRisksPayload" }
        - type: object
          required: [mode, payload]
          properties:
            mode: { type: string, enum: [obligations] }
            payload: { $ref: "#/components/schemas/AiContractObligationsPayload" }
        - type: object
          required: [mode, payload]
          properties:
            mode: { type: string, enum: [regulatory] }
