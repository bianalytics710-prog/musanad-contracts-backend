        executive sees system-wide (AC-S7-05).
      required: [totalImpacts, resolvedCount, pendingCount]
      properties:
        totalImpacts: { type: integer }
        resolvedCount: { type: integer }
        pendingCount: { type: integer }
        avgImpactScore:
          type: number
          nullable: true
          description: AC-S7-04 — null when totalImpacts == 0 (avoids div-by-zero).

    RegulatoryUpdateListItem:
      type: object
      required: [id, regulator, titleEn, publishedDate, severity, affectedClauseCategories]
      properties:
        id: { type: integer }
        regulator: { $ref: "#/components/schemas/RegulatorRef" }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate: { type: string, format: date, nullable: true }
        complianceDeadline: { type: string, format: date, nullable: true }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
          description: TEXT[] (Q4).
        category:
          $ref: "#/components/schemas/ImpactCategoryRef"
          nullable: true
        subSource: { type: string, nullable: true }

    RegulatoryUpdate:
      allOf:
        - $ref: "#/components/schemas/RegulatoryUpdateListItem"
        - type: object
          required: [impactSummary]
          properties:
            impactSummary: { $ref: "#/components/schemas/RegulatoryImpactSummary" }

    RegulatoryUpdateListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryUpdateListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateRegulatoryUpdateDto:
      type: object
      required: [regulatorId, titleEn, publishedDate]
      properties:
        regulatorId: { type: integer }
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, nullable: true, maxLength: 500 }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate:
          type: string
          format: date
          nullable: true
          description: AC-S8-03 — when present must be >= publishedDate.
        complianceDeadline:
          type: string
          format: date
          nullable: true
          description: AC-S8-04 — when present must be >= publishedDate.
        severity:
          $ref: "#/components/schemas/RegulatorySeverity"
          description: Defaults to `medium` per AC-S8-07.
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
        categoryId: { type: integer, nullable: true }
        subSource: { type: string, nullable: true }

    UpdateRegulatoryUpdateDto:
      type: object
      description: |
        Partial patch (camelCase keys). AC-S9-02 floor guard — `publishedDate`
        cannot be moved below MIN(detected_at) of associated impacts.
      properties:
        regulatorId: { type: integer }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        referenceNumber: { type: string, nullable: true }
        publishedDate: { type: string, format: date }
        effectiveDate: { type: string, format: date, nullable: true }
        complianceDeadline: { type: string, format: date, nullable: true }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }
        sourceUrl: { type: string, nullable: true }
        affectedClauseCategories:
          type: array
          items: { type: string }
        categoryId: { type: integer, nullable: true }
        subSource: { type: string, nullable: true }

    RegulatoryUpdateCreateResult:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }

    RegulatoryUpdateUpdateResult:
      type: object
      required: [id, updatedAt]
      properties:
        id: { type: integer }
        updatedAt: { type: string, format: date-time }

    RegulatoryUpdateDeleteResult:
      type: object
      description: AC-S10-01 cascade-soft-delete count returned alongside id.
      required: [id, isActive, cascadedImpacts]
      properties:
        id: { type: integer }
        isActive:
          type: boolean
          enum: [false]
        cascadedImpacts:
          type: integer
          description: AC-S10-02 — count of regulatory_impact rows soft-deleted by the cascade.

    RegulatoryImpactContractRef:
      type: object
      required: [id, contractNumber, titleEn]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }

    RegulatoryImpactRegulationRef:
      type: object
      required: [id, referenceCode, titleEn]
      properties:
        id: { type: integer }
        referenceCode: { type: string }
        titleEn: { type: string }

    RegulatoryImpactRegulatoryUpdateRef:
      type: object
      required: [id, titleEn, severity]
      properties:
        id: { type: integer }
        titleEn: { type: string }
        severity: { $ref: "#/components/schemas/RegulatorySeverity" }

    RegulatoryImpact:
      type: object
      description: |
        Per-contract impact analysis row. `regulatoryUpdate` is null when this
        is a structural impact (regulation only; FE renders as "Structural"
        badge). UNIQUE INDEX uses
        `COALESCE(regulatory_update_id, 0::BIGINT)` to enforce idempotency
        across both NULL and NOT NULL paths via the BIGSERIAL=0 sentinel
        (M4 ai_insight precedent; PG NULLS-DISTINCT default workaround).
      required: [id, contract, regulation, detectedAt, resolved]
      properties:
        id: { type: integer }
        contract: { $ref: "#/components/schemas/RegulatoryImpactContractRef" }
        regulation: { $ref: "#/components/schemas/RegulatoryImpactRegulationRef" }
        regulatoryUpdate:
          $ref: "#/components/schemas/RegulatoryImpactRegulatoryUpdateRef"
          nullable: true
        impactScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        impactNoteEn:
          type: string
          nullable: true
          description: Q6 — short-form tag (radar tooltip).
        impactNoteAr: { type: string, nullable: true }
        impactSummaryEn:
          type: string
          nullable: true
          description: Q6 — long-form AI executive summary.
        impactSummaryAr: { type: string, nullable: true }
        detectedAt: { type: string, format: date-time }
        resolved: { type: boolean }
        resolutionAction:
          $ref: "#/components/schemas/RegulatoryImpactResolutionAction"
          nullable: true
        resolutionNote:
          type: string
          nullable: true
          description: Q8 — admin-bounded free text; stored verbatim (NOT redacted).

    RegulatoryImpactListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryImpact" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    ImpactPayloadEntry:
      type: object
      description: |
        Per-contract payload entry. Wire shape is keyed by `contractId.toString()`.
        SENSITIVE — pino-redacted at controller (covered by `ai_prompt_payload`
        class per M4 precedent).
      properties:
        impactScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        noteEn: { type: string, nullable: true }
        noteAr: { type: string, nullable: true }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }

    BulkDetectRegulatoryImpactDto:
      type: object
      required: [regulatoryUpdateId, regulationId, contractIds, impactPayload]
      properties:
        regulatoryUpdateId: { type: integer }
        regulationId: { type: integer }
        contractIds:
          type: array
          minItems: 1
          items: { type: integer }
          description: AC-S11-03 — must be non-empty.
        impactPayload:
          type: object
          description: SENSITIVE — pino-redacted. Keyed by contractId stringified.
          additionalProperties:
            $ref: "#/components/schemas/ImpactPayloadEntry"

    BulkDetectRegulatoryImpactResult:
      type: object
      required: [createdCount, skippedDuplicateCount, impactIds]
      properties:
        createdCount: { type: integer }
        skippedDuplicateCount:
          type: integer
          description: AC-S11-02 — idempotent re-run skip count.
        impactIds:
          type: array
          items: { type: integer }

    ResolveRegulatoryImpactDto:
      type: object
      required: [resolutionAction]
      properties:
        resolutionAction: { $ref: "#/components/schemas/RegulatoryImpactResolutionAction" }
        resolutionNote:
          type: string
          nullable: true
          description: Q8 — stored verbatim (admin-bounded; not redacted).

    RegulatoryImpactResolveResult:
      type: object
      required: [id, resolved, resolutionAction, updatedAt]
      properties:
        id: { type: integer }
        resolved:
          type: boolean
          description: AC-S13-02 — derived as `resolution_action <> 'pending'`.
        resolutionAction: { $ref: "#/components/schemas/RegulatoryImpactResolutionAction" }
        updatedAt: { type: string, format: date-time }

    # ----------------------------------------------------------------
    # M6 — Dashboards & Reporting (10 endpoints)
    # ----------------------------------------------------------------

    DashboardKey:
      type: string
      enum: [admin, drafter, approver, legal_counsel, recipient, executive]
      description: |
        Computed dashboard key returned by `fn_dashboard_router` (S6).
        Decision tree codified in `db-design.md` §3.6 step 4. Default
        fallback is `recipient` (least-privilege view).

    HealthStatusOverall:
      type: string
      enum: [ok, degraded, unhealthy]
      description: Composed from `db.status` + `ai.estimatedHealthy`.

    HealthDbStatus:
      type: string
      enum: [ok, degraded]
      description: Derived from `CURRENT_TIMESTAMP` + `pg_is_in_recovery()`.

    PlaceholderKpi:
      type: object
      description: |
        Placeholder envelope for dashboard slots whose underlying domain
        tables do not yet exist (per Lovable S29 ACs referencing `parties` /
        `obligations`). FE renders disabled tiles with "feature pending"
        tooltips. Used in `LegalCounselDashboardKpis.templateUsageThisWindow`
        and `RecipientDashboardKpis.myObligationsCount`.
      required: [value, placeholder]
      properties:
        value:
          type: integer
          enum: [0]
          description: Always 0 for placeholder slots.
        placeholder:
          type: boolean
          enum: [true]
          description: Distinguishes from a real zero-value count.

    TrendDayCount:
      type: object
      description: "Daily trend point — date (YYYY-MM-DD) + count integer."
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    ApprovalDecisionDayPoint:
      type: object
      description: |
        Daily approval decision point — separates approved vs rejected counts.
        Source uses present-tense `decision='approve'/'reject'` literals
        (S2-22-WARN-1-FIX — past-tense `'approved'/'rejected'` would never
        match the live CHECK enum).
      required: [date, approved, rejected]
      properties:
        date: { type: string, format: date }
        approved: { type: integer }
        rejected: { type: integer }

    TrendMonthCount:
      type: object
      description: "Monthly trend point — month (YYYY-MM) + count integer."
      required: [month, count]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        count: { type: integer }

    TrendMonthValueAed:
      type: object
      description: Monthly value point — used by `fn_dashboard_executive.trends.valueOverTimeByMonth`.
      required: [month, totalValueAed]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        totalValueAed: { type: number }

    DashboardContractRow:
      type: object
      description: |
        Lightweight contract projection used by dashboard list slots
        (`myDrafts5` / `awaitingMyAction5` / `myContracts5`). NEVER
        includes `contract_body` or any other sensitive fields. Distinct
        from M1a `Contract` — M1a's full shape is unchanged in M6.
      required: [id, contractNumber, titleEn, status]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        valueAed: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }

    DrafterAwaitingActionRow:
      type: object
      description: Drafter awaiting-action row — extends `DashboardContractRow` with `lastDecisionNote`.
      required: [id, contractNumber, titleEn, status]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        lastDecisionNote:
          type: string
          nullable: true
          description: Most recent reject / request_resubmission note. SENSITIVE — pino-redacted on logs (M2 precedent); included in API response for the drafter only.

    ApproverPendingQueueRow:
      type: object
      description: |
        Joined `approval_step + contract` row — projected by
        `fn_dashboard_approver.lists.pendingQueue5`.
        post-057 patch: join chain is `approval_step JOIN approval_chain
        ON ch.id = step.approval_chain_id JOIN contract ON c.id =
        ch.contract_id` (M6-DB-IMPL-DEFECT-1 fix; original design referenced
        non-existent `step.contract_id`).
      required: [stepId, contractId, contractNumber, titleEn, requestedAt, hoursWaiting]
      properties:
        stepId: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        valueAed: { type: number, nullable: true }
        requestedAt:
          type: string
          format: date-time
          description: |
            `approval_step.created_at` — replaces non-existent `assigned_at`
            per S2-22-FIX-2b. Rows are immutable post-create
            (`trg_approval_step_immutable_fields`).
        hoursWaiting:
          type: number
          description: "EXTRACT(EPOCH FROM (NOW() - step.created_at))/3600 — decimal hours."

    RecipientMyContractsRow:
      type: object
      description: |
        Joined `contract + signature_party` row — projected by
        `fn_dashboard_recipient.lists.myContracts5`. Recipient is identified
        via `signature_party.signer_email = current_user.email`
        (case-insensitive). `counterpartyId` is always null until the
        parties module ships (db-design.md §3.5 explicit).
      required: [id, contractNumber, titleEn, status, ourPartyId]
      properties:
        id: { type: integer }
        contractNumber: { type: string }
        titleEn: { type: string }
        titleAr: { type: string, nullable: true }
        status: { type: string }
        ourPartyId: { type: integer }
        counterpartyId:
          type: integer
          nullable: true
          enum: [null]

    RecipientPendingSignatureRow:
      type: object
      description: |
        Joined `signature_invitation + signature_party + contract` row —
        projected by `fn_dashboard_recipient.lists.pendingSignatures5`.
        `sentAt` aliased from `invitation_sent_at`; `expiresAt` aliased
        from `invitation_expires_at` (S2-22-FIX-5a — non-aliased columns
        were design-time references that don't exist on the live table).
      required: [invitationId, contractId, contractNumber, sentAt]
      properties:
        invitationId: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    DashboardRegulatoryUpdateRow:
      type: object
      description: |
        Recent regulatory-update row — lighter projection than M5
        `RegulatoryUpdate`. Embeds a `RegulatorRef`-like sub-object.
        Projected by `fn_dashboard_legal_counsel.lists.recentRegulatoryUpdates5`.
      required: [id, titleEn, severity, regulator]
      properties:
        id: { type: integer }
        titleEn: { type: string }
        severity: { type: string }
        effectiveDate: { type: string, format: date, nullable: true }
        regulator:
          type: object
          required: [id, nameEn]
          properties:
            id: { type: integer }
            nameEn: { type: string }

    DashboardOpenImpactRow:
      type: object
      description: |
        Open regulatory-impact row — lighter projection than M5
        `RegulatoryImpact`. Projected by
        `fn_dashboard_legal_counsel.lists.openImpacts5`.
      required: [id, contractId, contractNumber, regulationTitleEn, severity, detectedAt]
      properties:
        id: { type: integer }
        contractId: { type: integer }
        contractNumber: { type: string }
        regulationTitleEn: { type: string }
        severity:
          type: string
          description: "COALESCE(regulatory_update.severity, 'unknown') — db-design.md §3.4."
        detectedAt: { type: string, format: date-time }

    CounterpartyConcentrationRow:
      type: object
      description: |
        Counterparty concentration row — projected by
        `fn_dashboard_executive.kpis.topCounterpartiesByValue5`.
        `counterpartyName` is not joined (no parties table yet); FE shows
        `counterpartyId` with a "Name pending" fallback chip per AC-S7-04.
      required: [counterpartyId, totalValueAed, contractCount]
      properties:
        counterpartyId: { type: integer }
        totalValueAed: { type: number }
        contractCount: { type: integer }

    ValueDistributionBucket:
      type: object
      description: |
        Value-distribution histogram bucket — projected by
        `fn_dashboard_executive.kpis.valueDistribution`.
        Bucket labels: `<100k` / `100k-1M` / `1M-10M` / `10M+`.
      required: [bucket, count]
      properties:
        bucket: { type: string }
        count: { type: integer }

    AiCostTopPromptRow:
      type: object
      description: Top-prompt cost row — projected by `fn_dashboard_ai_cost_summary.topPromptsByCost5`.
      required: [promptId, requestCount, totalCostUsd]
      properties:
        promptId: { type: integer }
        requestCount:
          type: integer
          description: "successCount + errorCount per fn_ai_request_log_cost_report (M4 043)."
        totalCostUsd:
          type: number
          description: "totalCostUsdMicros / 1_000_000 — projected as USD with 2dp at FE per AC-S11-07."
        cacheHitRatio:
          type: number
          nullable: true
          description: NULL when prompt has zero successful requests in the window (S2-18 NULL semantic).

    ExecutiveAnomaly:
      type: object
      description: |
        One anomaly row — reshaped from M4 `fn_ai_insight_list` rows where
        `entity_type='executive_anomalies'`. `detectedAt` sourced from
        `ai_insight.created_at` (no `detected_at` column exists on
        `ai_insight`).
      required: [id, severity, detectedAt]
      properties:
        id: { type: integer }
        summaryEn: { type: string, nullable: true }
        summaryAr: { type: string, nullable: true }
        severity:
          type: string
          description: |
            Open string union (forward-compat with M4 ai_insight payload).
            M5 `RegulatorySeverity` is a different scope.
        detectedAt: { type: string, format: date-time }
        payload:
          type: object
          nullable: true
          description: Free-form payload from M4 `ai_insight.payload`.
          additionalProperties: true

    AdminDashboardKpis:
      type: object
      required: [totalContractsActive, totalContractsByStatus, expiringWithin30d, expiringWithin90d, pendingApprovals, pendingSignatures, openRegulatoryImpacts, recentAuditEvents, totalActiveUsers]
      properties:
        totalContractsActive: { type: integer }
        totalContractsByStatus:
          type: object
          additionalProperties: { type: integer }
          description: jsonb_object_agg(contract.status, count). Open key set — M1a may grow status literals; FE renders whatever keys come back.
        expiringWithin30d: { type: integer }
        expiringWithin90d:
          type: integer
          description: "AC-S1-04 monotonic — expiringWithin30d <= expiringWithin90d."
        pendingApprovals: { type: integer }
        pendingSignatures: { type: integer }
        openRegulatoryImpacts:
          type: integer
          description: "WHERE resolved = FALSE AND is_active = TRUE (CRIT-1 rewrite — no resolved_at column)."
        recentAuditEvents: { type: integer }
        totalActiveUsers: { type: integer }

    AdminDashboardTrends:
      type: object
      required: [contractsCreatedByDay, approvalDecisionsByDay]
      properties:
        contractsCreatedByDay:
          type: array
          items: { $ref: "#/components/schemas/TrendDayCount" }
        approvalDecisionsByDay:
          type: array
          items: { $ref: "#/components/schemas/ApprovalDecisionDayPoint" }

    AdminDashboardSnapshot:
      type: object
      required: [kpis, trends]
      properties:
        kpis: { $ref: "#/components/schemas/AdminDashboardKpis" }
        trends: { $ref: "#/components/schemas/AdminDashboardTrends" }

    DrafterDashboardKpis:
      type: object
      required: [myDraftsCount, awaitingMyActionCount, readyToSendCount, myRecentlyApprovedCount]
      properties:
        myDraftsCount: { type: integer }
        awaitingMyActionCount: { type: integer }
        readyToSendCount:
          type: integer
          description: "WHERE drafted_by = caller AND status = 'approved' AND id NOT IN (signature_invitation)."
        myRecentlyApprovedCount: { type: integer }

    DrafterDashboardLists:
      type: object
      required: [myDrafts5, awaitingMyAction5]
      properties:
        myDrafts5:
          type: array
          items: { $ref: "#/components/schemas/DashboardContractRow" }
        awaitingMyAction5:
          type: array
          items: { $ref: "#/components/schemas/DrafterAwaitingActionRow" }

    DrafterDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/DrafterDashboardKpis" }
        lists: { $ref: "#/components/schemas/DrafterDashboardLists" }

    ApproverDashboardKpis:
      type: object
      required: [pendingMyApprovalCount, decidedByMeCount]
      properties:
        pendingMyApprovalCount:
          type: integer
          description: |
            COUNT WHERE COALESCE(delegated_to, reassigned_to,
            approver_user_id) IS NOT DISTINCT FROM v_user_id AND
            status='pending' (S2-22-FIX-2a override-chain + S2-18 NULL-safe).
        decidedByMeCount:
          type: integer
          description: "ad.decided_by = caller AND ad.decided_at >= NOW() - p_window_days days (S2-22-FIX-3)."
        averageDecisionHoursMine:
          type: number
          nullable: true
          description: "AVG hours via approval_step.created_at (S2-22-FIX-2b). NULL when 0 decisions in window."
        averageDecisionHoursTeam:
          type: number
          nullable: true
          description: Same shape, OTHER users with the same approver_role.

    ApproverDashboardLists:
      type: object
      required: [pendingQueue5]
      properties:
        pendingQueue5:
          type: array
          items: { $ref: "#/components/schemas/ApproverPendingQueueRow" }

    ApproverDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/ApproverDashboardKpis" }
        lists: { $ref: "#/components/schemas/ApproverDashboardLists" }

    LegalCounselDashboardKpis:
      type: object
      required: [regulatoryUpdatesThisWindow, openRegulatoryImpacts, criticalSeverityCount, regulationCatalogSize, templateUsageThisWindow]
      properties:
        regulatoryUpdatesThisWindow: { type: integer }
        openRegulatoryImpacts:
          type: integer
          description: "WHERE resolved = FALSE AND is_active = TRUE (CRIT-1 rewrite)."
        criticalSeverityCount: { type: integer }
        regulationCatalogSize: { type: integer }
        templateUsageThisWindow:
          $ref: "#/components/schemas/PlaceholderKpi"
        auditSummary:
          type: object
          nullable: true
          additionalProperties: { type: integer }
          description: |
            jsonb_object_agg(table_name, count) FROM audit_log — keys are
            LIVE `audit_log.table_name` values (S2-22-FIX-4 — was
            `entity_type` which doesn't exist). NULL when caller lacks
            `audit.read` permission (CRIT-4 lock — NOT `audit.read.all`).

    LegalCounselDashboardLists:
      type: object
      required: [recentRegulatoryUpdates5, openImpacts5]
      properties:
        recentRegulatoryUpdates5:
          type: array
          items: { $ref: "#/components/schemas/DashboardRegulatoryUpdateRow" }
        openImpacts5:
          type: array
          items: { $ref: "#/components/schemas/DashboardOpenImpactRow" }

    LegalCounselDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/LegalCounselDashboardKpis" }
        lists: { $ref: "#/components/schemas/LegalCounselDashboardLists" }

    RecipientDashboardKpis:
      type: object
      required: [myContractsCount, pendingMySignatureCount, signedByMeWindow, myObligationsCount]
      properties:
        myContractsCount:
          type: integer
          description: DISTINCT contracts where caller is a `signature_party` (lower(email) match).
        pendingMySignatureCount:
          type: integer
          description: "signature_invitation rows assigned to caller's email AND status='pending'."
        signedByMeWindow:
          type: integer
          description: |
            signature_event WHERE actor_user_id = caller AND
            event_type='signed' AND created_at >= NOW() - p_window_days
            AND is_active=TRUE (S2-22-FIX-1 — was signer_user_id /
            signed_at / outcome; none exist). DN-19 semantic limitation:
            actor_user_id IS NULL for external-only invitation signers
            and they are NOT counted (acceptable trade-off — internal /
            UAE-PASS / app-authenticated recipients DO populate
            actor_user_id and ARE counted).
        myObligationsCount:
          $ref: "#/components/schemas/PlaceholderKpi"

    RecipientDashboardLists:
      type: object
      required: [myContracts5, pendingSignatures5]
      properties:
        myContracts5:
          type: array
          items: { $ref: "#/components/schemas/RecipientMyContractsRow" }
        pendingSignatures5:
          type: array
          items: { $ref: "#/components/schemas/RecipientPendingSignatureRow" }

    RecipientDashboardSnapshot:
      type: object
      required: [kpis, lists]
      properties:
        kpis: { $ref: "#/components/schemas/RecipientDashboardKpis" }
        lists: { $ref: "#/components/schemas/RecipientDashboardLists" }

    DashboardPermissionsSummary:
      type: object
      required: [canViewAdminDashboard, canViewExecutiveDashboard]
      properties:
        canViewAdminDashboard: { type: boolean }
        canViewExecutiveDashboard: { type: boolean }

    DashboardRouterResponse:
      type: object
      description: |
        Returned by `fn_dashboard_router` (S6) — db-design.md §3.6.
        Honours the authoritative DB design over the orchestrator's earlier
        `{ roleSlug, dashboardSlug }` shorthand per
        `feedback_db_impl_report_dont_fix.md`.
      required: [userId, primaryRole, dashboardKey, permissionsSummary]
      properties:
        userId: { type: integer }
        primaryRole:
          type: string
          description: |
            Raw role.name as resolved via `fn_user_get_by_id`
            `v_user->'role'->>'name'` with COALESCE fallback to `'unknown'`
            (S2-22-WARN-3-FIX). Live shape is nested `role:{id,name}` —
            NOT flat `roleName`.
        dashboardKey: { $ref: "#/components/schemas/DashboardKey" }
        permissionsSummary: { $ref: "#/components/schemas/DashboardPermissionsSummary" }

    ExecutiveExpiryCliffs:
      type: object
      required: [next30d, next60d, next90d]
      properties:
        next30d: { type: integer }
        next60d:
          type: integer
          description: "AC-S7-03 monotonic: next30d <= next60d <= next90d."
        next90d: { type: integer }

    ExecutiveDashboardKpis:
      type: object
      required: [totalActiveValueAed, contractsByStatus, expiryCliffs, topCounterpartiesByValue5, valueDistribution, openRegulatoryImpactsCritical]
      properties:
        totalActiveValueAed: { type: number }
        contractsByStatus:
          type: object
          additionalProperties: { type: integer }
        expiryCliffs: { $ref: "#/components/schemas/ExecutiveExpiryCliffs" }
        topCounterpartiesByValue5:
          type: array
          items: { $ref: "#/components/schemas/CounterpartyConcentrationRow" }
        valueDistribution:
          type: array
          items: { $ref: "#/components/schemas/ValueDistributionBucket" }
        openRegulatoryImpactsCritical:
          type: integer
          description: WHERE ri.resolved = FALSE AND ru.severity = 'critical' (CRIT-1 + M5 join).
        aiCostUsdWindow:
          type: number
          nullable: true
          description: |
            Q5 inline figure derived from `fn_ai_request_log_cost_report`
            (M4 043). NULL when caller lacks `ai.observability.read` (no
            error — AC-S7-05 explicit panel marker). 90-day cap inherited
            from M4 even when `windowDays > 90` via the LEAST clause
            inside the fn_.

    ExecutiveDashboardTrends:
      type: object
      required: [valueOverTimeByMonth, contractsCreatedByMonth]
      properties:
        valueOverTimeByMonth:
          type: array
          items: { $ref: "#/components/schemas/TrendMonthValueAed" }
        contractsCreatedByMonth:
          type: array
          items: { $ref: "#/components/schemas/TrendMonthCount" }

    ExecutiveDashboardSnapshot:
      type: object
      required: [kpis, trends]
      properties:
        kpis: { $ref: "#/components/schemas/ExecutiveDashboardKpis" }
        trends: { $ref: "#/components/schemas/ExecutiveDashboardTrends" }

    ExecutiveAnomaliesHistoryResponse:
      type: object
      required: [anomalies]
      properties:
        anomalies:
          type: array
          description: Empty array (NOT 404) when ai_insight cache empty — AC-S8-02.
          items: { $ref: "#/components/schemas/ExecutiveAnomaly" }

    AiCostSummary:
      type: object
      description: |
        Used by S11 standalone endpoint AND by S7 inline (`kpis.aiCostUsdWindow`
        is derived from this same fn_'s `totalCostUsdWindow`). Q5 architect
        lock: `vw_ai_cost_rollup` was DROPPED — single source of compute is
        `fn_ai_request_log_cost_report` (M4 043) wrapped by
        `fn_dashboard_ai_cost_summary`.
      required: [totalCostUsdWindow, totalRequestsWindow, topPromptsByCost5]
      properties:
        totalCostUsdWindow: { type: number }
        totalRequestsWindow: { type: integer }
        cacheHitRatioOverall:
          type: number
          nullable: true
          description: NULL when totalRequestsWindow = 0 (S2-18 NULL semantic).
        topPromptsByCost5:
          type: array
          items: { $ref: "#/components/schemas/AiCostTopPromptRow" }

    HealthCheckDb:
      type: object
      required: [status, currentTimestamp]
      properties:
        status: { $ref: "#/components/schemas/HealthDbStatus" }
        latestMigration:
          type: integer
          nullable: true
          description: |
            MAX(version) FROM schema_migrations. NULL when the
            `schema_migrations_select_admin` RLS SELECT policy (migration
            054 / ARCH-NEW-3 option (c)) is missing OR the table is empty.
        currentTimestamp: { type: string, format: date-time }

    HealthCheckAi:
      type: object
      required: [estimatedHealthy]
      properties:
        lastSuccessfulRequestAt:
          type: string
          format: date-time
          nullable: true
          description: MAX(ai_request_log.created_at) WHERE outcome = 'success'.
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
          description: "MAX(ai_request_log.created_at) WHERE outcome IN ('error','timeout','rate_limited','cancelled')."
        estimatedHealthy:
          type: boolean
          description: lastSuccessfulRequestAt IS NOT NULL AND (lastFailureAt IS NULL OR lastSuccessfulRequestAt > lastFailureAt).

    HealthCheckSnapshot:
      type: object
      required: [db, ai, overall]
      properties:
        db: { $ref: "#/components/schemas/HealthCheckDb" }
        ai: { $ref: "#/components/schemas/HealthCheckAi" }
        overall: { $ref: "#/components/schemas/HealthStatusOverall" }

    # ============================================================
    # M7 — OSINT Source Framework + Adapter Protocol (CR-A)
    # ============================================================

    # --- Enums (7) ---

    SourceKind:
      type: string
      description: |
        `osint_source.kind` CHECK enum. UI dropdown source for the
        /app/admin/sources Add/Edit form.
      enum: [sanctions, news, weather, commodity, fx, social, regulatory, internal]

    SourceFormat:
      type: string
      description: "`osint_source.format` CHECK enum."
      enum: [xml, csv, json, rss, api]

    SignalKind:
      type: string
      description: |
        `osint_signal.kind` CHECK enum (Annex B.2.1 SignalKind). Superset
        of SourceKind — includes `logistics` and `esg` (signals can be
        derived from any kind of source/event).
      enum: [geopolitical, sanctions, weather, commodity, fx, logistics, esg, regulatory, news, internal]

    Severity:
      type: string
      description: |
        `osint_signal.severity_v2` CHECK enum (Annex B.2.1 Severity).
        Ordered enum: informational(1) < low(2) < medium(3) < high(4)
        < critical(5). The `severityMin` filter on
        `GET /signals` matches inclusive minimum.
      enum: [informational, low, medium, high, critical]

    HealthState:
      type: string
      description: |
        `source_health.state` CHECK enum (Annex B.7.1). Drives FE green/
        yellow/red tile colour: healthy=green, degraded=yellow,
        failing/unauthorised=red.
      enum: [healthy, degraded, failing, unauthorised]

    CredentialKind:
      type: string
      description: "`source_credential.credential_kind` CHECK enum."
      enum: [api_key, oauth_token, basic_auth, none]

    DataClassification:
      type: string
      description: |
        Annex B.2.1 + §15 invariant 5 alignment. Used on both
        `osint_source.data_classification` and `osint_signal.data_classification`.
      enum: [demo, pilot, production]

    # --- Embedded JSONB shapes (5) ---

    RateLimitConfig:
      type: object
      description: "`osint_source.rate_limit` JSONB shape (Annex B.5.1)."
      required: [callsPerMinute, burst, minIntervalMs, respectRetryAfter]
      properties:
        callsPerMinute: { type: integer }
        burst: { type: integer }
        minIntervalMs: { type: integer }
        respectRetryAfter: { type: boolean }

    GeoReference:
      type: object
      description: |
        Element of `osint_signal.geographies` JSONB array (Annex B.2.1).
        Used by both adapter `normalise()` output and
        `fn_osint_signal_list` filtering via `@>` GIN index.
      properties:
        isoCountry:
          type: string
          description: "ISO 3166-1 alpha-2 country code (e.g. 'AE')."
        regionCode:
          type: string
          description: "Optional region descriptor (e.g. 'GCC', 'MENA', 'APAC')."
        free:
          type: string
          description: "Optional free-form locality (city / port / facility)."

    EntityReference:
      type: object
      description: |
        Element of `osint_signal.affected_entities` JSONB array (Annex B.2.1).
        Used for filtering signals by counterparty / vessel / facility.
      required: [entityType, name]
      properties:
        entityType:
          type: string
          description: "Entity classification: 'company' / 'vessel' / 'facility' / 'person' / 'instrument' / etc."
        name:
          type: string
        identifier:
          type: string
          description: "Stable identifier — OFAC UID, IMO number, internal counterparty id, etc."
        partyId:
          type: integer
          description: "Optional FK to Musanad party.id when matched."

    SeverityMappingRule:
      type: object
      description: |
        Single rule in `osint_source.severity_mapping.rules`. Per-source
        heuristic that the adapter `normalise()` consults to derive the
        signal severity. Rule shape varies by source kind.
      properties:
        programContains: { type: string }
        titleContains: { type: string }
        absChangePctGte: { type: number }
        pegDeviationPctGte: { type: number }
        default: { $ref: "#/components/schemas/Severity" }
        severity: { $ref: "#/components/schemas/Severity" }

    SeverityMapping:
      type: object
      description: |
        `osint_source.severity_mapping` JSONB shape. Rules are evaluated
        in order; first match wins.
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/SeverityMappingRule" }

    GeographyFilter:
      type: object
      description: |
        `osint_source.geography_filter` JSONB shape (GDELT only in CR-A;
        structure left open for future adapters).
      properties:
        countryIn:
          type: array
          items: { type: string }
        themeIn:
          type: array
          items: { type: string }
        actorIn:
          type: array
          items: { type: string }

    # --- Tenant ---

    Tenant:
      type: object
      description: |
        Derived from `fn_tenant_get_current` JSONB output (db-design.md §3.1).
        CR-A ships a flat single-row table (ADNOC); CR-C extends with
        branding, hierarchy, and hash-chained audit per Q-NEW3 lock.
      required: [id, slug, displayName, configPack]
      properties:
        id:
          type: string
          format: uuid
          description: "ADNOC seed = `00000000-0000-0000-0000-000000000001`."
        slug: { type: string, description: "Stable string handle. ADNOC = 'adnoc'." }
        displayName: { type: string, description: "ADNOC = 'ADNOC'." }
        configPack: { type: string, description: "Drives seed selection (e.g. 'adnoc' / 'default')." }

    # --- OsintSource (entity + detail + listItem) ---

    OsintSource:
      type: object
      description: |
        Base OSINT source registry row. Derived from
        `fn_osint_source_get_by_id` JSONB output (db-design.md §3.3).
      required: [id, tenantId, sourceId, displayName, kind, format, refreshSeconds, sourceReliability, enabled, metadata, dataClassification, createdAt, updatedAt]
      properties:
        id: { type: integer }
        tenantId: { type: string, format: uuid }
        sourceId:
          type: string
          description: "Stable per-tenant string handle, e.g. 'ofac_sdn'. Immutable post-create."
        displayName: { type: string }
        displayNameAr: { type: string, nullable: true }
        kind: { $ref: "#/components/schemas/SourceKind" }
        url:
          type: string
          nullable: true
          description: "**[SENSITIVE]** Endpoint URL. Pino-redacted at log layer; may embed query-string secrets."
        format: { $ref: "#/components/schemas/SourceFormat" }
        refreshSeconds:
          type: integer
          minimum: 60
          description: "Per-row override of adapter-class default (Q-NEW4: per-row always wins)."
        sourceReliability:
          type: number
          minimum: 0
          maximum: 1
          description: "Snapshot at insert time. Copied to `osint_signal.source_reliability` on each insert."
        enabled: { type: boolean }
        rateLimit:
          oneOf:
            - { $ref: "#/components/schemas/RateLimitConfig" }
            - { type: "null" }
        severityMapping:
          oneOf:
            - { $ref: "#/components/schemas/SeverityMapping" }
            - { type: "null" }
        geographyFilter:
          oneOf:
            - { $ref: "#/components/schemas/GeographyFilter" }
            - { type: "null" }
        licensingNote: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          description: "Adapter-specific extra config (sub-feed list / marker list / currency-pair list)."
        dataClassification: { $ref: "#/components/schemas/DataClassification" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SourceHealthBadge:
      type: object
      description: |
        Embedded health summary on list/detail osint_source responses.
        Subset of `SourceHealthListItem` (no sourceId/displayName/kind
        since the parent OsintSource carries those).
      required: [state, signals24h, checkedAt]
      properties:
        state: { $ref: "#/components/schemas/HealthState" }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        signals24h: { type: integer }
        lastErrorMessage:
          type: string
          nullable: true
          description: "**[SENSITIVE]** Truncated to 500 chars by `fn_source_health_record`. Pino-redacted at log layer."
        checkedAt: { type: string, format: date-time }

    SourceCredentialMetadata:
      type: object
      description: |
        Embedded credential summary on `OsintSourceDetail`. NEVER includes
        `credentialRef` (AC-S3-04 invariant — credential_ref MUST NOT
        appear in any API response).
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/CredentialKind" }
        lastRotatedAt: { type: string, format: date-time, nullable: true }

    OsintSourceDetail:
      allOf:
        - { $ref: "#/components/schemas/OsintSource" }
        - type: object
          description: |
            Full GET-by-id response — base OsintSource + embedded health
            badge + credential metadata. credentialRef intentionally NOT
            projected per AC-S3-04. Maps to `GET /admin/sources/:id`
            200 body.
          properties:
            health:
              oneOf:
                - { $ref: "#/components/schemas/SourceHealthBadge" }
                - { type: "null" }
            credential:
              oneOf:
                - { $ref: "#/components/schemas/SourceCredentialMetadata" }
                - { type: "null" }

    OsintSourceListItem:
      allOf:
        - { $ref: "#/components/schemas/OsintSource" }
        - type: object
          description: |
            Identical to OsintSourceDetail except `credential` is absent
            (list joins source_health only; credential metadata is fetched
            per-source via get-by-id).
          properties:
            health:
              oneOf:
                - { $ref: "#/components/schemas/SourceHealthBadge" }
                - { type: "null" }

    OsintSourceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OsintSourceListItem" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    CreateOsintSourceDto:
      type: object
      required: [sourceId, displayName, kind, format, refreshSeconds, sourceReliability]
      description: |
        POST /admin/sources request body. tenant_id is derived from
        `app.current_tenant_id` GUC — never accepted from request body.
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        displayNameAr: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/SourceKind" }
        url: { type: string, description: "**[SENSITIVE]** Pino-redacted." }
        format: { $ref: "#/components/schemas/SourceFormat" }
        refreshSeconds: { type: integer, minimum: 60 }
        sourceReliability: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean, default: true }
        rateLimit: { $ref: "#/components/schemas/RateLimitConfig" }
        severityMapping: { $ref: "#/components/schemas/SeverityMapping" }
        geographyFilter: { $ref: "#/components/schemas/GeographyFilter" }
        licensingNote: { type: string }
        metadata: { type: object, additionalProperties: true, default: {} }
        dataClassification: { $ref: "#/components/schemas/DataClassification" }

    UpdateOsintSourceDto:
      type: object
      description: |
        PATCH /admin/sources/:id request body. ALL fields optional
        (partial update). `sourceId` is REJECTED with 400 if present
        (immutable per AC-S3-08). tenantId is never accepted.
      properties:
        displayName: { type: string }
        displayNameAr: { type: string }
        kind: { $ref: "#/components/schemas/SourceKind" }
        url: { type: string }
        format: { $ref: "#/components/schemas/SourceFormat" }
        refreshSeconds: { type: integer, minimum: 60 }
        sourceReliability: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean }
        rateLimit: { $ref: "#/components/schemas/RateLimitConfig" }
        severityMapping: { $ref: "#/components/schemas/SeverityMapping" }
        geographyFilter: { $ref: "#/components/schemas/GeographyFilter" }
        licensingNote: { type: string }
        metadata: { type: object, additionalProperties: true }
        dataClassification: { $ref: "#/components/schemas/DataClassification" }

    DeleteOsintSourceResponse:
      type: object
      required: [id, deactivated, message]
      properties:
        id: { type: integer }
        deactivated: { type: boolean, enum: [true] }
        message:
          type: string
          example: "Source deactivated. Existing signals remain queryable."

    TestPullResponse:
      type: object
      required: [queued, sourceId, requestedAt]
      description: |
        202 Accepted from POST /admin/sources/:id/test-pull. Actual fetch
        is asynchronous via pg_notify('osint_test_pull') → BE worker
        LISTEN dispatch within ~10s. FE polls source_health every 2s for
        up to 30s after this response (AC-S10-04) to surface delta
        signals_24h count.
      properties:
        queued: { type: boolean, enum: [true] }
        sourceId: { type: string }
        requestedAt: { type: string, format: date-time }

    # --- SourceCredential (DTO + response) ---

    SetCredentialDto:
      type: object
      required: [credentialKind, credentialRef]
      description: |
        POST /admin/sources/:id/credential request body. credentialRef
        MUST match `^(env:|vault:)`; plain-text secrets rejected with
        400 (heuristic — free-form ≥20-char `[A-Za-z0-9_]+` without
        prefix raises 22023 → AC-S3-06). credentialRef is **REDACTED**
        in audit_log payload (AE1) + Pino logs (AE3) and **NEVER**
        returned in the response (AC-S3-04).
      properties:
        credentialKind: { $ref: "#/components/schemas/CredentialKind" }
        credentialRef:
          type: string
          minLength: 3
          pattern: "^(env:|vault:)"
          description: "**[SENSITIVE]** Pattern: `env:VARNAME` OR `vault:path`. NEVER plain-text secret. NEVER returned in response."

    SetCredentialResponse:
      type: object
      required: [id, credentialKind, lastRotatedAt]
      description: |
        POST /admin/sources/:id/credential 200 body. INVARIANT:
        `credentialRef` is NEVER returned (AC-S3-04 — verified by
        integration test absence-grep).
      properties:
        id: { type: integer }
        credentialKind: { $ref: "#/components/schemas/CredentialKind" }
        lastRotatedAt: { type: string, format: date-time }

    # --- OsintSignal ---

    OsintSignal:
      type: object
      description: |
        Annex B.2.1 normalised signal shape. Derived from
        `fn_osint_signal_list` JSONB output (db-design.md §3.4). `id`
        is BIGSERIAL on the DB side; returned as integer in JSON.
        `osintSourceId` is NULL only for the 17 R-LC manual_curated
        back-fill rows (Q-DA3 — they predate osint_source seeding).
        `rawPayload` IS in the response body per design (legal_counsel
        needs SDN entry text for advisory drafting in CR-H); redacted
        at log + audit layer only.
      required: [id, tenantId, sourceId, sourceReliability, fetchedAt, kind, title, geographies, affectedEntities, severity, confidence, rawPayload, dedupHash, dataClassification, createdAt]
      properties:
        id: { type: integer }
        tenantId: { type: string, format: uuid }
        osintSourceId: { type: integer, nullable: true }
        sourceId:
          type: string
          description: "Denormalized for query perf; mirrors osint_source.source_id."
        sourceReliability: { type: number, minimum: 0, maximum: 1 }
        fetchedAt: { type: string, format: date-time }
        eventDate: { type: string, format: date-time, nullable: true }
        kind: { $ref: "#/components/schemas/SignalKind" }
        signalKindSubtype:
          type: string
          nullable: true
          description: "Discriminator: 'manual_curated' (R-LC back-fill) / 'milestone_slippage' / 'sla_breach' / null."
        title: { type: string }
        summary: { type: string, nullable: true }
        geographies:
          type: array
          items: { $ref: "#/components/schemas/GeoReference" }
        affectedEntities:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        url: { type: string, nullable: true }
        rawPayload:
          type: object
          additionalProperties: true
          description: "**[SENSITIVE]** Original source payload. Redacted in logs + audit_log; exposed in API response per design."
        dedupHash:
          type: string
          description: "SHA-256 hex of `source_id || '|' || isoformat(event_date OR fetched_at) || '|' || lower(trim(title))`. Drives idempotent upsert via UNIQUE(tenant_id, dedup_hash)."
        dataClassification: { $ref: "#/components/schemas/DataClassification" }
        createdAt: { type: string, format: date-time }

    OsintSignalListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OsintSignal" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    # --- SourceHealth (list item) ---

    SourceHealthListItem:
      type: object
      description: |
        `fn_source_health_list` row shape (db-design.md §3.5). Wraps
        `SourceHealthBadge` with denormalised source identity. List
        returns a BARE ARRAY (no pagination envelope per S2-12 design
        exception — bounded set per tenant; ~14 rows max in CR-A).
        Sort: failing > unauthorised > degraded > healthy, then displayName.
      required: [sourceId, displayName, kind, state, signals24h, checkedAt]
      properties:
        sourceId: { type: string }
        displayName: { type: string }
        kind: { $ref: "#/components/schemas/SourceKind" }
        state: { $ref: "#/components/schemas/HealthState" }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        signals24h: { type: integer }
        lastErrorMessage:
          type: string
          nullable: true
          description: "**[SENSITIVE]** Truncated to 500 chars by `fn_source_health_record`."
        checkedAt: { type: string, format: date-time }

    # --- pg_notify channel payloads (NOT exposed via HTTP — documented for CR-E + worker LISTEN consumers) ---

    OsintSignalInsertedNotification:
      type: object
      description: |
        `pg_notify('osint_signal_inserted')` payload. Emitted by
        `fn_osint_signal_upsert` (DEFINER, system-only) ONLY on the
        insert path (not on conflict). CR-E rule engine LISTENs to
        this channel.
      required: [id, tenantId, sourceId, severity, kind]
      properties:
        id: { type: integer }
        tenantId: { type: string, format: uuid }
        sourceId: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        kind: { $ref: "#/components/schemas/SignalKind" }

    OsintTestPullNotification:
      type: object
      description: |
        `pg_notify('osint_test_pull')` payload. Emitted by
        `fn_osint_source_test_pull` (INVOKER, source.manage). The fetch
        worker LISTENs and dispatches a manual fetch within ~10s
        (AC-S7-06). Production worker connection MUST use Neon direct
        endpoint, NOT -pooler (F-3 — PgBouncer transaction pooling
        drops session-level LISTEN).
      required: [osintSourceId, tenantId, sourceId, actorId, requestedAt]
      properties:
        osintSourceId: { type: integer }
        tenantId: { type: string, format: uuid }
        sourceId: { type: string }
        actorId: { type: integer }
        requestedAt: { type: string, format: date-time }

    # ============================================================
    # M8 — Internal Signal Data Path (CR-A2)
    # ============================================================

    InternalSignalType:
      type: string
      description: |
        The 8 SOT-sealed internal signal sub-types (db-design.md §1.1
        CHECK enum). Maps 1:1 to `internal_signal_kind.signal_type` AND
        to `osint_signal.signal_kind_subtype` for rows where `kind = 'internal'`.
      enum:
        - milestone_slippage
        - sla_breach
        - payment_delay
        - invoice_dispute
        - vendor_incident
        - ics_incident
        - icv_status_change
        - certificate_expiry

    SignalResolutionKind:
      type: string
      description: |
        Resolution-kind closed list (db-design.md §5.2 step 5). Single
        4-value enum applied uniformly across all 8 signal_types (Agent 5
        decision). Per-subtype reason codes belong in `resolutionNote`
        free-text; pilot can promote a subset to structured tags via a
        separate `resolution_reason_code` lookup table when admin demand
        exists.
      enum:
        - cleared
        - superseded
        - mitigated
        - false_positive

    InternalSignalStatusFilter:
      type: string
      description: |
        Status filter for `GET /api/v1/internal-signals?status=...`.
        Maps to `metadata.resolvedAt IS NULL` (open) /
        `IS NOT NULL` (resolved). `'all'` is the controller-side default
        (no predicate; stripped before passing to fn body).
      enum: [open, resolved, all]

    InternalSignalParameterSchema:
      type: object
      description: |
        Shape of the `parameter_schema` JSONB column on
        `internal_signal_kind`. Consumed by `fn_internal_signal_ingest`
        for required-field enforcement (db-design.md §5.1 step 5).
        `required[]` keys MUST be present on the ingest payload root.
        `optional[]` is documentary (FE form hints / Zod schema generators).
      required: [required, optional]
      properties:
        required:
          type: array
          items: { type: string }
        optional:
          type: array
          items: { type: string }

    InternalSignalKind:
      type: object
      description: |
        `internal_signal_kind` row as projected by
        `fn_internal_signal_kind_list` (db-design.md §5.3). Tenant-scoped
        via `app.current_tenant_id` GUC (RLS policy
        `internal_signal_kind_tenant_select`).
      required:
        - id
        - signalType
        - displayName
        - displayNameAr
        - parameterSchema
        - defaultSeverity
        - isActive
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        signalType: { $ref: "#/components/schemas/InternalSignalType" }
        displayName: { type: string }
        displayNameAr: { type: string }
        description: { type: string, nullable: true }
        parameterSchema: { $ref: "#/components/schemas/InternalSignalParameterSchema" }
        defaultSeverity: { $ref: "#/components/schemas/Severity" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InternalSignalMetadata:
      type: object
      description: |
        Resolution-lifecycle JSONB sub-object stored on
        `osint_signal.metadata` (Q-DA6 lock = ADD column). Written ONLY by
        `fn_internal_signal_resolve` (db-design.md §5.2 step 8).
        Idempotence (AC-S5-03): re-resolve of an already-resolved signal
        returns the existing object unchanged (fn detects via
        `metadata->>'resolvedAt' IS NOT NULL` and skips the pg_notify).
      required: [resolvedAt, resolvedBy, resolutionKind]
      properties:
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: integer, nullable: true }
        resolutionKind: { $ref: "#/components/schemas/SignalResolutionKind" }
        resolutionNote: { type: string, nullable: true }

    InternalSignalRow:
      type: object
      description: |
        Internal signal row as projected by `fn_internal_signal_list`
        (db-design.md §5.4). Narrows the M7 OsintSignal contract to
        `kind='internal'` AND adds CR-A2-specific projections (`signalType`,
        `metadata`, flat `resolvedAt / resolvedBy / resolutionKind`).
        Omits `geographies` / `affectedEntities` / `dedupHash` from the
        M7 OsintSignal projection — uninteresting for the internal-signal
        admin / executive read path.
      required:
        - id
        - tenantId
        - signalType
        - kind
        - title
        - severity
        - confidence
        - fetchedAt
        - sourceId
        - sourceReliability
        - rawPayload
        - metadata
        - createdAt
      properties:
        id: { type: integer }
        tenantId: { type: string, format: uuid }
        signalType: { $ref: "#/components/schemas/InternalSignalType" }
        kind: { type: string, enum: [internal] }
        title: { type: string }
        summary: { type: string, nullable: true }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number }
        fetchedAt: { type: string, format: date-time }
        eventDate: { type: string, format: date-time, nullable: true }
        sourceId: { type: string, enum: ["internal:harness"] }
        sourceReliability: { type: number }
        rawPayload:
          type: object
          additionalProperties: true
          description: "Full original ingest payload — contractId/vendorId/milestoneRef/invoiceRef/etc."
        metadata:
          type: object
          additionalProperties: true
          description: "Empty `{}` for unresolved signals; `InternalSignalMetadata` shape after resolve."
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedBy: { type: integer, nullable: true }
        resolutionKind:
          allOf:
            - $ref: "#/components/schemas/SignalResolutionKind"
          nullable: true
        createdAt: { type: string, format: date-time }

    InternalSignalIngestPayload:
      type: object
      description: |
        Caller payload for `POST /api/v1/admin/internal-signals` →
        `fn_internal_signal_ingest(p_payload JSONB)` (db-design.md §5.1
        parameters). The fn translates this into the M7
        `OsintSignalUpsertPayload` shape internally and DELEGATES to
        `fn_osint_signal_upsert`.

        Required keys: `signalType` + `observedAt`. Conditional keys per
        the catalogue row's `parameterSchema.required[]`:
          - milestone_slippage: contractId, milestoneRef
          - sla_breach:         contractId
          - payment_delay:      contractId, invoiceRef, daysOverdue
          - invoice_dispute:    contractId, invoiceRef
          - vendor_incident:    vendorId
          - ics_incident:       (none beyond observedAt)
          - icv_status_change:  vendorId
          - certificate_expiry: (none beyond observedAt)

        Severity override is OPTIONAL — `fn_internal_signal_ingest`
        defaults to the catalogue row's `defaultSeverity`.
      required: [signalType, observedAt]
      properties:
        signalType: { $ref: "#/components/schemas/InternalSignalType" }
        observedAt:
          type: string
          format: date-time
          description: "ISO-8601 UTC timestamp."
        contractId: { type: integer }
        vendorId: { type: integer }
        milestoneRef: { type: string }
        invoiceRef: { type: string }
        daysOverdue: { type: integer }
        severityCalcInput:
          type: object
          additionalProperties: true
        severity: { $ref: "#/components/schemas/Severity" }
        dataClassification: { $ref: "#/components/schemas/DataClassification" }

    InternalSignalIngestResponse:
      type: object
      description: |
        Response from `fn_internal_signal_ingest` (db-design.md §5.1
        step 11). `inserted=true` means a new row was written;
        `inserted=false` means the dedup_hash UNIQUE(tenant_id, dedup_hash)
        suppressed the insert (idempotent AC-S2-02).
      required: [signalId, inserted, dedupHashHit, signalKindSubtype]
      properties:
        signalId: { type: integer }
        inserted: { type: boolean }
        dedupHashHit: { type: boolean }
        signalKindSubtype: { $ref: "#/components/schemas/InternalSignalType" }

    InternalSignalResolvePayload:
      type: object
      description: |
        Body for `POST /api/v1/internal-signals/:id/resolve`
        (db-design.md §5.2 parameters).
      required: [resolutionKind]
      properties:
        resolutionKind: { $ref: "#/components/schemas/SignalResolutionKind" }
        resolutionNote:
          type: string
          description: "Optional free-text. Persisted to metadata.resolutionNote."

    InternalSignalResolveResponse:
      type: object
      description: |
        Response from `fn_internal_signal_resolve` (db-design.md §5.2
        step 10). Idempotent — re-resolve returns the existing values
        without re-emitting the pg_notify (AC-S5-03).
      required: [signalId, resolvedAt]
      properties:
        signalId: { type: integer }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: integer, nullable: true }
        resolutionKind:
          $ref: "#/components/schemas/SignalResolutionKind"
          description: "Optional. Echoed by BE; not present in workspace types.ts (Doc-Drift Nit deferred)."
        idempotent:
          type: boolean
          description: "Optional. true on idempotent re-resolve; absent or false on first-resolve. Not present in workspace types.ts (Doc-Drift Nit deferred)."

    InternalSignalListResponse:
      type: object
      description: |
        Paginated list response for `GET /api/v1/internal-signals`
        (db-design.md §5.4).
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/InternalSignalRow" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    InternalSignalResolvedNotification:
      type: object
      description: |
        `pg_notify('internal_signal_resolved')` payload. Emitted by
        `fn_internal_signal_resolve` (INVOKER) on first-resolve only —
        NOT on idempotent re-resolve (AC-S5-03). CR-E rule engine LISTENs
        for downstream re-evaluation. Mirrors the M7
        `OsintSignalInsertedNotification` naming convention. NOT exposed
        via HTTP — documented for future CR-E worker implementations.
      required: [signalId, tenantId, signalKindSubtype, resolutionKind, resolvedAt]
      properties:
        signalId: { type: integer }
        tenantId: { type: string, format: uuid }
        signalKindSubtype: { $ref: "#/components/schemas/InternalSignalType" }
        resolutionKind: { $ref: "#/components/schemas/SignalResolutionKind" }
        resolvedBy: { type: integer, nullable: true }
        resolvedAt: { type: string, format: date-time }

    # ============================================================
    # M9 — Counterparty Graph (CR-B)
    # ============================================================

    RelationshipType:
      type: string
      description: |
        Closed CHECK enum on `party_relationship.relationship_type`
        (Q-DA5=5a — 6 values; pilot adds via M1b 010 dynamic-rename
        pattern when needed; COMMENT ON COLUMN documents the upgrade
        path).
      enum:
        - parent
        - ubo
        - subsidiary
        - sub_contractor
        - jv
        - controlling_shareholder

    SanctionsStatus:
      type: string
      description: |
        Closed CHECK enum on `party.sanctions_status` (4 values). `clean`
        is the column DEFAULT. `flagged` and `sanctioned` are written by
        the CR-E rule engine (future module — out of M9 scope per
        Q-DA4=4a). M9's `fn_party_sanctions_match` is return-only and
        does NOT mutate this column. M9's `fn_party_update` does NOT
        accept `sanctions_*` parameters (defence-in-depth).
      enum:
        - clean
        - flagged
        - sanctioned
        - under_review

    IcvStatus:
      type: string
      description: "Closed CHECK enum on `party.icv_status` (5 values)."
      enum:
        - certified
        - expired
        - downgraded
        - pending
        - none

    RelationshipSource:
      type: string
      description: |
        Closed CHECK enum on `party_relationship.source` — provenance of
        the edge. `manual` is the column DEFAULT.
      enum:
        - dnb
        - sayari
        - manual
        - demo_seed

    ChainHopVia:
      type: string
      description: |
        Discriminator on each `PartyChainNode.via` indicating how this
        hop was reached: `edge` = via the `party_relationship` edge
        table (tenant-scoped); `self_fk_parent` = via `party.parent_id`
        self-FK shortcut (single-tenant in v1 per Q-DA7=7a);
        `self_fk_ubo` = via `party.ubo_id` self-FK shortcut.
      enum: [edge, self_fk_parent, self_fk_ubo]

    SanctionsMatchType:
      type: string
      description: |
        Discriminator on each `PartySanctionsMatchEntry.matchType`.
        `direct_name` = pg_trgm hit on `party.name_en`. `direct_alias`
        = hit on any element of `party.aliases`. `chain_ancestor` /
        `chain_descendant` = expansion via `fn_party_chain_traverse_up`
        / `_down` from a direct match.
      enum: [direct_name, direct_alias, chain_ancestor, chain_descendant]

    ChainDirection:
      type: string
      description: |
        Query-string enum for `GET /api/v1/parties/:id/chain?direction=`.
        `up` returns ancestors; `down` returns descendants; `both`
        (default) returns both flat-array payloads in a single response
        (BE merges via Promise.all of `_up` + `_down` fns).
      enum: [up, down, both]

    PartyAliasArray:
      type: array
      description: |
        Trimmed, deduped, non-empty alias list stored on `party.aliases`
        (JSONB array of strings). FE PartyAliasesField chip-list editor
        enforces the same invariants client-side; `fn_party_update`
        raises 22023 `invalid_aliases_shape` if the body is not a JSONB
        array of strings (AC-S9-04). GIN index on aliases supports
        fuzzy-alias hits in `fn_party_sanctions_match`.
      items: { type: string, minLength: 1 }

    PartyRelationship:
      type: object
      description: |
        A single directed-typed edge in the counterparty graph
        (db-design.md §6.2). `parent_id` and `child_id` are immutable
        post-create (PATCH silently ignores them per AC-S2-04). Soft
        delete only (`is_active=FALSE`); RESTRICTIVE
        `party_relationship_deny_direct_delete` policy blocks hard
        DELETE — only `fn_party_relationship_delete` allowed.
      required:
        - id
        - tenantId
        - parentId
        - childId
        - relationshipType
        - source
        - confidence
        - metadata
        - createdAt
        - updatedAt
        - isActive
      properties:
        id: { type: integer }
        tenantId: { type: string, format: uuid }
        parentId: { type: integer }
        childId: { type: integer }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        ownershipPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        effectiveFrom: { type: string, format: date, nullable: true }
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: "If both effectiveFrom + effectiveTo are set, DB CHECK enforces effectiveTo >= effectiveFrom."
        source: { $ref: "#/components/schemas/RelationshipSource" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isActive: { type: boolean }

    CreateRelationshipPayload:
      type: object
      description: |
        Body for `POST /api/v1/parties/:id/relationships`. URL `:id`
        supplies `parentId` (the URL is always the parent); body supplies
        `childId`. Self-loop guard: `childId === pathId` raises 22023
        `self_loop_not_allowed` (AC-S1-06; defence-in-depth in Zod via
        cross-field refine() AND in fn body).
      required: [childId, relationshipType]
      properties:
        childId: { type: integer, minimum: 1 }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        ownershipPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        effectiveFrom: { type: string, format: date, nullable: true }
        effectiveTo: { type: string, format: date, nullable: true }
        source: { $ref: "#/components/schemas/RelationshipSource" }
        confidence: { type: number, minimum: 0, maximum: 1, default: 1.0 }
        metadata:
          type: object
          additionalProperties: true
          default: {}

    UpdateRelationshipPayload:
      type: object
      description: |
        Partial update body for `PATCH /api/v1/parties/:id/relationships/:relId`.
        `parentId` + `childId` are immutable post-create — silently dropped if
        present (AC-S2-04). All fields optional; at least one required.
      properties:
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        ownershipPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        effectiveFrom: { type: string, format: date, nullable: true }
        effectiveTo: { type: string, format: date, nullable: true }
        source: { $ref: "#/components/schemas/RelationshipSource" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        metadata:
          type: object
          additionalProperties: true

    RelationshipListEdge:
      type: object
      description: |
        A single edge as projected by `fn_party_relationship_list`
        (db-design.md §6.2). Each edge embeds the joined other-party
        `{ partyId, nameEn, nameAr, sanctionsStatus }` so the FE renders
        the panel without a follow-up GET /parties/:id roundtrip
        (AC-S4-02).
      required: [id, relationshipType, otherParty, isOutgoing]
      properties:
        id: { type: integer }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        ownershipPct: { type: number, nullable: true }
        effectiveFrom: { type: string, format: date, nullable: true }
        effectiveTo: { type: string, format: date, nullable: true }
        source: { $ref: "#/components/schemas/RelationshipSource" }
        confidence: { type: number }
        isOutgoing:
          type: boolean
          description: "true → this edge points OUT from the anchor party (anchor is parent_id); false → IN to the anchor (anchor is child_id)."
        otherParty:
          type: object
          required: [partyId, nameEn, sanctionsStatus]
          properties:
            partyId: { type: integer }
            nameEn: { type: string }
            nameAr: { type: string, nullable: true }
            sanctionsStatus: { $ref: "#/components/schemas/SanctionsStatus" }

    ListRelationshipsResponse:
      type: object
      description: "Bare-array (no pagination) — bounded result; <50 edges typical."
      required: [incoming, outgoing, counts]
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/RelationshipListEdge" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/RelationshipListEdge" }
        counts:
          type: object
          required: [incoming, outgoing]
          properties:
            incoming: { type: integer }
            outgoing: { type: integer }

    DeleteRelationshipResponse:
      type: object
      description: |
        Response from `fn_party_relationship_delete`. Idempotent —
        re-deleting an already-soft-deleted edge returns 200 with the
        original `deletedAt` + `idempotent=true` (AC-S3-02).
      required: [success, deletedAt, idempotent]
      properties:
        success: { type: boolean, enum: [true] }
        deletedAt: { type: string, format: date-time }
        idempotent: { type: boolean }

    PartyChainNode:
      type: object
      description: |
        Single node in a chain traversal result. Each node embeds
        `nameEn` / `nameAr` / `sanctionsStatus` for FE rendering without
        follow-up roundtrips (AC-S5-06). `via` discriminates how this
        hop was reached (edge vs. self-FK shortcut).
      required:
        - partyId
        - depth
        - relationshipType
        - sanctionsStatus
        - nameEn
        - via
      properties:
        partyId: { type: integer }
        depth: { type: integer, minimum: 0 }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        ownershipPct: { type: number, nullable: true }
        sanctionsStatus: { $ref: "#/components/schemas/SanctionsStatus" }
        nameEn: { type: string }
        nameAr: { type: string, nullable: true }
        via: { $ref: "#/components/schemas/ChainHopVia" }

    PartyChainTraverseUpResponse:
      type: object
      description: "Response shape when `direction=up`."
      required: [rootPartyId, ancestors, chainTruncated, depthReached]
      properties:
        rootPartyId: { type: integer }
        ancestors:
          type: array
          items: { $ref: "#/components/schemas/PartyChainNode" }
        chainTruncated:
          type: boolean
          description: "true when p_max_depth was hit (Q-DA3=3a silent cap; no RAISE on cycle / depth-limit)."
        depthReached: { type: integer }

    PartyChainTraverseDownResponse:
      type: object
      description: "Response shape when `direction=down`."
      required: [rootPartyId, descendants, chainTruncated, depthReached]
      properties:
        rootPartyId: { type: integer }
        descendants:
          type: array
          items: { $ref: "#/components/schemas/PartyChainNode" }
        chainTruncated: { type: boolean }
        depthReached: { type: integer }

    PartyChainBothResponse:
      type: object
      description: |
        Response shape when `direction=both` (default). BE merges
        `fn_party_chain_traverse_up` + `_down` results via Promise.all;
        `chainTruncated` is OR-merged; `depthReached` is MAX-merged.
      required: [rootPartyId, ancestors, descendants, chainTruncated, depthReached]
      properties:
        rootPartyId: { type: integer }
        ancestors:
          type: array
          items: { $ref: "#/components/schemas/PartyChainNode" }
        descendants:
          type: array
          items: { $ref: "#/components/schemas/PartyChainNode" }
        chainTruncated: { type: boolean }
        depthReached: { type: integer }

    PartyChainTraverseResponse:
      description: |
        Discriminated union on `direction` query param. The exact response
        shape is one of `PartyChainTraverseUpResponse` /
        `PartyChainTraverseDownResponse` / `PartyChainBothResponse`.
      oneOf:
        - $ref: "#/components/schemas/PartyChainTraverseUpResponse"
        - $ref: "#/components/schemas/PartyChainTraverseDownResponse"
        - $ref: "#/components/schemas/PartyChainBothResponse"

    RelationshipTypeCounts:
      type: object
      description: |
        Direct-relationship counts for the chain root. AC-S8-03
        invariant: ALL 6 keys ALWAYS present with default 0; never
        undefined keys.
      required:
        - parent
        - ubo
        - subsidiary
        - sub_contractor
        - jv
        - controlling_shareholder
      properties:
        parent: { type: integer }
        ubo: { type: integer }
        subsidiary: { type: integer }
        sub_contractor: { type: integer }
        jv: { type: integer }
        controlling_shareholder: { type: integer }

    PartyChainSummary:
      type: object
      description: |
        Single-roundtrip flattened chain summary. Combines
        `fn_party_chain_traverse_up` + `_down` + `fn_party_relationship_list`
        internally. Pre-pivots ancestors/descendants by depth (AC-S8-02
        — string-keyed map `{ "1": [...], "2": [...] }`); emits all 6
        relationshipType counts even when 0 (AC-S8-03); single
        `chainTruncated` flag covering both directions (AC-S8-04 —
        OR of up.chainTruncated and down.chainTruncated). Drives the
        FE `OwnershipChainTab` tree-layout component without further
        client-side grouping.
      required: [rootParty, ancestorsByDepth, descendantsByDepth, directRelationshipCounts, chainTruncated]
      properties:
        rootParty:
          type: object
          required: [id, nameEn, sanctionsStatus]
          properties:
            id: { type: integer }
            nameEn: { type: string }
            nameAr: { type: string, nullable: true }
            sanctionsStatus: { $ref: "#/components/schemas/SanctionsStatus" }
            esgScore: { type: integer, nullable: true, minimum: 0, maximum: 100 }
            icvStatus:
              allOf:
                - $ref: "#/components/schemas/IcvStatus"
              nullable: true
            icvPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        ancestorsByDepth:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PartyChainNode" }
          description: "Keys are depth strings ('1', '2', ...)."
        descendantsByDepth:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PartyChainNode" }
        directRelationshipCounts: { $ref: "#/components/schemas/RelationshipTypeCounts" }
        chainTruncated: { type: boolean }

    PartySanctionsMatchInput:
      type: object
      description: |
        Body for `POST /api/v1/admin/parties/sanctions-match`. The
        `signalEntities` array shape mirrors `osint_signal.affected_entities`
        verbatim per S2-19 cross-fn signature stability — the same
        `EntityReference` shape produced by `fn_osint_signal_upsert`.
      required: [signalEntities]
      properties:
        signalEntities:
          type: array
          minItems: 1
          items:
            type: object
            required: [entityType, name]
            properties:
              entityType: { type: string }
              name: { type: string, minLength: 1 }
              identifier: { type: string }
              partyId: { type: integer }
        similarityThreshold:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Optional per-call override. Resolution order:
            param → `app.party_sanctions_match_threshold` GUC override
            → 0.7 default (Q-DA2=2a).

    PartySanctionsMatchEntry:
      type: object
      description: |
        Single match envelope. Includes `matchedEntityName` for
        source-traceability (AC-S7-05). `chainPath` is non-null only when
        `matchType` is `chain_ancestor` or `chain_descendant`.
      required: [partyId, name, matchedEntityName, matchType, similarity]
      properties:
        partyId: { type: integer }
        name: { type: string }
        matchedEntityName: { type: string }
        matchType: { $ref: "#/components/schemas/SanctionsMatchType" }
        similarity: { type: number, minimum: 0, maximum: 1 }
        chainPath:
          type: array
          nullable: true
          items:
            type: object
            required: [partyId, depth, relationshipType]
            properties:
              partyId: { type: integer }
              depth: { type: integer }
              relationshipType: { $ref: "#/components/schemas/RelationshipType" }

    PartySanctionsMatchResponse:
      type: object
      description: |
        Return-only envelope (Q-DA4=4a). `party.sanctions_status` is
        verifiable as unchanged via select-before / select-after
        (AC-S7-06); CR-E rule engine writes status via separate DEFINER
        carve-out (out of M9 scope).
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/PartySanctionsMatchEntry" }

    PartyUpdatePayload:
      type: object
      description: |
        Partial-update body for `PATCH /api/v1/parties/:id` (db-design.md
        §3.4). Editable subset only — `sanctionsStatus` /
        `sanctionsLastChecked` / `sanctionsMatchSignalId` are silently
        ignored even if forwarded (defence-in-depth — Q-DA4=4a +
        AC-S9-05; the fn signature does NOT accept them as parameters).
        `parentId` / `uboId` use a sentinel-mapping convention:
        `undefined` → leave alone; `null` → BE controller maps to `-1`
        which the fn body interprets as explicit unset (db-design.md
        §3.4 convention).
      properties:
        nameEn: { type: string, maxLength: 200 }
        nameAr: { type: string, maxLength: 200, nullable: true }
        emirate: { type: string, maxLength: 40, nullable: true }
        freeZone: { type: string, maxLength: 80, nullable: true }
        country: { type: string, maxLength: 60, nullable: true }
        contactEmail: { type: string, format: email, maxLength: 255, nullable: true }
        contactPhone: { type: string, maxLength: 40, nullable: true }
        registeredAddress: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        tradeLicenseNumber: { type: string, maxLength: 80, nullable: true }
        tradeLicenseIssuer: { type: string, maxLength: 80, nullable: true }
        parentId:
          type: integer
          minimum: 1
          nullable: true
          description: "Send null to explicitly unset; BE maps null → -1 before fn call."
        uboId:
          type: integer
          minimum: 1
          nullable: true
          description: "Same sentinel convention as parentId."
        aliases: { $ref: "#/components/schemas/PartyAliasArray" }
        esgScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: "DB CHECK 0..100 (AC-S9-06). CHECK violation surfaces as 23514, routed to 400 via translatePgError."
        icvStatus:
          allOf:
            - $ref: "#/components/schemas/IcvStatus"
          nullable: true
        icvPct: { type: number, minimum: 0, maximum: 100, nullable: true }
        icvLastChecked: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          additionalProperties: true

    PartyDetail:
      type: object
      description: |
        Extended party detail projection. Migration 120 rewrites
        `fn_party_get_by_id` to add 11 new fields per Q-DA1=1a; existing
        M_parity 058 + R-LC 070/075 fields preserved verbatim
        (additive widening — backward-compat invariant). Returned by
        `GET /api/v1/parties/:id` (transitive widening per OI-M9-2),
        `PATCH /api/v1/parties/:id`, and `POST /api/v1/parties` (R-LC 073
        `fn_party_create` ends with `RETURN fn_party_get_by_id(...)` —
        also widens transparently). Workspace types.ts is the canonical
        source of truth for the full key list — this schema documents the
        M9-introduced additions only; existing M_parity / R-LC fields
        omitted here for brevity (see `data-dictionary.md` §`party`).
      properties:
        id: { type: integer }
        nameEn: { type: string }
        nameAr: { type: string, nullable: true }
        parentId: { type: integer, nullable: true, description: "M9 — self-FK shortcut to direct parent party." }
        uboId: { type: integer, nullable: true, description: "M9 — self-FK shortcut to ultimate beneficial owner." }
        sanctionsStatus: { $ref: "#/components/schemas/SanctionsStatus" }
        sanctionsLastChecked: { type: string, format: date-time, nullable: true }
        sanctionsMatchSignalId:
          type: integer
          nullable: true
          description: "M9 — FK → osint_signal.id; written by CR-E rule engine (out of scope)."
        esgScore: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        icvStatus:
          allOf: [{ $ref: "#/components/schemas/IcvStatus" }]
          nullable: true
        icvPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        icvLastChecked: { type: string, format: date-time, nullable: true }
        aliases: { $ref: "#/components/schemas/PartyAliasArray" }
        metadata:
          type: object
          additionalProperties: true

    # ---------------------------------------------------------------
    # M14 / CR-F — Risk Scoring schemas
    # ---------------------------------------------------------------

    RiskScoreDimensionBreakdown:
      type: object
      description: Breakdown for one risk dimension (legal / financial / operational / reputational / compliance).
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        probability: { type: number, minimum: 0, maximum: 1 }
        impact: { type: number, minimum: 0, maximum: 1 }
        reasons:
          type: array
          items: { type: string }

    WeightsAtCalculation:
      type: object
      description: Snapshot of scoring weights in effect at compute time.
      properties:
        legal: { type: number }
        financial: { type: number }
        operational: { type: number }
        reputational: { type: number }
        compliance: { type: number }

    MarFormulaBreakdown:
      type: object
      description: MaR formula audit trail stored inside explanation JSONB.
      properties:
        contractValue: { type: string, nullable: true, description: "AED string or null for SOWs (HITL Q5)." }
        exposureFraction: { type: number }
        probability: { type: number, nullable: true }
        impactMultiplier: { type: number, nullable: true }
        marValue: { type: string, nullable: true }

    HydratedContributingCorrelation:
      type: object
      description: Correlation with hydrated signal + rule + matched-clause details.
      properties:
        correlationId: { type: string, description: "BIGINT as string." }
        ruleId: { type: string }
        probability: { type: number }
        impactMultiplier: { type: number }
        marContribution: { type: string, nullable: true }
        dimensionsAffected: { type: array, items: { type: string } }
        ruleVersionHash: { type: string, nullable: true }
        confidence: { type: number }
        matchReason: { type: string, nullable: true }
        status: { type: string }
        sourceReliability: { type: number }
        signal:
          type: object
          properties:
            id: { type: string }
            titleEn: { type: string, nullable: true }
            titleAr: { type: string, nullable: true }
            signalKind: { type: string, nullable: true }
            occurredAt: { type: string, format: date-time, nullable: true }
        matchedClause:
          type: object
          nullable: true
          properties:
            id: { type: string }
            clauseTypeV2: { type: string, nullable: true }
            snippet: { type: string, nullable: true }

    RiskScoreExplainResponse:
      type: object
      description: |
        Full risk score explain response from fn_risk_score_explain.
        SENSITIVE — contributingCorrelations, explanation fields are
        Pino-redacted on egress. Powers GET /api/v1/contracts/:id/risk-score.
      properties:
        riskScoreId: { type: string, description: "BIGINT as string." }
        contractId: { type: string, description: "BIGINT as string." }
        healthScore: { type: integer, minimum: 0, maximum: 100 }
        dimensions:
          type: object
          properties:
            legal: { $ref: "#/components/schemas/RiskScoreDimensionBreakdown" }
            financial: { $ref: "#/components/schemas/RiskScoreDimensionBreakdown" }
            operational: { $ref: "#/components/schemas/RiskScoreDimensionBreakdown" }
            reputational: { $ref: "#/components/schemas/RiskScoreDimensionBreakdown" }
            compliance: { $ref: "#/components/schemas/RiskScoreDimensionBreakdown" }
        marFormula: { $ref: "#/components/schemas/MarFormulaBreakdown" }
        marValue: { type: string, nullable: true, description: "AED amount as string; null for SOWs." }
        marCurrency: { type: string, enum: [AED] }
        weightsVersion: { type: string }
        weightsAtCalculation: { $ref: "#/components/schemas/WeightsAtCalculation" }
        contributingCorrelations:
          type: array
          items: { $ref: "#/components/schemas/HydratedContributingCorrelation" }
          description: "SENSITIVE — Pino-redacted."
        calculatedAt: { type: string, format: date-time }
        triggeredBy:
          type: string
          enum: [signal, clause_change, weight_change, scheduled, manual, bootstrap]

    RiskScoreHistorySnapshot:
      type: object
      description: Single snapshot row from fn_risk_score_history.
      properties:
        riskScoreId: { type: string }
        calculatedAt: { type: string, format: date-time }
        healthScore: { type: integer, minimum: 0, maximum: 100 }
        dimLegal: { type: integer, minimum: 0, maximum: 100 }
        dimFinancial: { type: integer, minimum: 0, maximum: 100 }
        dimOperational: { type: integer, minimum: 0, maximum: 100 }
        dimReputational: { type: integer, minimum: 0, maximum: 100 }
        dimCompliance: { type: integer, minimum: 0, maximum: 100 }
        marValue: { type: string, nullable: true }
        marCurrency: { type: string, enum: [AED] }
        triggeredBy: { type: string }
        weightsVersion: { type: string }

    RiskScoreHistoryResponse:
      type: object
      description: Paginated history of risk score snapshots for a contract.
      properties:
        contractId: { type: string }
        windowDays: { type: integer, enum: [30, 90, 180] }
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/RiskScoreHistorySnapshot" }
        count: { type: integer }

    AvarBreakdownBucket:
      type: object
      description: Single group-by bucket in AVaR aggregation result.
      properties:
        key: { type: string }
        label: { type: string }
        avar: { type: string, nullable: true, description: "AED NUMERIC as string; null when no mar_value contracts." }
        contractCount: { type: integer }
        pctOfTotal: { type: number, nullable: true }

    AvarDeltaVsPriorWindow:
      type: object
      description: Delta comparison vs the equivalent prior window.
      properties:
        priorAvar: { type: string }
        deltaAed: { type: string }
        deltaPct: { type: number, nullable: true }

    AvarAggregateResponse:
