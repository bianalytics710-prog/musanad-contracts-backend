  /regulations:
    get:
      tags: [M5 — Regulations]
      operationId: regulationList
      summary: List regulations with pagination + filters (S1)
      description: |
        List paginated regulations. Filters compose AND. Search ILIKE on
        titleEn / titleAr / referenceCode (FE debounces 300ms — T10). Sort:
        effective_date DESC NULLS LAST, created_at DESC.
      x-authorisedRoles: [Super Admin, platform_admin, legal_counsel, contract_drafter, contract_approver, contract_approver_2, executive]
      x-requiredPermissions: regulations.read
      x-authMode: jwt
      x-storyId: S1
