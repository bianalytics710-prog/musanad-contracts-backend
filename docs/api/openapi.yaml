        per tenant; mirrors M7 `fn_source_health_list` precedent.
        Returns `is_active=TRUE` rows only. Ordered `signal_type ASC`
        (deterministic for FE / screen-reader iteration). Tenant-scoped
        via `internal_signal_kind_tenant_select` RLS policy on
        `current_setting('app.current_tenant_id')::uuid`. Each row
        carries `parameterSchema` JSON-Schema-style spec consumed by
        `fn_internal_signal_ingest` for required-field enforcement, plus
