        "404": { description: Item not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /regulatory/cascade/items/{itemId}/draft-amendment:
    post:
      tags: ["CR-M — Labor-Law Cascade"]
      summary: Generate labor-law amendment advisory draft
      description: |
        7-step orchestration in regulatory-cascade-draft.service.ts:
        1. Load cascade item (extracts signalId, affectedContractIds).
        2. Idempotency guard — 409 if advisory_draft_id already set.
        3. Resolve contractId (body.contractId or item.affectedContractIds[0]).
        4. Locate or create correlation (signal=decree, contract=affected).
        5. Fetch labor_law_amendment_v1 advisory_template id.
        6. generateAdvisoryDraft (Mustache + LLM via CR-H advisory-drafter.service).
        7. fn_regulatory_cascade_item_link_draft — sets advisory_draft_id, status→amended.
        Separation of duties: compliance_esg can run cascade but NOT draft amendments (403).
      operationId: draftCascadeAmendment
      security: [{ BearerAuth: [] }]
      x-authorised-roles: ["legal_counsel", "compliance_esg (403)", "platform_admin", "Super Admin"]
      x-permission: advisory.draft.review
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
          description: regulatory_cascade_item.id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contractId:
                  type: integer
                  description: Override contract to associate with draft (defaults to first affectedContractId)
      responses:
        "200":
          description: Advisory draft created and linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAmendmentResponse" }
        "400": { description: No affectedContractIds on item, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks advisory.draft.review permission (compliance_esg is intentionally blocked), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Item / signal / contract not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Advisory draft already linked to this item, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

