  /internal-signals:
    get:
      tags: [M8 — Internal Signals]
      operationId: internalSignalList
      summary: Paginated list of internal signals
      description: |
        Paginated list of internal signals (`osint_signal` rows where
        `kind='internal'`) for the current tenant. Filters: `signalType`
        (one of 8 enum values; filters on `osint_signal.signal_kind_subtype`),
        `contractId` (filters on `raw_payload->>'contractId'` — used to
        assemble the EPC SLA hero scenario per AT-2), `vendorId`
        (filters on `raw_payload->>'vendorId'`), `since` (ISO-8601 UTC;
        `fetched_at >= since` — required for the `count_in_180_days`
        predicate per AT-2 / AC-S4-02), `status` ('open' →
        `metadata.resolvedAt IS NULL`, 'resolved' → `IS NOT NULL`, 'all'
        → no predicate, default).
        Does NOT wrap M7 `fn_osint_signal_list` (per collision-report
        S2-19 finding 2 — different filter set + different permission gate);
        direct osint_signal scan with `kind='internal'` filter.
        Order: `fetched_at DESC NULLS LAST, id DESC`. `limit` clamped to
        `LEAST(p_limit, 100)` per M7 fn_osint_signal_list precedent.
        Tenant-scoped via the M7 `osint_signal_tenant_isolation_select`
        RLS policy — cross-tenant requests return empty data array
        (AC-S4-04 / AC-S8-02).
