        - BearerAuth: []
      x-authorised-roles: ["platform_admin", "legal_counsel"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: scenario
          in: query
          schema: { type: string, maxLength: 100 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Paginated correlation rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            ruleId: { type: string }
                            name: { type: string }
                            nameAr: { type: string }
                            scenario: { type: string, nullable: true }
                            enabled: { type: boolean }
                            lastReviewedAt: { type: string, format: date-time, nullable: true }
                            versionHashShort: { type: string }
                            versionHash: { type: string }
                            updatedAt: { type: string, format: date-time }
                      pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { description: Invalid query parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      summary: Create a new correlation rule with DSL match and produce YAML bodies
      description: |
        BE parser validates matchYaml and produceYaml against Annex C grammar before
        calling fn_rule_create. fn_rule_create computes SHA-256 version_hash and emits
        PG NOTIFY 'correlation_rule_changed' for cache invalidation (HITL Q3).
        rule_id must be unique per tenant.
      operationId: createCorrelationRule
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruleId, name, nameAr, matchYaml, produceYaml]
              properties:
                ruleId: { type: string, maxLength: 200, description: "e.g. rule.sanctions.direct_counterparty" }
                name: { type: string, maxLength: 200 }
                nameAr: { type: string, maxLength: 200 }
                scenario: { type: string, maxLength: 100, nullable: true }
                enabled: { type: boolean, default: true }
                matchYaml: { type: string, description: DSL match block per Annex C grammar }
                produceYaml: { type: string, description: DSL produce block per Annex C.5 }
                meta: { type: object, description: Optional CorrelationRuleMeta }
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      tenantId: { type: string, format: uuid }
                      ruleId: { type: string }
                      name: { type: string }
                      nameAr: { type: string }
                      scenario: { type: string, nullable: true }
                      enabled: { type: boolean }
                      meta: { type: object }
                      matchYaml: { type: string }
                      produceYaml: { type: string }
                      versionHash: { type: string }
                      lastReviewedBy: { type: integer, nullable: true }
                      lastReviewedByName: { type: string, nullable: true }
                      lastReviewedAt: { type: string, format: date-time, nullable: true }
                      dataClassification: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      createdBy: { type: integer, nullable: true }
                      updatedBy: { type: integer, nullable: true }
                      isActive: { type: boolean }
        "400": { description: Required field missing or invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: A rule with this ruleId already exists in the tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: matchYaml or produceYaml is not valid YAML per Annex C grammar, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/rules/{id}:
    get:
      summary: Fetch a single correlation rule by ID with fixture summary
      description: |
        Full rule detail including matchYaml, produceYaml, meta, versionHash, and
        a fixtures array (id, fixtureId, description, expectedMatch per fixture).
        Used by the admin rule detail page and test-against-fixture panel.
      operationId: getCorrelationRule
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin", "legal_counsel"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Full rule detail with fixture summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      ruleId: { type: string }
                      name: { type: string }
                      nameAr: { type: string }
                      scenario: { type: string, nullable: true }
                      enabled: { type: boolean }
                      meta: { type: object }
                      matchYaml: { type: string }
                      produceYaml: { type: string }
                      versionHash: { type: string }
                      lastReviewedBy: { type: integer, nullable: true }
                      lastReviewedByName: { type: string, nullable: true }
                      lastReviewedAt: { type: string, format: date-time, nullable: true }
                      dataClassification: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      createdBy: { type: integer, nullable: true }
                      updatedBy: { type: integer, nullable: true }
                      isActive: { type: boolean }
                      fixtures:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            fixtureId: { type: string }
                            description: { type: string, nullable: true }
                            expectedMatch: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Rule not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

    patch:
      summary: Update an existing correlation rule; recomputes versionHash on YAML change
      description: |
        Partial update — all fields optional; at least one required. Recomputes
        version_hash when matchYaml or produceYaml changes. Emits PG NOTIFY
        'correlation_rule_changed' for cache invalidation. Both YAML bodies are
        validated by the BE parser before persist.
      operationId: updateCorrelationRule
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                nameAr: { type: string, maxLength: 200 }
                scenario: { type: string, maxLength: 100, nullable: true }
                enabled: { type: boolean }
                matchYaml: { type: string }
                produceYaml: { type: string }
                meta: { type: object }
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    description: Full updated rule shape (same as POST 201 data)
        "400": { description: Invalid field values or empty request body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Rule not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: matchYaml or produceYaml is not valid YAML, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

    delete:
      summary: Soft-delete a correlation rule (sets is_active=false)
      description: |
        Soft-deletes the rule row (is_active=false). Fixture rows are retained
        for audit. Already-inactive rules return 409 (already deleted).
        Hard DELETE is blocked by RESTRICTIVE deny-direct-delete RLS policy.
      operationId: deleteCorrelationRule
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Rule soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      isActive: { type: boolean, enum: [false] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Rule not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Rule already inactive (already deleted), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/rules/{id}/test:
    post:
      summary: Run a correlation rule against its registered fixtures (pure simulation)
      description: |
        Evaluates the rule against one or all registered fixtures. Does NOT persist
        any correlation rows. Returns passed=true when actualMatch == expectedMatch.
        If fixtureId is omitted, all fixtures are run and results are aggregated.
      operationId: testCorrelationRuleAgainstFixture
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fixtureId:
                  type: string
                  description: Optional single fixture; if omitted all fixtures are run
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      ruleId: { type: string }
                      fixtureId: { type: string }
                      expectedMatch: { type: boolean }
                      actualMatch: { type: boolean }
                      matchEvidence: { type: object }
                      matchReason: { type: string, nullable: true }
                      diffNotes:
                        type: array
                        items: { type: string }
                      passed: { type: boolean }
                      durationMs: { type: integer, nullable: true }
        "400": { description: Invalid fixtureId, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks rule.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Rule not found or no fixtures registered, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /correlations:
    get:
      summary: Paginated list of active correlations for contracts visible to the actor
      description: |
        Returns correlation rows for the current tenant filtered by contract, status
        (active/dismissed/expired), rule_id string, and date range. Includes
        contractTitleEn/Ar and ruleName/ruleScenario via JOINs. RLS-scoped.
        match_evidence and match_entities are included in response but never logged.
      operationId: listCorrelations
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin", "legal_counsel"]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: contractId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, dismissed, expired]
        - name: ruleId
          in: query
          schema: { type: string }
          description: "Filter by rule_id string e.g. rule.sanctions.direct_counterparty"
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated correlations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            tenantId: { type: string, format: uuid }
                            signalId: { type: integer }
                            contractId: { type: integer }
                            contractTitleEn: { type: string, nullable: true }
                            contractTitleAr: { type: string, nullable: true }
                            ruleId: { type: string }
                            ruleName: { type: string, nullable: true }
                            ruleScenario: { type: string, nullable: true }
                            ruleVersionHash: { type: string }
                            confidence: { type: number }
                            matchReason: { type: string }
                            matchEvidence: { type: object }
                            matchGeographies:
                              type: array
                              items: { type: string }
                            matchEntities:
                              type: array
                              items: { type: object }
                            status: { type: string, enum: [active, dismissed, expired] }
                            dismissedBy: { type: integer, nullable: true }
                            dismissedAt: { type: string, format: date-time, nullable: true }
                            dismissedReason: { type: string, nullable: true }
                            expiresAt: { type: string, format: date-time, nullable: true }
                            dataClassification: { type: string }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                            createdBy: { type: integer, nullable: true }
                            updatedBy: { type: integer, nullable: true }
                            isActive: { type: boolean }
                      pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { description: Invalid query parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks correlation.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /correlations/{id}/dismiss:
    post:
      summary: Dismiss an active correlation with a mandatory reason
      description: |
        Sets correlation.status='dismissed'. reason is mandatory (min 10 / max 2000 chars),
        stored in dismissed_reason, and written to the audit log. Soft-delete only —
        RESTRICTIVE deny-direct-delete policy blocks hard DELETE. Double-dismiss returns 409.
      operationId: dismissCorrelation
      tags: ["M13 — Correlation Rule Engine"]
      security:
        - BearerAuth: []
      x-authorised-roles: ["platform_admin", "legal_counsel"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Correlation ID (BIGINT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  description: Mandatory business justification recorded in audit log
      responses:
        "200":
          description: Correlation dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      correlationId: { type: integer }
                      newStatus: { type: string, enum: [dismissed] }
        "400": { description: Reason missing or too short/long, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks correlation.dismiss permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Correlation not found in actor's tenant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Correlation already dismissed (already_dismissed), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  # ================================================================
  # M14 / CR-F — 5-Dim Risk Scoring + MaR + AVaR
  # ================================================================

  /contracts/{id}/risk-score:
    get:
      summary: Get latest risk score and full explanation for a contract
      description: |
        Returns the most-recent risk score snapshot from `latest_risk_score` MV
        hydrated with correlation details via `fn_risk_score_explain`.
        SENSITIVE — contributingCorrelations and explanation fields are
        Pino-redacted on egress. Hidden for contract_recipient role
        (fn_-level row-aware filter).
      operationId: getRiskScoreExplain
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin, executive, legal_counsel, contract_drafter, contract_approver]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Contract ID (BIGINT)
      responses:
        "200":
          description: Current risk score for the contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RiskScoreExplainResponse" }
        "400": { description: Invalid contract ID, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks score.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Contract not found or no risk score yet, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /contracts/{id}/risk-score/history:
    get:
      summary: Get risk score history snapshots for a contract
      description: |
        Returns time-series of risk score snapshots over a configurable window
        via `fn_risk_score_history`. Powers the Recharts LineChart with 30/90/180-day toggle.
      operationId: getRiskScoreHistory
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin, executive, legal_counsel, contract_drafter, contract_approver]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Contract ID (BIGINT)
        - name: windowDays
          in: query
          required: false
          schema: { type: integer, enum: [30, 90, 180], default: 30 }
          description: History window in days. Validated by DB ERRCODE 22023.
      responses:
        "200":
          description: Risk score history for the contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RiskScoreHistoryResponse" }
        "400": { description: Invalid contract ID or windowDays not in [30,90,180], content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks score.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Contract not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /risk/avar:
    get:
      summary: Get AVaR (Aggregate Value at Risk) across the portfolio
      description: |
        Portfolio-level Money at Risk aggregation via `fn_avar_aggregate`.
        Returns total AVaR + breakdown by groupBy dimension. Uses S2-24
        split-aggregate CTE pattern (inner per_bucket CTE with SUM; outer
        jsonb_agg — never nested aggregate). Powers AvarDashboardSection on
        the executive dashboard.
      operationId: getAvarAggregate
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin, executive, legal_counsel, contract_drafter, contract_approver]
      parameters:
        - name: businessUnit
          in: query
          required: false
          schema: { type: string }
          description: Filter by contract_type (business unit proxy).
        - name: counterpartyId
          in: query
          required: false
          schema: { type: integer }
          description: Filter by counterparty party_id.
        - name: counterpartyChain
          in: query
          required: false
          schema: { type: boolean }
          description: If true, includes chain members of the counterparty via fn_party_chain_traverse_down.
        - name: geography
          in: query
          required: false
          schema: { type: string }
          description: Filter by emirate (geography proxy).
        - name: riskKind
          in: query
          required: false
          schema: { type: string }
          description: Filter by correlation rule risk_kind.
        - name: timeHorizonDays
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365 }
          description: Look-forward horizon for MaR contribution window.
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [business_unit, counterparty_id, counterparty_chain, geography, risk_kind]
            default: business_unit
          description: Dimension to group AVaR breakdown by.
        - name: windowDays
          in: query
          required: false
          schema: { type: integer, default: 30 }
          description: Time window for AVaR calculation and delta comparison.
      responses:
        "200":
          description: AVaR aggregate result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AvarAggregateResponse" }
        "400": { description: Invalid query parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks score.read permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/scoring-weights:
    get:
      summary: Get current scoring weights configuration
      description: |
        Returns the active ADNOC 5-dim scoring weights, version history, and
        default exposure-fraction and impact-multiplier lookup tables via
        `fn_scoring_weights_get`. Admin-only.
      operationId: getScoringWeights
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin]
      responses:
        "200":
          description: Current scoring weights
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/ScoringWeightsGetResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks score.weights.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      summary: Update scoring weights (admin)
      description: |
        Updates the 5-dim scoring weights via `fn_scoring_weights_set`.
        All 5 dimensions required; sum must equal 1.0 ± 0.001. Tolerates
        minor floating-point drift (auto-normalised). Version auto-incremented.
        Audit trail written via `fn_audit_log_record_v2` hash-chain helper
        (R-PA7 hash-chain invariant). Does NOT trigger recompute — use
        POST /admin/scoring-weights/recompute-all separately.
      operationId: patchScoringWeights
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringWeightsUpdateRequest" }
            example:
              legal: 0.25
              financial: 0.25
              operational: 0.20
              reputational: 0.15
              compliance: 0.15
      responses:
        "200":
          description: Weights updated and new version applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/ScoringWeightsSetResponse" }
        "400": { description: Invalid weights — sum constraint or missing field, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks score.weights.manage permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Concurrent weight update collision, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/scoring-weights/recompute-all:
    post:
      summary: Trigger bulk risk-score recompute for all active contracts (admin)
      description: |
        Calls `fn_score_recompute_for_weight_change` which iterates all
        active contracts and calls `fn_risk_score_compute` per contract.
        Per-contract BEGIN/EXCEPTION/END isolation — failures are captured
        in `failedContractIds` and do NOT roll back successful recomputes.
        Heavy-rate-limited: 5 requests / min / user (heavyExportRateLimiter).
        Requires a destructive-confirm dialog in the FE before submission.
        Elapsed time is reported for operational monitoring.
      operationId: recomputeAllRiskScores
      tags: ["M14 — Risk Scoring (CR-F)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin]
      x-rate-limit: "5 req/min/user (heavyExportRateLimiter)"
