            `/not found/i` pattern (M7 precedent — same as
            `fn_osint_source_get_by_id` 'Source not found' routing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/internal-signal-kinds:
