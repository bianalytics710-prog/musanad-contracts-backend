  /ai/regulatory-impact-summary:
    post:
      tags: [M4 — AI (Regulatory Impact)]
      operationId: aiRegulatoryImpactSummary
      summary: PUBLIC — regulatory-impact PDF summary, signed-PDF-token authenticated (S5)
      description: |
        **PUBLIC endpoint** behind a signed-PDF-token (HMAC-validated at
        Express middleware). Returns a structured executive summary of a
        regulatory update for inclusion in the regulatory-impact PDF.

        **Auth:** see the `signedPdfToken` security scheme. Token is sent in
        either `Authorization: Bearer <token>` OR `X-Signed-Pdf-Token`.
        Middleware validates HMAC + `aud=regulatory-impact-pdf` + `iss` +
        `exp` + nonce.

        **Cache:** 30 days, content-addressed by SHA-256 of canonicalised
        inputs (`regulator + title + severity + contracts[] + language`).

        **Rate limit:** in-process per-token bucket (10/h) — substituted
        for `fn_ai_request_log_check_rate_limit` because the public path
        has no actor user id. BE-IMPL-INFO-2: per-replica memory only —
        switch to Redis when scaling beyond 1 replica.

        **fn_ai_regulatory_impact_summary_get is `neondb_owner`-only DEFINER**
        — NOT in the PUBLIC EXECUTE allowlist (Q3 Option A). The 5 PUBLIC
        EXECUTE grants stay exactly the M3 set.

        **Service unavailable:** if `SIGNED_PDF_TOKEN_SECRET` is unset at
        boot, S5 returns 503 (intentional; documented in M4-SMOKE-BE-INFO-2;
        recommend env-validation upgrade).
      x-rateLimit: in-process per-token bucket (10/h) — single-replica only (BE-IMPL-INFO-2)
      x-authorisedRoles: []
      x-authMode: signed-token
      x-storyId: S5
      security:
        - signedPdfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRegulatoryImpactSummaryRequest" }
      responses:
        "200":
          description: OK — executive summary payload.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-AI-Cache:
              schema: { type: string, enum: [HIT, MISS] }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            application/json:
              schema:
                type: object
                required: [success, data, requestId]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AiRegulatoryImpactSummaryResponse" }
                  requestId: { type: string, format: uuid }
        "400":
          description: VALIDATION_ERROR — contracts must be 1..20; language `en|ar` only (bilingual rejected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Token invalid / expired / aud mismatch / nonce reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: RATE_LIMITED — per-token cap (10/h).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Provider error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: |
            SERVICE_UNAVAILABLE — `SIGNED_PDF_TOKEN_SECRET` env var is unset
            (M4-SMOKE-BE-INFO-2). Operator must set the secret and restart
            the backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

