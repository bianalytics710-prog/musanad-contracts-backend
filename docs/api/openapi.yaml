  /ai/risk-assistant/ask:
    post:
      summary: Ask the AI Risk Assistant (SSE streaming or JSON)
      description: |
        Submits a natural-language question to the per-persona AI Risk Assistant.
        Default response is Server-Sent Events (Content-Type: text/event-stream).
        Add `?stream=false` for a non-streaming JSON response.

        ACL pre-filter: fn_contract_list narrows the document context to
        contracts visible to the caller before the prompt is assembled.
        scope_hash + acl_filtered_count are written to ai_request_log
        (migration 179 columns) for Annex D §15.3 audit compliance.

        Persona selection: `persona` field in body maps to
        `ai_prompt.prompt_id = 'risk_assistant.qa_<persona>'`. If omitted,
        the BE derives from the caller's JWT role claim.

        SSE event sequence: (token)... (citation)... done
        On LLM error: (error event with code + message) then stream closes.

        Rate limit: 30 req/min/user.

        NOTE — DEFECT-CR-G-7 (known open): LLM stream silent in test
        environment. Infrastructure layer verified working. Fix tracked
        post-ship.
      operationId: askRiskAssistant
      tags: ["M15 — AI Risk Assistant (CR-G)"]
      security:
        - bearerAuth: []
      x-authorised-roles: [Super Admin, platform_admin, executive, legal_counsel, compliance_esg, operations, finance_treasury, procurement, contract_drafter, contract_approver]
      x-rate-limit: "30 req/min/user"
      parameters:
        - name: stream
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: "true = SSE (text/event-stream), false = JSON non-streaming response."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 2000
                  description: "Natural-language question. SENSITIVE — Pino-redacted."
                persona:
                  type: string
                  enum: [executive, legal_counsel, compliance_esg, operations, finance_treasury, procurement]
                  description: "If omitted, derived from JWT role claim."
                filters:
                  type: object
                  description: "Optional ACL-narrowing context. SENSITIVE — Pino-redacted."
                  properties:
                    contractIds: { type: array, items: { type: string } }
                    contractType: { type: string }
                    emirate: { type: string }
                    riskKind: { type: string }
            example:
              query: "Which contracts have the highest sanctions exposure this quarter?"
              persona: compliance_esg
      responses:
        "200":
          description: |
            SSE stream (Content-Type: text/event-stream) if ?stream=true (default).
            JSON object (Content-Type: application/json) if ?stream=false.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/RiskAssistantSSEEvent" }
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/RiskAssistantNonStreamingResponse" }
        "400": { description: Invalid request body or query too long, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Actor lacks ai.invoke.risk_assistant permission, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { description: Rate limit exceeded (30 req/min/user), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { $ref: "#/components/responses/ServerError" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ============================================================
  # CR-M — Labor-Law Cascade + ADNOC-World Foundation
