        per AC-S6-04: re-invoking on the same `rightVersionId` overwrites
        the prior summary.

        **Defect note (DEFECT-1, patched in migration 045):** the original
        fn body in 043 referenced nonexistent `updated_at`/`updated_by`
        columns on `contract_version`. Migration 045 drops the columns
        from the UPDATE clause and materialises `updatedAt` locally; the
        JSONB return shape is byte-identical to 043 — controller bindings
        unchanged. Stage 2 lesson S2-22 (column-existence verification)
        codified to prevent recurrence.
