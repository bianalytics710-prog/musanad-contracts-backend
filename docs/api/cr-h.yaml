        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Row not found or actor lacks visibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

