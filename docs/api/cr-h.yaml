        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Draft not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Tag: Admin: Notifications ─────────────────────────────────────────────

  /admin/notification-dispatch-log:
    get:
      tags: [Admin: Notifications]
      operationId: listNotificationDispatchLog
      summary: List notification dispatch log
      description: "Paginated universal notification dispatch log. bodyRendered truncated to 500 chars. Required permission: notification.dispatch_log.read."
      security: [{ BearerAuth: [] }]
      x-authorised-roles: [Super Admin, platform_admin]
      x-required-permission: notification.dispatch_log.read
      x-db-function: fn_notification_dispatch_log_list
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: channel
          in: query
          schema: { type: string, enum: [email, in_app, teams_capture, slack_capture] }
        - name: status
          in: query
          schema: { type: string, enum: [sent, failed, captured_only, pending_retry, final_failed, suppressed_by_preference] }
        - name: notificationKind
          in: query
          schema: { type: string, enum: [alert, advisory, approval_request, signature_request, system, risk_case, report] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
        - name: recipientUserId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          description: "ISO 8601 UTC — delivery_attempted_at >= from"
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "ISO 8601 UTC — delivery_attempted_at <= to"
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated notification dispatch log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationDispatchLogListItem' }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller lacks notification.dispatch_log.read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/notification-dispatch-log/{id}:
